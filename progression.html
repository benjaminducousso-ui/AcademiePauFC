<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Progression Pau FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--navy:#0B2A4A;--navy-2:#123B66;--yellow:#F2C200;--yellow-ink:#7A5E00;--bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#E9EEF6;--line:#D5DDE8;--ink:#14213D;--muted:#5B6B82;--faint:#8A97AB;--ok:#2E8B57;--warn:#C77700;--bad:#D64545;--shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);--r:10px;--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy-2:#173F6B;--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200}}
:root[data-theme="dark"]{--navy-2:#173F6B;--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}h1{font-size:clamp(30px,5vw,44px);font-weight:800;text-transform:uppercase}h2{font-size:clamp(22px,3vw,30px);font-weight:700;text-transform:uppercase}h3{font-size:21px;font-weight:700}h4{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}button{font-family:inherit;font-size:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.top{background:var(--navy);color:#fff;padding-block:18px 14px}.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.crest{width:76px;height:76px;flex:none;border-radius:50%;background:#fff;padding:2px;box-sizing:border-box}.brand .eyebrow{color:var(--yellow)}.brand p{color:#C9D6E8;max-width:66ch;margin-top:4px}
.catbar{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 4px}
.cat{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:18px;font-weight:700}
.cat[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.cat small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.8;letter-spacing:0}
main{padding-block:20px 60px}
.whobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.whobar .wlab{font-weight:700;font-size:14px}.whobar input{font:inherit;font-weight:700;font-size:15px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:160px;background:var(--bg,#fff);color:var(--ink)}
.whobar.empty{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}.whobar.empty input{border-color:var(--yellow)}
.addp{display:flex;gap:6px;align-items:center}.addp input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:230px;background:var(--surface);color:var(--ink)}
.perbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:14px 0 6px}
.perchip{flex:none;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:150px;text-align:left}
.perchip b{font-family:var(--display);font-size:18px;line-height:1}.perchip span{font-size:13px;font-weight:600}.perchip small{font-size:11px;color:var(--muted)}
.perchip[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:16px}
.card h3{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}@media (max-width:900px){.periods{grid-template-columns:repeat(2,1fr)}}@media (max-width:520px){.periods{grid-template-columns:1fr}}
.period{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}.period b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.period small{color:var(--muted)}.period ul{margin:6px 0 0;padding-left:16px}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.facet{background:var(--surface-2);border-radius:8px;padding:10px}.facet b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.facet span{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.callout{border-left:4px solid var(--yellow);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px;font-size:15px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;font-size:11px;color:var(--muted);padding:6px 3px;border-bottom:2px solid var(--line);white-space:normal;line-height:1.15;vertical-align:bottom}td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.name{font-weight:600;white-space:normal;min-width:140px;font-size:14px}td.notecell{width:100%;min-width:100px}td>.stars{margin-right:10px}
.tbl-wrap th:first-child,.tbl-wrap td.name{position:sticky;left:0;background:var(--surface);z-index:1}
.stars{display:inline-flex;gap:0}.stars button{background:none;border:0;padding:1px 0;font-size:16px;line-height:1;color:var(--line)}.stars button.on{color:var(--yellow)}
input.num{width:48px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;background:var(--surface);color:var(--ink);text-align:right}
input.txt{width:100%;min-width:90px;box-sizing:border-box;border:1px solid transparent;border-radius:6px;padding:5px 6px;font:inherit;background:transparent;color:var(--ink)}input.txt:hover,input.txt:focus{border-color:var(--line);background:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px}.toolbar .status{align-self:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.status{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}.status.ok{background:#DCF5E6;color:#1B5E36}.status.warn{background:#FFF3BF;color:#7A5E00}.status.bad{background:#FBE0E0;color:#8A1F1F}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-weight:600;font-size:13px}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.trend{font-family:var(--display);font-size:15px;letter-spacing:.04em;white-space:nowrap}.trend .bar{display:inline-block;width:9px;height:18px;border-radius:2px;margin-right:3px;background:var(--line);vertical-align:middle;position:relative;overflow:hidden}.trend .bar span{position:absolute;left:0;right:0;bottom:0;background:#F2C200;display:block}.trend em{font-style:normal;font-weight:800;margin-left:4px;vertical-align:middle}
.tsub td{padding-top:1px;padding-bottom:1px;border-bottom:0;background:#F6F8FB}.tsub+tr:not(.tsub) td{border-top:1px solid var(--line)}tr:not(.tsub)+.tsub td{border-top:1px dashed var(--line)}.tsub .tname{font-weight:500;font-size:12.5px;color:var(--muted);padding-left:14px;background:#F6F8FB}.tsub .tname small{opacity:.7}.tval{font-family:var(--display);font-size:14px}.tval .st{font-size:13px;letter-spacing:1px;color:#D9A400;padding:0 4px}.tval .st i{font-style:normal;color:var(--line)}.tval.up .st{background:#FFF3B8}.tmain td{padding-top:8px}.pdone{color:var(--muted);font-size:12px}.tval b{font-weight:700;padding:0 6px;border-radius:6px}.tval.up b{background:#FFF3B8}.tval.down b{opacity:.6}#view-bilan td.name{white-space:nowrap}td[data-l="Mot"]{white-space:normal;min-width:160px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;background:transparent;color:#C9D6E8;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--display);font-size:17px;text-transform:uppercase;font-weight:700}.tab[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none}.view.active{display:block}
.testbox{margin-top:12px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.testbox .note{font-size:13px}
.trows{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:26px minmax(160px,1fr) 110px 100px auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (max-width:720px){.trow{grid-template-columns:26px 1fr auto}.trow input[data-k="unit"],.trow input[data-k="target"]{grid-column:2}}
.trow.thead{background:transparent;border:0;padding:0 8px}.trow.thead span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.trow .n{font-family:var(--display);font-size:17px;font-weight:800;color:var(--navy-2);text-align:center}
.trow input{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--surface);color:var(--ink)}
.trow .mv{display:inline-flex;gap:4px}
.btn.small{padding:6px 9px;font-size:14px}
.btn:disabled{opacity:.4}
.legend{font-size:13px;color:var(--muted);margin-top:8px}

.tbl-wrap{position:relative;scrollbar-width:thin;scrollbar-color:#B9C4D6 transparent;padding-bottom:2px}.tbl-wrap::-webkit-scrollbar{height:10px;-webkit-appearance:none}.tbl-wrap::-webkit-scrollbar-track{background:var(--surface-2);border-radius:6px}.tbl-wrap::-webkit-scrollbar-thumb{background:#8F9FB8;border-radius:6px}
.tbl-wrap.has-more:not(.at-end){-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.scrollhint{font-size:13px;color:var(--muted);margin:6px 0 2px}.scrollhint span{display:inline-block;font-weight:700;margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>

/* =====================================================================
   CARNET (diplôme A4) — module partagé Pau FC Académie
   La mise en page est calculée UNE fois en primitives (mm), puis rendue
   à l'identique en HTML (aperçu / impression) et en PDF (jsPDF).
   Dépend de : FONT_BOLD / FONT_REGULAR / FONT_ITALIC (Poppins base64),
   CREST_PNG (blason), jsPDF chargé à la demande (loadJsPDF).
   ===================================================================== */
const CARNET={PW:210,PH:297,F:8,I:10.5,MX:20};
const CCOL={navy:"#0B2A4A",yel:"#F2C200",gray:"#6E7887",ink:"#1E2430",line:"#E2E6EC",box:"#F6F7FA",on:"#F2C200",onS:"#C9A000",offS:"#C8C8C8",faint:"#C8CCD4"};
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res();const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res();sc.onerror=()=>rej(new Error("jspdf"));document.head.appendChild(sc)})}
function carnetFonts(doc){if(doc._pf)return;doc._pf=true;doc.addFileToVFS("Poppins-Bold.ttf",FONT_BOLD);doc.addFont("Poppins-Bold.ttf","Poppins","bold");doc.addFileToVFS("Poppins-Regular.ttf",FONT_REGULAR);doc.addFont("Poppins-Regular.ttf","Poppins","normal");doc.addFileToVFS("Poppins-Italic.ttf",FONT_ITALIC);doc.addFont("Poppins-Italic.ttf","Poppins","italic")}
/* d = {club,title,line,name,sub,items[],starsTitle,facets[{name,desc,n}],tests[{name,val,unit,target}],legend,motTitle,mot,educ,sigL,sigR,foot} */
function carnetLayout(doc,d){
  const {PW,F,I,MX}=CARNET,W=PW-2*MX,CX=PW/2,P=[];
  carnetFonts(doc);
  const font=(st,sz)=>{doc.setFont("Poppins",st);doc.setFontSize(sz)};
  const tw=(s,st,sz,cs)=>{font(st,sz);return doc.getTextWidth(s)+(cs?(s.length-1)*cs:0)};
  const wrap=(s,st,sz,w)=>{font(st,sz);return doc.splitTextToSize(s,w)};
  const T=(s,x,y,o)=>P.push(Object.assign({t:"text",s,x,y,size:10,st:"normal",c:CCOL.ink,al:"left",cs:0},o));
  // cadre
  P.push({t:"rect",x:F,y:F,w:PW-2*F,h:CARNET.PH-2*F,stroke:CCOL.navy,lw:.9});
  P.push({t:"rect",x:I,y:I,w:PW-2*I,h:CARNET.PH-2*I,stroke:CCOL.yel,lw:.35});
  // blason + en-tête
  P.push({t:"img",x:CX-12,y:16,w:24,h:24});
  T(d.club||"PAU FC · ACADÉMIE",CX,47.5,{size:8.5,st:"bold",c:CCOL.gray,al:"center",cs:1.2});
  T(d.title,CX,57,{size:23,st:"bold",c:CCOL.navy,al:"center",cs:.6});
  P.push({t:"rect",x:CX-15,y:60.2,w:30,h:1,fill:CCOL.yel});
  T(d.line,CX,67,{size:9.5,c:CCOL.gray,al:"center"});
  let ns=28;while(tw(d.name,"bold",ns)>W-10&&ns>16)ns-=1;
  T(d.name,CX,84,{size:ns,st:"bold",al:"center"});
  T(d.sub,CX,91.5,{size:10,st:"italic",c:CCOL.gray,al:"center"});
  // apprentissages
  let y=101;
  (d.items||[]).forEach(a=>{const lines=wrap(a,"normal",10,W-9);P.push({t:"diamond",x:MX+2,y:y-2.9,s:1.4});lines.forEach((l,i)=>T(l,MX+8,y+i*5.6,{size:10}));y+=5.6*lines.length+1.1});
  const h=(txt,yy)=>{const w=tw(txt,"bold",8.5,1.2);T(txt,CX,yy,{size:8.5,st:"bold",c:CCOL.navy,al:"center",cs:1.2});P.push({t:"line",x1:MX,y1:yy-1.2,x2:CX-w/2-6,y2:yy-1.2,c:CCOL.yel,lw:.4});P.push({t:"line",x1:CX+w/2+6,y1:yy-1.2,x2:MX+W,y2:yy-1.2,c:CCOL.yel,lw:.4})};
  // étoiles
  const tests=(d.tests||[]).filter(x=>x.val!=null&&x.val!=="");
  const yTitle=Math.max(y+7,128);h(d.starsTitle||"LES ÉTOILES DE L'ÉDUCATEUR",yTitle);
  const n=d.facets.length;const rowsStart=yTitle+9;const endMax=tests.length?214:226;
  const rowH=Math.max(12.6,Math.min(15,(endMax-rowsStart)/n));
  y=rowsStart;
  d.facets.forEach((f,i)=>{if(i)P.push({t:"line",x1:MX,y1:y-rowH+9.6,x2:MX+W,y2:y-rowH+9.6,c:CCOL.line,lw:.25});
    T(f.name,MX,y,{size:11,st:"bold"});
    wrap(f.desc||"","normal",7.5,W-42).slice(0,2).forEach((l,k)=>T(l,MX,y+4.3+k*3.5,{size:7.5,c:CCOL.gray}));
    for(let k=0;k<3;k++)P.push({t:"star",cx:MX+W-24+k*10.5,cy:y+.4,r:3.9,on:k<(f.n||0)});
    y+=rowH});
  // repères mesurés (facultatif)
  if(tests.length){const yt=y+1.5;T("REPÈRES MESURÉS",MX,yt,{size:7.5,st:"bold",c:CCOL.navy,cs:1});
    let x=MX;const yy=yt+6.2;tests.forEach(tt=>{const lab=`${tt.name} : ${tt.val} ${tt.unit||""}${tt.target?` (objectif ${tt.target})`:""}`.trim();const w=tw(lab,"normal",8)+6;if(x+w>MX+W){x=MX}P.push({t:"rect",x,y:yy-4.2,w,h:6,fill:CCOL.box,stroke:CCOL.line,lw:.25,r:1.5});T(lab,x+3,yy,{size:8});x+=w+2.5})}
  T(d.legend||"1 étoile : à découvrir · 2 étoiles : en progrès · 3 étoiles : acquis pour son âge — on se compare à soi-même, jamais aux autres.",CX,231.5,{size:7.3,c:CCOL.gray,al:"center"});
  // mot
  h(d.motTitle||"LE MOT DE L'ÉDUCATEUR",240.5);
  P.push({t:"rect",x:MX,y:244.5,w:W,h:25,fill:CCOL.box,stroke:CCOL.line,lw:.3,r:2.5});
  if(d.mot){wrap(`« ${d.mot} »`,"italic",11.5,W-14).slice(0,3).forEach((l,i)=>T(l,MX+7,251.5+i*5.6,{size:11.5,st:"italic"}))}
  else [252,258.5,265].forEach(o=>P.push({t:"line",x1:MX+7,y1:o,x2:MX+W-7,y2:o,c:CCOL.faint,lw:.25}));
  if(d.educ)T(d.educ,MX+W-6,267.3,{size:8,c:CCOL.gray,al:"right"});
  // signatures
  P.push({t:"line",x1:MX,y1:275,x2:MX+62,y2:275,c:CCOL.ink,lw:.3});P.push({t:"line",x1:MX+W-62,y1:275,x2:MX+W,y2:275,c:CCOL.ink,lw:.3});
  T(d.sigL||"L'éducateur",MX,278.6,{size:7.5,c:CCOL.gray});T(d.sigR||"Le responsable technique jeunes",MX+W,278.6,{size:7.5,c:CCOL.gray,al:"right"});
  if(d.foot)T(wrap(d.foot,"normal",6.8,W)[0],CX,283.2,{size:6.8,c:CCOL.gray,al:"center"});
  return P;
}

function hex(c){const m=c.replace("#","");return [parseInt(m.slice(0,2),16),parseInt(m.slice(2,4),16),parseInt(m.slice(4,6),16)]}
function carnetPdfPage(doc,prims){
  prims.forEach(p=>{
    if(p.t==="rect"){if(p.fill)doc.setFillColor(...hex(p.fill));if(p.stroke){doc.setDrawColor(...hex(p.stroke));doc.setLineWidth(p.lw||.3)}const m=p.fill&&p.stroke?"FD":p.fill?"F":"S";if(p.r)doc.roundedRect(p.x,p.y,p.w,p.h,p.r,p.r,m);else doc.rect(p.x,p.y,p.w,p.h,m)}
    else if(p.t==="line"){doc.setDrawColor(...hex(p.c));doc.setLineWidth(p.lw||.3);doc.line(p.x1,p.y1,p.x2,p.y2)}
    else if(p.t==="img"){doc.addImage(CREST_PNG,"PNG",p.x,p.y,p.w,p.h)}
    else if(p.t==="diamond"){doc.setFillColor(...hex(CCOL.yel));const s=p.s;doc.lines([[s,s],[-s,s],[-s,-s],[s,-s]],p.x,p.y,[1,1],"F",true)}
    else if(p.t==="star"){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?p.r*0.45:p.r;pts.push([p.cx+rr*Math.cos(a),p.cy+rr*Math.sin(a)])}const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
      if(p.on){doc.setFillColor(...hex(CCOL.on));doc.setDrawColor(...hex(CCOL.onS))}else{doc.setFillColor(255,255,255);doc.setDrawColor(...hex(CCOL.offS))}doc.setLineWidth(.3);doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)}
    else if(p.t==="text"){doc.setFont("Poppins",p.st);doc.setFontSize(p.size);doc.setTextColor(...hex(p.c));
      if(p.cs){const w=doc.getTextWidth(p.s)+(p.s.length-1)*p.cs;const x=p.al==="center"?p.x-w/2:p.al==="right"?p.x-w:p.x;doc.text(p.s,x,p.y,{charSpace:p.cs})}
      else doc.text(p.s,p.x,p.y,{align:p.al})}
  })}
/* ---- rendu HTML (mêmes coordonnées) ---- */
function carnetHtml(prims){
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const mm=v=>v.toFixed(2)+"mm";
  let o=`<div class="dip">`;
  prims.forEach(p=>{
    if(p.t==="rect"){o+=`<div class="cp" style="left:${mm(p.x)};top:${mm(p.y)};width:${mm(p.w)};height:${mm(p.h)};${p.fill?`background:${p.fill};`:""}${p.stroke?`border:${mm(p.lw||.3)} solid ${p.stroke};`:""}${p.r?`border-radius:${mm(p.r)};`:""}"></div>`}
    else if(p.t==="line"){const horiz=Math.abs(p.y1-p.y2)<.01;o+=horiz?`<div class="cp" style="left:${mm(Math.min(p.x1,p.x2))};top:${mm(p.y1-(p.lw||.3)/2)};width:${mm(Math.abs(p.x2-p.x1))};height:${mm(p.lw||.3)};background:${p.c}"></div>`:``}
    else if(p.t==="img"){o+=`<img class="cp" src="${CREST_PNG}" alt="" style="left:${mm(p.x)};top:${mm(p.y)};width:${mm(p.w)};height:${mm(p.h)}">`}
    else if(p.t==="diamond"){o+=`<div class="cp" style="left:${mm(p.x-p.s)};top:${mm(p.y-p.s)};width:${mm(p.s*2)};height:${mm(p.s*2)};background:${CCOL.yel};transform:rotate(45deg) scale(.72)"></div>`}
    else if(p.t==="star"){o+=`<svg class="cp ${p.on?'on':''}" viewBox="0 0 20 20" style="left:${mm(p.cx-p.r)};top:${mm(p.cy-p.r)};width:${mm(p.r*2)};height:${mm(p.r*2)}"><polygon points="10,1.5 12.6,7.2 18.8,7.8 14.1,12 15.5,18.2 10,15 4.5,18.2 5.9,12 1.2,7.8 7.4,7.2"/></svg>`}
    else if(p.t==="text"){const szmm=p.size*0.3528;const top=p.y-szmm*0.86;
      let pos=p.al==="center"?`left:0;right:0;text-align:center;`:p.al==="right"?`right:${mm(CARNET.PW-p.x)};text-align:right;`:`left:${mm(p.x)};`;
      o+=`<div class="cp ct" style="${pos}top:${mm(top)};font-size:${p.size}pt;font-weight:${p.st==="bold"?700:400};font-style:${p.st==="italic"?"italic":"normal"};color:${p.c};letter-spacing:${p.cs?mm(p.cs):"0"}">${esc(p.s)}</div>`}
  });
  return o+`</div>`;
}
const CARNET_CSS=`
.dips{display:flex;flex-direction:column;gap:18px;align-items:center;margin-top:14px}
.dipwrap{transform-origin:top left;width:210mm;align-self:flex-start}
.dip{position:relative;width:210mm;height:297mm;background:#fff;color:#1E2430;font-family:Poppins,"Source Sans 3",Arial,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.14);overflow:hidden}
.dip .cp{position:absolute;box-sizing:border-box}
.dip .ct{line-height:1;white-space:nowrap}
.dip svg.cp{fill:#fff;stroke:#C8C8C8;stroke-width:.8}.dip svg.cp.on{fill:#F2C200;stroke:#C9A000}
.printbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 4px}
@media print{header.top,.printbar,.toast,.tabs{display:none!important}main{padding:0;max-width:none}.dips{display:block;margin:0;gap:0}.dipwrap{transform:none!important;height:auto!important;width:210mm}.dip{box-shadow:none;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dipwrap:last-child .dip{break-after:auto;page-break-after:auto}@page{size:A4 portrait;margin:0}}
`;
function fitDips(){document.querySelectorAll(".dipwrap").forEach(w=>{const avail=w.parentElement.clientWidth;const sc=Math.min(1,avail/w.firstElementChild.offsetWidth);w.style.transform=`scale(${sc})`;w.style.height=(w.firstElementChild.offsetHeight*sc)+"px"})}
window.addEventListener("resize",()=>fitDips());
/* Vue carnets : list = tableau de données d (voir carnetLayout), opts = {title, fname, back()} */
async function showCarnets(list,opts){
  const m=document.querySelector("main");const head=document.querySelector("header.top");
  if(!document.getElementById("carnetCss")){const st=document.createElement("style");st.id="carnetCss";st.textContent=CARNET_CSS;document.head.appendChild(st)}
  m.innerHTML=`<div class="printbar"><button class="btn ghost" id="backCarnets">← Retour</button><span class="note">Chargement…</span></div>`;
  try{await loadJsPDF()}catch(e){m.querySelector(".note").textContent="Impossible de charger le module PDF (réseau)";m.querySelector("#backCarnets").addEventListener("click",opts.back);return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  const pages=list.map(d=>carnetLayout(doc,d));
  head.hidden=true;
  m.innerHTML=`<div class="printbar"><button class="btn ghost" id="backCarnets">← Retour</button><span class="note">${list.length} carnet(s) · ${opts.title||""} · une page A4 par enfant, à imprimer sur papier épais</span><span><button class="btn wa" id="doPdf" style="background:var(--navy);color:#fff">📄 Télécharger le PDF</button> <button class="btn ghost" id="doPrint">🖨️ Imprimer</button></span></div><div class="dips">${pages.map(p=>`<div class="dipwrap">${carnetHtml(p)}</div>`).join("")}</div>`;
  m.querySelector("#backCarnets").addEventListener("click",()=>{head.hidden=false;opts.back()});
  m.querySelector("#doPrint").addEventListener("click",()=>{try{window.print()}catch(e){}});
  m.querySelector("#doPdf").addEventListener("click",async()=>{
    const doc2=new jsPDF({unit:"mm",format:"a4",compress:true});carnetFonts(doc2);
    pages.forEach((p,i)=>{if(i>0)doc2.addPage();carnetPdfPage(doc2,p)});
    const blob=doc2.output("blob");const fname=opts.fname||"carnets.pdf";
    let dl=null;try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads")}catch(e){dl=null}
    if(dl){try{await dl.save({filename:fname,data:blob});toast("PDF enregistré")}catch(e){if(e&&e.code==="declined")toast("Enregistrement annulé");else toast("Téléchargement impossible ici")}}
    else{try{doc2.save(fname);toast("PDF téléchargé")}catch(e){}}
  });
  fitDips();window.scrollTo(0,0);
}

<script>
/* ===== Application ===== */
const LS="paufc-progression-v1";let store={};try{store=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const get=(k,d)=>(k in store)?store[k]:d;const set=(k,v)=>{store[k]=v;save()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date();today.setHours(0,0,0,0);const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MOIS_C=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];const fmtShort=s=>{const d=D(s);return `${d.getDate()} ${MOIS_C[d.getMonth()]}`};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2200)}
const QS=new URLSearchParams(location.search);
let cat=QS.get("cat")&&CATS.includes(QS.get("cat"))?QS.get("cat"):get("cat","U7");
let per=get("per",(PERIODS.find(p=>today<=D(p.to))||PERIODS[4]).n);
const grp=()=>GROUPS[GROUP_OF[cat]];
/* ===== Repères mesurés (les items chiffrés à côté des étoiles) =====
   Par défaut ceux du guide FFF du groupe ; chaque catégorie peut les adapter (ajouter, renommer, retirer).
   La liste est partagée avec les autres éducateurs via le classeur du club (clé PROG-<catégorie> / __tests). */
store.tests=store.tests||{};
const UNITS=["contacts","s","m","cm","km/h","réussi 0/1","points","répétitions"];
const isTime=u=>/^s(ec|econdes?)?\.?$/i.test(String(u||"").trim());
const defTests=c=>GROUPS[GROUP_OF[c]].tests;
function TESTS(c){c=c||cat;const cu=store.tests[c];return Array.isArray(cu)?cu:defTests(c)}
const testsCustom=c=>Array.isArray(store.tests[c||cat]);
function saveTests(c,list,by){const ts=Date.now();
  if(list)store.tests[c]=list;else delete store.tests[c];
  save();
  const payload={seances:1,cat:"PROG-"+c,id:"__tests",data:list?{tests:list}:null,by:by||get("who","")||"l'éducateur",ts};
  return fetch(API,{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||"save");toast(list?"Repères enregistrés et partagés avec le club":"Repères du guide FFF rétablis pour le club")})
    .catch(()=>toast("Enregistrés sur cet appareil ; le partage réessaiera plus tard"))}
async function loadTests(c){try{const r=await fetch(`${API}?seances=${encodeURIComponent("PROG-"+c)}`,{cache:"no-store"});const arr=await r.json();if(!Array.isArray(arr))return;
  const row=arr.find(x=>x&&x.id==="__tests");if(!row)return;
  const list=row.data&&Array.isArray(row.data.tests)?row.data.tests:null;
  const cur=store.tests[c];
  if(JSON.stringify(cur||null)!==JSON.stringify(list)){if(list)store.tests[c]=list;else delete store.tests[c];save();if(c===cat)render()}}catch(e){}}
/* --- données d'évaluation : store.evals[key] = {f:{},t:{},note,by,ts} --- */
store.evals=store.evals||{};store.extra=store.extra||{};store.queue=store.queue||[];
const key=(c,p,n)=>`${c}|${p}|${n}`;
function rec(c,p,n){return store.evals[key(c,p,n)]||(store.evals[key(c,p,n)]={f:{},t:{},note:"",by:"",ts:0})}
function players(c){return [...(ROSTER[c]||[]),...(store.extra[c]||[])]}
function push(c,p,n){const r=rec(c,p,n);r.ts=Date.now();r.by=get("who","");save();const payload={prog:1,cat:c,player:p,per:n,f:r.f,t:r.t,note:r.note,by:r.by,ts:r.ts};
  store.queue.push(payload);save();flush()}
let flushing=false;
async function flush(){if(flushing||!store.queue.length){setStatus();return}flushing=true;setStatus("sync");
  while(store.queue.length){const p=store.queue[0];try{const r=await fetch(API,{method:"POST",body:JSON.stringify(p),headers:{"Content-Type":"text/plain;charset=utf-8"}});if(!r.ok)throw new Error(r.status);const j=await r.json().catch(()=>({}));if(j.error)throw new Error(j.error);store.queue.shift();save()}catch(e){flushing=false;setStatus("bad");return}}
  flushing=false;setStatus("ok")}
function setStatus(mode){const el=document.getElementById("syncStatus");if(!el)return;
  if(mode==="sync"){el.className="status";el.textContent="Envoi…"}else if(mode==="bad"||store.queue.length){el.className="status warn";el.textContent=`${store.queue.length} saisie(s) en attente d'envoi — réessai automatique`}else if(mode==="ok"){el.className="status ok";el.textContent="Partagé avec le RTJ"}else{el.className="status ok";el.textContent="À jour"}}
async function loadRemote(c){try{const r=await fetch(`${API}?prog=${encodeURIComponent(c)}`,{cache:"no-store"});const j=await r.json();if(!Array.isArray(j))return;let n=0;
  j.forEach(x=>{const k=key(x.cat,x.player,x.per);const loc=store.evals[k];if(!loc||(x.ts||0)>(loc.ts||0)){store.evals[k]={f:x.f||{},t:x.t||{},note:x.note||"",by:x.by||"",ts:x.ts||0};n++}
    if(x.player&&!players(x.cat).includes(x.player)){store.extra[x.cat]=store.extra[x.cat]||[];store.extra[x.cat].push(x.player)}});
  if(n){save();render()}}catch(e){}}
/* --- rendu --- */
function renderCats(){document.getElementById("catbar").innerHTML=CATS.map(c=>`<button class="cat" data-c="${c}" aria-pressed="${c===cat}">${c}<small>${(ROSTER[c]||[]).length+(store.extra[c]||[]).length} joueurs</small></button>`).join("");
  document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.c;set("cat",cat);tEdit=false;tDraft=null;render();loadRemote(cat);loadTests(cat)}))}
function perbar(){return `<div class="perbar">${PERIODS.map(p=>`<button class="perchip" data-p="${p.n}" aria-pressed="${p.n===per}"><b>P${p.n}</b><span>${esc(p.name)}</span><small>${fmtShort(p.from)} → ${fmtShort(p.to)}</small></button>`).join("")}</div>`}
function bindPer(root){root.querySelectorAll(".perchip").forEach(b=>b.addEventListener("click",()=>{per=+b.dataset.p;set("per",per);render()}))}
function stars(v,attrs){return `<span class="stars" ${attrs}>${[1,2,3].map(n=>`<button class="${(v||0)>=n?'on':''}" data-n="${n}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join("")}</span>`}
let tEdit=false,tDraft=null;
function testsPanel(){
  const rows=tDraft.map((t,i)=>`<div class="trow"><span class="n num">${i+1}</span>
    <input type="text" data-k="name" data-i="${i}" value="${esc(t.name)}" placeholder="Nom du repère (ex. Jonglerie pied droit)" aria-label="Nom du repère ${i+1}">
    <input type="text" data-k="unit" data-i="${i}" value="${esc(t.unit||"")}" list="unitlist" placeholder="unité" aria-label="Unité">
    <input type="number" step="0.1" data-k="target" data-i="${i}" value="${t.target??""}" placeholder="objectif" aria-label="Objectif">
    <span class="mv"><button class="btn small" data-up="${i}" title="Monter" ${i===0?"disabled":""}>↑</button><button class="btn small" data-down="${i}" title="Descendre" ${i===tDraft.length-1?"disabled":""}>↓</button><button class="btn small" data-del="${i}" title="Retirer ce repère">✕</button></span></div>`).join("");
  return `<div class="testbox"><b>⚙️ Les critères chiffrés de la catégorie ${cat}</b>
    <span class="note">Ce qu'on chiffre à côté des étoiles. Une ligne par repère : son nom, son unité, l'objectif visé (facultatif). Les valeurs déjà saisies pour les joueurs sont conservées. Pour un temps (unité « s »), l'objectif se lit « en dessous de ».</span>
    <datalist id="unitlist">${UNITS.map(u=>`<option value="${u}">`).join("")}</datalist>
    ${tDraft.length?`<div class="trow thead"><span></span><span>Nom du repère</span><span>Unité</span><span>Objectif</span><span></span></div>`:""}
    <div class="trows">${rows||`<p class="note">Aucun repère : à cet âge on observe avec les étoiles, sans rien chiffrer.</p>`}</div>
    <div class="toolbar"><button class="btn" id="tAdd">+ Ajouter un repère</button>
      <div class="field"><label for="tBy">Ton prénom</label><input id="tBy" type="text" value="${esc(get("who",""))}" placeholder="facultatif"></div>
      <button class="btn primary" id="tSave">Enregistrer et partager</button><button class="btn" id="tCancel">Annuler</button>
      ${testsCustom()?`<button class="btn" id="tReset" style="margin-left:auto">↺ Revenir aux repères du guide FFF</button>`:""}</div></div>`}
function bindTestsPanel(v){const q=id=>document.getElementById(id);
  v.querySelectorAll(".trow input").forEach(i=>i.addEventListener("input",()=>{const t=tDraft[+i.dataset.i],k=i.dataset.k;
    if(k==="target")t.target=i.value===""?null:+i.value;else t[k]=i.value}));
  v.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.up;[tDraft[i-1],tDraft[i]]=[tDraft[i],tDraft[i-1]];renderEval()}));
  v.querySelectorAll("[data-down]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.down;[tDraft[i+1],tDraft[i]]=[tDraft[i],tDraft[i+1]];renderEval()}));
  v.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{tDraft.splice(+b.dataset.del,1);renderEval()}));
  q("tAdd").addEventListener("click",()=>{tDraft.push({id:"t"+Date.now().toString(36),name:"",unit:"contacts",target:null});renderEval();const last=v.querySelector(`.trow:last-child input[data-k="name"]`);if(last)last.focus()});
  q("tCancel").addEventListener("click",()=>{tEdit=false;tDraft=null;renderEval()});
  q("tSave").addEventListener("click",()=>{const by=(q("tBy").value||"").trim();if(by)set("who",by);
    const list=tDraft.filter(t=>(t.name||"").trim()).map(t=>{const o={id:t.id,name:t.name.trim(),unit:(t.unit||"").trim()};if(t.target!=null&&t.target!=="")o.target=+t.target;if(isTime(o.unit))o.lower=true;return o});
    tEdit=false;tDraft=null;
    const same=JSON.stringify(list)===JSON.stringify(defTests(cat));
    saveTests(cat,same?null:list,by).then(()=>render());renderEval()});
  const rs=q("tReset");if(rs)rs.addEventListener("click",()=>{if(rs.dataset.armed!=="1"){rs.dataset.armed="1";rs.textContent="Confirmer le retour aux repères du guide ?";return}
    tEdit=false;tDraft=null;saveTests(cat,null,(q("tBy").value||"").trim()).then(()=>render());renderEval()})}
function renderEval(){const v=document.getElementById("view-eval");const g=grp();const P=PERIODS[per-1];const list=players(cat);
  const head=`<tr><th>Joueur</th>${g.facets.map(f=>`<th title="${esc(f.desc)}">${esc(f.name)}</th>`).join("")}${TESTS().map(t=>`<th title="${esc(t.name)}">${esc(t.name)}<br><small>${esc(t.unit)}${t.target?` · obj. ${t.target}`:""}</small></th>`).join("")}<th>Mot de l'éducateur</th><th></th></tr>`;
  const rows=list.map(p=>{const r=rec(cat,p,per);return `<tr data-p="${esc(p)}"><td class="name">${esc(p)}</td>${g.facets.map(f=>`<td data-l="${esc(f.name)}">${stars(r.f[f.id],`data-f="${f.id}"`)}</td>`).join("")}${TESTS().map(t=>`<td data-l="${esc(t.name)} (${esc(t.unit)}${t.target?`, obj. ${t.target}`:""})"><input class="num" type="number" step="${/^(s|km\/h)$/.test(t.unit||"")?"0.1":"1"}" inputmode="${/^(s|km\/h)$/.test(t.unit||"")?"decimal":"numeric"}" data-t="${t.id}" value="${r.t[t.id]??""}" aria-label="${esc(t.name)}"></td>`).join("")}<td data-l="Mot de l'éducateur" class="notecell"><input class="txt" type="text" data-note value="${esc(r.note)}" placeholder="le mot de l'éducateur (carnet)"></td><td data-l="Carnet"><button class="btn" data-carnet="${esc(p)}" title="Carnet de ce joueur" style="padding:5px 8px">📄 Carnet</button></td></tr>`}).join("");
  const who=get("who","");
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Appréciation de la période ${per}</h2><p class="note" style="margin-top:6px">${esc(g.age)}</p>
   <div class="whobar${who?"":" empty"}"><span class="wlab">${who?"Rempli par":"Qui remplit ?"}</span><input id="who" type="text" value="${esc(who)}" placeholder="ton prénom" aria-label="Éducateur qui remplit" autocomplete="given-name"><span class="note" style="font-size:12.5px">${who?"— ton prénom signe les carnets et les saisies partagées":"— indispensable : il signe les carnets et les saisies partagées avec le RTJ"}</span></div>
   ${perbar()}
   <div class="card"><div class="facets">${g.facets.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div>
   <p class="legend">★ découvre · ★★ réussit souvent · ★★★ réussit vite et en match.${TESTS().length?" Repères mesurés : saisir la valeur du test de la période ; la liste s'adapte avec le bouton « Modifier les critères » sous le tableau.":""} Le message éducatif de la période : <b>${P.pef}</b>. Le <b>mot de l'éducateur</b>, les étoiles et les repères mesurés sont repris sur le <b>carnet de progression</b> (une page A4 par joueur, PDF ou impression) remis aux parents en fin de période.</p>
   ${tEdit?testsPanel():""}
   <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${rows||'<tr><td colspan="9" class="note">Aucun joueur.</td></tr>'}</tbody></table></div>
   <div class="toolbar" style="margin-top:14px"><form id="addPf" class="addp" autocomplete="off"><input id="addPn" type="text" placeholder="NOM Prénom du joueur à ajouter" aria-label="Nom du joueur à ajouter"><button class="btn" type="submit">+ Ajouter</button></form><button class="btn" id="tEditBtn" aria-pressed="${tEdit}" title="Modifier, ajouter ou retirer les critères chiffrés de la catégorie">⚙️ Modifier les critères${TESTS().length?` · ${TESTS().length}`:""}</button><span class="status" id="syncStatus" title="État du partage avec le classeur du club"></span></div>
   <div class="toolbar" style="justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><span class="note" style="flex:1">Carnet de progression : une page A4 par joueur, à remettre aux parents en fin de période.</span><button class="btn primary" id="allCarnets">📄 Carnets de la période ${per} (PDF / impression)</button></div></div>`;
  bindPer(v);setStatus();
  document.getElementById("tEditBtn").addEventListener("click",()=>{tEdit=!tEdit;tDraft=tEdit?TESTS().map(t=>({...t})):null;renderEval();if(tEdit){const b=v.querySelector(".testbox");if(b)b.scrollIntoView({behavior:"smooth",block:"nearest"})}});
  if(tEdit)bindTestsPanel(v);
  const wi=document.getElementById("who");wi.addEventListener("input",e=>{set("who",e.target.value.trim());wi.closest(".whobar").classList.toggle("empty",!e.target.value.trim())});
  wi.addEventListener("blur",()=>{if(get("who","")!==who)renderEval()});
  if(!who)setTimeout(()=>wi.focus(),200);
  v.querySelectorAll(".stars button").forEach(b=>b.addEventListener("click",()=>{const tr=b.closest("tr"),p=tr.dataset.p,f=b.parentElement.dataset.f;const r=rec(cat,p,per);const n=+b.dataset.n;r.f[f]=r.f[f]===n?0:n;push(cat,p,per);renderEval()}));
  v.querySelectorAll("input.num").forEach(i=>i.addEventListener("change",()=>{const p=i.closest("tr").dataset.p;const r=rec(cat,p,per);const tt=TESTS().find(x=>x.id===i.dataset.t);const dec=/^(s|km\/h)$/.test((tt&&tt.unit)||"");
    r.t[i.dataset.t]=i.value===""?null:(dec?Math.round(+i.value*100)/100:Math.round(+i.value));i.value=r.t[i.dataset.t]??"";push(cat,p,per)}));
  v.querySelectorAll("input.txt").forEach(i=>i.addEventListener("change",()=>{const p=i.closest("tr").dataset.p;rec(cat,p,per).note=i.value;push(cat,p,per)}));
  document.getElementById("allCarnets").addEventListener("click",()=>openCarnets(list));
  v.querySelectorAll("[data-carnet]").forEach(b=>b.addEventListener("click",()=>openCarnets([b.dataset.carnet])));
  document.getElementById("addPf").addEventListener("submit",e=>{e.preventDefault();const n=document.getElementById("addPn").value.trim();if(!n)return;
    if(players(cat).some(x=>x.toLowerCase()===n.toLowerCase())){toast("Ce joueur est déjà dans la liste");return}
    store.extra[cat]=store.extra[cat]||[];store.extra[cat].push(n);save();renderEval();renderCats();toast(n+" ajouté en "+cat);
    setTimeout(()=>{const tr=document.querySelector(`tr[data-p="${n.replace(/"/g,'\\"')}"]`);if(tr)tr.scrollIntoView({behavior:"smooth",block:"center"})},50)});
}
function renderProg(){const v=document.getElementById("view-prog");const g=grp();
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Le fil de l'année</h2><p class="note" style="margin-top:6px">${esc(g.age)}</p>
  <div class="periods">${PERIODS.map((p,i)=>`<div class="period"><b>P${p.n} · ${esc(p.name)}</b><small>${fmtShort(p.from)} → ${fmtShort(p.to)} · PEF ${p.pef}</small><ul>${g.periods[i].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="grid2"><div class="card"><h3>Ce qu'on apprécie</h3><div class="facets">${g.facets.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Repères mesurés${testsCustom()?" (adaptés par le club)":""}</h3>${TESTS().length?`<ul style="margin:6px 0 0;padding-left:18px">${TESTS().map(t=>`<li><b>${esc(t.name)}</b> — ${esc(t.unit)}${t.target?`, objectif : ${t.target}`:""}${t.lower?" (plus petit = mieux)":""}</li>`).join("")}</ul>`:'<p class="note">Pas de repère chiffré à cet âge : on observe, on n\'évalue pas.</p>'}<p class="note" style="margin-top:10px"><b>Format de compétition</b> · ${esc(g.match)}</p></div></div>
  <div class="callout">${cat<="U13"||["U10","U11","U12","U13"].includes(cat)?"Programme et compétences tirés du guide interactif FFF de la catégorie (thèmes numérotés T1… = procédés d'apprentissage du guide).":"Au-delà des U13 la FFF ne publie pas de guide interactif : ce référentiel décline ses compétences (tactique, technique, psychologique, athlétique) et les tests physiques d'usage en préformation / formation. À valider et ajuster avec le RTJ."}</div>`}
function renderBilan(){const v=document.getElementById("view-bilan");const g=grp();const list=players(cat);
  const T=TESTS();
  const rows=list.map(p=>{const recs=PERIODS.map(P=>store.evals[key(cat,p,P.n)]);const last=recs.filter(Boolean).pop();
    const note=recs.some(Boolean);
    /* une sous-ligne par facette : les étoiles de chaque période dans sa colonne, comme les repères */
    const fac=note?g.facets.map(f=>{let prev=null;const tds=recs.map((r,i)=>{const n=r?(r.f[f.id]||0):0;let cls="";if(n&&prev)cls=n>prev?" up":n<prev?" down":"";if(n)prev=n;
        return `<td data-l="P${i+1}" class="tval${cls}">${n?`<b class="st" title="${esc(f.name)} · P${i+1} : ${n} étoile${n>1?"s":""}">${"★".repeat(n)}<i>${"★".repeat(3-n)}</i></b>`:""}</td>`}).join("");
      return `<tr class="tsub"><td class="name tname" title="${esc(f.desc||"")}">${esc(f.name)}</td>${tds}</tr>`}).join(""):"";
    const cells=PERIODS.map((P,i)=>`<td data-l="P${P.n}">${!note&&i===0?`<span style="opacity:.5">pas encore évalué</span>`:""}</td>`).join("");
    /* les repères mesurés : une sous-ligne par test, les valeurs alignées sous P1 … P5 comme les étoiles */
    const court=n=>n.replace(/\s*\(.*?\)/g,"").replace(/Jonglerie/i,"Jongl.").replace(/pied droit/i,"pied D").replace(/pied gauche/i,"pied G").replace(/pied fort \/ pied faible/i,"PF / pf").replace(/en déplacement/i,"dépl.").replace(/conduite/i,"").replace(/Détente verticale/i,"Détente").replace(/Gainage planche/i,"Gainage").replace(/Souplesse.*/i,"Souplesse").replace(/\s+/g," ").trim();
    const sub=T.map(t=>{const vals=recs.map(r=>r&&r.t[t.id]!=null?r.t[t.id]:null);if(!vals.some(x=>x!=null))return "";
      let prev=null;const tds=vals.map((v,i)=>{let cls="";if(v!=null&&prev!=null)cls=(t.lower?v<prev:v>prev)?" up":(v===prev?"":" down");if(v!=null)prev=v;
        return `<td data-l="P${i+1}" class="tval${cls}">${v==null?"":`<b>${v}</b>`}</td>`}).join("");
      return `<tr class="tsub"><td class="name tname">${esc(court(t.name))} <small>${esc(t.unit||"")}</small></td>${tds}</tr>`}).filter(Boolean).join("");
    return `<tr class="tmain"><td class="name">${esc(p)}</td>${cells}</tr>${fac}${sub}`}).join("");
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Bilan annuel</h2><p class="note" style="margin-top:6px">Sous chaque joueur, une ligne par facette (${g.facets.map(f=>esc(f.name)).join(", ")}) avec ses étoiles dans la colonne de chaque période${T.length?", puis une ligne par repère mesuré avec la valeur relevée":""}. Jaune = mieux que la période d'avant. Le mot de l'éducateur, lui, est sur le carnet de progression de chaque enfant.</p>
  <div class="toolbar" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" id="bilanPdf">📄 Télécharger le bilan (PDF)</button></div>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Joueur</th>${PERIODS.map(P=>`<th>P${P.n}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  document.getElementById("bilanPdf").addEventListener("click",()=>bilanPdf().catch(e=>toast("PDF impossible : "+(e.message||e))))}

/* ===== Bilan annuel en PDF : A4 paysage, deux colonnes de blocs joueur, 1 à 2 pages, à l'instant T ===== */
async function bilanPdf(){
  await loadJsPDF();const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});carnetFonts(doc);
  const g=grp();const list=players(cat);const T=TESTS();const PW=297,PH=210,MX=10,GAP=6;const NCOL=list.length>12?3:2;const CW=(PW-2*MX-GAP*(NCOL-1))/NCOL;
  const col=x=>hex(x);const font=(st,sz)=>{doc.setFont("Poppins",st);doc.setFontSize(sz)};
  const fmtV=v=>Number.isInteger(v)?String(v):String(Math.round(v*100)/100).replace(".",",");
  const star=(cx,cy,r,on)=>{const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r*0.45:r;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
    const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
    if(on){doc.setFillColor(...col(CCOL.on));doc.setDrawColor(...col(CCOL.onS))}else{doc.setFillColor(255,255,255);doc.setDrawColor(...col(CCOL.offS))}doc.setLineWidth(.2);doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)};
  const NW=NCOL===3?33:46,PWc=(CW-NW)/5;const RH=NCOL===3?2.5:2.9;const SR=NCOL===3?1.0:1.15,SG=NCOL===3?2.9:3.4;
  const today=new Date();const dateTxt=today.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  const done=PERIODS.filter(P=>list.some(p=>store.evals[key(cat,p,P.n)])).map(P=>"P"+P.n);
  let page=0;const TOP=33.5,BOTTOM=PH-6.5;
  const head=()=>{page++;if(page>1)doc.addPage();
    try{doc.addImage(CREST_PNG,"PNG",MX,7,13,13)}catch(e){}
    font("bold",7);doc.setTextColor(...col(CCOL.gray));doc.text("PAU FC · ACADÉMIE · SAISON 2026-2027",MX+16,11,{charSpace:.8});
    font("bold",15);doc.setTextColor(...col(CCOL.navy));doc.text(`${cat} · BILAN ANNUEL${page>1?" (suite)":""}`,MX+16,17.5);
    font("normal",7.5);doc.setTextColor(...col(CCOL.gray));doc.text(`${g.label} · au ${dateTxt}${done.length?` · périodes renseignées : ${done.join(", ")}`:" · aucune période renseignée"}`,MX+16,22);
    font("normal",6.3);const leg=doc.splitTextToSize(`Une ligne par facette avec ses étoiles dans la colonne de chaque période (1 découvre · 2 réussit souvent · 3 réussit vite et en match)${T.length?", puis les repères mesurés relevés":""}. Fond jaune = mieux que la période d'avant. Le mot de l'éducateur figure sur les carnets.   ${PERIODS.map(P=>`P${P.n} ${P.name}`).join("  ·  ")}`,PW-2*MX).slice(0,2);doc.text(leg,MX,26.4);
    doc.setDrawColor(...col(CCOL.yel));doc.setLineWidth(.6);doc.line(MX,31.2,PW-MX,31.2)};
  const foot=()=>{font("normal",6.3);doc.setTextColor(...col(CCOL.gray));doc.text(`Pau FC Academy · progression des joueurs · ${cat} · page ${page}`,PW/2,PH-2.8,{align:"center"})};
  const colHead=(x,y)=>{doc.setFillColor(...col(CCOL.navy));doc.rect(x,y,CW,4.6,"F");font("bold",6.5);doc.setTextColor(255,255,255);
    doc.text("JOUEUR",x+2,y+3.2);PERIODS.forEach((P,i)=>doc.text(`P${P.n}`,x+NW+i*PWc+PWc/2,y+3.2,{align:"center"}));return y+5.6};
  head();
  let cx=MX,y=colHead(MX,TOP),colIdx=0;
  const nextCol=()=>{colIdx++;if(colIdx>NCOL-1){foot();head();colIdx=0}cx=MX+colIdx*(CW+GAP);y=colHead(cx,TOP)};
  list.forEach(p=>{const recs=PERIODS.map(P=>store.evals[key(cat,p,P.n)]);const last=recs.filter(Boolean).pop();const noted=recs.some(Boolean);
    const testRows=noted?T.filter(t=>recs.some(r=>r&&r.t[t.id]!=null)):[];
    const nRows=(noted?g.facets.length+testRows.length:1)+(NCOL===3?1:0);const bh=nRows*RH+2.2;
    if(y+bh>BOTTOM)nextCol();
    const PX=i=>cx+NW+i*PWc+PWc/2;
    doc.setDrawColor(...col(CCOL.line));doc.setLineWidth(.2);doc.line(cx,y,cx+CW,y);y+=1;
    font("bold",7.6);doc.setTextColor(...col(CCOL.ink));const nm=p.length>(NCOL===3?22:30)?p.slice(0,NCOL===3?21:29)+"…":p;doc.text(nm,cx+1.5,y+2.3);
    if(!noted){font("italic",6.5);doc.setTextColor(...col(CCOL.gray));doc.text("pas encore évalué",cx+NW+2,y+2.3);y+=RH+1.2;return}
    if(NCOL===3)y+=RH;
    g.facets.forEach((f,fi)=>{if(fi){font("normal",6.3);doc.setTextColor(...col(CCOL.gray));doc.text(f.name,cx+6,y+2.2)}
      else if(NCOL<3){font("normal",6.3);doc.setTextColor(...col(CCOL.gray));doc.text(f.name,cx+6+doc.getTextWidth(nm)*7.6/6.3+2,y+2.2)}
      let prev=null;recs.forEach((r,i)=>{const n=r?(r.f[f.id]||0):0;if(n){if(prev&&n>prev){doc.setFillColor(255,243,184);doc.roundedRect(PX(i)-SG*1.65,y+.15,SG*3.3,2.6,.6,.6,"F")}
        for(let k=0;k<3;k++)star(PX(i)-SG+k*SG,y+1.45,SR,k<n);prev=n}});
      y+=RH});
    testRows.forEach(t=>{font("normal",6);doc.setTextColor(...col(CCOL.gray));const lab=`${t.name}${t.unit?" ("+t.unit+")":""}`;const mx=NCOL===3?22:36;doc.text(lab.length>mx?lab.slice(0,mx-1)+"…":lab,cx+6,y+2.2);
      let prev=null;recs.forEach((r,i)=>{const v=r&&r.t[t.id]!=null?r.t[t.id]:null;if(v!=null){const mieux=prev!=null&&(t.lower?v<prev:v>prev);
        if(mieux){doc.setFillColor(255,243,184);doc.roundedRect(PX(i)-4.5,y+.15,9,2.7,.6,.6,"F")}
        font("bold",6.6);doc.setTextColor(...col(CCOL.ink));doc.text(fmtV(v),PX(i),y+2.2,{align:"center"});prev=v}});
      y+=RH});
    y+=1});
  doc.setDrawColor(...col(CCOL.line));doc.line(cx,y,cx+CW,y);foot();
  doc.save(`bilan-annuel-${cat.toLowerCase()}-${today.toISOString().slice(0,10)}.pdf`);toast(`Bilan téléchargé (${page} page${page>1?"s":""})`)}
/* --- carnets de progression (module partagé carnet.js) --- */
const fmtDay=s=>{const d=D(s);const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];return `${d.getDate()}${d.getDate()===1?"er":""} ${M[d.getMonth()]}`};
function carnetOfPlayer(p,n){const g=grp();const P=PERIODS[n-1];const next=PERIODS[n];const r=store.evals[key(cat,p,n)]||{f:{},t:{},note:"",by:""};const y1=D(P.from).getFullYear(),y2=D(P.to).getFullYear();
  return {title:"CARNET DE PROGRESSION",line:`${cat} · Période ${n} « ${P.name} » · du ${fmtDay(P.from)}${y1!==y2?" "+y1:""} au ${fmtDay(P.to)} ${y2}`,name:p,
    sub:"a participé aux séances de la période et a travaillé :",items:(CARNET_ITEMS[GROUP_OF[cat]]||[])[n-1]||g.periods[n-1],
    facets:g.facets.map(f=>({name:f.name,desc:f.desc,n:r.f[f.id]||0})),
    tests:TESTS().map(t=>({name:t.name,val:r.t[t.id],unit:t.unit,target:t.target})),
    legend:"1 étoile : découvre · 2 étoiles : réussit souvent · 3 étoiles : réussit vite et en match — on se compare à soi-même, jamais aux autres.",
    mot:r.note||"",educ:r.by||get("who",""),
    foot:(next?`Prochaine période : « ${next.name} » du ${fmtDay(next.from)} au ${fmtDay(next.to)} · message éducatif : ${next.pef}. `:"Merci pour cette belle saison ! ")+"À bientôt au Pau FC !"}}
function restoreMain(){const m=document.querySelector("main");if(!document.getElementById("view-eval"))m.innerHTML=`<section class="view active" id="view-eval" role="tabpanel"></section><section class="view" id="view-bilan" role="tabpanel"></section>`}
function openCarnets(list){if(!list.length){toast("Aucun joueur");return}showCarnets(list.map(p=>carnetOfPlayer(p,per)),{title:`${cat} · période ${per}`,fname:`carnets-${cat.toLowerCase()}-periode${per}.pdf`,back:()=>{restoreMain();document.querySelector("header.top").hidden=false;showTab("view-eval")}})}
function showTab(id){restoreMain();document.querySelector("header.top").hidden=false;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.getAttribute("aria-controls")===id));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===id));set("tab",id);render()}
function render(){renderCats();let id=get("tab","view-eval");if(id==="view-prog"){id="view-eval";set("tab",id);document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.getAttribute("aria-controls")===id));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===id))}
  if(id==="view-eval")renderEval();else renderBilan()}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showTab(t.getAttribute("aria-controls"))));
showTab(get("tab","view-eval"));loadRemote(cat);loadTests(cat);flush();
/* Aide au défilement pour les tableaux plus larges que l'écran : ombre sur le bord droit,
   barre de défilement toujours visible et une courte mention sous le tableau. */
function addScrollArrows(){document.querySelectorAll('.tbl-wrap,.sess-list').forEach(el=>{
  const over=el.scrollWidth>el.clientWidth+4;
  let bar=el.nextElementSibling;if(!(bar&&bar.classList.contains('scrollhint')))bar=null;
  el.classList.toggle('has-more',over);
  if(!over){if(bar)bar.hidden=true;return}
  if(!bar){bar=document.createElement('div');bar.className='scrollhint';bar.innerHTML='<span aria-hidden="true">↔</span> Tableau plus large que l’écran : faites-le glisser vers la gauche pour voir toutes les colonnes.';el.parentNode.insertBefore(bar,el.nextSibling);
    const upd=()=>el.classList.toggle('at-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4);el.addEventListener('scroll',upd,{passive:true});upd()}
  bar.hidden=false})}
const _sh=new MutationObserver(()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});_sh.observe(document.querySelector('main'),{childList:true,subtree:true});window.addEventListener('resize',()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});setTimeout(addScrollArrows,300);

<style>
:root{--navy:#0B2A4A;--navy-2:#123B66;--yellow:#F2C200;--yellow-ink:#7A5E00;--bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#E9EEF6;--line:#D5DDE8;--ink:#14213D;--muted:#5B6B82;--faint:#8A97AB;--ok:#2E8B57;--warn:#C77700;--bad:#D64545;--shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);--r:10px;--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}

:root[data-theme="dark"]{--navy-2:#173F6B;--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}h1{font-size:clamp(30px,5vw,44px);font-weight:800;text-transform:uppercase}h2{font-size:clamp(22px,3vw,30px);font-weight:700;text-transform:uppercase}h3{font-size:21px;font-weight:700}h4{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}button{font-family:inherit;font-size:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.top{background:var(--navy);color:#fff;padding-block:18px 14px}.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.crest{width:46px;height:52px;flex:none}.brand .eyebrow{color:var(--yellow)}.brand p{color:#C9D6E8;max-width:66ch;margin-top:4px}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
.cat{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:18px;font-weight:700}
.cat[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.cat small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.8;letter-spacing:0}
main{padding-block:20px 60px}
.perbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:14px 0 6px}
.perchip{flex:none;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:150px;text-align:left}
.perchip b{font-family:var(--display);font-size:18px;line-height:1}.perchip span{font-size:13px;font-weight:600}.perchip small{font-size:11px;color:var(--muted)}
.perchip[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:16px}
.card h3{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}@media (max-width:900px){.periods{grid-template-columns:repeat(2,1fr)}}@media (max-width:520px){.periods{grid-template-columns:1fr}}
.period{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}.period b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.period small{color:var(--muted)}.period ul{margin:6px 0 0;padding-left:16px}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.facet{background:var(--surface-2);border-radius:8px;padding:10px}.facet b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.facet span{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.callout{border-left:4px solid var(--yellow);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px;font-size:15px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.name{font-weight:600;white-space:normal;min-width:160px}
.stars{display:inline-flex;gap:0}.stars button{background:none;border:0;padding:1px 2px;font-size:20px;line-height:1;color:var(--line)}.stars button.on{color:var(--yellow)}
input.num{width:64px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;background:var(--surface);color:var(--ink);text-align:right}
input.txt{width:150px;border:1px solid transparent;border-radius:6px;padding:5px 6px;font:inherit;background:transparent;color:var(--ink)}input.txt:hover,input.txt:focus{border-color:var(--line);background:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.status{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}.status.ok{background:#DCF5E6;color:#1B5E36}.status.warn{background:#FFF3BF;color:#7A5E00}.status.bad{background:#FBE0E0;color:#8A1F1F}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-weight:600;font-size:13px}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.trend{font-family:var(--display);font-size:15px;letter-spacing:.04em}.trend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;background:var(--line);vertical-align:middle}.trend i.l1{background:#F2C200;opacity:.45}.trend i.l2{background:#F2C200;opacity:.75}.trend i.l3{background:#F2C200}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}
.tabs{display:flex;gap:4px;margin-top:12px}.tab{background:transparent;color:#C9D6E8;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--display);font-size:17px;text-transform:uppercase;font-weight:700}.tab[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none}.view.active{display:block}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    periods:[["Sécuriser la possession, reformer le bloc, jouer vers l'avant entre les lignes, transition défensive, jouer vers l'avant collectivement — étapes 1 à 5 (T1-T9)"],["Sécuriser la possession, agrandir l'espace (T10-T11)"],["Sécuriser la possession, jouer vers l'avant entre les lignes (T12-T13) · futsal"],["Garder le temps d'avance, réaction à la perte, marquer, changer de rythme, prise de balle et enchaînements, défendre l'axe ballon-but (T14-T22)"],["Fixer dans une zone pour jouer dans une autre (T23) · Festival U13"]],
    match:"Critérium U12/U13 : foot à 8, classement par phase sans montée/descente ; futsal 4-5 journées."},
  u1415:{label:"U14 · U15 · préformation",age:"13-14 ans — croissance rapide : individualiser, protéger les articulations, développer la vitesse et le jeu à 11. Référentiel proposé à partir des compétences FFF (pas de guide interactif fédéral) — à valider avec le RTJ.",
    facets:[{id:"tactique",name:"Tactique",desc:"Jeu de position à 11, conservation sous pression, transitions offensive et défensive, animation défensive en bloc, jeu entre les lignes"},{id:"technique",name:"Technique",desc:"Technique sous pression et en vitesse, jeu long des 2 pieds, jeu de tête, finition, duels offensifs et défensifs"},{id:"mental",name:"Mental",desc:"Concentration 90 min, gestion des émotions, leadership, respect de l'arbitre, projet collectif"},{id:"physique",name:"Physique",desc:"Vitesse, endurance, coordination, gainage, souplesse ; prévention (croissance)"}],
    tests:[{id:"j100",name:"Jonglerie pied fort / pied faible",unit:"contacts",target:100},{id:"v30",name:"Vitesse 30 m",unit:"s",lower:true},{id:"vma",name:"VMA (Vameval ou 30-15)",unit:"km/h"},{id:"detente",name:"Détente verticale",unit:"cm"},{id:"gainage",name:"Gainage planche",unit:"s"},{id:"souplesse",name:"Souplesse (assis-atteindre)",unit:"cm"}],
    periods:[["Repères collectifs à 11 : occupation, conservation, jeu vers l'avant"],["Transitions : réaction à la perte, contre-attaque, bloc équipe"],["Futsal et technique en vitesse : prises de balle, enchaînements, jeu de tête"],["Animation défensive en bloc, jeu dans les intervalles, finition"],["Compétition : gestion du match, rôles, bilan physique et technique"]],
    match:"Championnats U14/U15 à 11 (district / ligue) : hors-jeu, mi-temps de 40 min."},
  u1618:{label:"U16 · U17 · U18 · formation",age:"15-17 ans — vers le football adulte : performance, spécialisation par poste, autonomie, préparation physique structurée. Référentiel proposé — à valider avec le RTJ.",
    facets:[{id:"tactique",name:"Tactique",desc:"Compréhension du système, animation offensive et défensive par lignes, transitions, coups de pied arrêtés"},{id:"technique",name:"Technique",desc:"Maîtrise sous pression et à haute intensité, jeu long, jeu de tête, finition, spécificités du poste"},{id:"mental",name:"Mental",desc:"Exigence, résilience, leadership, communication, hygiène de vie (sommeil, alimentation)"},{id:"physique",name:"Physique",desc:"Vitesse, endurance, puissance, prévention des blessures, récupération"}],
    tests:[{id:"v30",name:"Vitesse 30 m",unit:"s",lower:true},{id:"v10",name:"Vitesse 10 m",unit:"s",lower:true},{id:"vma",name:"VMA (30-15 IFT ou Vameval)",unit:"km/h"},{id:"detente",name:"Détente verticale (CMJ)",unit:"cm"},{id:"gainage",name:"Gainage planche",unit:"s"},{id:"j100",name:"Jonglerie pied faible",unit:"contacts",target:100}],
    periods:[["Bases collectives du système, condition physique de reprise"],["Animation offensive et transitions ; coups de pied arrêtés"],["Bloc défensif, pressing, futsal ou salle par temps froid"],["Finition, duels, rôle par poste ; tests physiques de mi-saison"],["Compétition, gestion des fins de saison, bilan individuel"]],
    match:"Championnats U16/U17/U18 à 11 (district / ligue / région)."}
};
</script>
<script>
/* ===== Application ===== */
const LS="paufc-progression-v1";let store={};try{store=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const get=(k,d)=>(k in store)?store[k]:d;const set=(k,v)=>{store[k]=v;save()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date();today.setHours(0,0,0,0);const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MOIS_C=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];const fmtShort=s=>{const d=D(s);return `${d.getDate()} ${MOIS_C[d.getMonth()]}`};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2200)}
const QS=new URLSearchParams(location.search);
let cat=QS.get("cat")&&CATS.includes(QS.get("cat"))?QS.get("cat"):get("cat","U7");
let per=get("per",(PERIODS.find(p=>today<=D(p.to))||PERIODS[4]).n);
const grp=()=>GROUPS[GROUP_OF[cat]];
/* --- données d'évaluation : store.evals[key] = {f:{},t:{},note,by,ts} --- */
store.evals=store.evals||{};store.extra=store.extra||{};store.queue=store.queue||[];
const key=(c,p,n)=>`${c}|${p}|${n}`;
function rec(c,p,n){return store.evals[key(c,p,n)]||(store.evals[key(c,p,n)]={f:{},t:{},note:"",by:"",ts:0})}
function players(c){return [...(ROSTER[c]||[]),...(store.extra[c]||[])]}
function push(c,p,n){const r=rec(c,p,n);r.ts=Date.now();r.by=get("who","");save();const payload={prog:1,cat:c,player:p,per:n,f:r.f,t:r.t,note:r.note,by:r.by,ts:r.ts};
  store.queue.push(payload);save();flush()}
let flushing=false;
async function flush(){if(flushing||!store.queue.length){setStatus();return}flushing=true;setStatus("sync");
  while(store.queue.length){const p=store.queue[0];try{const r=await fetch(API,{method:"POST",body:JSON.stringify(p),headers:{"Content-Type":"text/plain;charset=utf-8"}});if(!r.ok)throw new Error(r.status);const j=await r.json().catch(()=>({}));if(j.error)throw new Error(j.error);store.queue.shift();save()}catch(e){flushing=false;setStatus("bad");return}}
  flushing=false;setStatus("ok")}
function setStatus(mode){const el=document.getElementById("syncStatus");if(!el)return;
  if(mode==="sync"){el.className="status";el.textContent="Envoi…"}else if(mode==="bad"||store.queue.length){el.className="status warn";el.textContent=`${store.queue.length} saisie(s) en attente d'envoi — réessai automatique`}else if(mode==="ok"){el.className="status ok";el.textContent="Partagé avec le RTJ"}else{el.className="status ok";el.textContent="À jour"}}
async function loadRemote(c){try{const r=await fetch(`${API}?prog=${encodeURIComponent(c)}`,{cache:"no-store"});const j=await r.json();if(!Array.isArray(j))return;let n=0;
  j.forEach(x=>{const k=key(x.cat,x.player,x.per);const loc=store.evals[k];if(!loc||(x.ts||0)>(loc.ts||0)){store.evals[k]={f:x.f||{},t:x.t||{},note:x.note||"",by:x.by||"",ts:x.ts||0};n++}
    if(x.player&&!players(x.cat).includes(x.player)){store.extra[x.cat]=store.extra[x.cat]||[];store.extra[x.cat].push(x.player)}});
  if(n){save();render()}}catch(e){}}
/* --- rendu --- */
function renderCats(){document.getElementById("catbar").innerHTML=CATS.map(c=>`<button class="cat" data-c="${c}" aria-pressed="${c===cat}">${c}<small>${(ROSTER[c]||[]).length+(store.extra[c]||[]).length} joueurs</small></button>`).join("");
  document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.c;set("cat",cat);render();loadRemote(cat)}))}
function perbar(){return `<div class="perbar">${PERIODS.map(p=>`<button class="perchip" data-p="${p.n}" aria-pressed="${p.n===per}"><b>P${p.n}</b><span>${esc(p.name)}</span><small>${fmtShort(p.from)} → ${fmtShort(p.to)}</small></button>`).join("")}</div>`}
function bindPer(root){root.querySelectorAll(".perchip").forEach(b=>b.addEventListener("click",()=>{per=+b.dataset.p;set("per",per);render()}))}
function stars(v,attrs){return `<span class="stars" ${attrs}>${[1,2,3].map(n=>`<button class="${(v||0)>=n?'on':''}" data-n="${n}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join("")}</span>`}
function renderEval(){const v=document.getElementById("view-eval");const g=grp();const P=PERIODS[per-1];const list=players(cat);
  const head=`<tr><th>Joueur</th>${g.facets.map(f=>`<th title="${esc(f.desc)}">${esc(f.name)}</th>`).join("")}${g.tests.map(t=>`<th title="${esc(t.name)}">${esc(t.name.length>18?t.name.slice(0,17)+"…":t.name)}<br><small>${esc(t.unit)}${t.target?` · obj. ${t.target}`:""}</small></th>`).join("")}<th>Un mot</th></tr>`;
  const rows=list.map(p=>{const r=rec(cat,p,per);return `<tr data-p="${esc(p)}"><td class="name">${esc(p)}</td>${g.facets.map(f=>`<td>${stars(r.f[f.id],`data-f="${f.id}"`)}</td>`).join("")}${g.tests.map(t=>`<td><input class="num" type="number" step="0.1" data-t="${t.id}" value="${r.t[t.id]??""}" aria-label="${esc(t.name)}"></td>`).join("")}<td><input class="txt" type="text" data-note value="${esc(r.note)}" placeholder="un mot"></td></tr>`}).join("");
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Appréciation de la période ${per}</h2><p class="note" style="margin-top:6px">${esc(g.age)}</p>${perbar()}
   <div class="toolbar"><div class="field"><label for="who">Éducateur qui remplit</label><input id="who" type="text" value="${esc(get("who",""))}" placeholder="Prénom"></div><span class="status" id="syncStatus"></span><button class="btn" id="addP">+ Ajouter un joueur</button><button class="btn" id="copyTxt">Copier le bilan (texte)</button></div>
   <div class="card"><div class="facets">${g.facets.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div>
   <p class="legend">★ découvre · ★★ réussit souvent · ★★★ réussit vite et en match.${g.tests.length?" Repères mesurés : saisir la valeur du test de la période (objectifs du guide FFF indiqués).":""} Le message éducatif de la période : <b>${P.pef}</b>.</p>
   <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${rows||'<tr><td colspan="9" class="note">Aucun joueur.</td></tr>'}</tbody></table></div></div>`;
  bindPer(v);setStatus();
  document.getElementById("who").addEventListener("change",e=>set("who",e.target.value.trim()));
  v.querySelectorAll(".stars button").forEach(b=>b.addEventListener("click",()=>{const tr=b.closest("tr"),p=tr.dataset.p,f=b.parentElement.dataset.f;const r=rec(cat,p,per);const n=+b.dataset.n;r.f[f]=r.f[f]===n?0:n;push(cat,p,per);renderEval()}));
  v.querySelectorAll("input.num").forEach(i=>i.addEventListener("change",()=>{const p=i.closest("tr").dataset.p;const r=rec(cat,p,per);r.t[i.dataset.t]=i.value===""?null:+i.value;push(cat,p,per)}));
  v.querySelectorAll("input.txt").forEach(i=>i.addEventListener("change",()=>{const p=i.closest("tr").dataset.p;rec(cat,p,per).note=i.value;push(cat,p,per)}));
  document.getElementById("addP").addEventListener("click",()=>{const n=prompt("NOM Prénom du joueur");if(!n)return;store.extra[cat]=store.extra[cat]||[];store.extra[cat].push(n.trim());save();renderEval();renderCats()});
  document.getElementById("copyTxt").addEventListener("click",async()=>{const txt=`Pau FC ${cat} — appréciation période ${per} (${P.name})\n`+list.map(p=>{const r=rec(cat,p,per);return `${p} : ${g.facets.map(f=>`${f.name} ${"★".repeat(r.f[f.id]||0)||"–"}`).join(" · ")}${g.tests.filter(t=>r.t[t.id]!=null).map(t=>` · ${t.name} ${r.t[t.id]} ${t.unit}`).join("")}${r.note?` — ${r.note}`:""}`}).join("\n");try{await navigator.clipboard.writeText(txt);toast("Bilan copié")}catch(e){toast("Copie impossible ici")}});
}
function renderProg(){const v=document.getElementById("view-prog");const g=grp();
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Le fil de l'année</h2><p class="note" style="margin-top:6px">${esc(g.age)}</p>
  <div class="periods">${PERIODS.map((p,i)=>`<div class="period"><b>P${p.n} · ${esc(p.name)}</b><small>${fmtShort(p.from)} → ${fmtShort(p.to)} · PEF ${p.pef}</small><ul>${g.periods[i].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="grid2"><div class="card"><h3>Ce qu'on apprécie</h3><div class="facets">${g.facets.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div></div>
  <div class="card"><h3>Repères mesurés</h3>${g.tests.length?`<ul style="margin:6px 0 0;padding-left:18px">${g.tests.map(t=>`<li><b>${esc(t.name)}</b> — ${esc(t.unit)}${t.target?`, objectif du guide : ${t.target}`:""}${t.lower?" (plus petit = mieux)":""}</li>`).join("")}</ul>`:'<p class="note">Pas de repère chiffré à cet âge : on observe, on n\'évalue pas.</p>'}<p class="note" style="margin-top:10px"><b>Format de compétition</b> · ${esc(g.match)}</p></div></div>
  <div class="callout">${cat<="U13"||["U10","U11","U12","U13"].includes(cat)?"Programme et compétences tirés du guide interactif FFF de la catégorie (thèmes numérotés T1… = procédés d'apprentissage du guide).":"Au-delà des U13 la FFF ne publie pas de guide interactif : ce référentiel décline ses compétences (tactique, technique, psychologique, athlétique) et les tests physiques d'usage en préformation / formation. À valider et ajuster avec le RTJ."}</div>`}
function renderBilan(){const v=document.getElementById("view-bilan");const g=grp();const list=players(cat);
  const rows=list.map(p=>{const cells=PERIODS.map(P=>{const r=store.evals[key(cat,p,P.n)];const vals=r?g.facets.map(f=>r.f[f.id]||0).filter(x=>x>0):[];const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;return `<td><span class="trend" title="P${P.n}">${g.facets.map(f=>`<i class="${r&&r.f[f.id]?'l'+r.f[f.id]:''}"></i>`).join("")}${avg?` ${avg.toFixed(1)}`:""}</span></td>`}).join("");
    const last=PERIODS.map(P=>store.evals[key(cat,p,P.n)]).filter(Boolean).pop();const tests=last?g.tests.filter(t=>last.t[t.id]!=null).map(t=>`${t.name.split(" ")[0]} ${last.t[t.id]}`).join(" · "):"";
    return `<tr><td class="name">${esc(p)}</td>${cells}<td class="note">${esc(tests)}${last&&last.note?` — ${esc(last.note)}`:""}</td></tr>`}).join("");
  v.innerHTML=`<div class="eyebrow">${esc(g.label)}</div><h2 style="margin-top:4px">${cat} · Bilan annuel</h2><p class="note" style="margin-top:6px">Une case par facette et par période (clair → foncé = 1 → 3 étoiles), la moyenne de la période, les derniers repères mesurés et le dernier mot de l'éducateur.</p>
  <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Joueur</th>${PERIODS.map(P=>`<th>P${P.n}</th>`).join("")}<th>Repères · mot</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function showTab(id){document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.getAttribute("aria-controls")===id));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===id));set("tab",id);render()}
function render(){renderCats();const id=get("tab","view-eval");if(id==="view-eval")renderEval();else if(id==="view-prog")renderProg();else renderBilan()}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showTab(t.getAttribute("aria-controls"))));
showTab(get("tab","view-eval"));loadRemote(cat);flush();
</script>

</body>

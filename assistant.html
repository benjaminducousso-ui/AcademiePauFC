<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2A4A"></head><body>
<title>Assistant de séance · Pau FC Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --navy:#0B2A4A; --navy-2:#123B66; --yellow:#F2C200; --yellow-ink:#7A5E00;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EEF6; --line:#D5DDE8;
  --ink:#14213D; --muted:#5B6B82; --faint:#8A97AB;
  --ok:#2E8B57; --warn:#C77700; --wa:#25D366; --danger:#8A1F1F;
  --shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);
  --shadow-lg:0 12px 32px rgba(11,42,74,.16);
  --r:14px;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --tap:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
  --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 14px 34px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 14px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(22px,4.6vw,30px);font-weight:800;text-transform:uppercase}
h3{font-size:20px;font-weight:700}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- coquille ---------- */
.app{max-width:760px;margin:0 auto;padding:0 16px 132px}
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(11,42,74,.18)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.top img{width:36px;height:36px;flex:none}
.top .t1{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:12.5px;color:#C9D6E8;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.back:hover{background:rgba(255,255,255,.2)}
.top .sp{margin-left:auto;display:flex;gap:8px}
.tbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.2)}

/* ---------- blocs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card>h3{margin-bottom:4px}
.hint{color:var(--muted);font-size:15px}
.hero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border:0;padding:24px 20px;margin-top:16px}
.hero h2{color:#fff}
.hero p{color:#C9D6E8;margin-top:8px;max-width:46ch}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:18px;border-radius:999px;border:0;background:var(--yellow);color:#3B2E00;font-family:var(--display);text-transform:uppercase;font-size:22px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 18px rgba(242,194,0,.35);transition:transform .12s}
.big:active{transform:scale(.98)}
.ghostlink{display:inline-block;margin-top:12px;background:none;border:0;color:#C9D6E8;text-decoration:underline;font-size:15px;padding:6px 0}
.card .ghostlink{color:var(--muted)}

/* ---------- questions ---------- */
.q{margin-top:22px}
.q:first-child{margin-top:4px}
.q>label,.qlab{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:var(--tap);padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,background .12s,border-color .12s}
.chip:hover{border-color:var(--navy-2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] .c2{color:var(--yellow)}
.chip:active{transform:scale(.96)}
.chip .c2{font-size:13px;font-weight:600;color:var(--faint)}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:var(--tap);border:0;background:transparent;font-weight:700;font-size:15.5px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.stepper button{width:52px;height:var(--tap);border:0;background:transparent;font-size:24px;font-weight:700;line-height:1;color:var(--navy-2)}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.3}
.stepper .v{min-width:72px;text-align:center;font-family:var(--display);font-size:26px;font-weight:800}
.stepper .u{font-size:13px;color:var(--muted);padding-right:14px}
.datein{min-height:var(--tap);width:100%;max-width:260px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
.switch{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:8px 4px;border:0;border-top:1px solid var(--line);background:none;font:inherit}
.switch:first-of-type{border-top:0}
.switch:hover .tog{border-color:var(--navy-2)}
.switch b{font-weight:700;font-size:16.5px}
.switch .sub{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.tog{flex:none;width:58px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);position:relative;transition:background .15s,border-color .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .16s}
.switch[aria-pressed="true"] .tog{background:var(--ok);border-color:var(--ok)}
.switch[aria-pressed="true"] .tog::after{transform:translateX(26px)}

/* ---------- barre d'action collante ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;flex:1}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--yellow);border-color:var(--yellow);color:#3B2E00;flex:1;font-family:var(--display);text-transform:uppercase;font-size:20px;font-weight:800}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#08331B;flex:1}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 12px}
.btn.icon{width:52px;padding:0;flex:none}
.btn svg{width:20px;height:20px}

/* ---------- fiche de séance ---------- */
.sheet{margin-top:16px}
.shead{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r) var(--r) 0 0;padding:18px 18px 16px}
.shead .eyebrow{color:var(--yellow)}
.shead h2{color:#fff;margin-top:4px}
.shead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.tl{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.tl span{display:block}
.blocks{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);overflow:hidden}
.blk{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:16px;border-top:1px solid var(--line);position:relative}
.blk:first-child{border-top:0}
.blk .sch{align-self:start;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;min-height:76px}
.blk .sch svg{display:block;width:100%;height:auto}
.blk .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;box-shadow:none;position:static}
.blk .d{font-family:var(--display);font-size:24px;font-weight:800;color:var(--navy-2);line-height:1}
:root[data-theme="dark"] .blk .d{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blk .d{color:var(--yellow)}}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap}
.k-accueil,.k-calme{background:#6B7A90}.k-eveil{background:#C77700}.k-atelier{background:#1E56C9}.k-defi{background:#8E44AD}.k-match{background:#2E8B57}
.blk h3{margin-top:6px;font-size:19px}
.blk .desc{margin-top:4px;font-size:15.5px;color:var(--ink)}
.blk .more{margin-top:8px;font-size:14.5px;color:var(--muted)}
.blk .more b{color:var(--yellow-ink)}
.blk details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--navy-2);margin-top:6px}
@media (max-width:560px){.blk{grid-template-columns:1fr}.blk .sch{max-width:220px}}
.rotband{margin:0;padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--line);border-left:4px solid var(--yellow);font-size:15px}
.rotband b{color:var(--yellow-ink)}
.blk.inrot{border-left:4px solid var(--yellow)}
.mat{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px;border-top:1px solid var(--line)}
.mat span{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14px}

/* ---------- édition ---------- */
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0}
.erow.inrot{border-left:4px solid var(--yellow)}
.erow .grip{width:34px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none}
.erow .grip .n{font-family:var(--display);font-size:17px;font-weight:800;color:var(--navy-2)}
.erow.drag{box-shadow:var(--shadow-lg);border-color:var(--navy-2);opacity:.97}
.ename{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ename b{font-size:16px}
.etools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.dur{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:14px}
.dur input{width:62px;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;text-align:right;background:var(--surface)}
.slot{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;min-height:30px}
.slot::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--line)}
.plus{position:relative;z-index:1;width:32px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;transition:transform .12s,background .12s}
.plus:hover,.plus:focus-visible{background:var(--navy);border-color:var(--navy);color:#fff;transform:scale(1.1)}
.rotpill{position:relative;z-index:1;font-size:12.5px;font-weight:700;border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;opacity:0;transition:opacity .15s}
.slot:hover .rotpill,.rotpill:focus-visible,.rotpill.on{opacity:1}
.rotpill.on{border-style:solid;background:var(--yellow);border-color:var(--yellow);color:#3B2E00}
@media (hover:none){.rotpill{opacity:1}}
.elist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.elist.dragging .slot{visibility:hidden}
.etxt{flex:1 1 100%;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.etxt label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.etxt input,.etxt textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-weight:400;background:var(--surface);resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:13.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);resize:vertical}

/* ---------- sélecteur d'ateliers ---------- */
.sheetmodal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(11,42,74,.45);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
@media (min-width:720px){.sheetmodal{justify-content:center;padding:24px}.modal{border-radius:20px;max-width:680px;margin:0 auto;width:100%}}
.mhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.mhead .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.mhead h3{font-size:21px}
.msearch{display:flex;gap:8px;margin-top:10px}
.msearch input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
.mfilt{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 8px;scrollbar-width:none;flex:none}
.mfilt::-webkit-scrollbar{display:none}
.mfilt button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.mfilt button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mlist{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 16px;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:64px 1fr 32px;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;width:100%}
.mrow:hover{border-color:var(--navy-2)}
.mrow:active{transform:scale(.99)}
.mrow .mini{border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;min-height:46px}
.mrow .mini svg{display:block;width:64px;height:auto}
.mrow b{font-size:16px;display:block;line-height:1.2}
.mrow .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mrow .go{font-size:22px;color:var(--faint);text-align:center}
.mfoot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:80;background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.srow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.srow:hover{border-color:var(--navy-2)}
.srow .d{text-align:center;font-family:var(--display);line-height:1}
.srow .d b{display:block;font-size:24px;font-weight:800}
.srow .d span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.srow .t{font-weight:700;font-size:16.5px;line-height:1.2}
.srow .s{font-size:13.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:baseline}
@media print{.top,.actionbar,.toast{display:none!important}}

/* ---------- terrain virtuel ---------- */
.sked{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sktools{display:flex;flex-wrap:wrap;gap:5px}
.sktool{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;min-height:38px}
.sktool[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.skwrap{position:relative;max-width:640px;touch-action:none}
.skwrap svg{display:block;width:100%;height:auto;border-radius:10px}
.skwrap .skhit{position:absolute;inset:0;cursor:crosshair}
.skhit .skh{fill:rgba(255,255,255,.001);stroke:transparent;stroke-width:2;cursor:grab}
.skhit .skh:hover{fill:rgba(255,255,255,.25);stroke:#fff}
.skhit .skh.on{fill:rgba(242,194,0,.35);stroke:var(--yellow);stroke-width:2.5}
.skbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.skbar label{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.skbar input{width:96px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-weight:400;background:var(--surface)}
.skbar input[type=number]{width:66px}
.skbar .btn{min-height:40px;font-size:14px;padding:0 12px}
.fam{font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.reroll{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:17px;display:grid;place-items:center;opacity:.55;transition:opacity .15s,transform .15s;z-index:2}
.blk:hover .reroll,.reroll:focus-visible{opacity:1;border-color:var(--navy-2);color:var(--navy-2);transform:rotate(-90deg)}
@media (hover:none){.reroll{opacity:.9}}
.pill.by{background:var(--yellow);border-color:var(--yellow);color:#3B2E00;font-weight:700}
</style>
<header class="top"><div class="topin" id="topbar"></div></header>

const ATL=[{"name":"Accueil & rituel","kind":"accueil","dur":5,"desc":"On se salue, cri d'équipe « Pau FC ! », on vérifie protège-tibias et gourde, chacun prend un ballon et joue librement en attendant les copains.","veiller":"Un mot gentil à chaque enfant en arrivant ; celui qui arrive tôt joue déjà avec un ballon. À 5-6 ans, l'enfant doit être rassuré en permanence.","id":"a1","fin":"rituel","cats":["U7","U8","U9","U10","U11","U12","U13"],"fam":"rituel"},{"name":"Accueil et rituel du stage","kind":"accueil","dur":5,"desc":"Cercle debout : prénoms, cri d'équipe « Pau FC ! », les 3 règles du stage (on écoute, on essaie, on encourage). L'éducateur annonce en une phrase ce qu'on va apprendre dans la séance.","id":"a57","fin":"accueil","cats":["U7","U8","U9","U10","U11","U12","U13"],"fam":"rituel"},{"name":"1, 2, 3 soleil","kind":"eveil","dur":10,"desc":"Un joueur (le soleil) est sur la ligne d'arrivée, dos aux autres, et dit « 1, 2, 3… soleil ! ». Pendant qu'il parle, les joueurs partent en courant ; au mot « soleil » ils doivent s'arrêter. Celui qui bouge repart sur la ligne de départ. Le premier arrivé sur la ligne marque 1 point et devient le soleil.","org":"Terrain 15 × 20 m, ligne de départ et ligne d'arrivée, 7 joueurs + 1 soleil.","var":"Ballon à la main puis au pied. Obstacles. Inverser les rôles.","veiller":"Démontrer. Compter les points et valoriser. Varier le rythme d'énonciation de la phrase.","mat":["8 coupelles"],"src":"FFF U6/U7 · Thème 8 · Développement moteur","schema":{"f":[15,20],"cups":[{"x":1,"y":0,"k":"cup"},{"x":1,"y":20,"k":"cup"},{"x":14,"y":0,"k":"cup"},{"x":14,"y":20,"k":"cup"}],"players":[{"x":14,"y":10,"c":"y","l":"S"},{"x":2,"y":3,"c":"b"},{"x":4,"y":7,"c":"b"},{"x":3,"y":11,"c":"b"},{"x":5,"y":15,"c":"b"},{"x":2,"y":18,"c":"b"}],"arrows":[{"p":[[4,7],[9,8],[13,9]],"k":"m"}]},"id":"a29","fin":"conduite","cats":["U7"],"fam":"jeu"},{"name":"1, 2, 3 soleil · ballon au pied","kind":"eveil","dur":10,"desc":"Même jeu en conduite de balle : au mot « soleil », stop, pied sur le ballon, immobile. Un ballon qui roule = on repart au début. Le premier arrivé ballon au pied sur la ligne marque 1 point.","org":"Terrain 15 × 20 m, 1 ballon par enfant.","var":"Consigne d'arrêt imposée : semelle droite, puis gauche. Obstacles à contourner.","veiller":"Petites touches pour pouvoir s'arrêter net. Valoriser les arrêts propres.","mat":["8 coupelles","8 ballons"],"src":"FFF U6/U7 · Thème 8 · variante « ballon au pied »","schema":{"f":[15,20],"cups":[{"x":1,"y":0,"k":"cup"},{"x":1,"y":20,"k":"cup"},{"x":14,"y":0,"k":"cup"},{"x":14,"y":20,"k":"cup"}],"players":[{"x":14,"y":10,"c":"y","l":"S"},{"x":2,"y":3,"c":"b"},{"x":4,"y":7,"c":"b"},{"x":3,"y":11,"c":"b"},{"x":5,"y":15,"c":"b"}],"balls":[{"x":2.8,"y":3.3},{"x":4.8,"y":7.3},{"x":3.8,"y":11.3},{"x":5.8,"y":15.3}],"arrows":[{"p":[[4.8,7.3],[9,8.5],[13,9.5]],"k":"c"}]},"id":"a30","fin":"conduite","cats":["U7"],"fam":"jeu"},{"name":"Activation athlétique","kind":"eveil","dur":12,"desc":"Sur 20 m : montées de genoux, talons-fesses, pas chassés, foulées bondissantes, avec un ballon à la main puis au pied (conduite légère). Puis échelle de rythme ou cerceaux : 4 passages (1 appui, 2 appuis, latéral, sauts) suivis d'un sprint de 10 m au signal visuel de l'éducateur (bras levé = départ). Finir par 6 mobilisations articulaires guidées par le capitaine.","org":"2 couloirs de 20 m, 1 échelle de rythme ou 8 cerceaux par couloir, 1 ballon par joueur.","var":"Départ dos au terrain, se retourner au signal. Concours : le premier au plot gagne un point pour son équipe de la séance.","veiller":"Qualité des appuis avant la vitesse ; jamais de sprint à froid ; le capitaine mène les mobilisations.","mat":["1 ballon par joueur","2 échelles de rythme ou 16 cerceaux","12 coupelles"],"src":"Athlétique · coordination, vitesse de réaction, souplesse dynamique","schema":{"f":[24,12],"cups":[{"x":0,"y":2,"k":"cup"},{"x":20,"y":2,"k":"cup"},{"x":0,"y":10,"k":"cup"},{"x":20,"y":10,"k":"cup"}],"cones":[ function renderSchema(sc){

  (sc.players||[]).forEach(p=>{const col={b:"#1E56C9",r:"#D64545",y:"#F2C200",g:"#8E44AD",e:"#14213D"}[p.c]||"#1E56C9";const tx=p.c==="y"?"#3B2E00":"#fff";
    o+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${M(0.95)}" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
    const lab=p.l||(p.c==="e"?"E":"");if(lab)o+=`<text x="${X(p.x)}" y="${Y(p.y)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="800" fill="${tx}" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(lab)}</text>`});

  o+=`</svg>`;return o;
}

<script>
/* ---------- Éditeur de schéma (terrain virtuel) ---------- */
const SK_PAD=2.6,SK_S=10;
const TOOLS=[["sel","✥ Déplacer"],["cone","▲ Plot"],["cup","△ Coupelle"],["pb","● Bleu"],["pr","● Rouge"],["py","● Jaune"],["pg","● Gardien"],["pe","● Éducateur"],["ball","○ Ballon"],["goal","▭ But"],["hoop","◎ Cerceau"],["zone","▢ Zone"],["label","T Texte"],["ac","→ Conduite"],["am","⇢ Course"],["ap","→ Passe"],["as","→ Tir"]];
const ARROW_TOOLS={ac:"c",am:"m",ap:"p",as:"s"};
let skTool="sel",skSel=null,skPend=null;   /* skSel={k,i} ; skPend = 1er point d'une flèche */
const skEmpty=()=>({f:[30,20],cups:[],cones:[],players:[],balls:[],goals:[],hoops:[],zones:[],arrows:[],labels:[]});
function skNorm(sc){const o=Object.assign(skEmpty(),sc||{});o.f=[+o.f[0]||30,+o.f[1]||20];["cups","cones","players","balls","goals","hoops","zones","arrows","labels"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});return o}
const skHas=sc=>!!sc&&["cups","cones","players","balls","goals","hoops","zones","arrows","labels"].some(k=>(sc[k]||[]).length);
/* points déplaçables : [clé, index, x, y, rayon d'accroche, libellé] */
function skHandles(sc){const h=[];
  (sc.cones||[]).forEach((c,i)=>h.push(["cones",i,c.x,c.y]));(sc.cups||[]).forEach((c,i)=>h.push(["cups",i,c.x,c.y]));
  (sc.players||[]).forEach((p,i)=>h.push(["players",i,p.x,p.y]));(sc.balls||[]).forEach((b,i)=>h.push(["balls",i,b.x,b.y]));
  (sc.goals||[]).forEach((g,i)=>h.push(["goals",i,g.x,g.y]));(sc.hoops||[]).forEach((c,i)=>h.push(["hoops",i,c.x,c.y]));
  (sc.labels||[]).forEach((t,i)=>h.push(["labels",i,t.x,t.y]));
  (sc.zones||[]).forEach((z,i)=>h.push(["zones",i,z.x+z.w/2,z.y+z.h/2]));
  (sc.arrows||[]).forEach((a,i)=>(a.p||[]).forEach((p,j)=>h.push(["arrows",i,p[0],p[1],j])));
  return h}
function skHitLayer(sc){const [L,W]=sc.f;const vw=(L+2*SK_PAD)*SK_S,vh=(W+2*SK_PAD)*SK_S;
  const X=x=>((x+SK_PAD)*SK_S).toFixed(1),Y=y=>((y+SK_PAD)*SK_S).toFixed(1);
  return `<svg class="skhit" viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" xmlns="http://www.w3.org/2000/svg">${skHandles(sc).map(([k,i,x,y,j])=>{
    const on=skSel&&skSel.k===k&&skSel.i===i&&(skSel.j==null||skSel.j===j);
    return `<circle class="skh${on?" on":""}" data-k="${k}" data-i="${i}" ${j!=null?`data-j="${j}"`:""} cx="${X(x)}" cy="${Y(y)}" r="11"/>`}).join("")}</svg>`}
function skInspectorHtml(){const sc=skNorm(GDRAFT.schema);
  const sel=skSel&&(sc[skSel.k]||[])[skSel.i];
  if(skPend)return `<span class="note"><b>Flèche commencée</b> — clique maintenant le point d'arrivée (sur un joueur, un plot ou n'importe où).</span>`;
  if(ARROW_TOOLS[skTool])return `<span class="note"><b>Flèche ${({ac:"conduite",am:"course sans ballon",ap:"passe",as:"tir"})[skTool]}</b> — clique le point de départ, puis le point d'arrivée.</span>`;
  return !sel?`<span class="note">Choisis un élément dans la palette puis clique sur le terrain. Pour déplacer : fais glisser. Pour modifier ou retirer un élément : clique dessus.</span>`:
    `<b>${({cones:"Plot",cups:"Coupelle",players:"Joueur",balls:"Ballon",goals:"But",hoops:"Cerceau",zones:"Zone",labels:"Texte",arrows:"Flèche"})[skSel.k]}</b>
     ${skSel.k==="players"?`<label>Numéro / lettre <input type="text" id="skLab" maxlength="2" value="${esc(sel.l||"")}"></label>`:""}
     ${skSel.k==="labels"?`<label>Texte <input type="text" id="skLab" value="${esc(sel.t||"")}"></label>`:""}
     ${skSel.k==="zones"?`<label>Texte <input type="text" id="skLab" value="${esc(sel.t||"")}"></label><label>Largeur <input type="number" id="skW" min="2" max="60" step="1" value="${sel.w}"></label><label>Hauteur <input type="number" id="skH" min="2" max="40" step="1" value="${sel.h}"></label>`:""}
     ${skSel.k==="goals"?`<label>Largeur <input type="number" id="skW" min="1" max="10" step="1" value="${sel.s||3}"></label><button class="btn ghost small" id="skRot">↻ ${sel.o==="v"?"Mettre à l'horizontale":"Mettre à la verticale"}</button>`:""}
     <button class="btn ghost small" id="skDel">✕ Retirer</button>`}
function schemaEditorHtml(sc){sc=skNorm(sc);
  return `<div class="sked">
    <div class="sktools">${TOOLS.map(([t,l])=>`<button type="button" class="sktool" data-tool="${t}" aria-pressed="${skTool===t}">${l}</button>`).join("")}</div>
    <div class="skwrap">${renderSchema(sc)}${skHitLayer(sc)}</div>
    <div class="skbar skinsp">${skInspectorHtml()}</div>
    <div class="skbar"><label>Terrain <input type="number" id="skL" min="8" max="60" step="1" value="${sc.f[0]}"> × <input type="number" id="skWf" min="6" max="45" step="1" value="${sc.f[1]}"> m</label>
      <button class="btn ghost small" id="skUndo">↶ Annuler</button><button class="btn ghost small" id="skClear">Vider le terrain</button>
</div></div>`}
let skStack=[];
function skPush(){if(!GDRAFT)return;skStack.push(JSON.stringify(GDRAFT.schema||null));if(skStack.length>40)skStack.shift()}
function skRepaint(){const w=document.querySelector(".sked");if(!w)return;const sc=skNorm(GDRAFT.schema);
  w.querySelector(".skwrap").innerHTML=renderSchema(sc)+skHitLayer(sc);bindSkHits();skInspector()}
function skPaintView(){const w=document.querySelector(".sked .skwrap");if(!w)return;
  const v=w.querySelector("svg:not(.skhit)");if(v)v.outerHTML=renderSchema(skNorm(GDRAFT.schema))}
function skSyncHandles(){const svg=document.querySelector(".sked .skhit");if(!svg)return;
  const sc=skNorm(GDRAFT.schema);const hs=skHandles(sc);const cs=svg.querySelectorAll(".skh");
  if(cs.length!==hs.length){skRepaint();return}
  const X=x=>((x+SK_PAD)*SK_S).toFixed(1),Y=y=>((y+SK_PAD)*SK_S).toFixed(1);
  hs.forEach(([k,i,x,y,j],n)=>{const c=cs[n];c.setAttribute("cx",X(x));c.setAttribute("cy",Y(y));
    c.classList.toggle("on",!!(skSel&&skSel.k===k&&skSel.i===i&&(skSel.j==null||skSel.j===j)))})}
function skInspector(){const el=document.querySelector(".sked .skinsp");if(!el)return;el.innerHTML=skInspectorHtml();bindInspector()}
function skPoint(ev,svg){const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;
  const x=(ev.clientX-r.left)/r.width*vb.width/SK_S-SK_PAD,y=(ev.clientY-r.top)/r.height*vb.height/SK_S-SK_PAD;
  const [L,W]=skNorm(GDRAFT.schema).f;const cl=(v,m)=>Math.max(-1.5,Math.min(m+1.5,Math.round(v*2)/2));
  return {x:cl(x,L),y:cl(y,W)}}
function bindSkHits(){const svg=document.querySelector(".sked .skhit");if(!svg)return;
  svg.addEventListener("pointerdown",e=>{
    const h=e.target.closest(".skh");const sc=skNorm(GDRAFT.schema);const p=skPoint(e,svg);
    /* flèche en cours : un clic sur un élément accroche la flèche à cet élément */
    const snap=h?(()=>{const hs=skHandles(sc);const f=hs.find(([k,i,x,y,j])=>k===h.dataset.k&&i===+h.dataset.i&&(h.dataset.j==null||j===+h.dataset.j));return f?{x:f[2],y:f[3]}:p})():p;
    if(ARROW_TOOLS[skTool]){
      if(!skPend){skPend={x:snap.x,y:snap.y,k:ARROW_TOOLS[skTool]};skInspector();return}
      skPush();sc.arrows.push({p:[[skPend.x,skPend.y],[snap.x,snap.y]],k:skPend.k});skPend=null;GDRAFT.schema=sc;skRepaint();return}
    if(h){skSel={k:h.dataset.k,i:+h.dataset.i,j:h.dataset.j!=null?+h.dataset.j:null};
      e.preventDefault();let moved=false;skPush();
      const move=ev=>{const q=skPoint(ev,svg);const it=(skNorm(GDRAFT.schema)[skSel.k]||[])[skSel.i];if(!it)return;moved=true;
        if(skSel.k==="arrows"){it.p[skSel.j]=[q.x,q.y]}else if(skSel.k==="zones"){it.x=q.x-it.w/2;it.y=q.y-it.h/2}else{it.x=q.x;it.y=q.y}
        skPaintView();skSyncHandles()};
      const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
        if(!moved)skStack.pop();skPaintView();skSyncHandles();skInspector()};
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
      skSyncHandles();skInspector();return}
    if(skTool==="sel"){skSel=null;skSyncHandles();skInspector();return}
    skPush();
    if(skTool==="cone")sc.cones.push({x:p.x,y:p.y});
    else if(skTool==="cup")sc.cups.push({x:p.x,y:p.y});
    else if(skTool==="ball")sc.balls.push({x:p.x,y:p.y});
    else if(skTool==="hoop")sc.hoops.push({x:p.x,y:p.y});
    else if(skTool==="goal")sc.goals.push({x:p.x,y:p.y,o:"v",s:3});
    else if(skTool==="zone")sc.zones.push({x:p.x-3,y:p.y-3,w:6,h:6,t:""});
    else if(skTool==="label")sc.labels.push({x:p.x,y:p.y,t:"Texte"});
    else if(skTool[0]==="p"){const c={pb:"b",pr:"r",py:"y",pg:"g",pe:"e"}[skTool];sc.players.push({x:p.x,y:p.y,c,l:c==="g"?"G":c==="e"?"E":""})}
    GDRAFT.schema=sc;skSel=null;skRepaint()})}
function bindInspector(){const q=id=>document.getElementById(id);const sc=()=>skNorm(GDRAFT.schema);
  const lab=q("skLab");if(lab)lab.addEventListener("input",()=>{const s=sc();const it=s[skSel.k][skSel.i];if(skSel.k==="players")it.l=lab.value.toUpperCase();else it.t=lab.value;GDRAFT.schema=s;skPaintView()});
  const wIn=q("skW");if(wIn)wIn.addEventListener("change",()=>{const s=sc();const it=s[skSel.k][skSel.i];if(skSel.k==="goals")it.s=+wIn.value||3;else it.w=+wIn.value||6;GDRAFT.schema=s;skPaintView();skSyncHandles()});
  const hIn=q("skH");if(hIn)hIn.addEventListener("change",()=>{const s=sc();s[skSel.k][skSel.i].h=+hIn.value||6;GDRAFT.schema=s;skPaintView();skSyncHandles()});
  const rot=q("skRot");if(rot)rot.addEventListener("click",()=>{const s=sc();const g=s.goals[skSel.i];g.o=g.o==="v"?"h":"v";GDRAFT.schema=s;skPaintView()});
  const del=q("skDel");if(del)del.addEventListener("click",()=>{skPush();const s=sc();s[skSel.k].splice(skSel.i,1);skSel=null;GDRAFT.schema=s;skRepaint()})}
function bindSchemaEditor(){const q=id=>document.getElementById(id);const sc=()=>skNorm(GDRAFT.schema);
  document.querySelectorAll(".sktool").forEach(b=>b.addEventListener("click",()=>{skTool=b.dataset.tool;skPend=null;
    document.querySelectorAll(".sktool").forEach(x=>x.setAttribute("aria-pressed",x===b));skInspector()}));
  bindSkHits();bindInspector();
  const L=q("skL"),Wf=q("skWf");
  if(L)L.addEventListener("change",()=>{const s=sc();s.f[0]=Math.max(8,Math.min(60,+L.value||30));GDRAFT.schema=s;skRepaint()});
  if(Wf)Wf.addEventListener("change",()=>{const s=sc();s.f[1]=Math.max(6,Math.min(45,+Wf.value||20));GDRAFT.schema=s;skRepaint()});
  const un=q("skUndo");if(un)un.addEventListener("click",()=>{const p=skStack.pop();if(p==null){toast("Rien à annuler");return}GDRAFT.schema=JSON.parse(p);skSel=null;skPend=null;skRepaint()});
  const cl=q("skClear");if(cl)cl.addEventListener("click",()=>{skPush();const s=skNorm(GDRAFT.schema);GDRAFT.schema=Object.assign(skEmpty(),{f:s.f});skSel=null;skPend=null;skRepaint()})}

</script>
<script>
/* ===== Fiche de séance en PDF (une page A4) et partage WhatsApp =====
   Le RTJ veut du visuel pour les éducateurs : la séance part en PDF, schémas compris, plutôt qu'en texte.
   Rendu avec jsPDF (police Poppins embarquée, comme le carnet) ; les schémas SVG sont rasterisés à la volée. */
const FC={navy:"#0B2A4A",navy2:"#123B66",yel:"#F2C200",ink:"#1E2430",gray:"#6E7887",line:"#DCE2EC",light:"#F4F6FA"};
const KIND_PDF={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90"};
/* le SVG est rasterisé à son propre ratio : sinon les ronds (joueurs, ballons) s'étirent */
function svgToPng(svg,w,h){return new Promise(res=>{
  const img=new Image();const blob="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
  img.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    x.fillStyle="#2F6B43";x.fillRect(0,0,w,h);
    const nw=img.naturalWidth||w,nh=img.naturalHeight||h;const k=Math.min(w/nw,h/nh);
    const dw=nw*k,dh=nh*k;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);res(c.toDataURL("image/png"))};
  img.onerror=()=>res(null);img.src=blob})}
function fitText(doc,txt,w,size,style,max){doc.setFont("Poppins",style||"normal");
  let s=size;for(;s>6;s-=.5){doc.setFontSize(s);if(doc.splitTextToSize(txt,w).length<=(max||1))break}
  return s}
async function fichePdfDoc(s){
  await loadJsPDF();const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});carnetFonts(doc);
  const plateau=false;const blocks=blocksOf(s);

  try{doc.addImage(CREST_PNG,"PNG",MX,6,22,22)}catch(e){}
  doc.setTextColor(FC.yel);doc.setFont("Poppins","bold");doc.setFontSize(8.5);
  doc.text(`PAU FC ACADEMY · ${s.cats.join(" / ")} · ${cap(fmtLong(s.date))}`,MX+27,12);
  doc.setTextColor("#FFFFFF");const ts=fitText(doc,s.title,W-30,19,"bold",1);
  doc.setFontSize(ts);doc.text(s.title,MX+27,20.5);
  doc.setTextColor("#C9D6E8");doc.setFont("Poppins","normal");doc.setFontSize(8.2);
  doc.text(doc.splitTextToSize((s.fins||[]).map(finName).join(" · "),W-30).slice(0,2),MX+27,25.5);
  doc.setTextColor(FC.yel);doc.setFont("Poppins","bold");doc.setFontSize(9);

  /* — objectifs / consignes — */
  let y=40;
  const objs=blocks.filter(b=>b.veiller).slice(0,3).map(b=>`${b.name} : ${b.veiller}`);
  doc.setFillColor(FC.light);doc.roundedRect(MX,y-5,W,20,2,2,"F");
  doc.setTextColor(FC.gray);doc.setFont("Poppins","bold");doc.setFontSize(7);
  doc.text("LES POINTS À VEILLER",MX+4,y-1);
  doc.setTextColor(FC.ink);doc.setFont("Poppins","normal");doc.setFontSize(8.2);
  const col2=false;
  const ow=col2?W/2-8:W-8;
  let oy=y+3.5;objs.slice(0,3).forEach(o=>{doc.setFillColor(FC.yel);doc.circle(MX+5.2,oy-1,.9,"F");
    doc.text(doc.splitTextToSize(o,ow-6).slice(0,1),MX+7.5,oy);oy+=4.2});
  if(col2){const x2=MX+W/2;doc.setTextColor(FC.gray);doc.setFont("Poppins","bold");doc.setFontSize(7);
    doc.text(s.note?"CONSIGNES DU RÉFÉRENT":"MESSAGE ÉDUCATIF (PEF)",x2,y-1);
    doc.setTextColor(FC.ink);doc.setFont("Poppins","normal");doc.setFontSize(8.2);
    doc.text(doc.splitTextToSize(s.note||s.pef||"",W/2-6).slice(0,3),x2,y+3.5)}
  y+=20;
  /* — ateliers les uns sous les autres, dans l'ordre de la séance — */
  const SW=Math.min(58,W*0.33);
  const foot=()=>{doc.setTextColor(FC.gray);doc.setFont("Poppins","italic");doc.setFontSize(6.2);
    doc.text("Pau FC Academy · fiche de séance — beaucoup de ballon, peu de parole, un bravo à chacun.",MX,292);
    doc.text(`${s.cats.join(" / ")} · ${cap(fmtLong(s.date))}`,PW-MX,292,{align:"right"})};
  let clock=0;
  const rgrp=typeof rotGroups==="function"?rotGroups(blocks):blocks.map(()=>-1);
  for(let i=0;i<blocks.length;i++){const b=blocks[i];
    /* bandeau des ateliers tournants, juste avant le premier atelier du groupe */
    if(rgrp[i]===i){const nb=rgrp.filter(x=>x===i).length;const gb=blocks.filter((x,j)=>rgrp[j]===i);const tot=gb.reduce((a,x)=>a+(x.dur||0),0);
      const memeDur=new Set(gb.map(x=>x.dur)).size===1;
      if(y+9>286){foot();doc.addPage();y=14}
      doc.setFillColor(FC.yel);doc.roundedRect(MX,y,W,7,1.6,1.6,"F");
      doc.setTextColor("#3B2E00");doc.setFont("Poppins","bold");doc.setFontSize(7.2);
      doc.text(`ATELIERS TOURNANTS · ${nb} ateliers en même temps · ${nb} sous-groupes, on change ${memeDur?`toutes les ${blocks[i].dur} min`:"au signal"} · ${tot} min en tout`,MX+4,y+4.8);
      y+=9}
    const hasS=!!b.schema;const tx0=MX+(hasS?SW+6:0)+4,tw=W-(hasS?SW+6:0)-8;
    doc.setFont("Poppins","bold");doc.setFontSize(10.5);const nl=doc.splitTextToSize(b.name,tw-26);
    doc.setFont("Poppins","normal");doc.setFontSize(7.4);
    const dlAll=doc.splitTextToSize(b.desc||"",tw);const dl=dlAll.slice(0,9);
    if(dlAll.length>dl.length&&dl.length)dl[dl.length-1]=dl[dl.length-1].replace(/[\s,;.]*$/,"…");
    const vlAll=b.veiller?doc.splitTextToSize(b.veiller,tw-16):[];const vl=vlAll.slice(0,3);
    const orgAll=b.org?doc.splitTextToSize(b.org,tw):[];const org=orgAll.slice(0,2);
    const ar=hasS&&b.schema.f?(b.schema.f[0]+5.2)/(b.schema.f[1]+5.2):1.4;
    const sh=hasS?SW/ar:0;
    const textH=9+nl.length*4.4+dl.length*3.2+(org.length?1+org.length*3.2:0)+(vl.length?3+vl.length*3.2:0);
    const h=Math.max(hasS?sh+6:16,textH+4);
    if(y+h>286){foot();doc.addPage();y=14;
      doc.setTextColor(FC.gray);doc.setFont("Poppins","bold");doc.setFontSize(7);
      doc.text(`${s.cats.join(" / ")} · ${cap(fmtLong(s.date))} — SUITE`,MX,y-4);
      if(rgrp[i]>=0&&rgrp[i]!==i){doc.setFillColor(FC.yel);doc.roundedRect(MX,y,W,7,1.6,1.6,"F");
        doc.setTextColor("#3B2E00");doc.setFont("Poppins","bold");doc.setFontSize(7.2);
        doc.text("ATELIERS TOURNANTS (suite)",MX+4,y+4.8);y+=9}}
    doc.setDrawColor(rgrp[i]>=0?FC.yel:FC.line);doc.setFillColor("#FFFFFF");doc.roundedRect(MX,y,W,h,2,2,"FD");
    if(rgrp[i]>=0){doc.setFillColor(FC.yel);doc.rect(MX,y+2,1.6,h-4,"F")}
    if(hasS){const png=await svgToPng(renderSchema(b.schema),Math.round(SW*9),Math.round(sh*9));
      if(png){try{doc.addImage(png,"PNG",MX+3,y+3.5,SW,sh)}catch(e){}}}
    let ty=y+3.6;
    doc.setFillColor(KIND_PDF[b.kind]||FC.navy2);doc.roundedRect(tx0,ty,14,4.8,1,1,"F");
    doc.setTextColor("#FFFFFF");doc.setFont("Poppins","bold");doc.setFontSize(5.8);
    doc.text((KIND_LABEL[b.kind]||"").toUpperCase(),tx0+7,ty+3.3,{align:"center"});
    doc.setTextColor(FC.navy2);doc.setFontSize(9.5);doc.text(`${b.dur}'`,tx0+16.5,ty+3.8);
    doc.setTextColor(FC.gray);doc.setFont("Poppins","normal");doc.setFontSize(6.4);
    doc.text(clock?`+${clock} min`:"départ",tx0+tw-2,ty+3.8,{align:"right"});clock+=b.dur||0;
    ty+=9.4;doc.setTextColor(FC.ink);doc.setFont("Poppins","bold");doc.setFontSize(10.5);
    doc.text(nl,tx0,ty);ty+=nl.length*4.4;
    doc.setFont("Poppins","normal");doc.setFontSize(7.4);doc.setTextColor(FC.gray);
    doc.text(dl,tx0,ty);ty+=dl.length*3.2;
    if(org.length){doc.setFont("Poppins","italic");doc.setTextColor(FC.navy2);doc.text(org,tx0,ty+2.6);ty+=1+org.length*3.2}
    if(vl.length){ty+=3;doc.setFillColor(FC.yel);doc.rect(tx0,ty-2.6,1.4,vl.length*3.2+1,"F");
      doc.setFont("Poppins","bold");doc.setFontSize(6.6);doc.setTextColor(FC.ink);doc.text("À VEILLER",tx0+3,ty);
      doc.setFont("Poppins","normal");doc.setFontSize(7.2);doc.setTextColor(FC.ink);doc.text(vl,tx0+16,ty);}
    y+=h+2}
  /* — matériel + pied de page — */
  const mat=matOf(blocks);
  if(y<282){doc.setDrawColor(FC.line);doc.line(MX,y,PW-MX,y);
    doc.setTextColor(FC.gray);doc.setFont("Poppins","bold");doc.setFontSize(6.5);doc.text("MATÉRIEL",MX,y+4);
    doc.setFont("Poppins","normal");doc.setTextColor(FC.ink);doc.setFontSize(7);
    doc.text(doc.splitTextToSize(mat.join(" · "),W-22).slice(0,2),MX+18,y+4)}
  const lien=(typeof sessionUrl==="function")?sessionUrl(s):"";
  if(lien){doc.setTextColor(FC.navy2);doc.setFont("Poppins","normal");doc.setFontSize(6.6);
    doc.text("La séance en ligne : "+lien,MX,288)}
  doc.setTextColor(FC.gray);doc.setFont("Poppins","italic");doc.setFontSize(6.2);
  doc.text("Pau FC Academy · fiche de séance — beaucoup de ballon, peu de parole, un bravo à chacun.",MX,292);
  doc.text(`${s.cats.join(" / ")} · ${cap(fmtLong(s.date))}`,PW-MX,292,{align:"right"});
  return doc}
const ficheName=s=>`seance-${s.cats.join("-").toLowerCase()}-${s.date}.pdf`;
/* Un seul geste : sur téléphone le partage natif (WhatsApp y figure), sinon le téléchargement.
   Dans l'aperçu Claude, le téléchargement passe par la capacité « downloads » de la page publiée. */
async function savePdfFile(doc,name){
  try{const dl=(window.claude&&claude.use)?await claude.use("downloads"):null;
    if(dl&&dl.save){await dl.save({filename:name,data:doc.output("blob")});return true}}catch(e){}
  doc.save(name);return true}
async function fichePdf(s){
  toast("Préparation de la fiche PDF…");
  try{const doc=await fichePdfDoc(s);const name=ficheName(s);
    try{if(navigator.canShare){const file=new File([doc.output("blob")],name,{type:"application/pdf"});
      if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`Séance ${s.cats.join("/")}`,text:`${s.title} — ${s.cats.join("/")}`});return "shared"}}}catch(e){if(e&&e.name==="AbortError")return "shared"}
    await savePdfFile(doc,name);toast("Fiche PDF enregistrée");return "saved"}
  catch(e){toast("Fiche PDF indisponible (connexion ?) — le message texte reste possible");return "error"}}
</script>
<script>
/* =====================================================================
   ASSISTANT DE SÉANCE — Pau FC Academy
   Trois écrans, pas un de plus : l'accueil, le brief en six questions,
   la séance. Tout le contenu (143 ateliers du guide FFF et du club)
   vient des outils U7 → U13 et des stages.
   ===================================================================== */
const LS="paufc-assist-v1";
let store={sessions:[],custom:{},who:"",last:null};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const API="https://script.google.com/macros/s/AKfycbw_lyvwhgyF-4i9jM-mNnHTCkdS-q0W92UeU7QGwgmaayAjGTtJCGB1n2K-VlgkKuEGEg/exec";
/* Les ateliers créés par les éducateurs vivent dans le même classeur partagé que les autres outils :
   chacun garde les siens sur son appareil, et tout le monde reçoit ceux du club. */
async function pullClub(){try{const r=await fetch(`${API}?seances=ASSIST-LIB`,{cache:"no-store"});const arr=await r.json();
  if(!Array.isArray(arr))return;let ch=false;
  arr.forEach(x=>{if(!x||!x.id||!x.data||!x.data.name)return;const cur=(store.club||{})[x.id];
    if(!cur||(x.ts||0)>(cur.ts||0)){store.club=store.club||{};store.club[x.id]=Object.assign({},x.data,{id:x.id,by:x.by||"",ts:x.ts||0});ch=true}});
  if(ch){save();GAMES=allGames();render()}}catch(e){}}
async function pullSes(){try{const had=!!SES;const r=await fetch(`${API}?seances=ASSIST-SEANCES`,{cache:"no-store"});const arr=await r.json();
  if(!Array.isArray(arr))return;let ch=false;
  arr.forEach(x=>{if(!x||!x.id||!x.data||!x.data.title)return;
    const s=Object.assign({},x.data,{id:x.id,by:x.by||"",ts:x.ts||0});
    const i=(store.sessions||[]).findIndex(y=>y.id===x.id);
    if(i<0){store.sessions=store.sessions||[];store.sessions.push(s);ch=true}
    else if((x.ts||0)>(store.sessions[i].ts||0)){store.sessions[i]=s;ch=true}});
  if(ch){save();if(VIEW==="home")render()}}catch(e){}}
async function pushSes(s){try{await fetch(API,{method:"POST",body:JSON.stringify({seances:1,cat:"ASSIST-SEANCES",id:s.id,data:s,by:s.by||store.who||"",ts:Date.now()}),headers:{"Content-Type":"text/plain;charset=utf-8"}})}catch(e){}}
async function pushClub(id,g){try{await fetch(API,{method:"POST",body:JSON.stringify({seances:1,cat:"ASSIST-LIB",id,data:g,by:g.by||store.who||"",ts:Date.now()}),headers:{"Content-Type":"text/plain;charset=utf-8"}});
  toast("Atelier partagé avec le club")}catch(e){toast("Atelier gardé ici ; le partage réessaiera")}}

const CATS=["U7","U8","U9","U10","U11","U12","U13"];
const DUREES=[45,60,75,90];
const MOIS=["janv.","févr.","mars","avril","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const KCOL={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90"};
const today=()=>new Date().toISOString().slice(0,10);
const D=s=>new Date(s+"T12:00:00");
const fmtLong=s=>{const d=D(s);return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()].replace(".","")}`};
const fmtShort=s=>{const d=D(s);return `${d.getDate()} ${MOIS[d.getMonth()]}`};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pageUrl=()=>location.href.split("?")[0].split("#")[0];
const sessionUrl=s=>s&&s.id?pageUrl()+"?s="+s.id:pageUrl();
const uid=()=>"s"+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2800)}

/* ---------- bibliothèque : guide FFF + ateliers du club + ceux de l'éducateur ---------- */
function allGames(){const o={};ATL.forEach(g=>o[g.id]=g);
  Object.entries(store.club||{}).forEach(([id,g])=>o[id]=Object.assign({},g,{id,club:true}));
  Object.entries(store.custom||{}).forEach(([id,g])=>o[id]=Object.assign({},g,{id,mine:true}));return o}
let GAMES=allGames();
const gameOf=id=>GAMES[id]||{name:"Atelier",kind:"atelier",dur:10,desc:"",cats:CATS};
function poolFor(cats,kinds){return Object.values(GAMES).filter(g=>(!kinds||kinds.includes(g.kind))&&(!cats||!cats.length||!g.cats||g.cats.some(c=>cats.includes(c))))}
const finName=id=>(FINALITES.find(f=>f.id===id)||{}).name||"Jeu";

/* ---------- composition d'une séance ---------- */
function pick1(list,avoid){const free=list.filter(g=>!avoid.includes(g.id));const src=free.length?free:list;return src[Math.floor(Math.random()*src.length)]}
function suggest(b,avoid){
  avoid=avoid||[];
  const acc=poolFor(b.cats,["accueil"]),cal=poolFor(b.cats,["calme"]);
  const evs=poolFor(b.cats,["eveil"]);
  let ats=poolFor(b.cats,["atelier","defi"]);
  const mts=poolFor(b.cats,["match"]);
  if(b.fins&&b.fins.length){const f=ats.filter(g=>b.fins.includes(g.fin));if(f.length>=b.n)ats=f;else{const rest=ats.filter(g=>!b.fins.includes(g.fin));ats=f.concat(rest)}}
  /* on écarte des propositions les temps forts (fête, bilan, plateau) : ils restent dans la liste */
  const evt=g=>/f[êe]te|bilan|tour des|plateau|tournoi|rallye/i.test(g.name||"");
  const hors=g=>/futsal|hand/i.test((g.name||"")+" "+(g.desc||""));
  ats=ats.filter(g=>!evt(g)&&!hors(g)).length?ats.filter(g=>!evt(g)&&!hors(g)):ats;
  const mts2=mts.filter(g=>!evt(g)&&!hors(g)).length?mts.filter(g=>!evt(g)&&!hors(g)):mts.filter(g=>!hors(g));
  const blocks=[];const used=[];
  const add=(g,dur,extra)=>{if(!g)return;used.push(g.id);blocks.push(Object.assign({g:g.id,dur},extra||{}))};
  const petit=b.dur<=45;
  const dAcc=petit?4:5,dCal=petit?3:5,dEv=petit?8:10;
  const mt=b.match&&mts2.length?pick1(mts2,avoid):null;
  let dMatch=mt?(b.dur>=75?20:15):0;
  const ev=evs.length?pick1(evs,avoid):null;
  let reste=b.dur-dAcc-dCal-(ev?dEv:0)-dMatch;
  if(reste<b.n*5){const manque=b.n*5-reste;const pris=Math.min(manque,Math.max(0,dMatch-10));dMatch-=pris;reste+=pris}
  reste=Math.max(b.n*5,reste);
  let par=Math.max(5,Math.floor(reste/b.n/5)*5);
  let rab=reste-par*b.n;                      /* le reliquat se répartit par tranches de 5 */
  const durs=[];for(let i=0;i<b.n;i++){let d=par;if(!b.rot&&rab>=5){d+=5;rab-=5}durs.push(d)}
  if(b.rot&&rab>=5&&mt)dMatch+=Math.floor(rab/5)*5;
  else if(b.rot&&rab>=5)durs[durs.length-1]+=0;
  add(acc.length?pick1(acc,[]):null,dAcc);
  add(ev,dEv);
  const chosen=[];
  for(let i=0;i<b.n;i++){const g=pick1(ats.filter(x=>!chosen.includes(x.id)),avoid.concat(used));if(g){chosen.push(g.id);add(g,durs[i],i>0&&b.rot?{rot:1}:null)}}
  if(mt){const extra=b.theme?{name:"Match à thème · "+(b.fins&&b.fins.length?b.fins.map(finName).join(" / "):"la consigne du jour"),
      desc:(mt.desc||"")+" Consigne du jour à respecter pour que le but compte : celle des ateliers de la séance."}:null;
    add(mt,dMatch,extra)}
  add(cal.length?pick1(cal,[]):null,dCal);
  return blocks}
function titleOf(b,blocks){
  if(b.fins&&b.fins.length)return b.fins.map(finName).join(" · ");
  const ats=blocks.filter(x=>{const g=gameOf(x.g);return g.kind==="atelier"||g.kind==="defi"});
  const c={};ats.forEach(x=>{const f=gameOf(x.g).fin;if(f)c[f]=(c[f]||0)+1});
  const top=Object.entries(c).sort((a,b2)=>b2[1]-a[1])[0];
  return top?finName(top[0]):"Séance du jour"}
function newSession(b,blocks){
  return {id:uid(),date:b.date,cats:b.cats.slice(),eff:b.eff,dur:b.dur,fins:(b.fins||[]).slice(),rot:!!b.rot,
    title:titleOf(b,blocks),blocks,by:store.who||"",ts:Date.now()}}

/* ---------- helpers de rendu ---------- */
function blocksOf(s){return s.blocks.map(b=>{const g=gameOf(b.g);
  return Object.assign({},g,{id:b.g,dur:b.dur||g.dur,rot:!!b.rot,
    name:b.name||g.name,desc:b.desc===undefined?g.desc:b.desc,var:b.var===undefined?g.var:b.var,
    edited:!!(b.name||b.desc||b.var)})})}
function totalOf(s){return s.blocks.reduce((a,b)=>a+(b.dur||gameOf(b.g).dur||0),0)}
function rotGroups(bl){const g=bl.map(()=>-1);
  for(let i=1;i<bl.length;i++){if(bl[i].rot){g[i]=g[i-1]>=0?g[i-1]:i-1;if(g[i-1]<0)g[i-1]=i-1}}return g}
const rotSize=(g,at)=>g.filter(x=>x===at).length;
function normRot(bl){if(bl[0])delete bl[0].rot;return bl}
function equalizeRots(bl){const g=rotGroups(bl);
  g.forEach((x,i)=>{if(x===i){const ids=g.map((y,j)=>y===i?j:-1).filter(j=>j>=0);
    const d=bl[i].dur||gameOf(bl[i].g).dur;ids.forEach(j=>bl[j].dur=d)}});return bl}
function matOf(bl){const seen=new Set(),out=[];bl.forEach(b=>(b.mat||[]).forEach(m=>{const k=m.toLowerCase().replace(/[\d+]/g,"").trim();if(!seen.has(k)){seen.add(k);out.push(m)}}));return out}

/* ---------- à qui appartient la séance ? ----------
   Sans compte, la règle est simple : on ne modifie jamais la séance d'un autre.
   Dès qu'on touche à celle d'un collègue, on en prend une copie à son nom. */
const isMine=s=>!s||!s.by||s.by===store.who;
function ensureMine(){if(isMine(SES))return false;
  const src=SES.by;
  SES=Object.assign(JSON.parse(JSON.stringify(SES)),{id:uid(),by:store.who||"",from:src,ts:Date.now()});
  persist();toast("Copie créée à ton nom — la séance de "+src+" n'est pas touchée");return true}
/* ---------- état ---------- */
let VIEW="home",SES=null,BRIEF=null,EDIT=false,PICK=null,GED=null,GDRAFT=null,FOCUS=null,AVOID=[];
const root=()=>document.getElementById("app");
function go(v){VIEW=v;render();window.scrollTo({top:0,behavior:"instant"})}

/* ---------- qui es-tu ? (une fois, pas un compte) ---------- */
function askName(){const host=document.getElementById("modal");document.body.style.overflow="hidden";
  host.innerHTML=`<div class="sheetmodal" id="ovn"><div class="modal" role="dialog" aria-modal="true" aria-label="Ton prénom">
    <div class="mhead"><div class="grab"></div><h3>Bienvenue 👋</h3>
      <p class="hint">Ton prénom, simplement : il signe les séances et les ateliers que tu partages avec le club. Pas de compte, pas de mot de passe.</p></div>
    <div class="mlist" style="gap:0"><div class="field" style="margin-top:0"><label for="nwho">Ton prénom</label>
      <input id="nwho" type="text" placeholder="ex. Benjamin" autocomplete="given-name"></div></div>
    <div class="mfoot"><button class="btn primary" id="nok">C'est parti</button></div></div></div>`;
  const i=document.getElementById("nwho");setTimeout(()=>i.focus(),150);
  const done=()=>{const v=(i.value||"").trim();if(!v){i.focus();return}store.who=v;save();host.innerHTML="";document.body.style.overflow="";render();toast("Bonjour "+v+" !")};
  document.getElementById("nok").addEventListener("click",done);
  i.addEventListener("keydown",e=>{if(e.key==="Enter")done()})}

/* =====================  ÉCRAN 1 · ACCUEIL  ===================== */
function viewHome(){
  const ss=(store.sessions||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  const mine=ss.filter(isMine).slice(0,12),autres=ss.filter(s=>!isMine(s)).slice(0,12);
  const row=s=>`<button class="srow" data-open="${s.id}">
        <span class="d"><b>${D(s.date).getDate()}</b><span>${MOIS[D(s.date).getMonth()]}</span></span>
        <span><span class="t">${esc(s.title)}</span><span class="s">${s.cats.join(" · ")} · ${totalOf(s)} min${!isMine(s)?" · <b>"+esc(s.by)+"</b>":s.from?" · reprise de "+esc(s.from):""}</span></span>
        <span class="go" aria-hidden="true">›</span></button>`;
  return `<section class="card hero">
      <h2>Ta séance en deux minutes</h2>
      <p>Dis-moi pour qui et combien de temps : l'assistant compose la séance avec les ateliers du guide FFF et ceux du club. Tu ajustes, tu partages.</p>
      <button class="big" id="start">➕ Créer une séance</button>
    </section>
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:26px">
      <h3>Mes séances</h3>
      <button class="ghostlink" id="whoBtn" style="margin:0">${store.who?esc(store.who):"Mon prénom"}</button>
    </div>
    ${mine.length?`<div class="list">${mine.map(row).join("")}</div>`
      :`<p class="empty">Aucune séance pour l'instant.<br>Appuie sur « Créer une séance » : ça prend deux minutes.</p>`}
    ${autres.length?`<h3 style="margin-top:26px">Les séances du club</h3>
      <p class="hint" style="margin-top:4px">Celles des autres éducateurs. Ouvre-en une et « Reprendre » pour t'en faire une copie à ton nom.</p>
      <div class="list">${autres.map(row).join("")}</div>`:""}`}
function bindHome(){
  document.getElementById("start").addEventListener("click",()=>{BRIEF=Object.assign({cats:[],date:today(),eff:12,dur:60,fins:[],n:3,match:true,theme:false,rot:false},store.last||{},{date:today()});go("brief")});
  document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{SES=store.sessions.find(x=>x.id===b.dataset.open);EDIT=false;go("sheet")}));
  const wb=document.getElementById("whoBtn");if(wb)wb.addEventListener("click",askName)}

/* =====================  ÉCRAN 2 · LE BRIEF  ===================== */
function viewBrief(){
  const b=BRIEF;const ok=b.cats.length>0;
  return `<section class="card">
    <div class="q"><span class="qlab">Pour qui ?</span>
      <div class="chips" id="qcats">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${b.cats.includes(c)}">${c}</button>`).join("")}</div>
      <p class="hint" style="margin-top:8px">${b.cats.length?`${poolFor(b.cats,["atelier","defi"]).length} ateliers disponibles pour ${b.cats.join(", ")}.`:"Choisis une ou plusieurs catégories."}</p></div>

    <div class="q"><span class="qlab">Quel jour ?</span>
      <input class="datein" type="date" id="qdate" value="${b.date}"></div>

    <div class="q"><span class="qlab">Combien de temps ?</span>
      <div class="chips" id="qdur">${DUREES.map(d=>`<button class="chip" data-dur="${d}" aria-pressed="${b.dur===d}">${d} min</button>`).join("")}</div></div>

    <div class="q"><span class="qlab">Combien d'enfants ?</span>
      <div class="stepper"><button id="effm" aria-label="Moins" ${b.eff<=4?"disabled":""}>−</button><span class="v num" id="effv">${b.eff}</span><button id="effp" aria-label="Plus" ${b.eff>=30?"disabled":""}>+</button><span class="u">enfants</span></div></div>
  </section>

  <section class="card">
    <div class="q" style="margin-top:0"><span class="qlab">Travailler quoi ? <span style="font-weight:400;text-transform:none;letter-spacing:0">(facultatif)</span></span>
      <div class="chips" id="qfins">${FINALITES.filter(f=>!/bilan|f[êe]te/i.test(f.name)&&poolFor(b.cats,["atelier","defi"]).some(g=>g.fin===f.id)).map(f=>`<button class="chip" data-fin="${f.id}" aria-pressed="${b.fins.includes(f.id)}">${esc(f.name)}</button>`).join("")||`<span class="hint">Choisis d'abord une catégorie.</span>`}</div></div>

    <div class="q"><span class="qlab">Combien d'ateliers ?</span>

function bindBrief(){
  const b=BRIEF;const re=()=>{store.last=Object.assign({},b);save();render()};
  document.querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("click",()=>{const c=el.dataset.cat;const i=b.cats.indexOf(c);if(i<0)b.cats.push(c);else b.cats.splice(i,1);
    b.fins=b.fins.filter(f=>poolFor(b.cats,["atelier","defi"]).some(g=>g.fin===f));re()}));
  document.querySelectorAll("[data-dur]").forEach(el=>el.addEventListener("click",()=>{b.dur=+el.dataset.dur;re()}));
  document.querySelectorAll("[data-fin]").forEach(el=>el.addEventListener("click",()=>{const f=el.dataset.fin;const i=b.fins.indexOf(f);if(i<0)b.fins.push(f);else b.fins.splice(i,1);re()}));
  document.querySelectorAll("[data-rot]").forEach(el=>el.addEventListener("click",()=>{b.rot=el.dataset.rot==="1";re()}));
  document.getElementById("qdate").addEventListener("change",e=>{b.date=e.target.value||today()});
  const step=(id,key,min,max)=>{document.getElementById(id+"m").addEventListener("click",()=>{b[key]=Math.max(min,b[key]-1);re()});
    document.getElementById(id+"p").addEventListener("click",()=>{b[key]=Math.min(max,b[key]+1);re()})};
  step("eff","eff",4,30);step("n","n",1,5);

  document.getElementById("build").addEventListener("click",()=>{if(!b.cats.length)return;

/* Remplace un seul bloc par une autre proposition du même registre. */
function reroll(i){const b=SES.blocks[i];const g0=gameOf(b.g);
  const kinds=g0.kind==="atelier"||g0.kind==="defi"?["atelier","defi"]:[g0.kind];
  let pool=poolFor(SES.cats,kinds).filter(g=>g.id!==b.g&&!SES.blocks.some(x=>x.g===g.id));
  if(g0.kind==="match")pool=pool.filter(g=>!/futsal|hand/i.test(g.name+" "+(g.desc||"")));
  if(g0.fam)  {const same=pool.filter(g=>g.fam===g0.fam);if(same.length)pool=same}
  if(SES.fins&&SES.fins.length&&(kinds.length>1)){const f=pool.filter(g=>SES.fins.includes(g.fin));if(f.length)pool=f}
  if(!pool.length){toast("Pas d'autre atelier disponible dans ce registre");return}
  const g=pool[Math.floor(Math.random()*pool.length)];
  SES.blocks[i]={g:g.id,dur:b.dur,rot:b.rot};persist();render();toast("Atelier remplacé : "+g.name)}
function bindSheet(){
  if(EDIT){

    document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{if(SES.blocks.length<=1){toast("Il faut garder au moins un bloc");return}
      SES.blocks.splice(+b.dataset.rm,1);equalizeRots(normRot(SES.blocks));persist();render()}));
    document.querySelectorAll("[data-dur]").forEach(inp=>inp.addEventListener("change",()=>{const i=+inp.dataset.dur;
      const v=Math.max(1,Math.min(90,parseInt(inp.value)||gameOf(SES.blocks[i].g).dur));SES.blocks[i].dur=v;
      const g=rotGroups(SES.blocks);if(g[i]>=0){const ids=g.map((y,j)=>y===g[i]?j:-1).filter(j=>j>=0);ids.forEach(j=>SES.blocks[j].dur=v);
        persist();setTimeout(()=>{render();toast(`Les ${ids.length} ateliers tournants passent à ${v} min`)},0)}
      else{persist();setTimeout(render,0)}}));
    document.querySelectorAll("[data-rot]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.rot;
      if(SES.blocks[i].rot)delete SES.blocks[i].rot;else SES.blocks[i].rot=1;
      normRot(SES.blocks);const before=SES.blocks.map(x=>x.dur);equalizeRots(SES.blocks);
      const chg=SES.blocks.some((x,j)=>x.dur!==before[j]);persist();render();
      if(chg)toast("Même durée pour tous les ateliers du groupe : c'est ce qui les fait tourner ensemble")}));
    document.querySelectorAll("[data-txt]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.txt;SES.blocks[i]._open=!SES.blocks[i]._open;render()}));
    document.querySelectorAll("[data-tk]").forEach(el=>el.addEventListener("input",()=>{const i=+el.dataset.i,k=el.dataset.tk,g=gameOf(SES.blocks[i].g);
      const v=el.value;SES.blocks[i][k]=(v.trim()&&v!==(g[k]||""))?v:undefined;persist()}));
    document.querySelectorAll("[data-txtreset]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.txtreset;
      ["name","desc","var"].forEach(k=>delete SES.blocks[i][k]);persist();render()}));
    bindDrag();
    document.getElementById("done").addEventListener("click",()=>{SES.blocks.forEach(b=>delete b._open);EDIT=false;persist();render();window.scrollTo({top:0,behavior:"smooth"})});
    document.getElementById("del").addEventListener("click",e=>{const b=e.currentTarget;
      if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmer ?";b.style.width="auto";b.style.color="var(--danger)";return}
      store.sessions=(store.sessions||[]).filter(x=>x.id!==SES.id);save();SES=null;EDIT=false;go("home")});
    return}
  document.querySelectorAll("[data-roll]").forEach(b=>b.addEventListener("click",()=>{ensureMine();reroll(+b.dataset.roll)}));
  document.getElementById("edit").addEventListener("click",()=>{ensureMine();EDIT=true;persist();render()});
  document.getElementById("again").addEventListener("click",()=>{ensureMine();
    AVOID=AVOID.concat(SES.blocks.map(b=>b.g));if(AVOID.length>60)AVOID=AVOID.slice(-40);
    const b={cats:SES.cats,date:SES.date,eff:SES.eff,dur:SES.dur,fins:SES.fins,n:Math.max(1,SES.blocks.filter(x=>["atelier","defi"].includes(gameOf(x.g).kind)).length),
      match:SES.blocks.some(x=>gameOf(x.g).kind==="match"),theme:(store.last||{}).theme,rot:SES.rot};
    const blocks=suggest(b,AVOID);SES.blocks=blocks;SES.title=titleOf(b,blocks);persist();render();toast("Une autre proposition")});
  document.getElementById("wa").addEventListener("click",()=>{persist();
    const txt=encodeURIComponent(waMessage(SES));window.open("https://wa.me/?text="+txt,"_blank","noopener")});
  document.getElementById("pdf").addEventListener("click",()=>{persist();fichePdf(SES)})}

function persist(){if(!SES)return;SES.ts=Date.now();SES.by=SES.by||store.who||"";store.sessions=store.sessions||[];
  const i=store.sessions.findIndex(x=>x.id===SES.id);const clean=JSON.parse(JSON.stringify(SES));clean.blocks.forEach(b=>delete b._open);
  if(i<0)store.sessions.unshift(clean);else store.sessions[i]=clean;
  if(store.sessions.length>200)store.sessions=store.sessions.slice(0,200);save();
  if(isMine(SES)){clearTimeout(persist._t);persist._t=setTimeout(()=>pushSes(clean),1200)}}

/* ---------- glisser-déposer ---------- */
function bindDrag(){const list=document.querySelector(".elist");if(!list)return;
  const rows=()=>[...list.querySelectorAll(".erow")];
  list.querySelectorAll("[data-grip]").forEach(g=>{
    g.addEventListener("keydown",e=>{const i=+g.dataset.grip;let to=null;
      if(e.key==="ArrowUp")to=i-1;else if(e.key==="ArrowDown")to=i+1;else return;e.preventDefault();
      if(to<0||to>=SES.blocks.length)return;const [b]=SES.blocks.splice(i,1);SES.blocks.splice(to,0,b);
      equalizeRots(normRot(SES.blocks));persist();render();
      const n=document.querySelector('.erow[data-i="'+to+'"] [data-grip]');if(n)n.focus()});
    g.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();
      const row=g.closest(".erow");row.classList.add("drag");list.classList.add("dragging");
      try{g.setPointerCapture(e.pointerId)}catch(err){}
      const move=ev=>{const y=ev.clientY;rows().forEach(r=>{if(r===row)return;const bb=r.getBoundingClientRect();
        if(y>bb.top&&y<bb.bottom){if(y>bb.top+bb.height/2)r.after(row);else r.before(row)}})};
      const up=()=>{window.removeEventListener("pointermove",move);row.classList.remove("drag");list.classList.remove("dragging");
        try{g.releasePointerCapture(e.pointerId)}catch(err){}
        const order=rows().map(r=>+r.dataset.i);
        if(order.some((v,i)=>v!==i)){SES.blocks=equalizeRots(normRot(order.map(i=>SES.blocks[i])));persist();render();toast("Ordre mis à jour")}};
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true});window.addEventListener("pointercancel",up,{once:true})})})}

  host.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{PICK.fin=b.dataset.f||null;renderModal()}));
  host.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.pick;const at=PICK.at;
    if(PICK.mode==="replace"){SES.blocks[at]={g:id,dur:SES.blocks[at].dur,rot:SES.blocks[at].rot}}
    else{SES.blocks.splice(Math.max(0,Math.min(at,SES.blocks.length)),0,{g:id,dur:gameOf(id).dur})}
    PICK=null;equalizeRots(normRot(SES.blocks));persist();renderModal();render();
    FOCUS={dur:PICK?0:at};applyFocus()}));
  document.getElementById("pclose").addEventListener("click",closePicker);
  document.getElementById("pnew").addEventListener("click",()=>{const at=PICK.at,mode=PICK.mode;PICK=null;openGameEditor(at,mode)});
  document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closePicker()})}

function applyFocus(){if(!FOCUS)return;const f=FOCUS;FOCUS=null;
  if(f.dur!=null){const inp=document.querySelector('.erow[data-i="'+f.dur+'"] input[type=number]');
    if(inp){inp.closest(".erow").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>{inp.focus();inp.select()},260)}}}

/* ---------- créer son atelier ---------- */
function openGameEditor(at,mode){GED={at,mode};GDRAFT={name:"",kind:"atelier",dur:15,desc:"",org:"",var:"",veiller:"",mat:"",schema:skEmpty()};skSel=null;skPend=null;skTool="sel";skStack=[];renderModal();
  setTimeout(()=>{const n=document.getElementById("gname");if(n)n.focus()},150)}
function gameEditorHtml(){const d=GDRAFT;
  const KINDS=[["eveil","Éveil"],["atelier","Atelier"],["defi","Défi"],["match","Match"],["accueil","Accueil"],["calme","Retour au calme"]];
  return `<div class="sheetmodal" id="ov2"><div class="modal" role="dialog" aria-modal="true" aria-label="Créer un atelier">
    <div class="mhead"><div class="grab"></div><h3>✚ Mon atelier</h3>
      <p class="hint">Il rejoint ta liste : tu pourras le reprendre dans toutes tes séances.</p></div>
    <div class="mlist" style="gap:0">
      <div class="field" style="margin-top:0"><label for="gname">Nom</label><input id="gname" type="text" value="${esc(d.name)}" placeholder="ex. Le carré magique"></div>
      <div class="field"><label>Type</label><div class="chips" id="gkind">${KINDS.map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${d.kind===k}">${l}</button>`).join("")}</div></div>
      <div class="field"><label for="gdur">Durée (min)</label><input id="gdur" type="number" min="2" max="60" value="${d.dur}" style="max-width:120px"></div>
      <div class="field"><label for="gdesc">Déroulé et consignes</label><textarea id="gdesc" rows="5" placeholder="Ce que font les enfants, les règles, le but du jeu…">${esc(d.desc)}</textarea></div>
      <details style="margin-top:14px"><summary style="font-weight:700;color:var(--navy-2);cursor:pointer">Détails (facultatif)</summary>
        <div class="field"><label for="gorg">Organisation</label><input id="gorg" type="text" value="${esc(d.org)}" placeholder="ex. terrain 20 × 15 m, 1 ballon pour 2"></div>
        <div class="field"><label for="gvar">Variantes</label><input id="gvar" type="text" value="${esc(d.var)}"></div>
        <div class="field"><label for="gveil">À veiller</label><input id="gveil" type="text" value="${esc(d.veiller)}" placeholder="le point de coaching"></div>
        <div class="field"><label for="gmat">Matériel (séparé par des virgules)</label><input id="gmat" type="text" value="${esc(d.mat)}" placeholder="8 coupelles, 4 ballons"></div>
      </details>
      <details style="margin-top:12px" id="gsch"><summary style="font-weight:700;color:var(--navy-2);cursor:pointer">Illustrer sur le terrain (facultatif)</summary>
        ${schemaEditorHtml(d.schema)}</details>
    </div>
    <div class="mfoot"><button class="btn primary" id="gsave">✚ Créer et ajouter</button><button class="btn" id="gcancel">Annuler</button></div>
  </div></div>`}
function bindGameEditor(){const q=id=>document.getElementById(id);
  ({gname:"name",gdesc:"desc",gorg:"org",gvar:"var",gveil:"veiller",gmat:"mat"}) ;
  [["gname","name"],["gdesc","desc"],["gorg","org"],["gvar","var"],["gveil","veiller"],["gmat","mat"]].forEach(([id,k])=>{const el=q(id);if(el)el.addEventListener("input",e=>GDRAFT[k]=e.target.value)});
  q("gdur").addEventListener("change",e=>GDRAFT.dur=Math.max(2,Math.min(60,+e.target.value||15)));
  document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{GDRAFT.kind=b.dataset.k;renderModal()}));
  bindSchemaEditor();
  const sd=q("gsch");if(sd)sd.addEventListener("toggle",()=>{if(sd.open)setTimeout(()=>{skRepaint();sd.scrollIntoView({behavior:"smooth",block:"nearest"})},40)});
  q("gcancel").addEventListener("click",()=>{GED=null;GDRAFT=null;renderModal()});
  q("gsave").addEventListener("click",()=>{
    if(!GDRAFT.name.trim()){toast("Donne un nom à ton atelier");q("gname").focus();return}
    const id="m"+Date.now().toString(36);
    const g={id,name:GDRAFT.name.trim(),kind:GDRAFT.kind,dur:+GDRAFT.dur||15,desc:GDRAFT.desc.trim(),cats:SES.cats.slice(),
      fin:"jeu",fam:GDRAFT.kind==="match"?"match":(GDRAFT.kind==="accueil"||GDRAFT.kind==="calme")?"rituel":"technique",
      src:"Atelier d'éducateur",by:store.who||""};
    if(typeof skHas==="function"&&skHas(GDRAFT.schema))g.schema=skNorm(GDRAFT.schema);
    ["org","var","veiller"].forEach(k=>{if((GDRAFT[k]||"").trim())g[k]=GDRAFT[k].trim()});
    const mat=(GDRAFT.mat||"").split(",").map(x=>x.trim()).filter(Boolean);if(mat.length)g.mat=mat;
    store.custom=store.custom||{};store.custom[id]=g;save();GAMES=allGames();pushClub(id,g);
    const at=GED.at,mode=GED.mode;GED=null;GDRAFT=null;
    if(mode==="replace")SES.blocks[at]={g:id,dur:g.dur};
    else SES.blocks.splice(Math.max(0,Math.min(at,SES.blocks.length)),0,{g:id,dur:g.dur});
    equalizeRots(normRot(SES.blocks));persist();renderModal();render();toast("Atelier créé et ajouté")})}

/* ---------- partage ---------- */
function waIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.1.6 2.8.5a2.4 2.4 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c0-.1-.2-.2-.4-.3Z"/></svg>`}
/* Le message reste court : le détail est dans la fiche en ligne, dont le lien est en haut. */
function waMessage(s){
  const bl=blocksOf(s);const grp=rotGroups(s.blocks);const L=[];
  L.push(`★ *PAU FC ${s.cats.join("/")} · ${cap(fmtLong(s.date))}*`);
  L.push(`◆ *${s.title}* — ${totalOf(s)} min · ${s.eff} enfants${s.by?` · ${s.by}`:""}`);
  L.push(`➜ La séance en détail : ${sessionUrl(s)}`);
  L.push("");
  bl.forEach((b,i)=>{if(grp[i]===i){const n=rotSize(grp,i);L.push(`⟳ _${n} ateliers tournants, ${n} sous-groupes_`)}
    L.push(`${i+1}. ${b.dur}' ${b.name}`)});
  const mat=matOf(bl);if(mat.length)L.push("",`● *Matériel* : ${mat.join(", ")}`);
  return L.join("\n")}

/* =====================  rendu général  ===================== */
function render(){
  const top=document.getElementById("topbar");
  const titles={home:["Assistant de séance","Pau FC Academy · école de foot"],brief:["Nouvelle séance","Six questions, deux minutes"],sheet:[SES?SES.title:"Séance",SES?`${cap(fmtLong(SES.date))} · ${SES.cats.join(" · ")}`:""]};
  const [t1,t2]=titles[VIEW];
  top.innerHTML=`${VIEW!=="home"?`<button class="back" id="back" aria-label="Retour">‹</button>`:`<img src="${CREST_PNG}" alt="">`}
    <div style="min-width:0"><div class="t1">${esc(t1)}</div><div class="t2">${esc(t2)}</div></div>
    `;
  const b=document.getElementById("back");if(b)b.addEventListener("click",()=>{if(VIEW==="sheet"&&EDIT){EDIT=false;persist();render();return}go(VIEW==="sheet"?"home":"home")});
  root().innerHTML=VIEW==="home"?viewHome():VIEW==="brief"?viewBrief():viewSheet();
  if(VIEW==="home")bindHome();else if(VIEW==="brief")bindBrief();else bindSheet();
  applyFocus();
}
function openFromUrl(){const id=new URLSearchParams(location.search).get("s");if(!id)return false;
  const s=(store.sessions||[]).find(x=>x.id===id);if(!s)return false;
  SES=s;EDIT=false;VIEW="sheet";render();return true}
render();
if(!openFromUrl()&&!store.who)askName();
pullClub();pullSes().then(()=>{if(VIEW==="home")openFromUrl()});
window.addEventListener("online",()=>{pullClub();pullSes()});
</script>

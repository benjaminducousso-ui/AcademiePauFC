<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2A4A"></head><body>
<title>Assistant de séance · Pau FC Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --navy:#0B2A4A; --navy-2:#123B66; --yellow:#F2C200; --yellow-ink:#7A5E00;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EEF6; --line:#D5DDE8;
  --ink:#14213D; --muted:#5B6B82; --faint:#8A97AB;
  --ok:#2E8B57; --warn:#C77700; --wa:#25D366; --danger:#8A1F1F;
  --shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);
  --shadow-lg:0 12px 32px rgba(11,42,74,.16);
  --r:14px;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --tap:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
  --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 14px 34px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);--shadow-lg:0 14px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(22px,4.6vw,30px);font-weight:800;text-transform:uppercase}
h3{font-size:20px;font-weight:700}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- coquille ---------- */
.app{max-width:760px;margin:0 auto;padding:0 16px 132px}
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(11,42,74,.18)}
.topin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.top img{width:36px;height:36px;flex:none}
.top .t1{font-family:var(--display);text-transform:uppercase;font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:12.5px;color:#C9D6E8;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.back:hover{background:rgba(255,255,255,.2)}
.top .sp{margin-left:auto;display:flex;gap:8px}
.tbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.2)}

/* ---------- blocs ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card>h3{margin-bottom:4px}
.hint{color:var(--muted);font-size:15px}
.hero{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border:0;padding:24px 20px;margin-top:16px}
.hero h2{color:#fff}
.hero p{color:#C9D6E8;margin-top:8px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:18px;border-radius:999px;border:0;background:var(--yellow);color:#3B2E00;font-family:var(--display);text-transform:uppercase;font-size:22px;font-weight:800;letter-spacing:.02em;box-shadow:0 6px 18px rgba(242,194,0,.35);transition:transform .12s}
.big:active{transform:scale(.98)}
.hsearch{display:block;width:100%;margin-top:22px;height:48px;border-radius:14px;border:1px solid var(--line,#D5DCE6);padding:0 16px;font-size:16px;background:var(--surface);color:var(--ink)}
.hedu{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:18px;font-size:17px}
.top .tbtn{text-decoration:none;white-space:nowrap}
@media(max-width:520px){.top .tbtn{font-size:13px;padding:0 10px}}
.ghostlink{display:inline-block;margin-top:12px;background:none;border:0;color:#C9D6E8;text-decoration:underline;font-size:15px;padding:6px 0}
.card .ghostlink{color:var(--muted)}

/* ---------- questions ---------- */
.q{margin-top:22px}
.q:first-child{margin-top:4px}
.q>label,.qlab{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:var(--tap);padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,background .12s,border-color .12s}
.chip:hover{border-color:var(--navy-2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] .c2{color:var(--yellow)}
.chip:active{transform:scale(.96)}
.chip .c2{font-size:13px;font-weight:600;color:var(--faint)}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;min-height:var(--tap);border:0;background:transparent;font-weight:700;font-size:15.5px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.stepper button{width:52px;height:var(--tap);border:0;background:transparent;font-size:24px;font-weight:700;line-height:1;color:var(--navy-2)}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.3}
.stepper .v{min-width:72px;text-align:center;font-family:var(--display);font-size:26px;font-weight:800}
.stepper .u{font-size:13px;color:var(--muted);padding-right:14px}
.datein{min-height:var(--tap);width:100%;max-width:260px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
.switch{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:8px 4px;border:0;border-top:1px solid var(--line);background:none;font:inherit}
.switch:first-of-type{border-top:0}
.switch:hover .tog{border-color:var(--navy-2)}
.switch b{font-weight:700;font-size:16.5px}
.switch .sub{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.tog{flex:none;width:58px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);position:relative;transition:background .15s,border-color .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .16s}
.switch[aria-pressed="true"] .tog{background:var(--ok);border-color:var(--ok)}
.switch[aria-pressed="true"] .tog::after{transform:translateX(26px)}

/* ---------- barre d'action collante ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{min-height:52px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;flex:1}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--yellow);border-color:var(--yellow);color:#3B2E00;flex:1;font-family:var(--display);text-transform:uppercase;font-size:20px;font-weight:800}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#08331B;flex:1}
.btn.sm{min-height:40px;font-size:14.5px;padding:0 12px}
.btn.icon{width:52px;padding:0;flex:none}
.btn svg{width:20px;height:20px}

/* ---------- fiche de séance ---------- */
.sheet{margin-top:16px}
.shead{background:linear-gradient(160deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r) var(--r) 0 0;padding:18px 18px 16px}
.shead .eyebrow{color:var(--yellow)}
.shead h2{color:#fff;margin-top:4px}
.shead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.tl{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.tl span{display:block}
.blocks{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);overflow:hidden}
.blk{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:16px;border-top:1px solid var(--line);position:relative}
.blk:first-child{border-top:0}
.blk .sch{align-self:start;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;min-height:76px}
.blk .sch svg{display:block;width:100%;height:auto}
.blk .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:none;box-shadow:none;position:static}
.blk .d{font-family:var(--display);font-size:24px;font-weight:800;color:var(--navy-2);line-height:1}
:root[data-theme="dark"] .blk .d{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blk .d{color:var(--yellow)}}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;padding:3px 9px;border-radius:5px;color:#fff;white-space:nowrap}
.k-accueil,.k-calme{background:#6B7A90}.k-eveil{background:#C77700}.proc{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1.5px solid;letter-spacing:.02em}.proc i{font-style:normal;font-weight:600;opacity:.85}.proc b{font-weight:900}.proc-jeu{color:#1F7A4A;border-color:#1F7A4A;background:rgba(31,122,74,.08)}.proc-situation{color:#B4530A;border-color:#B4530A;background:rgba(180,83,10,.08)}.proc-exercice{color:#5B4BA8;border-color:#5B4BA8;background:rgba(91,75,168,.08)}
.k-jeu{background:#2E8B57}.k-situation{background:#1E56C9}.k-analytique{background:#0E7C86}.k-adaptatif{background:#7B4FC4}.k-traditionnel{background:#B8860B}.sidelab{flex-basis:100%;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 -2px}.rfc{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.k-atelier{background:#1E56C9}.k-defi{background:#8E44AD}.k-match{background:#2E8B57}
.blk h3{margin-top:6px;font-size:19px}
.blk .desc{margin-top:4px;font-size:15.5px;color:var(--ink)}
.blk .more{margin-top:8px;font-size:14.5px;color:var(--muted)}
.blk .more b{color:var(--yellow-ink)}
.blk details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--navy-2);margin-top:6px}
@media (max-width:560px){.blk{grid-template-columns:1fr}.blk .sch{max-width:220px}}
.rotband{margin:0;padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--line);border-left:4px solid var(--yellow);font-size:15px}
.rotband b{color:var(--yellow-ink)}
.blk.inrot{border-left:4px solid var(--yellow)}
.mat{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px;border-top:1px solid var(--line)}
.mat span{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:14px}

/* ---------- édition ---------- */
.erow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0}
.erow.inrot{border-left:4px solid var(--yellow)}
.erow .grip{width:34px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);cursor:grab;touch-action:none}
.erow .grip .n{font-family:var(--display);font-size:17px;font-weight:800;color:var(--navy-2)}
.erow.drag{box-shadow:var(--shadow-lg);border-color:var(--navy-2);opacity:.97}
.ename{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ename b{font-size:16px}
.etools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.dur{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:14px}
.dur input{width:62px;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;text-align:right;background:var(--surface)}
.slot{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;min-height:30px}
.slot::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:1px;background:var(--line)}
.plus{position:relative;z-index:1;width:32px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0;transition:transform .12s,background .12s}
.plus:hover,.plus:focus-visible{background:var(--navy);border-color:var(--navy);color:#fff;transform:scale(1.1)}
.rotpill{position:relative;z-index:1;font-size:12.5px;font-weight:700;border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;opacity:0;transition:opacity .15s}
.slot:hover .rotpill,.rotpill:focus-visible,.rotpill.on{opacity:1}
.rotpill.on{border-style:solid;background:var(--yellow);border-color:var(--yellow);color:#3B2E00}
@media (hover:none){.rotpill{opacity:1}}
.elist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.elist.dragging .slot{visibility:hidden}
.etxt{flex:1 1 100%;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.etxt label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.etxt input,.etxt textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-weight:400;background:var(--surface);resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:13.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);resize:vertical}

/* ---------- sélecteur d'ateliers ---------- */
.sheetmodal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(11,42,74,.45);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(28px)}to{transform:none}}
@media (min-width:720px){.sheetmodal{justify-content:center;padding:24px}.modal{border-radius:20px;max-width:680px;margin:0 auto;width:100%}}
.mhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.mhead .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.mhead h3{font-size:21px}
.msearch{display:flex;gap:8px;margin-top:10px}
.msearch input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
.mfilt{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 8px;scrollbar-width:none;flex:none}
.mfilt::-webkit-scrollbar{display:none}
.mfilt.msrc{padding-bottom:0}
.mfilt.msrc button{border-radius:10px;font-size:13.5px;min-height:34px}
.mfilt.msrc button[aria-pressed="true"]{background:var(--navy-2);border-color:var(--navy-2)}
.mfilt.msrc button::before{content:"☐ ";opacity:.7}
.mfilt.msrc button[aria-pressed="true"]::before{content:"☑ ";opacity:1}
.mfilt button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.mfilt button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.mlist{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 16px;display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:64px 1fr 32px;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;width:100%}
.mrow:hover{border-color:var(--navy-2)}
.mrow:active{transform:scale(.99)}
.mrow .mini{border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;min-height:46px}
.mrow .mini svg{display:block;width:64px;height:auto}
.mrow b{font-size:16px;display:block;line-height:1.2}
.mrow .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mrow .go{font-size:22px;color:var(--faint);text-align:center}
.mfoot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:80;background:var(--navy);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:88vw;text-align:center;line-height:1.3}
.toast.show{opacity:1;transform:translate(-50%,0)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.srow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.srow:hover{border-color:var(--navy-2)}
.srow .d{text-align:center;font-family:var(--display);line-height:1}
.srow .d b{display:block;font-size:24px;font-weight:800}
.srow .d span{font-size:11px;text-transform:uppercase;color:var(--muted)}
.srow .t{font-weight:700;font-size:16.5px;line-height:1.2}
.srow .s{font-size:13.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:15.5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);padding:12px 16px;border-top:1px solid var(--line)}

const phOf=g=>{const o=[];String((g&&g.ph)||"").split("").map(c=>PH_OLD[c]||c).forEach(c=>{if(PHASES.some(p=>p.id===c)&&!o.includes(c))o.push(c)});return o};
const phName=c=>(PHASES.find(p=>p.id===c)||{}).name||"";
/* une seule phase principale par fiche (la première) : c'est elle qui compte pour les filtres ; la suivante est affichée en secondaire */
const phMain=g=>phOf(g)[0]||null;
const phMatch=(g,side,ph)=>{const c=phMain(g);if(ph)return c===ph;if(side)return !!c&&PHASES.find(p=>p.id===c).side===side;return true};
const phBadges=g=>phOf(g).slice(0,2).map((c,i)=>{const p=PHASES.find(x=>x.id===c);return `<span class="ph ph-${p.side}${i?" ph2":""}" title="${i?"phase secondaire":"phase principale"}">${p.n} · ${p.name}</span>`}).join("");

/* Consignes de jeu à thème : une règle claire, vérifiable par les enfants. */
const THEMES={
  conduite:[["conduite avant la passe","Avant de passer, le porteur doit conduire son ballon sur au moins trois appuis. Un but après un dribble réussi compte double."],
            ["dribbler pour marquer","Un but ne compte que s'il est précédé d'un dribble : le buteur ou un partenaire a éliminé un adversaire balle au pied."]],
  passe:[["trois passes avant le but","Il faut trois passes réussies dans l'équipe avant de pouvoir marquer."],
         ["tout le monde touche","Un but ne compte que si tous les joueurs de l'équipe ont touché le ballon depuis la récupération."]],
  frappe:[["frapper du premier contact","Un but marqué du premier contact compte double."],
          ["tirer de loin","Un but tiré depuis l'extérieur de la zone compte double."]],
  duel:[["gagner son duel","Un but compte double s'il suit un duel gagné balle au pied."],
        ["défense individuelle","Chaque joueur défend sur un adversaire désigné : pas de but sur une récupération à deux."]],
  collectif:[["occuper la largeur","Un but ne compte que si le ballon est passé par les deux côtés du terrain avant la frappe."],
             ["tous dans le camp adverse","Au moment du but, tous les joueurs de l'équipe doivent être dans la moitié adverse."]],
  motricite:[["remise en jeu en course","Chaque remise en jeu se fait en conduite, sans arrêt du ballon."],
             ["deux pieds obligatoires","Chaque joueur doit toucher le ballon des deux pieds avant que son équipe puisse marquer."]],
  jonglerie:[["relance jonglée","Le gardien relance à la main ou en jonglant : jamais en dégagement lointain."],
             ["contrôle avant la passe","Le ballon doit être contrôlé avant chaque passe : pas de renvoi direct."]]
};
function themeFor(fins,exclu){
  const ids=(fins||[]).filter(f=>THEMES[f]);
  const src=ids.length?ids:["collectif"];
  let l=[];src.forEach(f=>l=l.concat(THEMES[f]));
  const neufs=l.filter(t=>t[0]!==exclu);if(neufs.length)l=neufs;
  return l[Math.floor(Math.random()*l.length)]}

function skPath(pts){const P=pts.map(p=>[p.x??p[0],p.y??p[1]]);const segs=[];let tot=0;
  for(let i=0;i<P.length-1;i++){const [x1,y1]=P[i],[x2,y2]=P[i+1];const l=Math.hypot(x2-x1,y2-y1);if(l>0.01){segs.push({x1,y1,x2,y2,l,ux:(x2-x1)/l,uy:(y2-y1)/l,s0:tot});tot+=l}}

  return {P,segs,tot,at}}
/* tracé à plusieurs points : même courbe lissée que les autres flèches, échantillonnée finement */
function skSmooth(pts){const P=pts.map(p=>[p.x??p[0],p.y??p[1]]);const out=[P[0]];const q=(a,c,e,n)=>{for(let k=1;k<=n;k++){const t=k/n,u=1-t;out.push([u*u*a[0]+2*u*t*c[0]+t*t*e[0],u*u*a[1]+2*u*t*c[1]+t*t*e[1]])}};

      const lam=multi?0.9:1.6,amp=multi?0.2:0.32,end=Math.max(0,G.tot-0.9);let d="";const N=Math.max(8,Math.ceil(G.tot/0.1));/* dans les virages serrés (slalom, huit) l'ondulation s'efface pour garder un tracé lisible */const env=[];for(let k=0;k<=N;k++){const s=G.tot*k/N;const t1=G.at(Math.max(0,s-0.35)),t2=G.at(Math.min(G.tot,s+0.35));const turn=Math.acos(Math.max(-1,Math.min(1,t1.ux*t2.ux+t1.uy*t2.uy)));env.push(Math.max(0,1-turn/0.45))}const envS=env.map((_,k)=>{let a=0,n=0;for(let j=-4;j<=4;j++){const v=env[k+j];if(v!=null){a+=v;n++}}return a/n});for(let k=0;k<=N;k++){const s=G.tot*k/N;const q=G.at(s);const w=s<end?Math.sin(s/lam*2*Math.PI)*amp*envS[k]*Math.min(1,s/0.4,(end-s)/0.4):0;const x=q.x-q.uy*w,y=q.y+q.ux*w;d+=(k?" L":"M")+X(x)+" "+Y(y)}

const LEGEND=`<div class="legend"><span>${skIco("pb")}${skIco("pr")}${skIco("py")}${skIco("pv")} joueurs</span><span>${skIco("pj")} J = joker</span><span>${skIco("pg")} gardien</span><span>${skIco("pe")} éducateur</span><span>${skIco("ball")} ballon</span><span>${skIco("cup")} coupelle</span><span>${skIco("cone")} plot</span><span>${skIco("pole")} jalon</span><span>${skIco("hoop")} cerceau</span><span>${skIco("dummy")} mannequin</span><span>${skIco("ladder")} échelle</span><span>${skIco("hurdle")} haie</span><span>${skIco("am")} déplacement</span><span>${skIco("ac")} conduite</span><span>${skIco("ap")} passe</span><span>${skIco("as")} tir</span></div>`;
/* ===== Fiche type BMF : rubriques d'un atelier, dans l'ordre de la fiche séance BMF ===== */
const BMF_ROWS=[["obj","Objectif"],["buts","But(s)"],["desc","Consignes"],["veiller","Comportements attendus"],["surf","Surface"],["dur","Durée"],["seq","Séquence"],["nbj","Effectif"],["var","Variables"],["crit","Critères de réussite"],["org","Organisation"]];
const TXT_K=["obj","buts","veiller","surf","seq","nbj","var","crit","org"];
const bmfVal=(g,k)=>k==="dur"?(g.dur?g.dur+" min":""):String(g[k]||"").trim();
/* fiche allégée : Objectif · Consignes · Organisation · Comportements attendus · Réussite · Variantes ; un comportement / une variante par ligne */
const veilPts=v=>String(v||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
const varPts=v=>veilPts(v).map(l=>l.replace(/^(plus facile|plus dur|variantes?|variables?)\s*:\s*/i,""));
const orgOf=g=>{const a=[g.surf,g.nbj,g.seq].map(x=>String(x||"").trim()).filter(Boolean);if(!a.length&&g.org)a.push(String(g.org).trim());return a.join(" · ")};
const flList=(l,v,cl)=>v.length?`<div class="${cl}"><b>${l}</b>${v.length>1?`<ul>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:` · ${esc(v[0])}`}</div>`:"";
function ficheLite(g){const h=[];
  if(g.obj)h.push(`<p class="fl-k"><b>Objectif</b> · ${esc(g.obj)}</p>`);
  if(g.desc)h.push(`<p class="fl-d">${esc(g.desc)}</p>`);
  const o=orgOf(g);if(o)h.push(`<p class="fl-o"><b>Organisation</b> · ${esc(o)}</p>`);
  h.push(flList("Comportements attendus",veilPts(g.veiller),"fl-v"));
  if(g.crit)h.push(`<p class="fl-k"><b>Réussite</b> · ${esc(g.crit)}</p>`);
  h.push(flList("Variantes",varPts(g.var),"fl-var"));
  return `<div class="fl">${h.join("")}</div>`}
/* PDF (format fiche BMF) : toutes les rubriques BMF, puces pour comportements et variables */
const pdfVal=(g,k)=>{if(k==="veiller"||k==="var"){const v=k==="var"?varPts(g.var):veilPts(g.veiller);return v.length>1?v.map(x=>"• "+x).join("\n"):(v[0]||"")}return bmfVal(g,k)};

<script>
/* ---------- Éditeur de schéma (terrain virtuel) ---------- */
const SK_PAD=2.6,SK_S=10;
const TOOL_GROUPS=[["Outils",[["sel","Déplacer"],["del","Gommer"]]],["Joueurs",[["pb","Bleu"],["pr","Rouge"],["py","Jaune"],["pv","Violet"],["pj","Joker"],["pg","Gardien"],["pe","Éduc."]]],["Matériel",[["ball","Ballon"],["cup","Coupelle"],["cone","Plot"],["pole","Jalon"],["hoop","Cerceau"],["dummy","Mannequin"],["ladder","Échelle"],["hurdle","Haie"],["goal","But"],["zone","Zone"],["label","Texte"]]],["Flèches",[["am","Déplacement"],["ac","Conduite"],["ap","Passe"],["as","Tir"]]]];
const TOOLS=TOOL_GROUPS.flatMap(g=>g[1]);
let skCol={cups:"o",cones:"o",poles:"y",hoops:"b"};
const ARROW_TOOLS={ac:"c",am:"m",ap:"p",as:"s"};
let skTool="sel",skSel=null,skPend=null;   /* skSel={k,i} ; skPend = 1er point d'une flèche */
const skEmpty=()=>({f:[30,20],cups:[],cones:[],players:[],balls:[],goals:[],hoops:[],zones:[],arrows:[],labels:[],poles:[],dummies:[],ladders:[],hurdles:[]});
function skNorm(sc){const o=Object.assign(skEmpty(),sc||{});o.f=[+o.f[0]||30,+o.f[1]||20];["cups","cones","players","balls","goals","hoops","zones","arrows","labels","poles","dummies","ladders","hurdles"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});return o}
const skHas=sc=>!!sc&&["cups","cones","players","balls","goals","hoops","zones","arrows","labels","poles","dummies","ladders","hurdles"].some(k=>(sc[k]||[]).length);
/* points déplaçables : [clé, index, x, y, rayon d'accroche, libellé] */
function skHandles(sc){const h=[];
  (sc.cones||[]).forEach((c,i)=>h.push(["cones",i,c.x,c.y]));(sc.cups||[]).forEach((c,i)=>h.push(["cups",i,c.x,c.y]));
  (sc.players||[]).forEach((p,i)=>h.push(["players",i,p.x,p.y]));(sc.balls||[]).forEach((b,i)=>h.push(["balls",i,b.x,b.y]));
  (sc.goals||[]).forEach((g,i)=>h.push(["goals",i,g.x,g.y]));(sc.hoops||[]).forEach((c,i)=>h.push(["hoops",i,c.x,c.y]));
  (sc.labels||[]).forEach((t,i)=>h.push(["labels",i,t.x,t.y]));
  ["poles","dummies","ladders","hurdles"].forEach(k=>(sc[k]||[]).forEach((c,i)=>h.push([k,i,c.x,c.y])));
  (sc.zones||[]).forEach((z,i)=>h.push(["zones",i,z.x+z.w/2,z.y+z.h/2]));
  (sc.arrows||[]).forEach((a,i)=>(a.p||[]).forEach((p,j)=>h.push(["arrows",i,p[0],p[1],j])));
  return h}
function skHitLayer(sc){const [L,W]=sc.f;const vw=(L+2*SK_PAD)*SK_S,vh=(W+2*SK_PAD)*SK_S;
  const X=x=>((x+SK_PAD)*SK_S).toFixed(1),Y=y=>((y+SK_PAD)*SK_S).toFixed(1);
  return `<svg class="skhit" viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" xmlns="http://www.w3.org/2000/svg">${skHandles(sc).map(([k,i,x,y,j])=>{
    const on=skSel&&skSel.k===k&&skSel.i===i&&(skSel.j==null||skSel.j===j);
    return `<circle class="skh${on?" on":""}" data-k="${k}" data-i="${i}" ${j!=null?`data-j="${j}"`:""} cx="${X(x)}" cy="${Y(y)}" r="11"/>`}).join("")}</svg>`}
const skColHtml=v=>`<span class="skcol">${["o","r","b","y"].map(c=>`<button type="button" data-col="${c}" aria-pressed="${v===c}" aria-label="${({o:"orange",r:"rouge",b:"bleu",y:"jaune"})[c]}" style="background:${MAT_COL[c][0]}"></button>`).join("")}</span>`;
function skInspectorHtml(){const sc=skNorm(GDRAFT.schema);
  const sel=skSel&&(sc[skSel.k]||[])[skSel.i];
  if(skPend)return `<span class="note"><b>Flèche commencée</b> — touche maintenant le point d'arrivée.</span>`;
  if(skTool==="del")return `<span class="note"><b>Gomme</b> — touche un élément pour l'effacer.</span>`;
  if(ARROW_TOOLS[skTool])return `<span class="note"><b>Flèche ${({ac:"conduite (ondulée)",am:"déplacement sans ballon (pointillés)",ap:"passe (trait plein)",as:"tir (double trait)"})[skTool]}</b> — trace-la du doigt, du départ à l'arrivée.</span>`;
  const ck={cup:"cups",cone:"cones",pole:"poles",hoop:"hoops"}[skTool];
  if(ck&&!sel)return `<b>Couleur</b> ${skColHtml(skCol[ck])} <span class="note">puis touche le terrain.</span>`;
  return !sel?`<span class="note">Choisis un élément dans la palette puis touche le terrain. ✥ pour déplacer, ⌫ pour effacer.</span>`:
    `<b>${({cones:"Plot",cups:"Coupelle",players:"Joueur",balls:"Ballon",goals:"But",hoops:"Cerceau",zones:"Zone",labels:"Texte",arrows:"Flèche",poles:"Jalon",dummies:"Mannequin",ladders:"Échelle de motricité",hurdles:"Haie"})[skSel.k]}</b>
     ${["cups","cones","poles","hoops"].includes(skSel.k)?skColHtml(sel.c||skCol[skSel.k]):""}
     ${skSel.k==="ladders"?`<label>Barreaux <input type="number" id="skN" min="2" max="16" step="1" value="${sel.n||8}"></label>`:""}
     ${["ladders","hurdles"].includes(skSel.k)?`<button class="btn ghost small" id="skRot2">↻ Tourner</button>`:""}
     ${skSel.k==="players"?`<label>Numéro / lettre <input type="text" id="skLab" maxlength="2" value="${esc(sel.l||"")}"></label>`:""}
     ${skSel.k==="labels"?`<label>Texte <input type="text" id="skLab" value="${esc(sel.t||"")}"></label>`:""}
     ${skSel.k==="zones"?`<label>Texte <input type="text" id="skLab" value="${esc(sel.t||"")}"></label><label>Largeur <input type="number" id="skW" min="2" max="60" step="1" value="${sel.w}"></label><label>Hauteur <input type="number" id="skH" min="2" max="40" step="1" value="${sel.h}"></label>`:""}
     ${skSel.k==="goals"?`<label>Largeur <input type="number" id="skW" min="1" max="10" step="1" value="${sel.s||3}"></label><button class="btn ghost small" id="skRot">↻ ${sel.o==="v"?"Mettre à l'horizontale":"Mettre à la verticale"}</button>`:""}
     <button class="btn ghost small" id="skDel">✕ Retirer</button>`}
function schemaEditorHtml(sc){sc=skNorm(sc);
  return `<div class="sked">
    <div class="sktools">${TOOL_GROUPS.map(([g,ts])=>`<div class="skgrp"><span class="skgl">${g}</span>${ts.map(([t,l])=>`<button type="button" class="sktool" data-tool="${t}" aria-pressed="${skTool===t}" title="${l}">${skIco(t)}${l}</button>`).join("")}</div>`).join("")}</div>
    <div class="skwrap">${renderSchema(sc)}${skHitLayer(sc)}</div>
    <div class="skbar skinsp">${skInspectorHtml()}</div>
    <div class="skbar"><label>Terrain <input type="number" id="skL" min="8" max="60" step="1" value="${sc.f[0]}"> × <input type="number" id="skWf" min="6" max="45" step="1" value="${sc.f[1]}"> m</label>
      <button class="btn ghost small" id="skUndo">↶ Annuler</button><button class="btn ghost small" id="skClear">Vider le terrain</button>
</div></div>`}
let skStack=[];
function skPush(){if(!GDRAFT)return;skStack.push(JSON.stringify(GDRAFT.schema||null));if(skStack.length>40)skStack.shift()}
function skRepaint(){const w=document.querySelector(".sked");if(!w)return;const sc=skNorm(GDRAFT.schema);
  w.querySelector(".skwrap").innerHTML=renderSchema(sc)+skHitLayer(sc);bindSkHits();skInspector()}
function skPaintView(){const w=document.querySelector(".sked .skwrap");if(!w)return;
  const v=w.querySelector("svg:not(.skhit)");if(v)v.outerHTML=renderSchema(skNorm(GDRAFT.schema))}
function skSyncHandles(){const svg=document.querySelector(".sked .skhit");if(!svg)return;
  const sc=skNorm(GDRAFT.schema);const hs=skHandles(sc);const cs=svg.querySelectorAll(".skh");
  if(cs.length!==hs.length){skRepaint();return}
  const X=x=>((x+SK_PAD)*SK_S).toFixed(1),Y=y=>((y+SK_PAD)*SK_S).toFixed(1);
  hs.forEach(([k,i,x,y,j],n)=>{const c=cs[n];c.setAttribute("cx",X(x));c.setAttribute("cy",Y(y));
    c.classList.toggle("on",!!(skSel&&skSel.k===k&&skSel.i===i&&(skSel.j==null||skSel.j===j)))})}
function skInspector(){const el=document.querySelector(".sked .skinsp");if(!el)return;el.innerHTML=skInspectorHtml();bindInspector()}
function skPoint(ev,svg){const r=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;
  const x=(ev.clientX-r.left)/r.width*vb.width/SK_S-SK_PAD,y=(ev.clientY-r.top)/r.height*vb.height/SK_S-SK_PAD;
  const [L,W]=skNorm(GDRAFT.schema).f;const cl=(v,m)=>Math.max(-1.5,Math.min(m+1.5,Math.round(v*2)/2));
  return {x:cl(x,L),y:cl(y,W)}}
/* élément le plus proche d'un point (en mètres), flèches comprises */
function skNearest(sc,p){let best=null,bd=2.2;
  skHandles(sc).forEach(([k,i,x,y])=>{if(k==="arrows")return;const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best={k,i}}});
  (sc.zones||[]).forEach((z,i)=>{if(!best&&p.x>=z.x&&p.x<=z.x+z.w&&p.y>=z.y&&p.y<=z.y+z.h)best={k:"zones",i}});
  (sc.arrows||[]).forEach((a,i)=>{const ps=a.p||[];for(let j=0;j<ps.length-1;j++){const [x1,y1]=ps[j],[x2,y2]=ps[j+1];const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1;
    const u=Math.max(0,Math.min(1,((p.x-x1)*dx+(p.y-y1)*dy)/L));const d=Math.hypot(p.x-(x1+u*dx),p.y-(y1+u*dy));if(d<bd){bd=d;best={k:"arrows",i}}}});
  return best}
function bindSkHits(){const svg=document.querySelector(".sked .skhit");if(!svg)return;
  svg.addEventListener("pointerdown",e=>{
    const h=e.target.closest(".skh");const sc=skNorm(GDRAFT.schema);const p=skPoint(e,svg);
    /* flèche en cours : un clic sur un élément accroche la flèche à cet élément */
    const snap=h?(()=>{const hs=skHandles(sc);const f=hs.find(([k,i,x,y,j])=>k===h.dataset.k&&i===+h.dataset.i&&(h.dataset.j==null||j===+h.dataset.j));return f?{x:f[2],y:f[3]}:p})():p;
    if(skTool==="del"){const n=skNearest(sc,p);if(n){skPush();sc[n.k].splice(n.i,1);GDRAFT.schema=sc;skSel=null;skRepaint()}return}
    if(ARROW_TOOLS[skTool]){
      if(skPend){skPush();sc.arrows.push({p:[[skPend.x,skPend.y],[snap.x,snap.y]],k:skPend.k});skPend=null;GDRAFT.schema=sc;skRepaint();return}
      /* tracé au doigt : on appuie au départ, on glisse, on lâche à l'arrivée ; un simple appui démarre une flèche en deux touches */
      e.preventDefault();skPush();const k=ARROW_TOOLS[skTool];sc.arrows.push({p:[[snap.x,snap.y],[snap.x,snap.y]],k});GDRAFT.schema=sc;const ai=sc.arrows.length-1;let far=false;
      const mv=ev=>{const q=skPoint(ev,svg);const a=GDRAFT.schema.arrows[ai];if(!a)return;a.p[1]=[q.x,q.y];if(Math.hypot(q.x-a.p[0][0],q.y-a.p[0][1])>1.2)far=true;skPaintView()};
      const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);
        if(!far){GDRAFT.schema.arrows.splice(ai,1);skStack.pop();skPend={x:snap.x,y:snap.y,k};skRepaint();return}
        skRepaint()};
      window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);return}
    if(h){skSel={k:h.dataset.k,i:+h.dataset.i,j:h.dataset.j!=null?+h.dataset.j:null};
      e.preventDefault();let moved=false;skPush();
      const move=ev=>{const q=skPoint(ev,svg);const it=(skNorm(GDRAFT.schema)[skSel.k]||[])[skSel.i];if(!it)return;moved=true;
        if(skSel.k==="arrows"){it.p[skSel.j]=[q.x,q.y]}else if(skSel.k==="zones"){it.x=q.x-it.w/2;it.y=q.y-it.h/2}else{it.x=q.x;it.y=q.y}
        skPaintView();skSyncHandles()};
      const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);
        if(!moved)skStack.pop();skPaintView();skSyncHandles();skInspector()};
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
      skSyncHandles();skInspector();return}
    if(skTool==="sel"){skSel=null;skSyncHandles();skInspector();return}
    skPush();
    if(skTool==="cone")sc.cones.push({x:p.x,y:p.y,c:skCol.cones});
    else if(skTool==="cup")sc.cups.push({x:p.x,y:p.y,c:skCol.cups});
    else if(skTool==="pole")sc.poles.push({x:p.x,y:p.y,c:skCol.poles});
    else if(skTool==="dummy")sc.dummies.push({x:p.x,y:p.y});
    else if(skTool==="ladder")sc.ladders.push({x:p.x,y:p.y,o:"h",n:8});
    else if(skTool==="hurdle")sc.hurdles.push({x:p.x,y:p.y,o:"v"});
    else if(skTool==="ball")sc.balls.push({x:p.x,y:p.y});
    else if(skTool==="hoop")sc.hoops.push({x:p.x,y:p.y,c:skCol.hoops});
    else if(skTool==="goal")sc.goals.push({x:p.x,y:p.y,o:"v",s:3});
    else if(skTool==="zone")sc.zones.push({x:p.x-3,y:p.y-3,w:6,h:6,t:""});
    else if(skTool==="label")sc.labels.push({x:p.x,y:p.y,t:"Texte"});
    else if(skTool[0]==="p"){const c={pb:"b",pr:"r",py:"y",pv:"v",pj:"j",pg:"g",pe:"e"}[skTool];sc.players.push({x:p.x,y:p.y,c,l:c==="g"?"G":c==="e"?"E":c==="j"?"J":""})}
    GDRAFT.schema=sc;skSel=null;skRepaint()})}
function bindInspector(){const q=id=>document.getElementById(id);const sc=()=>skNorm(GDRAFT.schema);
  const lab=q("skLab");if(lab)lab.addEventListener("input",()=>{const s=sc();const it=s[skSel.k][skSel.i];if(skSel.k==="players")it.l=lab.value.toUpperCase();else it.t=lab.value;GDRAFT.schema=s;skPaintView()});
  const wIn=q("skW");if(wIn)wIn.addEventListener("change",()=>{const s=sc();const it=s[skSel.k][skSel.i];if(skSel.k==="goals")it.s=+wIn.value||3;else it.w=+wIn.value||6;GDRAFT.schema=s;skPaintView();skSyncHandles()});
  const hIn=q("skH");if(hIn)hIn.addEventListener("change",()=>{const s=sc();s[skSel.k][skSel.i].h=+hIn.value||6;GDRAFT.schema=s;skPaintView();skSyncHandles()});
  const rot=q("skRot");if(rot)rot.addEventListener("click",()=>{const s=sc();const g=s.goals[skSel.i];g.o=g.o==="v"?"h":"v";GDRAFT.schema=s;skPaintView()});
  document.querySelectorAll(".skinsp .skcol button").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.col;const s=sc();
    if(skSel&&s[skSel.k]&&s[skSel.k][skSel.i]){skPush();s[skSel.k][skSel.i].c=c;skCol[skSel.k]=c;GDRAFT.schema=s;skPaintView()}
    else{const ck={cup:"cups",cone:"cones",pole:"poles",hoop:"hoops"}[skTool];if(ck)skCol[ck]=c}skInspector()}));
  const nIn=q("skN");if(nIn)nIn.addEventListener("change",()=>{const s=sc();s.ladders[skSel.i].n=Math.max(2,Math.min(16,+nIn.value||8));GDRAFT.schema=s;skPaintView()});
  const rot2=q("skRot2");if(rot2)rot2.addEventListener("click",()=>{const s=sc();const it=s[skSel.k][skSel.i];it.o=it.o==="v"?"h":"v";GDRAFT.schema=s;skPaintView()});
  const del=q("skDel");if(del)del.addEventListener("click",()=>{skPush();const s=sc();s[skSel.k].splice(skSel.i,1);skSel=null;GDRAFT.schema=s;skRepaint()})}
function bindSchemaEditor(){const q=id=>document.getElementById(id);const sc=()=>skNorm(GDRAFT.schema);
  document.querySelectorAll(".sktool").forEach(b=>b.addEventListener("click",()=>{skTool=b.dataset.tool;skPend=null;
    document.querySelectorAll(".sktool").forEach(x=>x.setAttribute("aria-pressed",x===b));skInspector()}));
  bindSkHits();bindInspector();
  const L=q("skL"),Wf=q("skWf");
  if(L)L.addEventListener("change",()=>{const s=sc();s.f[0]=Math.max(8,Math.min(60,+L.value||30));GDRAFT.schema=s;skRepaint()});
  if(Wf)Wf.addEventListener("change",()=>{const s=sc();s.f[1]=Math.max(6,Math.min(45,+Wf.value||20));GDRAFT.schema=s;skRepaint()});
  const un=q("skUndo");if(un)un.addEventListener("click",()=>{const p=skStack.pop();if(p==null){toast("Rien à annuler");return}GDRAFT.schema=JSON.parse(p);skSel=null;skPend=null;skRepaint()});
  const cl=q("skClear");if(cl)cl.addEventListener("click",()=>{skPush();const s=skNorm(GDRAFT.schema);GDRAFT.schema=Object.assign(skEmpty(),{f:s.f});skSel=null;skPend=null;skRepaint()})}

<script>
/* ===== Fiche de séance en PDF (une page A4) et partage WhatsApp =====
   Le RTJ veut du visuel pour les éducateurs : la séance part en PDF, schémas compris, plutôt qu'en texte.
   Rendu avec jsPDF (police Poppins embarquée, comme le carnet) ; les schémas SVG sont rasterisés à la volée. */
const FC={navy:"#0B2A4A",navy2:"#123B66",yel:"#F2C200",ink:"#1E2430",gray:"#6E7887",line:"#DCE2EC",light:"#F4F6FA"};
const KIND_PDF={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90",jeu:"#2E8B57",situation:"#1E56C9",analytique:"#0E7C86",adaptatif:"#7B4FC4",traditionnel:"#B8860B"};
/* le SVG est rasterisé à son propre ratio : sinon les ronds (joueurs, ballons) s'étirent */
function svgToPng(svg,w,h){return new Promise(res=>{
  const img=new Image();const blob="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));

/* La fiche fait-elle vraiment jouer un gardien ? (lu dans le texte, jamais « sans gardien ») */
const gkPlay=g=>{const t=(g.desc||"")+" "+(g.org||"");return /gardien/i.test(t)&&!/(sans|pas de|ni|aucun) gardien|gardiens? facultatifs?/i.test(t)};
/* Mémoire d'usage (persistée) : ce qui a déjà été proposé pèse moins dans les tirages suivants. */
function usedCount(id){return (store.used&&store.used[id])||0}
function markUsed(ids){store.used=store.used||{};ids.forEach(id=>{if(id)store.used[id]=(store.used[id]||0)+1});
  const tot=Object.values(store.used).reduce((a,b)=>a+b,0);
  if(tot>600)Object.keys(store.used).forEach(k=>{store.used[k]=Math.floor(store.used[k]/2);if(!store.used[k])delete store.used[k]});save()}
if(!store.used){store.used={};(store.sessions||[]).slice(0,20).forEach(s=>(s.blocks||[]).forEach(b=>{store.used[b.g]=(store.used[b.g]||0)+1}))}
function pickW(list,avoid,prefer){
  const free=list.filter(g=>!(avoid||[]).includes(g.id));const src=free.length?free:list;if(!src.length)return null;
  const w=src.map(g=>{let x=1/(1+2*usedCount(g.id));if(prefer){const p=prefer(g);x*=typeof p==="number"?p:(p?3:1)}return x});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<src.length;i++){r-=w[i];if(r<=0)return src[i]}return src[src.length-1]}
function pick1(list,avoid){const free=list.filter(g=>!avoid.includes(g.id));const src=free.length?free:list;return src[Math.floor(Math.random()*src.length)]}
/* « Défendre son château » et « Défendre son château · au pied » sont deux variantes
   du même atelier : on n'en garde qu'une seule dans une séance. */
const rootKey=n=>{const r=(n||"").split("·")[0].normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  /* « Match · foot à 3 » et « Match · foot à 4 » sont deux formats, pas deux variantes : racine trop générique → nom entier */
  return ["match","jeu","tournoi","theme"].includes(r)?(n||"").toLowerCase():r};
const themeLabel=b=>/^Jeu à thème · /.test(b.name||"")?b.name.replace("Jeu à thème · ",""):null;

/* Répartit le temps d'une séance : les ateliers ne descendent jamais sous un plancher réaliste,
   c'est le temps de jeu puis la mise en train qui cèdent en premier. */
function planDur(bl,cible){
  const K=i=>gameOf(bl[i].g).kind;
  const petit=cible<=45;
  const SOL=petit?8:10;                                   /* plancher d'un atelier */
  const idx=k=>bl.map((b,i)=>K(i)===k?i:-1).filter(i=>i>=0);
  const accs=idx("accueil"),cals=idx("calme"),evs=idx("eveil"),mts=idx("match");
  const ats=bl.map((b,i)=>["atelier","defi"].includes(K(i))?i:-1).filter(i=>i>=0);
  if(!ats.length&&!mts.length)return bl;
  let dAcc=2,dCal=2,dEv=petit?8:10;
  let jeu=mts.length?(mts.length>1?(petit?15:20):(petit?12:15)):0;
  const jeuMin=mts.length?(mts.length>1?(petit?10:15):(petit?8:10)):0;
  const fixe=()=>accs.length*dAcc+cals.length*dCal+evs.length*dEv;
  let reste=cible-fixe()-jeu;
  while(reste<ats.length*SOL&&jeu>jeuMin){jeu-=5;reste+=5}
  while(reste<ats.length*SOL&&evs.length&&dEv-5>=(petit?5:8)){dEv-=5;reste+=5*evs.length}
  accs.forEach(i=>bl[i].dur=dAcc);cals.forEach(i=>bl[i].dur=dCal);evs.forEach(i=>bl[i].dur=dEv);
  /* unités : un atelier seul, ou un groupe tournant entier (durée identique imposée) */
  const g=rotGroups(bl);const unites=[],pris=new Set();
  ats.forEach(i=>{if(pris.has(i))return;
    if(g[i]>=0){const ids=g.map((x,j)=>x===g[i]?j:-1).filter(j=>j>=0&&ats.includes(j));ids.forEach(j=>pris.add(j));unites.push(ids)}
    else{pris.add(i);unites.push([i])}});
  const nb=ats.length;
  const base=Math.max(5,Math.floor(Math.max(reste,nb*5)/nb/5)*5);
  ats.forEach(i=>bl[i].dur=base);
  let rab=reste-base*nb;
  for(const u of unites){const cout=5*u.length;if(rab>=cout){u.forEach(i=>bl[i].dur+=5);rab-=cout}}
  if(mts.length){let j=jeu+Math.max(0,rab);
    if(mts.length>1){const t=Math.max(10,Math.round(j*0.6/5)*5);bl[mts[0]].dur=t;bl[mts[1]].dur=Math.max(5,j-t);
      mts.slice(2).forEach(i=>bl[i].dur=gameOf(bl[i].g).dur)}
    else bl[mts[0]].dur=j}
  else if(rab>0&&ats.length)bl[ats[ats.length-1]].dur+=rab;
  return bl}
const serre=s=>{const bl=s.blocks;const petit=(s.dur||0)<=45;
  return bl.some((b,i)=>["atelier","defi"].includes(gameOf(b.g).kind)&&b.dur<(petit?8:10))};
/* ordre du cœur de séance : « prog » = du simple au complexe (exercice analytique → exercice adaptatif → situation), « bmf » = construction BMF (jeu → situation → exercice) ; le jeu de fin s'ajoute ensuite */
const ordSeq=(ord,n)=>{const base=ord==="prog"?["analytique","adaptatif","situation"]:["jeu","situation","adaptatif"];
  if(n<=1)return["situation"];if(ord==="prog"&&n===2)return["adaptatif","situation"];if(n===2)return["jeu","situation"];
  const o=base.slice();while(o.length<n)o.push(ord==="prog"?"situation":(o.length%2?"situation":"analytique"));return o.slice(0,n)};
const ordOf=b=>b.ord||(b.bmf?"bmf":"");
function suggest(b,avoid){
  avoid=avoid||[];
  const acc=poolFor(b.cats,["accueil"]),cal=poolFor(b.cats,["calme"]);
  const evs=poolWide(b.cats,["eveil"],8);
  let ats=poolFor(b.cats,["atelier","defi"]);const ats0=ats.slice();
  const mts=poolFor(b.cats,["match"]);
  if(b.fam){const f=ats.filter(g=>g.fam===b.fam);if(f.length>=b.n)ats=f;else ats=f.concat(ats.filter(g=>g.fam!==b.fam))}
  let prefer=null;
  if(b.fins&&b.fins.length){const f=ats.filter(g=>b.fins.includes(g.fin));
    if(f.length>=Math.max(6,2*b.n))ats=f;else prefer=g=>b.fins.includes(g.fin)}
  /* gardiens : sans gardien, les fiches qui en exigent un pèsent moitié moins ; avec, elles pèsent un peu plus */
  const pf=prefer;const gkW=b.gk?1.6:0.5;
  const phW=g=>!b.ph?1:b.ph.includes(phMain(g)||"#")?6:b.ph.includes(phOf(g)[1]||"#")?2.5:1;
  prefer=g=>(pf&&pf(g)?3:1)*(gkPlay(g)?gkW:1)*phW(g)*(b.pr&&prHit(g,b.pr)?3:1);
  /* on écarte des propositions les temps forts (fête, bilan, plateau) : ils restent dans la liste */
  const evt=g=>!!g.evt;
  const hors=g=>/futsal|hand/i.test((g.name||"")+" "+(g.desc||""));
  ats=ats.filter(g=>!evt(g)&&!hors(g)).length?ats.filter(g=>!evt(g)&&!hors(g)):ats;
  const mts2=mts.filter(g=>!evt(g)&&!hors(g)).length?mts.filter(g=>!evt(g)&&!hors(g)):mts.filter(g=>!hors(g));
  const blocks=[];const used=[];
  const add=(g,dur,extra)=>{if(!g)return;used.push(g.id);blocks.push(Object.assign({g:g.id,dur},extra||{}))};
  const petit=b.dur<=45;
  const dAcc=2,dCal=2,dEv=petit?8:10;
  const veutTh=!!b.theme,veutLib=!!b.match;
  const mtTh=veutTh&&mts2.length?pickW(mts2,avoid):null;
  const mtLib=veutLib&&mts2.length?pickW(mts2.filter(g=>!mtTh||g.id!==mtTh.id),avoid):null;
  const mt=mtTh||mtLib;
  const ev=evs.length?pickW(evs,avoid):null;
  const durs=[];for(let i=0;i<b.n;i++)durs.push(10);   /* planDur fixe les vraies durées à la fin */
  const dMatch=20;
  add(acc.length?pick1(acc,[]):null,dAcc);
  add(ev,dEv);
  const chosen=[],roots=[];
  for(let i=0;i<b.n;i++){
    let libre=ats.filter(x=>!chosen.includes(x.id)&&!roots.includes(rootKey(x.name)));
    if(!libre.length)libre=ats.filter(x=>!chosen.includes(x.id));
    /* phase choisie : au moins la moitié des ateliers dans cette phase, si le registre le permet — jamais bloquant */
    /* construction BMF : le type de chaque atelier est imposé (jeu → situation → exercice) ; on le cherche d'abord dans le thème,
       puis dans toute la catégorie, puis dans les catégories voisines — le thème ne fait jamais sauter la structure */
    if(ordOf(b)){const want=ordSeq(ordOf(b),b.n)[i];const ok=x=>!chosen.includes(x.id)&&!roots.includes(rootKey(x.name))&&!x.evt&&!/futsal|hand/i.test((x.name||"")+" "+(x.desc||""));
      const ofT=(l,w)=>l.filter(x=>typeOf(x)===w&&ok(x));
      let lp=ofT(libre,want);if(!lp.length)lp=ofT(ats0,want);if(!lp.length)lp=ofT(poolWide(b.cats,["atelier","defi"],60),want);
      if(!lp.length&&want==="adaptatif"){lp=ofT(libre,"analytique");if(!lp.length)lp=ofT(ats0,"analytique")}
      if(lp.length)libre=lp}
    /* phase et principe choisis : préférés à l'intérieur du type, jamais bloquants */
    if(b.fins&&b.fins.length){const lf=libre.filter(x=>b.fins.includes(x.fin));if(lf.length)libre=lf}
    if(b.ph){const lp=libre.filter(x=>b.ph.includes(phMain(x)||"#"));if(lp.length)libre=lp}
    if(b.pr){const lp=libre.filter(x=>prHit(x,b.pr));if(lp.length)libre=lp}
    const g=pickW(libre,avoid.concat(used),prefer);
    if(g){chosen.push(g.id);roots.push(rootKey(g.name));add(g,durs[i],i>0&&b.rot?{rot:1}:null)}}
  /* pas de défi imposé : les situations et les défis sont tirés ensemble, au poids de leur fraîcheur */
  /* un gardien présent : au moins une situation où il joue son rôle, jamais plus d'imposée */
  if(b.gk&&chosen.length&&!chosen.some(id=>gkPlay(gameOf(id)))){
    const withGk=ats.filter(g=>gkPlay(g)&&!chosen.includes(g.id)&&!roots.includes(rootKey(g.name)));
    if(withGk.length){const g=pickW(withGk,avoid,pf);const j=chosen.length-1;const k=blocks.findIndex(x=>x.g===chosen[j]);
      if(k>=0){blocks[k].g=g.id;chosen[j]=g.id;roots[j]=rootKey(g.name);used.push(g.id)}}}
  const th=themeFor(b.fins);
  const themeBlock=g=>({name:"Jeu à thème · "+th[0],desc:"Consigne du jour : "+th[1]+"\n"+(g.desc||"")});
  if(mtTh&&mtLib){
    add(mtTh,15,themeBlock(mtTh));
    add(mtLib,10,null)}
  else if(mtTh)add(mtTh,dMatch,themeBlock(mtTh));
  else if(mtLib)add(mtLib,dMatch,null);
  add(cal.length?pick1(cal,[]):null,dCal);
  markUsed(blocks.map(x=>x.g).filter(id=>!["accueil","calme"].includes(gameOf(id).kind)));
  return planDur(blocks,b.dur)}
function titleOf(b,blocks){return defTitle(b.cats,b.date,store.who)}
function defTitle(cats,date,who){return [(cats||[]).join(" · "),cap(fmtLong(date||today())),who?String(who).trim().replace(/(^|[\s-])(\p{L})/gu,(m,x,y)=>x+y.toUpperCase()):""].filter(Boolean).join(" · ")}
function titleOfOld(b,blocks){
  if(b.pr&&prOf(b.pr))return prOf(b.pr).n;
  if(b.fins&&b.fins.length)return b.fins.map(finName).join(" · ");
  if(b.ph){const ps=PHASES.filter(x=>b.ph.includes(x.id));if(ps.length)return ps.map(p=>p.name).join(" · ")}
  const ats=blocks.filter(x=>{const g=gameOf(x.g);return g.kind==="atelier"||g.kind==="defi"});
  const c={};ats.forEach(x=>{const f=gameOf(x.g).fin;if(f)c[f]=(c[f]||0)+1});
  const top=Object.entries(c).sort((a,b2)=>b2[1]-a[1])[0];
  return top?finName(top[0]):"Séance du jour"}
function newSession(b,blocks){
  return {id:uid(),date:b.date,cats:b.cats.slice(),eff:b.eff,gk:b.gk||0,dur:b.dur,fins:(b.fins||[]).slice(),fam:b.fam||null,ph:b.ph||null,pr:b.pr||null,rot:!!b.rot,ord:ordOf(b),
    gTheme:!!b.theme,gLibre:!!b.match,
    title:titleOf(b,blocks),blocks,by:store.who||"",ts:Date.now()}}

/* ---------- helpers de rendu ---------- */
function blocksOf(s){return s.blocks.map(b=>{const g=gameOf(b.g);
  return Object.assign({},g,{id:b.g,dur:b.dur||g.dur,rot:!!b.rot,
    name:b.name||g.name,desc:b.desc===undefined?g.desc:b.desc,var:b.var===undefined?g.var:b.var,
    veiller:b.veiller===undefined?g.veiller:b.veiller,org:b.org===undefined?g.org:b.org,schema:b.schema||g.schema,mat:b.mat||g.mat,
    ...Object.fromEntries(["obj","buts","surf","seq","nbj","crit"].map(k=>[k,b[k]===undefined?g[k]:b[k]])),
    edited:!!(b.name||b.desc||b.var)})})}
function totalOf(s){return s.blocks.reduce((a,b)=>a+(b.dur||gameOf(b.g).dur||0),0)}
function rotGroups(bl){const g=bl.map(()=>-1);
  for(let i=1;i<bl.length;i++){if(bl[i].rot){g[i]=g[i-1]>=0?g[i-1]:i-1;if(g[i-1]<0)g[i-1]=i-1}}return g}
const rotSize=(g,at)=>g.filter(x=>x===at).length;
function normRot(bl){if(bl[0])delete bl[0].rot;return bl}
function equalizeRots(bl){const g=rotGroups(bl);
  g.forEach((x,i)=>{if(x===i){const ids=g.map((y,j)=>y===i?j:-1).filter(j=>j>=0);
    const d=bl[i].dur||gameOf(bl[i].g).dur;ids.forEach(j=>bl[j].dur=d)}});return bl}
function matOf(bl){const seen=new Set(),out=[];bl.forEach(b=>(b.mat||[]).forEach(m=>{const k=m.toLowerCase().replace(/[\d+]/g,"").trim();if(!seen.has(k)){seen.add(k);out.push(m)}}));return out}

/* ---------- à qui appartient la séance ? ----------
   Sans compte, la règle est simple : on ne modifie jamais la séance d'un autre.
   Dès qu'on touche à celle d'un collègue, on en prend une copie à son nom. */
const isMine=s=>!s||!s.by||s.by===store.who;

  SES=Object.assign(JSON.parse(JSON.stringify(SES)),{id:uid(),by:store.who||"",from:src,ts:Date.now()});

const nmB=s=>(s||"").trim().replace(/\s+/g," ").replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());let HSEL=null,HPICK=[],HOPEN=null;let HQ="",HEDU=null,HMORE={m:false,c:false};const HN=5;
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function viewHome(){
  const ss=(store.sessions||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  const hq=norm(HQ||"");const hit=s=>!hq||norm(s.title+" "+(s.by||"")+" "+(s.cats||[]).join(" ")).includes(hq);
  const filt=!!(hq||HEDU);
  const mineAll=ss.filter(s=>isMine(s)&&!HEDU&&hit(s)),autresAll=ss.filter(s=>!isMine(s)&&(!HEDU||s.by===HEDU)&&hit(s));
  const mine=filt||HMORE.m?mineAll:mineAll.slice(0,HN),autres=filt||HMORE.c?autresAll:autresAll.slice(0,HN);
  const more=(k,all,shown)=>all.length>HN&&!filt?`<button class="seeall" data-hmore="${k}">${HMORE[k]?"Réduire la liste ▲":`Voir les ${all.length} séances ▼`}</button>`:"";
  const sby={};ss.forEach(s=>{if(s.by){const n=nmB(s.by);sby[n]=(sby[n]||0)+1}});const srank=Object.entries(sby).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"fr"));
  const medals=srank.length?`<div class="top3">${srank.slice(0,3).map(([n,k],i)=>`<span>${["🥇","🥈","🥉"][i]} ${esc(n)} · ${k} séance${k>1?"s":""}</span>`).join("")}</div>`:"";

  ${ok||SHOW_FINS?`<section class="card">
    ${ok&&!ANIM(c)?`<div class="q" style="margin-top:0"><span class="qlab">Thème de la séance <span class="opt">facultatif</span></span>

function bindBrief(){
  const b=BRIEF;const re=()=>{store.last=Object.assign({},b);save();render()};
  document.querySelectorAll("[data-cat]").forEach(el=>el.addEventListener("click",()=>{const c=el.dataset.cat;b.cats=[c];if(["U7","U8"].includes(c))b.gk=0;
    b.fins=b.fins.filter(f=>poolFor(b.cats,["atelier","defi"],true).some(g=>g.fin===f));re()}));
  document.querySelectorAll("[data-dur]").forEach(el=>el.addEventListener("click",()=>{b.dur=+el.dataset.dur;re()}));
  bindPhaseFlow(document,b,"b",re);
  if(SHOW_FINS)document.querySelectorAll("[data-fin]").forEach(el=>el.addEventListener("click",()=>{const f=el.dataset.fin;const i=b.fins.indexOf(f);if(i<0)b.fins.push(f);else b.fins.splice(i,1);re()}));
  document.querySelectorAll("[data-brot]").forEach(el=>el.addEventListener("click",()=>{b.rot=el.dataset.brot==="1";re()}));
  document.getElementById("qdate").addEventListener("change",e=>{b.date=e.target.value||today()});
  const step=(id,key,min,max)=>{document.getElementById(id+"m").addEventListener("click",()=>{b[key]=Math.max(min,(b[key]||0)-1);re()});
    document.getElementById(id+"p").addEventListener("click",()=>{b[key]=Math.min(max,(b[key]||0)+1);re()})};
  step("eff","eff",4,30);
  if(document.getElementById("gkm"))step("gk","gk",0,3);else b.gk=0;
  /* la construction BMF est la règle : nombre d'ateliers selon la durée, jeu de fin selon l'âge, toutes les sources */
  const cfg=()=>{b.n=bmfN(b.dur);b.ord="bmf";b.bmf=false;b.rot=!!b.rot;if(!SHOW_FINS)b.fins=[];const p=PETITS(b.cats[0]);b.match=p;b.theme=!p;store.srcSel="";if(ANIM(b.cats[0])){b.ph=null;b.pr=null;b.side=null}};
  document.getElementById("build").addEventListener("click",()=>{if(!b.cats.length)return;cfg();
    AVOID=[];const blocks=suggest(b,[]);SES=newSession(b,blocks);SES.tmp=true;EDIT=false;store.last=Object.assign({},b);save();go("sheet")});
  document.getElementById("blank").addEventListener("click",()=>{if(!b.cats.length){toast("Choisis d'abord la catégorie");return}cfg();
    const acc=poolFor(b.cats,["accueil"])[0],cal=poolFor(b.cats,["calme"])[0];
    const blocks=[];if(acc)blocks.push({g:acc.id,dur:2});if(cal)blocks.push({g:cal.id,dur:2});
    SES=newSession(b,blocks);EDIT=true;store.last=Object.assign({},b);persist();save();go("sheet")})}

/* Remplace un seul bloc par une autre proposition du même registre. */
let SEEN={};
function reroll(i){const _s=SOFT;SOFT=!!(SES&&SES.tmp);try{return reroll0(i)}finally{SOFT=_s}}
function reroll0(i){const b=SES.blocks[i];const g0=gameOf(b.g);
  /* le registre d'un bloc ne change pas au fil des ↻ : un défi reste un défi */
  const k0=b.k0||g0.kind;b.k0=k0;
  const atelier=k0==="atelier"||k0==="defi";
  const kinds=atelier?["atelier","defi"]:[k0];
  /* tout le registre est disponible : situations ET défis techniques, quelle que soit la famille */
  const usedRoots=SES.blocks.map((x,j)=>j===i?null:rootKey(gameOf(x.g).name)).filter(Boolean);
  /* accueil et retour au calme : on reste strictement dans la catégorie de la séance */
  const court=k0==="accueil"||k0==="calme";
  let pool=(court?poolFor(SES.cats,kinds):poolWide(SES.cats,kinds,10)).filter(g=>g.id!==b.g&&!SES.blocks.some((x,j)=>j!==i&&x.g===g.id)&&!usedRoots.includes(rootKey(g.name)));
  /* situation ou défi : le ↻ tourne sur tout le registre (situations ET défis), jamais sur un sous-ensemble */
  if(atelier){const dfs=poolWide(SES.cats,["defi"],4).filter(g=>g.id!==b.g&&!SES.blocks.some((x,j)=>j!==i&&x.g===g.id)&&!usedRoots.includes(rootKey(g.name))&&!g.evt);
    const ids=new Set(pool.map(g=>g.id));dfs.forEach(g=>{if(!ids.has(g.id))pool.push(g)})}
  pool=pool.filter(g=>!/futsal|hand/i.test(g.name+" "+(g.desc||"")));
  /* même typologie que le bloc : un exercice reste un exercice, une situation une situation, un jeu un jeu */
  if(atelier){const tf=b.tf0||TF(g0);b.tf0=tf;let same=pool.filter(g=>TF(g)===tf);
    /* pas assez de fiches de ce type dans la catégorie (ex. situations en U7) : on va chercher dans les catégories voisines, on ne change jamais de type */
    if(same.length<2){const ids=new Set(same.map(g=>g.id));poolFor(neighCats(SES.cats),kinds).filter(g=>TF(g)===tf&&!ids.has(g.id)&&g.id!==b.g&&!g.evt&&!SES.blocks.some((x,j)=>j!==i&&x.g===g.id)&&!usedRoots.includes(rootKey(g.name))).forEach(g=>same.push(Object.assign({},g,{voisin:true})))}
    if(same.length)pool=same}
  /* les temps forts (fête, plateau, tournoi, bilan) ne sont jamais proposés automatiquement */
  const evt=g=>!!g.evt;
  pool=pool.filter(g=>!evt(g));
  const theme=/^Jeu à thème/.test(b.name||"");
  if(!pool.length){
    if(theme){const th=themeFor(SES.fins,themeLabel(b));b.name="Jeu à thème · "+th[0];
      b.desc="Consigne du jour : "+th[1]+"\n"+(gameOf(b.g).desc||"");
      persist();render();toast("Nouvelle consigne : "+th[1]);return}
    toast("Rien d'autre de disponible dans ce registre");return}
  /* la finalité du jour n'est qu'une préférence : si elle n'offre pas de choix, on ouvre */
  let tri=pool;
  if(atelier&&SES.fins&&SES.fins.length){const f=pool.filter(g=>SES.fins.includes(g.fin));
    /* on ne se limite à la finalité du jour que si elle offre vraiment du choix */
    if(f.length>=12)tri=f.concat(pool.filter(g=>g.kind==="defi"&&!SES.fins.includes(g.fin)))}
  /* on fait le tour du registre avant de repasser sur un atelier déjà proposé */
  const vus=SEEN[i]||[];
  let neufs=tri.filter(g=>!vus.includes(g.id));
  if(!neufs.length){SEEN[i]=[];neufs=tri}
  /* le ↻ tourne sur tout le registre : le gardien n'est qu'une légère préférence, jamais une condition */
  const gkW=SES.gk?1.4:0.7;
  const phW=x=>!(atelier&&SES.ph)?1:SES.ph.includes(phMain(x)||"#")?6:SES.ph.includes(phOf(x)[1]||"#")?2.5:1;
  const g=pickW(neufs,[],x=>((atelier&&SES.fins&&SES.fins.length&&SES.fins.includes(x.fin))?3:1)*(atelier&&gkPlay(x)?gkW:1)*phW(x)*(atelier&&SES.pr&&prHit(x,SES.pr)?3:1));
  SEEN[i]=(SEEN[i]||[]).concat(g.id);markUsed([g.id]);
  SES.blocks[i]={g:g.id,dur:b.dur,rot:b.rot,k0,tf0:b.tf0};
  if(theme){const th=themeFor(SES.fins,themeLabel(b));SES.blocks[i].name="Jeu à thème · "+th[0];
    SES.blocks[i].desc="Consigne du jour : "+th[1]+"\n"+(g.desc||"")}
  persist();render();
  const reste=tri.length-1;
  toast(g.name+(g.voisin?" ("+(g.cats||[]).join("/")+", adapté)":"")+(reste>0?" · "+reste+" autre"+(reste>1?"s":"")+" possible"+(reste>1?"s":""):""))}
function bindSheet(){
  if(EDIT){
    const t=document.getElementById("etitle");if(t)t.addEventListener("input",e=>{SES.title=e.target.value;SES.tcust=true;const h=document.getElementById("stitle");if(h)h.textContent=e.target.value});
    const rb=document.getElementById("reb");if(rb)rb.addEventListener("click",rebalance);
    document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>openPicker("insert",+b.dataset.add)));
    document.querySelectorAll("[data-chg]").forEach(b=>b.addEventListener("click",()=>openPicker("replace",+b.dataset.chg)));
    document.querySelectorAll("[data-roll]").forEach(b=>b.addEventListener("click",()=>reroll(+b.dataset.roll)));
    document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{if(SES.blocks.length<=1){toast("Il faut garder au moins un bloc");return}
      SES.blocks.splice(+b.dataset.rm,1);equalizeRots(normRot(SES.blocks));persist();render()}));
    document.querySelectorAll("[data-dur]").forEach(inp=>inp.addEventListener("change",()=>{const i=+inp.dataset.dur;
      const v=Math.max(1,Math.min(90,parseInt(inp.value)||gameOf(SES.blocks[i].g).dur));SES.blocks[i].dur=v;
      const g=rotGroups(SES.blocks);if(g[i]>=0){const ids=g.map((y,j)=>y===g[i]?j:-1).filter(j=>j>=0);ids.forEach(j=>SES.blocks[j].dur=v);
        persist();setTimeout(()=>{render();toast(`Les ${ids.length} ateliers tournants passent à ${v} min`)},0)}
      else{persist();setTimeout(render,0)}}));
    document.querySelectorAll("[data-rot]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.rot;

let SOFT=false;

  const i=store.sessions.findIndex(x=>x.id===SES.id);const clean=JSON.parse(JSON.stringify(SES));clean.blocks.forEach(b=>delete b._open);

/* Les durées se règlent une par une ; ce bouton refait le partage d'un coup,
   en gardant l'accueil, la mise en train, les jeux et le retour au calme tels quels. */
function rebalance(){
  planDur(SES.blocks,SES.dur||totalOf(SES));persist();render();
  toast(serre(SES)?"Temps réparti — mais les ateliers restent courts : enlève-en un ou allonge la séance":"Temps réparti sur "+(SES.dur||totalOf(SES))+" min")}
/* ---------- glisser-déposer ---------- */
function bindDrag(){const list=document.querySelector(".elist");if(!list)return;
  const rows=()=>[...list.querySelectorAll(".erow")];
  list.querySelectorAll("[data-grip]").forEach(g=>{
    g.addEventListener("keydown",e=>{const i=+g.dataset.grip;let to=null;
      if(e.key==="ArrowUp")to=i-1;else if(e.key==="ArrowDown")to=i+1;else return;e.preventDefault();
      if(to<0||to>=SES.blocks.length)return;const [b]=SES.blocks.splice(i,1);SES.blocks.splice(to,0,b);
      equalizeRots(normRot(SES.blocks));persist();render();
      const n=document.querySelector('.erow[data-i="'+to+'"] [data-grip]');if(n)n.focus()});
    g.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();
      const row=g.closest(".erow");row.classList.add("drag");list.classList.add("dragging");
      try{g.setPointerCapture(e.pointerId)}catch(err){}
      const move=ev=>{const y=ev.clientY;rows().forEach(r=>{if(r===row)return;const bb=r.getBoundingClientRect();
        if(y>bb.top&&y<bb.bottom){if(y>bb.top+bb.height/2)r.after(row);else r.before(row)}})};
      const up=()=>{window.removeEventListener("pointermove",move);row.classList.remove("drag");list.classList.remove("dragging");
        try{g.releasePointerCapture(e.pointerId)}catch(err){}
        const order=rows().map(r=>+r.dataset.i);
        if(order.some((v,i)=>v!==i)){SES.blocks=equalizeRots(normRot(order.map(i=>SES.blocks[i])));persist();render();toast("Ordre mis à jour")}};
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true});window.addEventListener("pointercancel",up,{once:true})})})}

/* ---------- sélecteur d'ateliers (feuille modale) ---------- */
function openPicker(mode,i){const cur=mode==="replace"&&SES.blocks[i]?gameOf(SES.blocks[i].g):null;PICK={mode,at:i,q:"",cat:(SES.cats||[])[0]||"U9",tf:cur?TF(cur):"",club:false,cur:cur?cur.name:"",ph:SES.ph||null,pr:SES.pr||null,side:null,more:!!SES.ph};renderModal();

function renderModal(){
  const host=document.getElementById("modal");
  if(AED&&!SES.blocks[AED.i])AED=null;
  if(!PICK&&!GED&&!AED&&!SET){host.innerHTML="";document.body.style.overflow="";return}
  document.body.style.overflow="hidden";
  if(SET){host.innerHTML=setHtml();bindSet();return}
  if(GED){host.innerHTML=gameEditorHtml();bindGameEditor();return}
  if(AED&&!PICK){host.innerHTML=atelierHtml();bindAtelier();return}
  const q=norm(PICK.q||"");const cat=PICK.cat;
  const me=store.who;const isMe=g=>!!g.mine||(!!g.club&&!!me&&g.by===me);const recent=(a,b)=>(b.ts||b.created||0)-(a.ts||a.created||0);
  const hitQ=g=>!q||norm(g.name+" "+(g.desc||"")+" "+(g.by||"")).includes(q);
  const mineL=Object.values(GAMES).filter(g=>isMe(g)&&!g.deleted&&hitQ(g)).sort(recent);
  const clubL=Object.values(GAMES).filter(g=>g.club&&!isMe(g)&&!g.deleted&&(!g.cats||g.cats.includes(cat))&&hitQ(g)).sort(recent);
  let list=Object.values(GAMES).filter(g=>!g.mine&&!g.club&&(!g.cats||g.cats.includes(cat)));
  /* fiches des catégories voisines : proposées quand un type manque dans la catégorie (ex. situations en U7) */
  const nb=neighCats([cat]).filter(c=>c!==cat);const near=Object.values(GAMES).filter(g=>!g.mine&&!g.club&&g.cats&&!g.cats.includes(cat)&&g.cats.some(c=>nb.includes(c)));
  const tfs=["ex","situation","jeu","scolaire","eveil"].filter(k=>list.some(g=>TF(g)===k)||near.some(g=>TF(g)===k));
  if(PICK.tf){list=list.filter(g=>TF(g)===PICK.tf);if(list.length<4)list=list.concat(near.filter(g=>TF(g)===PICK.tf).map(g=>Object.assign({},g,{voisin:true})))}
  const sideOf=PICK.side||(PICK.ph?PHASES.find(p=>p.id===PICK.ph).side:null);
  if(PICK.ph)list=list.filter(g=>phOf(g).includes(PICK.ph));else if(sideOf)list=list.filter(g=>phOf(g).some(x=>(PHASES.find(p=>p.id===x)||{}).side===sideOf));

  const i=GED.block,d=GDRAFT,b=SES.blocks[i],g=gameOf(b.g);

  if(blkMine(g)){const c=Object.assign({},(store.custom||{})[g.id]||g);delete c.mine;delete c.club;delete c.id;
    if(tx("name"))c.name=tx("name");c.desc=tx("desc");[...TXT_K,"rf"].forEach(k=>{if(tx(k))c[k]=tx(k);else delete c[k]});

  const s1=skHas(d.schema)?JSON.stringify(skNorm(d.schema)):"",s0=g.schema?JSON.stringify(skNorm(g.schema)):"";if(s1&&s1!==s0)b.schema=skNorm(d.schema);else delete b.schema;

function bindGameEditor(){const q=id=>document.getElementById(id);
  ({gname:"name",gdesc:"desc",gorg:"org",gvar:"var",gveil:"veiller",gmat:"mat"}) ;
  [["gname","name"],["gdesc","desc"],["gorg","org"],["gvar","var"],["gveil","veiller"],["gmat","mat"]].forEach(([id,k])=>{const el=q(id);if(el)el.addEventListener("input",e=>GDRAFT[k]=e.target.value)});
  document.querySelectorAll("[data-bk]").forEach(el=>el.addEventListener("input",e=>GDRAFT[el.dataset.bk]=e.target.value));
  q("gdur").addEventListener("change",e=>GDRAFT.dur=Math.max(2,Math.min(60,+e.target.value||15)));
  document.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;
    if(["traditionnel","analytique","adaptatif","situation","jeu"].includes(k)){GDRAFT.kind="atelier";GDRAFT.proc=k;GDRAFT.rt=k==="analytique"?"sans":k==="jeu"?"egal":k==="adaptatif"?"lim":(["sans","egal","lim"].includes(GDRAFT.rt)?"":GDRAFT.rt);if(k==="analytique")GDRAFT.rf="sans opposition, circuit fermé";else if(/^sans opposition/.test(GDRAFT.rf||""))GDRAFT.rf=""}
    else{GDRAFT.kind=k;GDRAFT.proc=null}renderModal()}));
  document.querySelectorAll("[data-grt]").forEach(b=>b.addEventListener("click",()=>{GDRAFT.rt=b.dataset.grt;renderModal()}));
  {const rf=q("grf");if(rf)rf.addEventListener("input",e=>{GDRAFT.rf=e.target.value;if(GDRAFT.proc==="situation"){const m=e.target.value.match(/(\d+)\s*(?:\+\s*(\d+)\s*)?c\s*(\d+)/i);if(m){const a=(+m[1])+(+(m[2]||0)),dd=+m[3];const rt=a>dd?"sup":a<dd?"inf":"egal";if(GDRAFT.rt!==rt){GDRAFT.rt=rt;document.querySelectorAll("[data-grt]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.grt===rt))}}}})}
  document.querySelectorAll("[data-gph]").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.gph;let v=GDRAFT.ph||"";v=v.includes(c)?v.replace(c,""):(v+c).slice(-2);GDRAFT.ph=v;document.querySelectorAll("[data-gph]").forEach(x=>x.setAttribute("aria-pressed",v.includes(x.dataset.gph)))}));
  document.querySelectorAll("[data-gfin]").forEach(b=>b.addEventListener("click",()=>{GDRAFT.fin=GDRAFT.fin===b.dataset.gfin?null:b.dataset.gfin;document.querySelectorAll("[data-gfin]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.gfin===GDRAFT.fin))}));
  document.querySelectorAll("[data-gcat]").forEach(b=>b.addEventListener("click",()=>{const c=b.dataset.gcat;const a=GDRAFT.cats||[];GDRAFT.cats=a.includes(c)?a.filter(x=>x!==c):CATS.filter(x=>a.includes(x)||x===c);b.setAttribute("aria-pressed",GDRAFT.cats.includes(c))}));
  bindSchemaEditor();if(GED.block!=null)bindBlockExtras();
  setTimeout(skRepaint,40);
  {const gc=q("gcancel");if(gc)gc.addEventListener("click",()=>{GED=null;GDRAFT=null;renderModal()})}
  {const gx2=q("gx2");if(gx2)gx2.addEventListener("click",()=>{GED=null;GDRAFT=null;renderModal()})}
  q("gsave").addEventListener("click",()=>{
    if(GED.block!=null){blkClose();return}
    if(!GDRAFT.name.trim()){toast("Donne un nom à ton atelier");q("gname").focus();return}
    const needP=GDRAFT.kind==="atelier";
    
    if(!(GDRAFT.cats||[]).length){toast("Choisis au moins une catégorie");const c=q("gcats");if(c)c.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(!store.who){askName();toast("Ton prénom d'abord : l'atelier est enregistré à ton nom");return}
    const edit=(GED.mode==="edit"||GED.mode==="editblock")&&GED.src&&GED.src.mine;
    const id=edit?GED.src.id:"m"+Date.now().toString(36);
    const g={id,name:GDRAFT.name.trim(),kind:GDRAFT.kind,dur:+GDRAFT.dur||15,desc:GDRAFT.desc.trim(),cats:GDRAFT.cats.slice(),
      fin:GDRAFT.fin||"jeu",fam:GDRAFT.kind==="match"?"match":(GDRAFT.kind==="accueil"||GDRAFT.kind==="calme")?"rituel":"technique",
      src:"Atelier d'éducateur",by:store.who||""};
    if(GDRAFT.ph)g.ph=GDRAFT.ph;
    if(GED.src&&!edit)g.from=GED.src.name+(GED.src.by?" · "+GED.src.by:"");
    else if(edit&&store.custom&&store.custom[id]&&store.custom[id].from)g.from=store.custom[id].from;
    g.created=edit&&store.custom&&store.custom[id]&&store.custom[id].created||Date.now();
    if(needP&&GDRAFT.proc){g.proc=GDRAFT.proc;if((GDRAFT.rf||"").trim())g.rf=GDRAFT.rf.trim();if(GDRAFT.rt)g.rt=GDRAFT.rt}
    if(typeof skHas==="function"&&skHas(GDRAFT.schema))g.schema=skNorm(GDRAFT.schema);
    TXT_K.forEach(k=>{if((GDRAFT[k]||"").trim())g[k]=GDRAFT[k].trim()});
    const mat=(GDRAFT.mat||"").split(",").map(x=>x.trim()).filter(Boolean);if(mat.length)g.mat=mat;
    store.custom=store.custom||{};store.custom[id]=g;save();GAMES=allGames();pushClub(id,g);
    const at=GED.at,mode=GED.mode;GED=null;GDRAFT=null;
    if(mode==="lib"||mode==="copy"||mode==="edit"){renderModal();render();toast(edit?"Atelier mis à jour pour tout le club":"Atelier créé et partagé avec le club");return}
    if(mode==="fork"||mode==="editblock"){ensureMine();SES.blocks[at]=Object.assign({},SES.blocks[at],{g:id,dur:g.dur,name:undefined,desc:undefined,var:undefined});equalizeRots(normRot(SES.blocks));persist();renderModal();render();toast(edit?"Atelier mis à jour":"Ta version remplace l'atelier dans la séance");return}
    if(mode==="replace")SES.blocks[at]={g:id,dur:g.dur};
    else SES.blocks.splice(Math.max(0,Math.min(at,SES.blocks.length)),0,{g:id,dur:g.dur});
    equalizeRots(normRot(SES.blocks));persist();renderModal();render();toast("Créée et ajoutée à la séance")})}

/* Le message reste court : le détail est dans la fiche en ligne, dont le lien est en haut. */
function waMessage(s){
  const bl=blocksOf(s);const grp=rotGroups(s.blocks);const L=[];
  L.push(sessionUrl(s),"");
  L.push(`★ *PAU FC ${s.cats.join("/")} · ${cap(fmtLong(s.date))}*`);
  L.push(`◆ *${s.title}* — ${totalOf(s)} min · ${s.eff} enfants${s.gk?` dont ${s.gk} gardien${s.gk>1?"s":""}`:""}${s.by?` · ${s.by}`:""}`);
  L.push("");
  bl.forEach((b,i)=>{if(grp[i]===i){const n=rotSize(grp,i);L.push(`⟳ _${n} ateliers tournants, ${n} sous-groupes_`)}
    L.push(`${i+1}. ${b.dur}' ${b.name}`)});
  const mat=matOf(bl);if(mat.length)L.push("",`● *Matériel* : ${mat.join(", ")}`);
  return L.join("\n")}

/* =====================  rendu général  ===================== */
function render(){
  const top=document.getElementById("topbar");
  const titles={home:["Assistant de séance","Pau FC Academy · école de foot"],brief:["Nouvelle séance","Quelques questions, deux minutes"],sheet:["Séance",SES?`${SES.cats.join(" · ")} · ${cap(fmtLong(SES.date))}`:""]};
  const [t1,t2]=titles[VIEW];
  top.innerHTML=`${VIEW!=="home"?`<button class="back" id="back" aria-label="Retour">‹</button>`:`<img src="${CREST_PNG}" alt="">`}
    <div style="min-width:0"><div class="t1">${esc(t1)}</div><div class="t2">${esc(t2)}</div></div>
    ${VIEW==="home"?`<div class="sp"><a class="tbtn tlib" href="bibliotheque.html" title="Voir tous les ateliers de la bibliothèque">📚 <span class="tl1">Voir tous les ateliers</span><span class="tl2">Ateliers</span></a></div>`:""}`;
  const b=document.getElementById("back");if(b)b.addEventListener("click",()=>{if(VIEW==="sheet"&&EDIT){EDIT=false;persist();render();return}go(VIEW==="sheet"?"home":"home")});
  root().innerHTML=VIEW==="home"?viewHome():VIEW==="brief"?viewBrief():viewSheet();
  if(VIEW==="home")bindHome();else if(VIEW==="brief")bindBrief();else bindSheet();
  applyFocus();
}
function validateDraft(){if(!SES||!SES.draft)return;
  (SES.draftGames||[]).forEach(id=>{const g=(store.custom||{})[id];if(g){delete g.draft;pushClub(id,g)}});
  delete SES.draft;delete SES.draftNote;delete SES.draftGames;GAMES=allGames();persist();save();toast("Séance validée et partagée au club")}
function importFromUrl(){const raw=new URLSearchParams(location.search).get("import");if(!raw)return false;
  try{const txt=decodeURIComponent(escape(atob(raw.replace(/-/g,"+").replace(/_/g,"/"))));const d=JSON.parse(txt);
    const s=d.session;if(!s||!Array.isArray(s.blocks))throw new Error("séance");
    const map={};store.custom=store.custom||{};
    Object.entries(d.games||{}).forEach(([k,g])=>{const id="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);map[k]=id;
      store.custom[id]=Object.assign({},g,{by:store.who||"",draft:true})});
    s.blocks.forEach(b=>{if(map[b.g])b.g=map[b.g]});
    s.id=uid();s.by=store.who||"";s.ts=Date.now();s.draftGames=Object.values(map);
    GAMES=allGames();s.dur=totalOf(s);
    SES=s;EDIT=false;VIEW="sheet";persist();save();
    history.replaceState(null,"",pageUrl());render();toast("Brouillon importé : vérifie-le avant de valider");return true}
  catch(e){toast("Lien d'import illisible");return false}}
function openFromUrl(){if(importFromUrl())return true;{const p=new URLSearchParams(location.search);const many=p.get("ateliers");if(many&&!openFromUrl.done){openFromUrl.done=true;try{history.replaceState(null,"",location.pathname)}catch(e){}seanceFromMany(many.split(",").map(decodeURIComponent));return true}if(p.get("creer")&&!openFromUrl.done&&store.who){openFromUrl.done=true;try{history.replaceState(null,"",location.pathname)}catch(e){}openGameEditor(0,"lib");return true}const at=p.get("atelier");if(at&&!openFromUrl.done){openFromUrl.done=true;try{history.replaceState(null,"",location.pathname)}catch(e){}if(GAMES[at]){seanceFrom(at);return true}}}const id=new URLSearchParams(location.search).get("s");if(!id)return false;
  const s=(store.sessions||[]).find(x=>x.id===id);if(!s)return false;
  SES=s;EDIT=false;VIEW="sheet";render();return true}
render();
if(!openFromUrl()&&!store.who)askName();
pullClub();pullSes().then(()=>{if(VIEW==="home")openFromUrl()});
window.addEventListener("online",()=>{pullClub();pullSes()});
</script>

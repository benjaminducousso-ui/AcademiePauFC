<head>

<style>
/* Appli Tests Pau FC — écran unique, sombre, pensé pour le pouce et le plein soleil */
:root{--bg:#0E2440;--bg2:#16345A;--bg3:#1E4370;--ink:#EEF3FA;--muted:#9DB0C8;--yellow:#F2C200;--navy:#0B2A4A;--run:#E0532F;--ok:#8FE0B4;--okbg:#1C4A33;--warn:#F0A060;--warnbg:#4A3A12;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 0}
.back{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg2);color:var(--ink);font-size:22px;flex:none;cursor:pointer}
.tt{display:flex;flex-direction:column;min-width:0;flex:1}
.tt b{font-size:19px;font-weight:800;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.tt small{font-size:12.5px;color:var(--muted)}
.sync{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--okbg);color:var(--ok);white-space:nowrap;flex:none;border:0}
.sync.wait{background:var(--warnbg);color:var(--yellow)}.sync.off{background:#4A1E14;color:#FFB59E}
.main{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.sect{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.seg{display:grid;gap:6px;grid-template-columns:repeat(var(--n,3),1fr)}
.seg button{border:0;border-radius:12px;padding:9px 4px;background:var(--bg2);color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--navy)}
.seg button small{display:block;font-size:10.5px;font-weight:600}
.atl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:13px 14px;background:var(--bg2);color:var(--ink);cursor:pointer}
.atl .l{min-width:0;flex:1}.atl b{display:block;font-size:15.5px}.atl small{display:block;font-size:12px;color:var(--muted)}
.atl .c{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none}.atl .c.done{color:var(--ok)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--yellow)}
.queue{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.queue::-webkit-scrollbar{display:none}
.queue button{flex:none;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--bg2);color:var(--muted);border:0;cursor:pointer;font-weight:600}
.queue button.on{background:var(--yellow);color:var(--navy);font-weight:800}.queue button.ok{color:var(--ok)}.queue button.abs{color:var(--warn);text-decoration:line-through}
.who{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:4px 0}
.who small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.who b{font-size:30px;font-weight:800;line-height:1.1}
.who span{font-size:13px;color:var(--muted)}.who .rec{color:var(--yellow);font-weight:800}
.tries{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.try{border-radius:14px;padding:9px 11px;background:var(--bg2);display:flex;flex-direction:column;gap:2px;min-height:64px}
.try small{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.try b{font-family:var(--mono);font-size:21px}.try i{font-style:normal;font-size:11.5px;color:var(--ok)}.try i.m{color:var(--warn)}
.try.best{outline:2px solid var(--yellow)}
.big{flex:1;min-height:180px;border:0;border-radius:26px;background:var(--yellow);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--body);padding:10px}
.big .clock{font-family:var(--mono);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big .lab{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.big.run{background:var(--run);color:#fff}.big.arm{background:var(--bg3);color:var(--ink)}.big:disabled{opacity:.45}
.counter b{font-family:var(--mono);font-size:84px;line-height:1}
.row{display:grid;gap:8px;grid-template-columns:repeat(var(--n,2),1fr)}
.btn{border:0;border-radius:14px;padding:13px 8px;font-weight:800;font-size:14.5px;cursor:pointer;background:var(--bg2);color:var(--ink);font-family:var(--body)}
.btn.y{background:var(--yellow);color:var(--navy)}.btn.g{background:transparent;border:1.5px solid var(--bg3);color:var(--muted)}
.btn:disabled{opacity:.35;cursor:default}
.bon{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bon button{border:0;border-radius:12px;padding:10px 4px;background:var(--bg2);color:var(--ink);font-weight:800;font-size:12.5px;cursor:pointer;line-height:1.25}
.bon button small{display:block;font-weight:600;font-size:10.5px;color:var(--muted)}
.bon button[aria-pressed="true"]{background:var(--okbg);color:var(--ok)}.bon button:disabled{opacity:.35}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px dashed var(--bg3);background:transparent;color:var(--ink);border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left}
.opt i{font-style:normal;color:var(--muted);flex:none}.opt[aria-pressed="true"] i{color:var(--ok)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0;line-height:1.45}
.card{border-radius:18px;background:var(--bg2);padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:22px;text-transform:uppercase}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
input.f,select.f{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1.5px solid var(--bg3);background:var(--bg);color:var(--ink);width:100%;user-select:text;-webkit-user-select:text}
.err{color:#FFB59E;font-size:13.5px;font-weight:700;margin:0}
.crest{width:84px;height:84px;align-self:center}
.toast{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));max-width:532px;margin:0 auto;background:var(--okbg);color:#CFF3DE;font-weight:700;font-size:14px;padding:11px 12px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;opacity:0;transform:translateY(-10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none;pointer-events:auto}.toast button{border:0;border-radius:10px;padding:7px 11px;font-weight:800;background:#CFF3DE;color:#123;flex:none}
.sheet{position:fixed;inset:0;background:rgba(3,10,20,.7);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet .card{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--bg3)}
.manual{color:var(--warn);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const LS="paufc-tests-app";let D={};try{D=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- envoi : file d'attente, jamais perdue ---------- */

/* saisie manuelle (cellules du préparateur physique, chrono à main…) : toujours marquée comme telle */

const sayT=ms=>{const [a,b]=(ms/1000).toFixed(2).split(".");return `${+a} secondes ${b}`};
function validate(){const t=V.test,c=V.cur,L=players(V.cat),p=L[V.idx],b=best();if(!b)return;
  const r={};r[t.id]=b.v;
  if(t.combo){[0,1].forEach(i=>{if(c.v[i]==null)return;r[t.id+(i?"_c2":"_c")]=c.v[i];r[t.id+(i?"_b2":"_b")]=c.b[i]})}else if(!t.one){[0,1].forEach(i=>{if(c.v[i]!=null)r[t.id+"_e"+(i+1)]=c.v[i]})}
  const man=[0,1].filter(i=>c.m[i]);if(man.length){r[t.id+"_m"]=c.m[man[0]];man.forEach(i=>r[t.id+"_m"+(i+1)]=c.m[i])}
  const prev=D.res[rkey(V.cat,p,V.per,t.id)];send(V.cat,p,V.per,t,r);setAbs(p,false);
  const pr=prior(p);let msg=`${prenom(p)} · ${fmtV(t,b.v)} envoyé`;
  if(pr){const better=t.lower?b.v<pr.v:b.v>pr.v;if(better)msg=`${prenom(p)} bat son record ${pr.P===1?"d'octobre":"de "+TP[pr.P].toLowerCase()} 🎉 ${t.lower?"−"+fmt((pr.v-b.v)*1000)+" s":"+"+Math.round((b.v-pr.v)*100)/100+" "+t.unit}`}
  say(msg.replace(/🎉/,"").replace(/−/,"moins "));buzz(20);
  const idx=V.idx;toast(msg,{label:"Annuler",fn:()=>{if(prev)D.res[rkey(V.cat,p,V.per,t.id)]=prev;else delete D.res[rkey(V.cat,p,V.per,t.id)];
    /* l'annulation envoie une ligne vide qui remplace le résultat (le journal du classeur garde les deux) */
    const ts=Date.now();const keys=[t.id,t.id+"_e1",t.id+"_e2",t.id+"_c",t.id+"_b",t.id+"_c2",t.id+"_b2",t.id+"_m",t.id+"_m1",t.id+"_m2"];const tt={};keys.forEach(k=>tt[k]=prev&&prev.t&&prev.t[k]!==undefined?prev.t[k]:null);
    D.queue.push({prog:1,cat:apiCat(V.cat),player:p+"¦"+t.id,per:200+V.per,f:{},t:tt,note:"annulé",by:D.who,ts});D.res[rkey(V.cat,p,V.per,t.id)]={t:tt,by:D.who,ts};save();flush();V.idx=idx;newKid();toast("Résultat annulé : on recommence")}});
  next(true)}
function next(saved){const L=players(V.cat),t=V.test,ab=absOf();const free=x=>!has(V.cat,x,V.per,t.id)&&!ab[x];
  let n=L.findIndex((x,i)=>i>V.idx&&free(x));if(n<0)n=L.findIndex(free);if(n<0){stopT();V.view="done";setTimeout(render,saved?250:0);return}V.idx=n;newKid()}
function done(){const t=V.test,L=players(V.cat),ab=Object.keys(absOf()).filter(p=>!has(V.cat,p,V.per,t.id));const d=L.filter(p=>has(V.cat,p,V.per,t.id)).length;
  app.innerHTML=topBar(t.name,`${V.cat} · ${TP[V.per]}`,true)+`<div class="main"><div class="card" style="text-align:center"><h2>✓ ${d}/${L.length} joueurs</h2><p class="hint" style="font-size:14px">${ab.length?`À rattraper : ${ab.map(prenom).join(", ")}. Ils restent dans la liste, même lors d'une autre séance.`:"Tous les résultats sont dans l'outil Progression : fiches, bilan du groupe et carnets."}</p></div>
  ${ab.length?`<button class="btn y" id="catch">Faire passer les absents</button>`:""}<button class="btn ${ab.length?'g':'y'}" id="home">Choisir un autre atelier</button></div>`;
  badge();document.getElementById("back").onclick=()=>{V.view="home";render()};document.getElementById("home").onclick=()=>{V.view="home";render()};document.getElementById("sync").onclick=()=>flush();
  const cb=document.getElementById("catch");if(cb)cb.onclick=()=>{ab.forEach(p=>setAbs(p,false));V.idx=L.indexOf(ab[0]);newKid()}}

/* ---------- chrono ----------
   Précision : le départ et l'arrêt sont pris à l'instant du TOUCHER (event.timeStamp, horloge haute résolution,
   même base que performance.now()). L'affichage ne sert qu'à montrer le temps. Départ au bip : le chrono part
   à l'instant programmé du bip (horloge audio), sans temps de réaction. Double toucher < 300 ms ignoré. */
let T={state:"idle",t0:0,raf:0},audio=null;
function tone(at,f,d){try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type="square";o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.6,at+.005);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.start(at);o.stop(at+d+.02)}catch(e){}}
function onChrono(e){e.preventDefault();const t=V.test,c=V.cur;const now=e.timeStamp&&e.timeStamp<1e11?e.timeStamp:performance.now();
  if(T.state==="idle"){if(c.n>=2||pendingBonus())return;keepAwake();
    if(t.beep&&D.opt["beep_"+t.id]!==false){T.state="arm";try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(_){audio=null}
      const lead=3;let t0=performance.now()+lead*1000;
      if(audio){const base=audio.currentTime+.05;[0,1,2].forEach(s=>tone(base+s,700,.1));tone(base+lead,1400,.3);
        /* l'heure exacte du bip, convertie dans l'horloge des touchers */
        try{const ts=audio.getOutputTimestamp?audio.getOutputTimestamp():null;if(ts&&ts.performanceTime){t0=ts.performanceTime+(base+lead-ts.contextTime)*1000}else{t0=performance.now()+(base+lead-audio.currentTime)*1000}}catch(_){}}
      T.t0=t0;const cl=document.getElementById("clock"),lb=document.getElementById("clab"),btn=document.getElementById("chrono");btn.className="big arm";lb.textContent="Prêt… départ au bip · touche pour annuler";
      const cd=()=>{if(T.state!=="arm")return;const r=T.t0-performance.now();if(r<=0){T.state="run";T.last=T.t0;btn.className="big run";lb.textContent="Touche n'importe où pour arrêter";buzz(15);loopT();return}cl.textContent=Math.ceil(r/1000);T.raf=requestAnimationFrame(cd)};cd();return}
    T.state="run";T.t0=now;T.last=now;const btn=document.getElementById("chrono");btn.className="big run";document.getElementById("clab").textContent="Touche n'importe où pour arrêter";buzz(15);loopT();return}
  if(T.state==="arm"){stopT();render();toast("Départ annulé");return}
  if(T.state==="run"){if(now-T.last<300)return;const ms=now-T.t0;stopT();const v=Math.round(ms/10)/100;c.v[c.n]=v;c.ms[c.n]=ms;c.n++;buzz([10,40,10]);say(sayT(ms));render()}}
function loopT(){const cl=document.getElementById("clock");if(!cl||T.state!=="run")return;cl.textContent=fmt(Math.max(0,performance.now()-T.t0));T.raf=requestAnimationFrame(loopT)}
function stopT(){T.state="idle";cancelAnimationFrame(T.raf)}
/* pendant un essai, tout l'écran sert de STOP */
document.addEventListener("pointerdown",e=>{if(T.state==="run"&&V.view==="measure"&&!e.target.closest("#chrono")&&!e.target.closest("#back"))onChrono(e)},true);
/* l'appli s'installe et fonctionne sans réseau */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("tests-app-sw.js").catch(()=>{});
render();if(authed()&&V.cat)pull(V.cat);flush();setInterval(()=>{if(document.visibilityState==="visible"&&V.view==="home"&&V.cat)pull(V.cat)},30000);
</script>

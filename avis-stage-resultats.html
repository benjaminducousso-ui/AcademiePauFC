<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résultats de l'enquête · Pau FC Academy</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--navy:#0B2A4A;--yellow:#F2C200;--bg:#F5F3EC;--ink:#13213A;--muted:#5B6576;--line:#E2DDD0;--good:#1F7A4A;--bad:#B42318;--display:'Barlow Condensed',Arial Narrow,sans-serif;--body:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}header img{width:44px;height:44px}
header h1{font:800 24px/1 var(--display);text-transform:uppercase;margin:0}header p{margin:2px 0 0;color:#C9D4E2;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:12px 14px 40px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px #0B2A4A14}
h2{font:800 20px var(--display);text-transform:uppercase;color:var(--navy);margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px #0B2A4A14}
.kpi b{display:block;font:800 32px/1 var(--display);color:var(--navy)}.kpi span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:600 15px var(--body);cursor:pointer}.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.bars .r{display:grid;grid-template-columns:minmax(120px,38%) 1fr 64px;gap:10px;align-items:center;padding:5px 0}
.bars .t{font-size:15px}.bars .t small{color:var(--muted)}.track{height:14px;background:#EFEBE1;border-radius:7px;overflow:hidden}.track i{display:block;height:100%;background:var(--navy);border-radius:7px}
.bars .v{text-align:right;font-weight:700;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .card{margin:0}
.txt{border-top:1px solid var(--line);padding:9px 0}.txt:first-of-type{border-top:0}.txt .who{font-size:13px;color:var(--muted)}
.miss{columns:3 180px;font-size:15px}.miss div{break-inside:avoid;padding:2px 0}
.login{max-width:380px;margin:40px auto}.login input{width:100%;font:16px var(--body);padding:11px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0}
.btn{border:0;border-radius:12px;background:var(--yellow);font:800 18px var(--display);text-transform:uppercase;padding:12px 16px;cursor:pointer;width:100%}
.muted{color:var(--muted)}.err{color:var(--bad);font-weight:700}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.bars .r{grid-template-columns:1fr 70px}.bars .t{grid-column:1/-1}}
@media print{.chips,.noprint{display:none}body{background:#fff}.card{box-shadow:none;border:1px solid var(--line)}}
</style></head><body>

const GRID=[["g_format","Format sur 2 jours"],["g_horaires","Horaires"],["g_seances","Séances"],["g_tournois","Tournois et matchs"],["g_educ","Éducateurs"],["g_accueil","Accueil et organisation"],["g_infra","Terrains et installations"],["g_repas","Repas et goûters"],["g_club","Moments club"],["g_info","Information avant le stage"]];
const ONE=[["revenir","Envie de revenir",["Oui !","Peut-être","Non"]],["c_plaisir","Carnet : lui a fait…",["Très plaisir","Plutôt plaisir","Indifférent","Pas plaisir"]],["c_mot","Carnet : le mot de l'éducateur",["L'a beaucoup touché","Lui a fait plaisir","Indifférent","Pas lu"]],["c_idee","Carnet : bonne idée ?",["Oui, à garder tel quel","Oui, mais à adapter","Non, pas utile"]],["prix","Le prix",["Bon marché","Juste","Un peu cher","Trop cher"]],["prochain","Prochain stage",["On revient sûrement","Peut-être","Non"]],["duree","Durée idéale",["2 jours","3 jours","4 à 5 jours","Des demi-journées"]],["qui","Répondu par",["Le parent avec l'enfant","Le parent seul"]]];
const MULTI=[["prefere","Ce qu'il a préféré"],["c_etoiles","Carnet : les étoiles l'ont…"]];
const LS="paufc-avis-res";let code="";try{code=localStorage.getItem(LS)||""}catch(e){}

function login(msg){$("app").innerHTML=`<div class="card login"><h2>Accès RTJ</h2><p class="muted">Code RTJ de l'outil carnet de stage.</p><input id="code" type="password" autocomplete="off" placeholder="Code"><button class="btn" id="go">Voir les résultats</button>${msg?`<p class="err">${msg}</p>`:""}</div>`;
  $("go").onclick=()=>{code=$("code").value.trim();load()};$("code").onkeydown=e=>{if(e.key==="Enter")$("go").click()}}
async function load(){$("app").innerHTML=`<p class="muted">Chargement…</p>`;
  try{const r=await fetch(`${API}?a=avis&stage=${encodeURIComponent(STAGE)}&code=${encodeURIComponent(code)}`,{cache:"no-store"});const j=await r.json();
    if(!j.ok){try{localStorage.removeItem(LS)}catch(e){}return login(j.error==="rtj"||j.error==="code"?"Code incorrect.":"Erreur : "+j.error)}
    try{localStorage.setItem(LS,code)}catch(e){}
    // une réponse par enfant : la plus récente fait foi
    const by={};j.avis.forEach((a,i)=>{const k=a.id||("x"+i);by[k]=a});DATA=Object.values(by);render()}
  catch(e){login("Connexion impossible, réessayez.")}}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const f1=x=>x==null?"–":x.toFixed(1).replace(".",",");

function render(){const D=F?DATA.filter(a=>a.groupe===F):DATA;const n=D.length;
  const tot=F?(ROSTER[F]||[]).length:new Set(Object.values(ROSTER).flat().map(k=>k[0])).size;
  const notes=D.map(a=>+a.note).filter(Boolean),reco=D.map(a=>a.reco).filter(v=>v!==null&&v!==undefined&&v!=="").map(Number),qp=D.map(a=>+a.qp).filter(Boolean);
  const nps=reco.length?Math.round(100*(reco.filter(v=>v>=9).length-reco.filter(v=>v<=6).length)/reco.length):null;
  const grid=GRID.map(([k,l])=>{const v=D.map(a=>+a[k]).filter(x=>x>=1);return [l,avg(v),v.length]});
  const one=ONE.map(([k,l,opts])=>{const c=opts.map(o=>[o,D.filter(a=>a[k]===o).length]);const m=c.reduce((x,y)=>x+y[1],0);return `<div class="card"><h2>${l}</h2>${m?bars(c.map(x=>[x[0],x[1],0]),m,r=>Math.round(100*r[1]/m)+" %"):`<p class="muted">Pas encore de réponse.</p>`}</div>`});
  const multi=MULTI.map(([k,l])=>{const c={};D.forEach(a=>(a[k]||[]).forEach(v=>c[v]=(c[v]||0)+1));const L=Object.entries(c).sort((a,b)=>b[1]-a[1]);return `<div class="card"><h2>${l}</h2>${L.length?bars(L.map(x=>[x[0],x[1]]),n,r=>Math.round(100*r[1]/n)+" %"):`<p class="muted">Pas encore de réponse.</p>`}</div>`});
  const txt=(k,l)=>{const L=D.filter(a=>(a[k]||"").trim());return `<div class="card"><h2>${l} <span class="muted" style="font-size:16px">(${L.length})</span></h2>${L.map(a=>`<div class="txt">${esc(a[k])}<div class="who">${esc(a.enfant||"")} · ${esc(a.groupe)} · ${esc(a.ts)}${k==="message"&&a.email?` · <a href="mailto:${esc(a.email)}">${esc(a.email)}</a>`:""}</div></div>`).join("")||`<p class="muted">Rien pour l'instant.</p>`}</div>`};
  const done=new Set(DATA.map(a=>a.id).filter(Boolean));
  const miss=Object.entries(ROSTER).filter(([g])=>!F||g===F).map(([g,L])=>{const m=L.filter(k=>!done.has(k[0]));return m.length?`<div><b>${g}</b> (${m.length})</div>`+m.map(k=>`<div>${esc(k[1])}</div>`).join(""):""}).join("");

  <div class="kpis" style="margin-top:12px"><div class="kpi"><b>${n}<span style="font-size:18px">/${tot}</span></b><span>réponses (${tot?Math.round(100*n/tot):0} %)</span></div><div class="kpi"><b>${f1(avg(notes))}<span style="font-size:18px">/5</span></b><span>note globale</span></div><div class="kpi"><b>${nps==null?"–":(nps>0?"+":"")+nps}</b><span>recommandation (NPS, de −100 à +100)</span></div><div class="kpi"><b>${f1(avg(qp))}<span style="font-size:18px">/5</span></b><span>rapport qualité-prix</span></div></div>
  <div class="card"><h2>Ce qu'ils en ont pensé <span class="muted" style="font-size:16px">moyenne sur 4 (😞 1 → 😍 4)</span></h2>${bars(grid.map(g=>[g[0],g[1],0,g[2]?g[2]+" avis":""]),4,r=>f1(r[1]))}</div>

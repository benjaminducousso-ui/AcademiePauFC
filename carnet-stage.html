<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2A4A">
<title>Carnet de stage · Pau FC Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--navy:#0B2A4A;--navy-2:#123B66;--yellow:#F2C200;--bg:#F3F5F9;--surface:#fff;--surface-2:#E9EEF6;--line:#D5DDE8;--ink:#14213D;--muted:#5B6B82;--ok:#2E8B57;--warn:#C77700;--danger:#8A1F1F;
--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;flex:none}
.top .t1{font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t2{font-size:14px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{margin-left:auto;flex:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.lab{font-weight:700;font-size:15px}
input[type=text],input[type=password],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 30%,transparent)}
textarea{resize:vertical;min-height:84px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#0B2A4A}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.hint{color:var(--muted);font-size:15px;margin:6px 0 0}
.err{color:var(--danger);font-weight:700;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{opacity:.7;font-weight:600;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 6px}
.bar .grow{flex:1}
.prog{font-size:15px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:62px}
.row .nm{font-weight:700;font-size:17px}
.row .sub{font-size:14px;color:var(--muted)}
.row .mid{flex:1;min-width:0}
.row .go{color:var(--muted);font-size:22px}
.st{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-right:6px}
.st.s0{background:var(--surface-2);color:var(--muted)}.st.s1{background:#FFF1CC;color:#7A5E00}.st.s2{background:#DDF2E5;color:#1E6B41}
.flag{font-size:12px;font-weight:800;color:#fff;background:#C0392B;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
.mini-stars{white-space:nowrap;color:var(--yellow);font-size:14px;letter-spacing:1px}
.empty{color:var(--muted);text-align:center;padding:24px}
.addrow{margin-top:14px;width:100%;border:1.5px dashed var(--line);background:none;border-radius:14px;padding:12px;font-weight:700;color:var(--navy-2)}
.rtjbar{background:#FFF8DB;border:1px solid #F2D46A;border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;color:#14213D}
.rtjbar span{flex:1;min-width:180px;font-weight:600}
/* fiche */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(max-width:560px){.sheet{max-height:none;height:100%;border-radius:0}}
@media(min-width:561px){.ov{align-items:center}.sheet{border-radius:20px}}
.shead{position:relative;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 64px 12px 16px}
.shead h2{font-size:28px;text-transform:uppercase}
.shead .sub{color:var(--muted);font-size:15px}
.x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;display:grid;place-items:center}
.sbody{overflow:auto;padding:12px 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.fac{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fac .ft{flex:1;min-width:180px}
.fac b{display:block;font-size:16px}.fac small{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.stars{display:flex;gap:4px}
.star{width:46px;height:46px;border:0;background:none;padding:0;display:grid;place-items:center}
.star svg{width:36px;height:36px;fill:var(--surface-2);stroke:#B9C3D3;stroke-width:1}
.star.on svg{fill:var(--yellow);stroke:#C9A100}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:700}
.check input{width:26px;height:26px;flex:none;margin:0;accent-color:#C0392B}
.check.on{border-color:#C0392B;background:color-mix(in srgb,#C0392B 7%,var(--surface))}
.sfoot{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap}
.sfoot .btn{flex:1;min-width:0;white-space:nowrap;padding:10px 14px}.sfoot #fcancel,.sfoot #acancel{flex:0 0 auto}
.valinfo{margin-top:12px;font-size:14px;color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.pending{background:#FDECEA;color:#8A1F1F;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--navy-2);text-decoration:underline;font-weight:700;padding:6px 0}
</style></head><body>
<header class="top"><img alt="" id="crest"><div style="min-width:0"><div class="t1">Carnet de stage</div><div class="t2" id="t2">Pau FC Academy</div></div><button class="who" id="who" hidden></button></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div id="modal"></div>

async function api(params){const q=new URLSearchParams(Object.assign({code:store.code||""},params));const r=await fetch(API+"?"+q.toString(),{cache:"no-store"});return r.json()}
async function post(body){const r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({code:store.code||""},body)),headers:{"Content-Type":"text/plain;charset=utf-8"}});return r.json()}

async function load(){if(!API||API.indexOf("__")===0){ERR="noapi";render();return}
  LOADING=true;ERR="";render();
  try{const j=await api({a:"list",stage:STAGE});
    if(!j.ok){if(j.error==="code"){ERR="code";store.code="";save()}else ERR=j.error||"err";LOADING=false;render();return}
    ROLE=j.role;PLAYERS=(j.players||[]).filter(p=>allowed(p.groupe));
    // ce qui attend encore d'être envoyé reste affiché tel que saisi
    store.queue.filter(x=>x.stage===STAGE).forEach(x=>{const p=PLAYERS.find(y=>y.id===x.id);if(p)Object.assign(p,{f:x.f,mot:x.mot,suivre:x.suivre,pourquoi:x.pourquoi,club:x.club,statut:"à valider",by:x.by})});
    if(!GRP||!PLAYERS.some(p=>p.groupe===GRP)){const g=GROUPS.find(g=>PLAYERS.some(p=>p.groupe===g.id));GRP=g?g.id:"U6-U7"}
  }catch(e){ERR="net"}
  LOADING=false;render();flush()}

async function flush(){if(!store.queue.length||flush.busy)return;flush.busy=true;
  for(const x of store.queue.slice()){try{const j=await post(x);if(j&&j.ok){store.queue=store.queue.filter(y=>y!==x);save();const p=PLAYERS.find(y=>y.id===x.id);if(p){p.statut=j.statut;p.ts=j.ts}}else break}catch(e){break}}
  flush.busy=false;save();if(!OPEN&&!ADD)render()}

  <p class="hint">Remplis le carnet de stage de chaque enfant : ses étoiles et ton mot. Le code t'a été donné par le RTJ.</p>
  <div class="field"><label for="lname">Ton prénom</label><input id="lname" type="text" autocomplete="given-name" value="${esc(store.who||"")}" placeholder="ex. Kylian"></div>
  <div class="field"><label for="lcode">Code d'accès</label><input id="lcode" type="password" autocomplete="off" value="" placeholder="Code éducateur ou RTJ"></div>
  ${ERR==="code"?`<p class="err">Ce code n'est pas le bon.</p>`:""}
  <button class="btn primary" id="lgo" style="width:100%;margin-top:18px">Entrer</button></div>`}

function stars(n){return n?"★".repeat(n)+"☆".repeat(3-n):""}
function listView(){
  const inG=PLAYERS.filter(p=>p.groupe===GRP).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
  const done=inG.filter(p=>statusOf(p)>0).length,toVal=inG.filter(p=>statusOf(p)===1);
  let L=inG;if(FILTER==="saisir")L=inG.filter(p=>statusOf(p)===0);if(FILTER==="valider")L=toVal;if(FILTER==="suivre")L=inG.filter(p=>p.suivre);
  const nSuivre=inG.filter(p=>p.suivre).length;
  return `<div class="bar"><select id="stage" aria-label="Stage" style="max-width:220px">${STAGES_DEF.map(s=>`<option value="${s.id}"${s.id===STAGE?" selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
  <div class="chips" role="group" aria-label="Groupe">${GROUPS.map(g=>{const n=PLAYERS.filter(p=>p.groupe===g.id).length;return n?`<button class="chip" data-g="${g.id}" aria-pressed="${g.id===GRP}">${g.id}<span class="n">${n}</span></button>`:""}).join("")}</div>
  ${store.queue.length?`<div class="pending">⚠ ${store.queue.length} fiche${store.queue.length>1?"s":""} pas encore envoyée${store.queue.length>1?"s":""} (pas de réseau ?)<button class="btn" id="retry" style="min-height:38px">Réessayer</button></div>`:""}
  ${ROLE==="rtj"&&toVal.length?`<div class="rtjbar"><span>${toVal.length} fiche${toVal.length>1?"s":""} ${GRP} à valider</span><button class="btn ok" id="valall">✓ Valider les ${toVal.length}</button></div>`:""}
  <div class="bar"><span class="prog grow">${done} / ${inG.length} carnets remplis</span></div>
  <div class="chips" role="group" aria-label="Filtre">
    <button class="chip" data-f="tous" aria-pressed="${FILTER==="tous"}">Tous</button>
    <button class="chip" data-f="saisir" aria-pressed="${FILTER==="saisir"}">À saisir</button>
    <button class="chip" data-f="valider" aria-pressed="${FILTER==="valider"}">À valider</button>
    <button class="chip" data-f="suivre" aria-pressed="${FILTER==="suivre"}">À suivre${nSuivre?`<span class="n">${nSuivre}</span>`:""}</button></div>
  <div class="list">${L.length?L.map(p=>{const s=statusOf(p);const fs=FACETS.map(f=>p.f&&p.f[f.id]||0);const filled=fs.filter(Boolean).length;
    return `<button class="row" data-p="${esc(p.id)}"><span class="mid"><span class="nm">${esc(p.name)}</span><br><span class="sub"><span class="st s${s}">${ST_LABEL[s]}</span>${esc(p.cat)}${p.club?" · "+esc(p.club):""}${filled?` · <span class="mini-stars">${fs.reduce((a,b)=>a+b,0)} ★</span>`:""} ${p.suivre?`<span class="flag">À suivre</span>`:""}</span></span><span class="go" aria-hidden="true">›</span></button>`}).join(""):`<p class="empty">Personne ici.</p>`}</div>
  <button class="addrow" id="addkid">+ Ajouter un enfant qui n'est pas sur la liste</button>
  <p class="hint" style="margin-top:16px">${ROLE==="rtj"?"Mode RTJ : tu peux corriger et valider. Seules les fiches validées partent dans les carnets.":"Après ton enregistrement, la fiche passe « à valider » : le RTJ la relit et la valide."}</p>`}

function ficheView(){const p=PLAYERS.find(x=>x.id===OPEN);if(!p)return "";const d=DRAFT;const g=GROUPS.find(x=>x.id===p.groupe)||GROUPS[0];
  const inG=PLAYERS.filter(x=>x.groupe===p.groupe).sort((a,b)=>a.name.localeCompare(b.name,"fr"));const i=inG.indexOf(p);
  return `<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Fiche de ${esc(p.name)}">
  <div class="shead"><button class="x" id="fx" aria-label="Fermer">✕</button><h2>${esc(p.name)}</h2><div class="sub">${esc(p.cat)} · ${esc(p.groupe)} · ${esc(stName(STAGE))} · ${i+1} / ${inG.length}</div></div>
  <div class="sbody">
    ${FACETS.map(f=>`<div class="fac"><div class="ft"><b>${f.name}</b><small>${esc(g.facets[f.id])}</small></div><div class="stars" role="radiogroup" aria-label="${f.name}">${[1,2,3].map(n=>`<button class="star${(d.f[f.id]||0)>=n?" on":""}" data-s="${f.id}" data-n="${n}" role="radio" aria-checked="${d.f[f.id]===n}" aria-label="${n} étoile${n>1?"s":""}">${STAR}</button>`).join("")}</div></div>`).join("")}
    <p class="legend">1 étoile : à découvrir · 2 : en progrès · 3 : acquis pour son âge. On compare l'enfant à lui-même, jamais aux autres.</p>
    <div class="field"><label for="fmot">Le mot de l'éducateur <span class="hint" style="font-weight:400">(écrit sur le carnet)</span></label><textarea id="fmot" rows="3" placeholder="Ce qu'il a réussi, ce qu'il peut travailler…">${esc(d.mot)}</textarea></div>
    <div class="field"><label for="fclub">Son club</label><input id="fclub" type="text" value="${esc(d.club)}" placeholder="Pau FC, autre club, ou aucun"></div>
    <label class="check${d.suivre?" on":""}" id="fchk"><input type="checkbox" id="fsuivre"${d.suivre?" checked":""}><span>Joueur extérieur à suivre pour le Pau FC<br><span class="hint" style="font-weight:400;margin:0">Un enfant d'un autre club (ou sans club) à revoir par le RTJ. 🔒 Réservé au club : jamais sur le carnet.</span></span></label>
    ${d.suivre?`<div class="field"><label for="fwhy">Pourquoi ? <span class="hint" style="font-weight:400">(obligatoire · 🔒 pour le RTJ, jamais sur le carnet)</span></label><textarea id="fwhy" rows="3" placeholder="Ce qui t'a marqué : qualités, attitude, poste…">${esc(d.pourquoi)}</textarea></div>`:""}
    ${p.statut==="validé"?`<p class="valinfo">✓ Validé${p.valPar?" par "+esc(p.valPar):""}${p.valLe?" le "+esc(p.valLe):""}${ROLE!=="rtj"?" · une modification la renvoie au RTJ":""}</p>`:p.by?`<p class="hint">Saisi par ${esc(p.by)}${p.ts?" · "+esc(p.ts):""}</p>`:""}
  </div>
  <div class="sfoot"><button class="btn" id="fcancel">Annuler</button>${ROLE==="rtj"?`<button class="btn ok" id="fval">✓ Valider</button>`:`<button class="btn primary" id="fsave">✓ Enregistrer${i<inG.length-1?" ›":""}</button>`}</div>
  </div></div>`}

function addView(){const a=ADD;return `<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter un enfant" style="height:auto;max-height:94vh">
  <div class="shead"><button class="x" id="ax" aria-label="Fermer">✕</button><h2>Ajouter un enfant</h2><div class="sub">Il est ajouté à la base des stagiaires ; les parents se complètent ensuite dans le Drive.</div></div>
  <div class="sbody">
    <div class="field"><label for="apre">Prénom</label><input id="apre" type="text" value="${esc(a.prenom)}"></div>
    <div class="field"><label for="anom">Nom</label><input id="anom" type="text" value="${esc(a.nom)}"></div>
    <div class="field"><label for="acat">Catégorie</label><select id="acat">${["U6","U7","U8","U9","U10","U11","U12","U13"].filter(c=>{const n=+c.slice(1);return allowed(n<=7?"U6-U7":n<=9?"U8-U9":n<=11?"U10-U11":"U12-U13")}).map(c=>`<option${c===a.cat?" selected":""}>${c}</option>`).join("")}</select></div>
    <div class="field"><label for="aclub">Son club</label><input id="aclub" type="text" value="${esc(a.club)}" placeholder="Pau FC, autre club, ou aucun"></div>
    ${a.err?`<p class="err">${esc(a.err)}</p>`:""}
  </div>
  <div class="sfoot"><button class="btn" id="acancel">Annuler</button><button class="btn primary" id="ago">✓ Ajouter</button></div></div></div>`}

function render(){
  $("t2").textContent="Stages · Pau FC Academy";
  const w=$("who");if(store.code&&store.who){w.hidden=false;w.textContent=(ROLE==="rtj"?"RTJ · ":"")+store.who}else w.hidden=true;
  const app=$("app");
  if(ERR==="noapi")app.innerHTML=`<div class="card"><h2 style="font-size:28px">La base n'est pas encore branchée</h2><p class="hint">Il manque l'adresse de l'Apps Script du Google Sheet « Base stagiaires Pau FC » dans la page.</p></div>`;
  else if(!store.code||ERR==="code")app.innerHTML=login();
  else if(LOADING&&!PLAYERS.length)app.innerHTML=`<p class="empty">Chargement de la liste…</p>`;
  else if(ERR==="net"&&!PLAYERS.length)app.innerHTML=`<div class="card"><p>Impossible de joindre la base (réseau ?).</p><button class="btn primary" id="reload">Réessayer</button></div>`;
  else app.innerHTML=listView();
  bind();renderModal()}

function bind(){
  const lg=$("lgo");if(lg){const go=()=>{const n=$("lname").value.trim(),c=$("lcode").value.trim();if(!n){$("lname").focus();return}if(!c){$("lcode").focus();return}store.who=n;store.code=c;save();ERR="";load()};lg.onclick=go;$("lcode").onkeydown=e=>{if(e.key==="Enter")go()}}
  const rl=$("reload");if(rl)rl.onclick=load;
  const st=$("stage");if(st)st.onchange=()=>{STAGE=st.value;store.stage=STAGE;save();PLAYERS=[];load()};
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{GRP=b.dataset.g;store.grp=GRP;save();FILTER="tous";render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render()});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>openFiche(b.dataset.p));
  const rt=$("retry");if(rt)rt.onclick=flush;
  const va=$("valall");if(va)va.onclick=async()=>{const ids=PLAYERS.filter(p=>p.groupe===GRP&&statusOf(p)===1).map(p=>p.id);va.disabled=true;
    try{const j=await post({a:"validate",stage:STAGE,ids,by:store.who});if(j.ok){PLAYERS.forEach(p=>{if(ids.includes(p.id)){p.statut="validé";p.valPar=store.who}});toast(j.n+" fiche"+(j.n>1?"s":"")+" validée"+(j.n>1?"s":""))}else toast("Validation refusée")}catch(e){toast("Pas de réseau : réessaie")}render()};
  const ak=$("addkid");if(ak)ak.onclick=()=>{ADD={prenom:"",nom:"",cat:GRP.split("-")[0],club:""};renderModal()};
  const w=$("who");w.onclick=()=>{if(confirm("Changer d'éducateur ou de code ?")){store.code="";save();ROLE=null;PLAYERS=[];render()}}}

function openFiche(id){const p=PLAYERS.find(x=>x.id===id);if(!p)return;OPEN=id;DRAFT={f:Object.assign({},p.f||{}),mot:p.mot||"",club:p.club||"",suivre:!!p.suivre,pourquoi:p.pourquoi||""};DRAFT.snap=JSON.stringify(DRAFT);document.body.style.overflow="hidden";renderModal()}
function closeModal(){OPEN=null;DRAFT=null;ADD=null;document.body.style.overflow="";renderModal();render()}
function renderModal(){const m=$("modal");
  if(OPEN){m.innerHTML=ficheView();bindFiche()}else if(ADD){m.innerHTML=addView();bindAdd()}else m.innerHTML=""}
function readDraft(){const d=DRAFT;const t=$("fmot");if(t)d.mot=t.value;const c=$("fclub");if(c)d.club=c.value;const w=$("fwhy");if(w)d.pourquoi=w.value}
function dirty(){readDraft();const s=Object.assign({},DRAFT);delete s.snap;return JSON.stringify(s)!==DRAFT.snap}
function bindFiche(){
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{readDraft();const k=b.dataset.s,n=+b.dataset.n;DRAFT.f[k]=DRAFT.f[k]===n?0:n;const sb=document.querySelector(".sbody").scrollTop;renderModal();document.querySelector(".sbody").scrollTop=sb});
  $("fsuivre").onchange=e=>{readDraft();DRAFT.suivre=e.target.checked;const sb=document.querySelector(".sbody").scrollTop;renderModal();const s=document.querySelector(".sbody");s.scrollTop=sb;if(DRAFT.suivre){const w=$("fwhy");if(w){w.focus();w.scrollIntoView({block:"center"})}}};
  const close=()=>{if(dirty()&&!confirm("Fermer sans enregistrer ?"))return;closeModal()};
  $("fx").onclick=close;$("fcancel").onclick=close;$("ov").onclick=e=>{if(e.target.id==="ov")close()};
  const sv=$("fsave")||$("fval");sv.onclick=()=>commit(!!$("fval"))}
function commit(valider){readDraft();const d=DRAFT,p=PLAYERS.find(x=>x.id===OPEN);
  const n=FACETS.filter(f=>d.f[f.id]).length;
  if(n<FACETS.length&&!confirm(`${FACETS.length-n} facette${FACETS.length-n>1?"s":""} sans étoile. Enregistrer quand même ?`))return;
  if(d.suivre&&!d.pourquoi.trim()){toast("Explique pourquoi le suivre");const w=$("fwhy");if(w)w.focus();return}
  const body={a:"save",stage:STAGE,id:p.id,f:d.f,mot:d.mot.trim(),club:d.club.trim(),suivre:d.suivre,pourquoi:d.suivre?d.pourquoi.trim():"",by:store.who,valider,qts:Date.now()};
  Object.assign(p,{f:Object.assign({},d.f),mot:body.mot,club:body.club,suivre:body.suivre,pourquoi:body.pourquoi,by:store.who,statut:valider?"validé":"à valider",valPar:valider?store.who:""});
  store.queue=store.queue.filter(x=>!(x.id===p.id&&x.stage===STAGE));store.queue.push(body);save();
  // suivant dans le groupe (éducateur), sinon retour à la liste
  const inG=PLAYERS.filter(x=>x.groupe===p.groupe).sort((a,b)=>a.name.localeCompare(b.name,"fr"));const nx=inG[inG.indexOf(p)+1];
  toast(valider?"Validé ✓":"Enregistré ✓");
  if(!valider&&nx){openFiche(nx.id);document.querySelector(".sbody").scrollTop=0}else closeModal();
  flush()}
function bindAdd(){const close=()=>closeModal();$("ax").onclick=close;$("acancel").onclick=close;$("ov").onclick=e=>{if(e.target.id==="ov")close()};
  $("ago").onclick=async()=>{const a=ADD;a.prenom=$("apre").value.trim();a.nom=$("anom").value.trim();a.cat=$("acat").value;a.club=$("aclub").value.trim();
    if(!a.prenom||!a.nom){a.err="Prénom et nom obligatoires";renderModal();return}
    $("ago").disabled=true;try{const j=await post({a:"add",stage:STAGE,prenom:a.prenom,nom:a.nom,cat:a.cat,club:a.club,by:store.who});
      if(j.ok){ADD=null;document.body.style.overflow="";toast(a.prenom+" ajouté");await load();renderModal()}else{a.err="Ajout refusé ("+(j.error||"?")+")";renderModal()}}
    catch(e){a.err="Pas de réseau : réessaie";renderModal()}}}
$("crest").src=typeof CREST_PNG!=="undefined"?CREST_PNG:"";
window.addEventListener("online",flush);
render();if(store.code)load();else if(!API||API.indexOf("__")===0){ERR="noapi";render()}
</script></body></html>

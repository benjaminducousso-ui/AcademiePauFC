const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmt=s=>{const d=D(s);return `${d.getDate()} ${MOIS[d.getMonth()]}`};
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grp=()=>GROUPS[0];
function gridOf(d,g){return d.facets&&d.facets.length?d.facets:FACETS.map(f=>({id:f.id,name:f.name,desc:g.facets[f.id]}))}
function rowH(d,g){const n=gridOf(d,g).length;return n<=5?12.5:+(62.5/n).toFixed(2)}
const DIP={frame:8,inner:10.5,mx:20};
function dipData(d){const g=GROUPS.find(x=>x.id===d.g)||grp();const vd=VACANCES.find(x=>x.id===d.v)||VACANCES[0];const dates=vd[g.days];
  const y1=D(dates[0]).getFullYear();
  return {g,vd,dates,first:d.n.split(" ").pop(),
    stageLine:`Stage ${vd.name==="Hiver"?"d'hiver":vd.name==="Printemps"?"de printemps":"de la Toussaint"} · ${g.name} · ${g.dayNames[0].toLowerCase()} ${fmt(dates[0])} et ${g.dayNames[1].toLowerCase()} ${fmt(dates[1])} ${y1}`,
    next:`Prochains stages : ${VACANCES.filter(x=>x.id!==d.v).map(x=>`${x.name} (${fmt(x[g.days][0])} - ${fmt(x[g.days][1])})`).join(" · ")}.`}}

  const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
  if(on){doc.setFillColor(242,194,0);doc.setDrawColor(201,160,0)}else{doc.setFillColor(255,255,255);doc.setDrawColor(200,200,200)}doc.setLineWidth(.3);
  doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)}

  else{doc.setDrawColor(200,204,212);doc.setLineWidth(.25);[248.5,254,259.5].forEach(o=>doc.line(MX+7,o,MX+W-7,o))}

const FACETS=[{id:"motricite",name:"Motricité & coordination"},{id:"conduite",name:"Conduite, dribble & tir"},{id:"passe",name:"Passe & contrôle"},{id:"jeu",name:"Jeu & décision"},{id:"attitude",name:"Attitude & effort"}];
const GROUPS=[
 {id:"U6-U7",facets:{motricite:"Court, saute, change de direction, garde l'équilibre avec et sans ballon",conduite:"Ballon près du pied, les 2 pieds, change de direction, vise la cible pour marquer",passe:"Passe courte au sol vers un copain, arrêt semelle",jeu:"Reconnaît la cible et l'adversaire, ose dribbler ou passer",attitude:"Écoute, essaie, encourage, range le matériel"}},

const STAGES_DEF=[{id:"toussaint-2026",name:"Toussaint 2026"},{id:"hiver-2027",name:"Hiver 2027"},{id:"printemps-2027",name:"Printemps 2027"}];
function defGrid(grp){const g=GROUPS.find(x=>x.id===grp)||GROUPS[0];return FACETS.map(f=>({id:f.id,name:f.name,desc:g.facets[f.id]}))}
function gridFor(grp){return GRID[grp]&&GRID[grp].length?GRID[grp]:defGrid(grp)}
const LS="paufc-eval-stages-v1";
let store={};try{store=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){}
store.queue=store.queue||[];
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
const url=new URLSearchParams(location.search);
let STAGE=url.get("stage")||store.stage||"toussaint-2026";
let GRP=url.get("groupe")||store.grp||"";
const ONLY=(()=>{const g=(url.get("groupes")||"").trim();if(!g)return null;if(g==="petits")return["U6-U7","U8-U9"];if(g==="grands")return["U10-U11","U12-U13"];return g.split(",").map(x=>x.trim().toUpperCase())})();
const allowed=id=>!ONLY||ONLY.includes(id);
let APPR={},GRID={},GED=null,APED=null,VIEW=store.view||"liste",ROLE=null,PLAYERS=[],LOADING=false,ERR="",FILTER="tous",OPEN=null,DRAFT=null,ADD=null,CARN=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const statusOf=p=>p.statut==="validé"?2:p.statut==="à valider"?1:0;
const ST_LABEL=["À saisir","À valider","Validé"];

async function api(params){const q=new URLSearchParams(Object.assign({code:store.code||""},params));const r=await fetch(API+"?"+q.toString(),{cache:"no-store"});return r.json()}
async function post(body){const r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({code:store.code||""},body)),headers:{"Content-Type":"text/plain;charset=utf-8"}});return r.json()}

const VERSION="20/10 · 14h";
function applyList(j){ROLE=j.role;APPR=j.appr||{};GRID=j.grid||{};PLAYERS=(j.players||[]).filter(p=>allowed(p.groupe));
  // ce qui attend encore d'être envoyé reste affiché tel que saisi
  store.queue.filter(x=>x.stage===STAGE).forEach(x=>{const p=PLAYERS.find(y=>y.id===x.id);if(p)Object.assign(p,{f:x.f,mot:x.mot,suivre:x.suivre,pourquoi:x.pourquoi,statut:"à valider",by:x.by})});
  if(!GRP||!PLAYERS.some(p=>p.groupe===GRP)){const g=GROUPS.find(g=>PLAYERS.some(p=>p.groupe===g.id));GRP=g?g.id:"U6-U7"}}
const busy=()=>OPEN||ADD||APED||GED||CARN;
let SYNC=false;
async function load(){if(!API||API.indexOf("__")===0){ERR="noapi";render();return}
  ERR="";
  // affichage immédiat de la dernière liste connue, puis mise à jour en arrière-plan
  const ck=STAGE+"|"+(store.code||"").toLowerCase();
  if(!PLAYERS.length&&store.cache&&store.cache.k===ck){applyList(store.cache.j);LOADING=false}else if(!PLAYERS.length)LOADING=true;
  SYNC=true;if(!busy())render();
  try{const j=await api({a:"list",stage:STAGE});
    if(!j.ok){SYNC=false;if(j.error==="code"){ERR="code";store.code="";store.cache=null;save()}else ERR=j.error||"err";LOADING=false;render();return}
    applyList(j);try{store.cache={k:ck,j};save()}catch(e){}
  }catch(e){if(!PLAYERS.length)ERR="net"}
  LOADING=false;SYNC=false;if(!busy())render();flush()}

async function flush(){if(!store.queue.length||flush.busy)return;flush.busy=true;
  for(const x of store.queue.slice()){try{const j=await post(x);if(j&&j.ok){store.queue=store.queue.filter(y=>y!==x);save();const p=PLAYERS.find(y=>y.id===x.id);if(p){p.statut=j.statut;p.ts=j.ts}}else break}catch(e){break}}
  flush.busy=false;save();if(!OPEN&&!ADD)render()}

const SHORT={motricite:"Motricité",conduite:"Conduite",passe:"Passe",jeu:"Jeu",attitude:"Attitude"},TINY={motricite:"Motri.",conduite:"Cond.",passe:"Passe",jeu:"Jeu",attitude:"Atti."};

function recapHtml(L){if(!L.length)return `<p class="empty">Personne ici.</p>`;const GR=gridFor(L[0].groupe);const lab=(f,sm)=>{const d=FACETS.find(x=>x.id===f.id);if(d&&d.name===f.name)return sm?TINY[f.id]:SHORT[f.id];const w=f.name.split(/[\s,&·]+/)[0];return sm&&w.length>6?w.slice(0,5)+".":w};
  const avg=k=>{const v=L.map(p=>p.f&&p.f[k]||0).filter(Boolean);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1).replace(".",","):"–"};
  const who=p=>{const s=statusOf(p);return `<span class="rsub"><span class="dot d${s}"></span>${ST_LABEL[s]}${p.by?" · "+esc(p.by):""}${p.suivre?` <span class="flag">À suivre</span>`:""}</span>${p.mot?`<span class="rmot">« ${esc(p.mot)} »</span>`:""}`};
  return `<div class="recap"><table><thead><tr><th class="rn">Enfant</th>${GR.map(f=>`<th title="${esc(f.name)}"><span class="lg2">${esc(lab(f))}</span><span class="sm2">${esc(lab(f,1))}</span></th>`).join("")}</tr></thead><tbody>
  ${L.map(p=>`<tr class="rmh" data-p="${esc(p.id)}"><td colspan="${GR.length}"><b>${esc(p.name)}</b>${who(p)}</td></tr><tr class="rrow" data-p="${esc(p.id)}" tabindex="0"><td class="rn"><b>${esc(p.name)}</b>${who(p)}</td>${GR.map(f=>`<td>${starCell(p.f&&p.f[f.id])}</td>`).join("")}</tr>`).join("")}
  </tbody><tfoot><tr class="rmf"><td colspan="${GR.length}">Moyenne du groupe</td></tr><tr><td class="rn">Moyenne du groupe</td>${GR.map(f=>`<td>${avg(f.id)}</td>`).join("")}</tr></tfoot></table></div>
  <p class="hint">Touche un enfant pour ouvrir sa fiche. On compare pour harmoniser les étoiles entre éducateurs ; sur le carnet, l'enfant n'est comparé qu'à lui-même.</p>`}

  const ga=$("gadd");if(ga)ga.onclick=()=>{rd();G.items.push({id:"x"+Date.now().toString(36),name:"",desc:""});keep();const l=document.querySelectorAll("[data-gn]");l[l.length-1].focus()};
  $("gdef").onclick=()=>{rd();G.items=defGrid(G.grp);keep()};
  $("gtdef").onclick=()=>{rd();G.text=((CARNETS.GROUPS.find(x=>x.id===GMAP[G.grp])||{}).apprentissages||[]).join("\n");keep()};
  $("gsave").onclick=async()=>{rd();const items=G.items.filter(x=>x.name.trim()).map(x=>({id:x.id,name:x.name.trim(),desc:(x.desc||"").trim()}));if(!items.length){G.err="Il faut au moins un critère";keep();return}
    const list=G.text.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,7);
    if(list.some(x=>x.length>APPR_MAX)){G.err="« A travaillé » : raccourcis les points de plus de "+APPR_MAX+" caractères, sinon ils débordent sur le carnet.";keep();return}
    $("gsave").disabled=true;try{const j=await post({a:"grid",groupe:G.grp,items,by:store.who});const j2=j.ok?await post({a:"appr",stage:STAGE,groupe:G.grp,list,by:store.who}):{};if(j.ok&&j2.ok){GRID[G.grp]=j.grid;APPR[G.grp]=j2.list;toast("Carnet "+G.grp+" enregistré");close()}else if(j.ok){GRID[G.grp]=j.grid;G.err="Critères enregistrés, mais pas « a travaillé » ("+(j2.error||"?")+")";keep()}else{G.err=j.error==="rtj"?"Réservé au RTJ":"Enregistrement refusé ("+(j.error||"?")+")";keep()}}
    catch(e){G.err="Pas de réseau : réessaie";keep()}}}

function readDraft(){const d=DRAFT;const a=$("fpre"),b=$("fnom");if(a)d.prenom=a.value;if(b)d.nom=b.value;const t=$("fmot");if(t)d.mot=t.value;const c=$("fclub");if(c)d.club=c.value;const w=$("fwhy");if(w)d.pourquoi=w.value}
function dirty(){readDraft();const s=Object.assign({},DRAFT);delete s.snap;delete s.ren;return JSON.stringify(s)!==DRAFT.snap}
function bindFiche(){
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{readDraft();const k=b.dataset.s,n=+b.dataset.n;DRAFT.f[k]=DRAFT.f[k]===n?0:n;const sb=document.querySelector(".sbody").scrollTop;renderModal();document.querySelector(".sbody").scrollTop=sb});
  $("fsuivre").onchange=e=>{readDraft();DRAFT.suivre=e.target.checked;const sb=document.querySelector(".sbody").scrollTop;renderModal();const s=document.querySelector(".sbody");s.scrollTop=sb;if(DRAFT.suivre){const w=$("fwhy");if(w){w.focus();w.scrollIntoView({block:"center"})}}};
  {const t=$("fmot");if(t)t.oninput=()=>{$("fmotn").textContent=t.value.length+" / "+MOT_MAX+" caractères (3 lignes sur le carnet)"}}
  $("fren").onclick=()=>{readDraft();DRAFT.ren=!DRAFT.ren;renderModal();const a=$("fpre");if(a)a.focus()};
  const close=()=>{if(dirty()&&!confirm("Fermer sans enregistrer ?"))return;closeModal()};
  $("fx").onclick=close;$("fcancel").onclick=close;$("ov").onclick=e=>{if(e.target.id==="ov")close()};
  const sv=$("fsave")||$("fval");sv.onclick=()=>commit(!!$("fval"));
  const fp=$("fcpdf");if(fp)fp.onclick=()=>{if(dirty()){toast("Enregistre d'abord la fiche");return}pdfCarnets([OPEN])};
  const fc=$("fcarn");if(fc)fc.onclick=()=>{if(dirty()&&!confirm("Tu as des changements non enregistrés. Voir le carnet tel qu'il est enregistré ?"))return;const id=OPEN;closeModal();CARN=[id];render();window.scrollTo(0,0)}}
/* ===== Carnets (RTJ) : le diplôme d'une page de stages.html, uniquement les fiches validées ===== */
const GMAP={"U6-U7":"u67","U8-U9":"u89","U10-U11":"u1011","U12-U13":"u1213"};
const vacOf=st=>String(st).split("-")[0];
// RÈGLE : un carnet ne reprend que les étoiles et le mot — jamais « à suivre » ni le « pourquoi »
function apprOf(grp){return APPR[grp]&&APPR[grp].length?APPR[grp]:((CARNETS.GROUPS.find(x=>x.id===GMAP[grp])||{}).apprentissages||[])}
function carnetOf(p){return {n:p.name,g:GMAP[p.groupe]||"u67",v:vacOf(STAGE),f:Object.assign({},p.f||{}),m:p.mot||"",e:p.by||"",appr:apprOf(p.groupe),facets:gridFor(p.groupe)}}
let SEL=null;
function carnetsView(){const list=CARN.map(id=>PLAYERS.find(p=>p.id===id)).filter(Boolean);
  if(!SEL||SEL.ctx!==CARN.join())SEL={ctx:CARN.join(),ids:new Set((list.length>1?list.filter(p=>statusOf(p)===2):list).map(p=>p.id))};
  const chosen=list.filter(p=>SEL.ids.has(p.id)),n=chosen.length;
  const nv=list.filter(p=>statusOf(p)!==2).length;
  return `<div class="printbar"><button class="btn" id="cback">← Retour</button><span class="note">${esc(stName(STAGE))}${list.length?" · "+esc(list[0].groupe):""} · une page A4 par enfant${list.length>1?` · les carnets validés sont cochés${nv?`, ${nv} pas encore validé${nv>1?"s":""}`:""}`:""}</span></div>
  ${list.length>1?`<div class="selbox"><div class="selhead"><b>Carnets à imprimer : ${n} / ${list.length}</b><span><button class="linkbtn" id="selval">Les validés</button> · <button class="linkbtn" id="selall">Tout cocher</button> · <button class="linkbtn" id="selnone">Tout décocher</button></span></div>
    <div class="sellist">${list.map(p=>`<label class="selit"><input type="checkbox" data-sel="${esc(p.id)}"${SEL.ids.has(p.id)?" checked":""}> <span>${esc(p.name)}${statusOf(p)===2?"":` <span class="st s${statusOf(p)}">${ST_LABEL[statusOf(p)]}</span>`}</span></label>`).join("")}</div></div>`:""}
  <div class="selact"><button class="btn primary" id="cpdf"${n?"":" disabled"}>📄 PDF ${n>1?`des ${n} carnets`:"du carnet"}</button><button class="btn" id="cprint"${n?"":" disabled"}>🖨 Imprimer${n>1?` les ${n}`:""}</button></div>
  <div class="dips">${chosen.map(p=>`${list.length>1?`<div class="onebar"><b>${esc(p.name)}${statusOf(p)===2?"":` <span class="st s${statusOf(p)}">${ST_LABEL[statusOf(p)]}</span>`}</b><button class="btn sm" data-c1pdf="${esc(p.id)}">⬇ Son PDF</button></div>`:""}<div class="dipwrap">${CARNETS.ficheHtml(carnetOf(p))}</div>`).join("")}</div>`}
async function pdfCarnets(ids){const list=ids.map(id=>PLAYERS.find(p=>p.id===id)).filter(Boolean);toast("Préparation du PDF…");
    try{await CARNETS.loadJsPDF()}catch(e){toast("Impossible de charger le module PDF (réseau)");return}
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});list.forEach((p,i)=>{if(i)doc.addPage();CARNETS.pdfFiche(doc,carnetOf(p))});
    const slug=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
    const vn=(CARNETS.VACANCES.find(x=>x.id===vacOf(STAGE))||{name:STAGE}).name;
    try{doc.save(list.length===1?`carnet-stage-${slug(vn)}-${slug(list[0].name)}.pdf`:`carnets-stage-${slug(vn)}-${list[0].groupe}.pdf`);toast("PDF téléchargé")}catch(e){toast("Téléchargement impossible")}}
function bindCarnets(){$("cback").onclick=()=>{CARN=null;render()};
  $("cprint").onclick=()=>{try{setTimeout(()=>window.print(),50)}catch(e){toast("Utilise le menu Imprimer du navigateur")}};
  const chosen=()=>CARN.filter(id=>SEL.ids.has(id));
  $("cpdf").onclick=()=>pdfCarnets(chosen());
  document.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{if(c.checked)SEL.ids.add(c.dataset.sel);else SEL.ids.delete(c.dataset.sel);const y=window.scrollY;render();window.scrollTo(0,y)});
  const sa=$("selall");if(sa)sa.onclick=()=>{CARN.forEach(id=>SEL.ids.add(id));render()};
  const sv=$("selval");if(sv)sv.onclick=()=>{SEL.ids=new Set(CARN.filter(id=>{const p=PLAYERS.find(x=>x.id===id);return p&&statusOf(p)===2}));render()};
  const sn=$("selnone");if(sn)sn.onclick=()=>{SEL.ids.clear();render()};
  document.querySelectorAll("[data-c1pdf]").forEach(b=>b.onclick=()=>pdfCarnets([b.dataset.c1pdf]));
  requestAnimationFrame(()=>CARNETS.fitDips())}
window.addEventListener("resize",()=>{if(CARN)CARNETS.fitDips()});
function commit(valider){readDraft();const d=DRAFT,p=PLAYERS.find(x=>x.id===OPEN);
  const GR=gridFor(p.groupe);const n=GR.filter(f=>d.f[f.id]).length;
  if(n<GR.length&&!confirm(`${GR.length-n} item${GR.length-n>1?"s":""} sans étoile. Enregistrer quand même ?`))return;
  if(!d.prenom.trim()||!d.nom.trim()){toast("Prénom et nom obligatoires");return}
  const renamed=d.prenom.trim()!==(p.prenom||"")||d.nom.trim()!==(p.nom||"");
  if(d.suivre&&!d.pourquoi.trim()){toast("Explique pourquoi le suivre");const w=$("fwhy");if(w)w.focus();return}
  const body={a:"save",stage:STAGE,id:p.id,f:d.f,mot:d.mot.trim(),suivre:d.suivre,prenom:renamed?d.prenom.trim():undefined,nom:renamed?d.nom.trim():undefined,pourquoi:d.suivre?d.pourquoi.trim():"",by:store.who,valider,qts:Date.now()};
  if(renamed)Object.assign(p,{prenom:d.prenom.trim(),nom:d.nom.trim(),name:(d.prenom.trim()+" "+d.nom.trim())});
  Object.assign(p,{f:Object.assign({},d.f),mot:body.mot,suivre:body.suivre,pourquoi:body.pourquoi,by:store.who,statut:valider?"validé":"à valider",valPar:valider?store.who:""});
  store.queue=store.queue.filter(x=>!(x.id===p.id&&x.stage===STAGE));store.queue.push(body);save();
  // suivant dans le groupe (éducateur), sinon retour à la liste
  const inG=PLAYERS.filter(x=>x.groupe===p.groupe).sort((a,b)=>a.name.localeCompare(b.name,"fr"));const nx=inG[inG.indexOf(p)+1];
  toast(valider?"Validé ✓":"Enregistré ✓");
  if(!valider&&nx){openFiche(nx.id);document.querySelector(".sbody").scrollTop=0}else closeModal();
  flush()}

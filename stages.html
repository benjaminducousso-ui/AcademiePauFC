<script>
/* ---------- Schéma SVG ---------- */
let svgId=0;
function renderSchema(sc){
  if(!sc) return "";
  const [L,W]=sc.f; const S=10, pad=2.6;
  const X=x=>((x+pad)*S).toFixed(1), Y=y=>((y+pad)*S).toFixed(1), M=m=>(m*S).toFixed(1);
  const vw=(L+2*pad)*S, vh=(W+2*pad)*S; const id="sv"+(++svgId);
  let o=`<svg viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="Schéma de l'atelier" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs>`;
  [["c","#FFFFFF"],["m","#FFFFFF"],["p","#F2C200"],["s","#FF5A5A"]].forEach(([k,c])=>{o+=`<marker id="${id}${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`});
  o+=`</defs>`;
  o+=`<rect x="0" y="0" width="${vw}" height="${vh}" rx="8" fill="#2F6B43"/>`;
  // pelouse rayée
  const bands=Math.max(4,Math.round(L/4));
  for(let i=0;i<bands;i++){const bx=i*L/bands;o+=`<rect x="${X(bx)}" y="${Y(0)}" width="${M(L/bands)}" height="${M(W)}" fill="${i%2?'#4A9C63':'#3E8E57'}"/>`}
  o+=`<rect x="${X(0)}" y="${Y(0)}" width="${M(L)}" height="${M(W)}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/>`;
  (sc.zones||[]).forEach(z=>{o+=`<rect x="${X(z.x)}" y="${Y(z.y)}" width="${M(z.w)}" height="${M(z.h)}" fill="${z.f||'#fff'}" fill-opacity=".32" stroke="${z.f||'#fff'}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    if(z.t) o+=`<text x="${X(z.x+z.w/2)}" y="${Y(z.y+z.h/2)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.45)" stroke-width="2.5" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(z.t)}</text>`});
  (sc.goals||[]).forEach(g=>{const s=g.s||3;
    if(g.o==="v"){const gx=g.x<=0?g.x-0.9:g.x; o+=`<rect x="${X(gx)}" y="${Y(g.y-s/2)}" width="${M(0.9)}" height="${M(s)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}
    else{const gy=g.y<=0?g.y-0.9:g.y; o+=`<rect x="${X(g.x-s/2)}" y="${Y(gy)}" width="${M(s)}" height="${M(0.9)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}});
  (sc.hoops||[]).forEach(h=>{o+=`<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${M(1.3)}" fill="none" stroke="#fff" stroke-width="1.8"/>`});
  (sc.arrows||[]).forEach(a=>{const pts=a.p;let d=`M${X(pts[0].x??pts[0][0])} ${Y(pts[0].y??pts[0][1])}`;
    if(pts.length===2){d+=` L${X(pts[1][0])} ${Y(pts[1][1])}`}
    else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${X(pts[i][0])} ${Y(pts[i][1])} ${X(mx)} ${Y(my)}`}const l=pts[pts.length-1];d+=` T${X(l[0])} ${Y(l[1])}`}
    const st={c:'stroke="#fff" stroke-width="2.2"',m:'stroke="#fff" stroke-width="1.8" stroke-dasharray="5 4"',p:'stroke="#F2C200" stroke-width="2"',s:'stroke="#FF5A5A" stroke-width="2.8"'}[a.k||"c"];
    o+=`<path d="${d}" fill="none" ${st} stroke-linecap="round" stroke-linejoin="round" marker-end="url(#${id}${a.k||"c"})"/>`});
  (sc.cups||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-3.6).toFixed(1)} l4.2 6.8 h-8.4z" fill="#FFB020" stroke="#7A4B00" stroke-width=".7"/>`});
  (sc.cones||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-6.5).toFixed(1)} l5.2 10.5 h-10.4z" fill="#FF7A1A" stroke="#7A2E00" stroke-width=".8"/><rect x="${(+X(c.x)-6).toFixed(1)}" y="${(+Y(c.y)+3.2).toFixed(1)}" width="12" height="2" fill="#7A2E00"/>`});
  (sc.players||[]).forEach(p=>{const col={b:"#1E56C9",r:"#D64545",y:"#F2C200",g:"#8E44AD",e:"#14213D"}[p.c]||"#1E56C9";const tx=p.c==="y"?"#3B2E00":"#fff";

    stageLine:`Stage ${vd.name==="Hiver"?"d'hiver":vd.name==="Printemps"?"de printemps":"de la Toussaint"} · ${g.name} · ${g.dayNames[0].toLowerCase()} ${fmt(dates[0])} et ${g.dayNames[1].toLowerCase()} ${fmt(dates[1])} ${y1}`,

/* ---- HTML ---- */
function starsHtml(n){return [1,2,3].map(i=>`<svg viewBox="0 0 20 20" class="${i<=(n||0)?'on':''}"><polygon points="10,1.5 12.6,7.2 18.8,7.8 14.1,12 15.5,18.2 10,15 4.5,18.2 5.9,12 1.2,7.8 7.4,7.2"/></svg>`).join("")}
function ficheHtml(d){const {g,vd,first,stageLine,next}=dipData(d);
  return `<div class="dip"><div class="dip-frame"></div><div class="dip-inner"></div>

/* ---- PDF (jsPDF) ---- */
let fontsReady=false;
function pdfFonts(doc){if(!fontsReady){doc.addFileToVFS("Poppins-Bold.ttf",FONT_BOLD);doc.addFont("Poppins-Bold.ttf","Poppins","bold");doc.addFileToVFS("Poppins-Regular.ttf",FONT_REGULAR);doc.addFont("Poppins-Regular.ttf","Poppins","normal");doc.addFileToVFS("Poppins-Italic.ttf",FONT_ITALIC);doc.addFont("Poppins-Italic.ttf","Poppins","italic")}}
function pdfStar(doc,cx,cy,r,on){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r*0.45:r;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
  const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
  if(on){doc.setFillColor(242,194,0);doc.setDrawColor(201,160,0)}else{doc.setFillColor(255,255,255);doc.setDrawColor(200,200,200)}doc.setLineWidth(.3);
  doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)}
function pdfFiche(doc,d){const {g,vd,first,stageLine,next}=dipData(d);const PW=210,PH=297,F=DIP.frame,I=DIP.inner,MX=DIP.mx,W=PW-2*MX,CX=PW/2;
  pdfFonts(doc);
  const navy=[11,42,74],yel=[242,194,0],gray=[110,120,135],ink=[30,36,48];
  // cadre
  doc.setDrawColor(...navy);doc.setLineWidth(.9);doc.rect(F,F,PW-2*F,PH-2*F);
  doc.setDrawColor(...yel);doc.setLineWidth(.35);doc.rect(I,I,PW-2*I,PH-2*I);
  // blason + en-tête
  doc.addImage(CREST_PNG,"PNG",CX-11,16,22,24.9);
  doc.setFont("Poppins","bold");doc.setFontSize(8.5);doc.setTextColor(...gray);{const t="PAU FC · ACADÉMIE",cs=1.2;doc.text(t,CX-(doc.getTextWidth(t)+(t.length-1)*cs)/2,47.5,{charSpace:cs})}
  doc.setFontSize(23);doc.setTextColor(...navy);{const t="CARNET DE STAGE",cs=.6;doc.text(t,CX-(doc.getTextWidth(t)+(t.length-1)*cs)/2,57,{charSpace:cs})}
  doc.setFillColor(...yel);doc.rect(CX-15,60.2,30,1,"F");
  doc.setFont("Poppins","normal");doc.setFontSize(9.5);doc.setTextColor(...gray);doc.text(stageLine,CX,67,{align:"center"});
  // nom
  doc.setFont("Poppins","bold");doc.setTextColor(...ink);let ns=28;doc.setFontSize(ns);while(doc.getTextWidth(d.n)>W-10&&ns>16){ns-=1;doc.setFontSize(ns)}doc.text(d.n,CX,84,{align:"center"});
  doc.setFont("Poppins","italic");doc.setFontSize(10);doc.setTextColor(...gray);doc.text("a participé aux deux journées du stage et a travaillé :",CX,91.5,{align:"center"});
  // liste
  let y=101;doc.setFont("Poppins","normal");doc.setFontSize(10);doc.setTextColor(...ink);
  g.apprentissages.forEach(a=>{const lines=doc.splitTextToSize(a,W-9);doc.setFillColor(...yel);const s=1.4;doc.lines([[s,s],[-s,s],[-s,-s],[s,-s]],MX+2,y-2.9,[1,1],"F",true);doc.text(lines,MX+8,y);y+=5.6*lines.length+1.1});
  // titre section étoiles
  const h=(t,yy)=>{doc.setFont("Poppins","bold");doc.setFontSize(8.5);doc.setTextColor(...navy);const cs=1.2;const tw=doc.getTextWidth(t)+(t.length-1)*cs;doc.text(t,CX-tw/2,yy,{charSpace:cs});doc.setDrawColor(...yel);doc.setLineWidth(.4);doc.line(MX,yy-1.2,CX-tw/2-6,yy-1.2);doc.line(CX+tw/2+6,yy-1.2,MX+W,yy-1.2)};
  h("LES ÉTOILES DE L'ÉDUCATEUR",159.5);
  y=168.5;FACETS.forEach((f,i)=>{doc.setDrawColor(226,230,236);doc.setLineWidth(.25);if(i)doc.line(MX,y-7,MX+W,y-7);
    doc.setFont("Poppins","bold");doc.setFontSize(11);doc.setTextColor(...ink);doc.text(f.name,MX,y);
    doc.setFont("Poppins","normal");doc.setFontSize(7.5);doc.setTextColor(...gray);doc.text(doc.splitTextToSize(g.facets[f.id],W-48)[0],MX,y+4.3);
    const n=d.f[f.id]||0;for(let k=0;k<3;k++)pdfStar(doc,MX+W-24+k*10.5,y+.4,3.9,k<n);y+=12.5});
  doc.setFont("Poppins","normal");doc.setFontSize(7.3);doc.setTextColor(...gray);doc.text("1 étoile : à découvrir · 2 étoiles : en progrès · 3 étoiles : acquis pour son âge — on se compare à soi-même, jamais aux autres.",CX,231.5,{align:"center"});
  // mot
  h("LE MOT DE L'ÉDUCATEUR",240.5);
  doc.setFillColor(246,247,250);doc.setDrawColor(226,230,236);doc.setLineWidth(.3);doc.roundedRect(MX,244.5,W,25,2.5,2.5,"FD");
  if(d.m){doc.setFont("Poppins","italic");doc.setFontSize(11.5);doc.setTextColor(...ink);const lines=doc.splitTextToSize(`« ${d.m} »`,W-14).slice(0,3);doc.text(lines,MX+7,251.5)}
  else{doc.setDrawColor(200,204,212);doc.setLineWidth(.25);[252,258.5,265].forEach(o=>doc.line(MX+7,o,MX+W-7,o))}
  if(d.e){doc.setFont("Poppins","normal");doc.setFontSize(8);doc.setTextColor(...gray);doc.text(d.e,MX+W-6,267.3,{align:"right"})}
  // signatures
  doc.setDrawColor(...ink);doc.setLineWidth(.3);doc.line(MX,275,MX+62,275);doc.line(MX+W-62,275,MX+W,275);
  doc.setFont("Poppins","normal");doc.setFontSize(7.5);doc.setTextColor(...gray);doc.text("L'éducateur",MX,278.6);doc.text("Le responsable technique jeunes",MX+W,278.6,{align:"right"});
  // pied
  doc.setFontSize(6.8);doc.text(doc.splitTextToSize(next+" À bientôt au Pau FC !",W)[0],CX,283.2,{align:"center"})}
</script>
<script>
/* ===== Application Stages ===== */
const LS="paufc-stages-v1";let store={};try{store=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const get=(k,d)=>(k in store)?store[k]:d;const set=(k,v)=>{store[k]=v;save()};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date();today.setHours(0,0,0,0);const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmt=s=>{const d=D(s);return `${d.getDate()} ${MOIS[d.getMonth()]}`};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2200)}
const QS=new URLSearchParams(location.search);
let gid=GROUPS.some(g=>g.id===QS.get("g"))?QS.get("g"):get("g","u67");
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=t=>{try{return JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))))}catch(e){return null}};
const CARNET=QS.get("carnet")?b64d(QS.get("carnet")):null;
const grp=()=>GROUPS.find(g=>g.id===gid);
function nextVac(){return VACANCES.find(v=>today<=D(v[grp().days][1]))||VACANCES[VACANCES.length-1]}
let vac=get("vac",null);
store.evals=store.evals||{};store.kids=store.kids||{};store.queue=store.queue||[];
/* --- stockage des appréciations : clé STAGE-<vacances>-<groupe> --- */
const catKey=()=>`STAGE-${vac}-${gid}`;
const key=(c,p)=>`${c}|${p}`;
function rec(p){const c=catKey();return store.evals[key(c,p)]||(store.evals[key(c,p)]={f:{},note:"",by:"",ts:0})}
function kids(){return store.kids[catKey()]||[]}
function push(p){const r=rec(p);r.ts=Date.now();r.by=get("who","");save();
  store.queue.push({prog:1,cat:catKey(),player:p,per:1,f:r.f,t:{},note:r.note,by:r.by,ts:r.ts});save();flush()}
let flushing=false;
async function flush(){if(flushing||!store.queue.length){setStatus();return}flushing=true;setStatus("sync");
  while(store.queue.length){const p=store.queue[0];try{const r=await fetch(API,{method:"POST",body:JSON.stringify(p),headers:{"Content-Type":"text/plain;charset=utf-8"}});if(!r.ok)throw new Error(r.status);const j=await r.json().catch(()=>({}));if(j.error)throw new Error(j.error);store.queue.shift();save()}catch(e){flushing=false;setStatus("bad");return}}
  flushing=false;setStatus("ok")}
function setStatus(mode){const el=document.getElementById("syncStatus");if(!el)return;
  if(mode==="sync"){el.className="status";el.textContent="Envoi…"}else if(mode==="bad"||store.queue.length){el.className="status warn";el.textContent=`${store.queue.length} saisie(s) en attente d'envoi — réessai automatique`}else if(mode==="ok"){el.className="status ok";el.textContent="Partagé avec le RTJ"}else{el.className="status ok";el.textContent="À jour"}}
async function loadRemote(){const c=catKey();try{const r=await fetch(`${API}?prog=${encodeURIComponent(c)}`,{cache:"no-store"});const j=await r.json();if(!Array.isArray(j))return;let n=0;
  j.forEach(x=>{const k=key(c,x.player);const loc=store.evals[k];if(!loc||(x.ts||0)>(loc.ts||0)){store.evals[k]={f:x.f||{},note:x.note||"",by:x.by||"",ts:x.ts||0};n++}
    if(x.player&&!kids().includes(x.player)){store.kids[c]=store.kids[c]||[];store.kids[c].push(x.player);n++}});
  if(n){save();render()}}catch(e){}}
/* --- rendu --- */
function renderCats(){document.getElementById("catbar").innerHTML=GROUPS.map(g=>`<button class="cat" data-g="${g.id}" aria-pressed="${g.id===gid}">${g.name}<small>${g.dayNames.join(" & ")}</small></button>`).join("");
  document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{gid=b.dataset.g;set("g",gid);curS=get("s:"+gid,null);render();loadRemote()}))}
function vacbar(){const g=grp();return `<div class="perbar">${VACANCES.map(v=>{const d=v[g.days];return `<button class="perchip" data-v="${v.id}" aria-pressed="${v.id===vac}"><b>${esc(v.name)}</b><span>${g.dayNames[0]} ${fmt(d[0])}</span><small>${g.dayNames[1]} ${fmt(d[1])}</small></button>`}).join("")}</div>`}
function bindVac(root){root.querySelectorAll(".perchip").forEach(b=>b.addEventListener("click",()=>{vac=b.dataset.v;set("vac",vac);render();loadRemote()}))}
const st=()=>STAGE[gid];
const KIND_LABEL={accueil:"Accueil",eveil:"Éveil",atelier:"Atelier",defi:"Défi",match:"Match / jeu",calme:"Calme"};
const KIND_COLOR={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90"};
const LEGEND=`<div class="legend"><span><i style="background:#1E56C9"></i>équipe bleue</span><span><i style="background:#D64545"></i>équipe rouge</span><span><i style="background:#F2C200"></i>équipe jaune</span><span><i style="background:#8E44AD"></i>G = gardien</span><span><i style="background:#14213D"></i>E = éducateur</span><span>▲ coupelle / plot</span><span>○ ballon</span><span>— conduite</span><span>- - course sans ballon</span><span style="color:#B08A00">— passe</span><span style="color:#D64545">— tir</span></div>`;
let curS=QS.get("s")||get("s:"+gid,null);
const sessionOf=id=>st().sessions.find(x=>x.id===id);
function blocksOf(s){return s.blocks.map(b=>{const g=st().lib[b.g]||{name:b.g,kind:"atelier",dur:10,desc:""};return {...g,...Object.fromEntries(Object.entries(b).filter(([k,v])=>v!==undefined&&k!=="g")),dur:b.dur||g.dur}})}
const totalOf=s=>blocksOf(s).reduce((a,b)=>a+b.dur,0);
function collectMat(blocks){const set=new Set();blocks.forEach(b=>(b.mat||[]).forEach(m=>set.add(m)));return [...set]}
function slotTime(t){const [h,m]=t.split("h");return +h*60+(+m||0)}
const fmtTime=m=>`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`;
function planSlots(day){return st().plan[day].map(([t,x,d])=>{if(typeof x==="object"){const s=sessionOf(x.s);const tot=totalOf(s);return {t,s,end:fmtTime(slotTime(t)+tot),tot}}return {t,title:x,desc:d}})}
function sessionLink(s){return `${location.origin}${location.pathname}?g=${gid}&s=${s.id}`}
function waMessage(s){const g=grp();const vd=VACANCES.find(x=>x.id===vac);const d=vd[g.days][s.day-1];
  const lines=[`⚽ *Stage ${vd.name} · ${g.name}* — ${g.dayNames[s.day-1]} ${fmt(d)}`,`🎯 *${s.title}* (${totalOf(s)} min)`,"",`*Déroulé*`];
  blocksOf(s).forEach((b,i)=>lines.push(`${i+1}. ${b.dur}' *${b.name}*`));
  lines.push("",`👀 À veiller : ${s.veiller}`,"",`📎 *Fiche complète* (schémas, consignes, matériel) : ${sessionLink(s)}`);return lines.join("\n")}
function renderStage(){const v=document.getElementById("view-stage");const g=grp();const vd=VACANCES.find(x=>x.id===vac);const dates=vd[g.days];const S=st();
  v.innerHTML=`<div class="eyebrow">Stage ${esc(vd.name)} · ${esc(g.name)}</div><h2 style="margin-top:4px">${g.dayNames[0]} ${fmt(dates[0])} et ${g.dayNames[1]} ${fmt(dates[1])}</h2>${vacbar()}
  <div class="kpis"><div class="kpi"><b>2 jours</b><span>8h45 → 16h30 / 17h</span></div><div class="kpi"><b>${S.sessions.length} séances</b><span>de ${S.dur} min</span></div><div class="kpi"><b>${g.places}</b><span>places maxi · ${esc(g.ratio)}</span></div><div class="kpi"><b>${esc(g.ballon)}</b><span>ballon</span></div></div>
  <div class="grid2"><div class="card"><h3>Le stage en deux phrases</h3><p>${esc(g.resume)}</p></div>
  <div class="card"><h3>Ce que l'enfant va apprendre</h3><ul style="padding-left:18px;margin-top:6px">${g.apprentissages.map(a=>`<li style="margin:4px 0">${esc(a)}</li>`).join("")}</ul></div></div>
  <div class="card"><h3>Programme heure par heure</h3><p class="note">Collation et présentation du stage à 9h15 le premier jour, séances de ${S.dur} minutes (tournoi : 1 h), temps libre encadré avant le repas, goûter l'après-midi ; chaque séance se déplie dans l'onglet « Séances techniques » (cliquer sur son nom). Une seule règle pour les éducateurs : beaucoup de ballon, peu de parole, un bravo à chacun.</p>
  <div class="days">${[0,1].map(di=>`<div class="day"><h3>${g.dayNames[di]} ${fmt(dates[di])}</h3>${planSlots(di).map(sl=>sl.s?`<div class="slot sess" data-s="${sl.s.id}" role="button" tabindex="0"><span class="t">${sl.t}</span><div><b>${esc(sl.s.title)}</b><span class="note">${sl.t} → ${sl.end} · ${sl.tot} min · ${blocksOf(sl.s).filter(b=>!["accueil","calme"].includes(b.kind)).map(b=>esc(b.name)).join(" · ")}</span></div></div>`:`<div class="slot"><span class="t">${sl.t}</span><div><b>${esc(sl.title)}</b>${esc(sl.desc||"")}</div></div>`).join("")}</div>`).join("")}</div></div>
  <div class="callout"><b>À la fin du stage</b> : chaque famille repart avec les étoiles et le mot de l'éducateur (onglet « Appréciation »). Pas de compte rendu écrit individuel : deux minutes de face à face valent mieux.</div>`;
  bindVac(v);v.querySelectorAll(".slot.sess").forEach(el=>{const go=()=>{curS=el.dataset.s;set("s:"+gid,curS);renderSeances();document.querySelector('.tab[aria-controls="view-seances"]').click();window.scrollTo({top:0,behavior:"smooth"})};el.addEventListener("click",go);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}})})}
function renderSeances(){const v=document.getElementById("view-seances");const g=grp();const S=st();const vd=VACANCES.find(x=>x.id===vac);
  if(!curS||!sessionOf(curS))curS=S.sessions[0].id;const s=sessionOf(curS);const blocks=blocksOf(s);const total=blocks.reduce((a,b)=>a+b.dur,0);
  const list=[1,2].map(d=>`<div class="dayh">${g.dayNames[d-1]} ${fmt(vd[g.days][d-1])}</div>`+S.sessions.filter(x=>x.day===d).map((x,i)=>{const sl=[...planSlots(0),...planSlots(1)].find(p=>p.s&&p.s.id===x.id);return `<button class="sess-item" data-s="${x.id}" aria-current="${x.id===curS}"><span class="d"><b>${sl?sl.t:""}</b><span>J${d}</span></span><span><span class="ttl">${esc(x.title)}</span><br><span class="sub">${totalOf(x)} min · ${blocksOf(x).filter(b=>b.kind!=="accueil"&&b.kind!=="calme").length} jeux</span></span></button>`}).join("")).join("");
  const tl=blocks.map(b=>`<span style="width:${(b.dur/total*100).toFixed(1)}%;background:${KIND_COLOR[b.kind]}" title="${esc(b.name)}"></span>`).join("");
  const tlLeg=[...new Set(blocks.map(b=>b.kind))].map(k=>`<span><i style="background:${KIND_COLOR[k]}"></i>${KIND_LABEL[k]}</span>`).join("");
  let clock=(()=>{const sl=[...planSlots(0),...planSlots(1)].find(p=>p.s&&p.s.id===s.id);return sl?slotTime(sl.t):null})();
  const blocksHtml=blocks.map(b=>{const at=clock!==null?fmtTime(clock):"";if(clock!==null)clock+=b.dur;return `<article class="block">
     <div>${b.schema?`<div class="schema">${renderSchema(b.schema)}</div>`:`<div class="schema" style="display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:14px">${b.kind==="accueil"?"🤝 Cercle d'accueil":"🙌 Cercle de fin"}</div>`}</div>
     <div><div class="when"><span class="t">${b.dur}'</span><span class="kind k-${b.kind}">${KIND_LABEL[b.kind]}</span>${at?`<span class="note" style="font-size:12px">· ${at}</span>`:""}${b.src?`<span class="note" style="font-size:12px">· ${esc(b.src)}</span>`:""}</div>
       <h3>${esc(b.name)}</h3><p class="desc">${esc(b.desc||"")}</p></div>
       ${b.org||b.var||b.veiller?`<div class="more">${b.org||b.var?`<dl>${b.org?`<dt>Organisation</dt><dd>${esc(b.org)}</dd>`:""}${b.var?`<dt>Variantes</dt><dd>${esc(b.var)}</dd>`:""}</dl>`:""}${b.veiller?`<div class="veiller"><b>Veiller à</b> · ${esc(b.veiller)}</div>`:""}</div>`:""}</article>`}).join("");
  const mat=collectMat(blocks);const msg=waMessage(s);
  const sl=[...planSlots(0),...planSlots(1)].find(p=>p.s&&p.s.id===s.id);
  v.innerHTML=`<div class="eyebrow">${esc(g.name)} · séances techniques</div><h2 style="margin-top:4px">${S.sessions.length} séances types de ${S.dur} minutes (tournois : 1 h), prêtes à mener</h2><p class="note" style="margin-top:6px">Chaque séance : un éveil, deux ou trois jeux avec leurs schémas, un jeu ou un match pour finir. L'éducateur suit le déroulé, met en place, corrige. Une consigne à la fois.</p>
  <div class="sess-layout"><div class="sess-list">${list}</div>
  <div class="sheet"><div class="sheet-head"><div><div class="eyebrow">Jour ${s.day} · ${sl?`${sl.t} → ${sl.end}`:""} · Stage ${esc(vd.name)}</div><h2>${esc(s.title)}</h2><p class="theme">${esc(s.theme)}</p></div><div class="meta"><span class="pill">${total} min</span><span class="pill">${esc(g.name)}</span><span class="pill">${esc(g.ratio)}</span></div></div>
   <div class="objs"><div><h4>Objectifs de la séance</h4><ul>${s.objs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div><div><h4>Le regard de l'éducateur</h4><p>${esc(s.veiller)}</p></div><div><h4>Repères d'appréciation</h4><p class="note">${FACETS.map(f=>`<b>${esc(f.name)}</b> : ${esc(g.facets[f.id])}`).join(" · ")}</p></div></div>
   <div class="timeline">${tl}</div><div class="tl-legend">${tlLeg}</div>
   <div class="blocks"><div style="padding:6px 20px 0">${LEGEND}</div>${blocksHtml}</div>
   <div class="materiel"><span class="eyebrow" style="margin-right:6px">Matériel</span>${mat.map(m=>`<span class="mat">${esc(m)}</span>`).join("")}</div>
   <div class="sendbar"><h4>Envoyer la séance aux éducateurs</h4><div class="toolbar" style="margin-top:0"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Envoyer sur WhatsApp</a></div><p class="note" style="margin-top:8px">Le message contient le déroulé et le lien direct vers cette fiche (schémas, consignes, matériel).</p></div>
  </div></div>`;
  v.querySelectorAll(".sess-item").forEach(b=>b.addEventListener("click",()=>{curS=b.dataset.s;set("s:"+gid,curS);renderSeances();window.scrollTo({top:0,behavior:"smooth"})}));}
function stars(v,attrs){return `<span class="stars" ${attrs}>${[1,2,3].map(n=>`<button class="${(v||0)>=n?'on':''}" data-n="${n}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join("")}</span>`}
function renderAppr(){const v=document.getElementById("view-appr");const g=grp();const vd=VACANCES.find(x=>x.id===vac);const list=kids();
  const head=`<tr><th>Enfant</th>${FACETS.map(f=>`<th title="${esc(g.facets[f.id])}">${esc(f.name)}</th>`).join("")}<th>Le mot de l'éducateur</th><th></th></tr>`;
  const rows=list.map(p=>{const r=rec(p);return `<tr data-p="${esc(p)}"><td class="name">${esc(p)}</td>${FACETS.map(f=>`<td data-l="${esc(f.name)}">${stars(r.f[f.id],`data-f="${f.id}"`)}</td>`).join("")}<td data-l="Mot de l'éducateur"><input class="txt" type="text" data-note value="${esc(r.note)}" placeholder="un mot pour la famille" style="width:200px"></td><td data-l="Carnet"><button class="btn" data-carnet="${esc(p)}" title="Envoyer le carnet numérique aux parents" style="padding:5px 9px">📱 Carnet</button></td></tr>`}).join("");
  v.innerHTML=`<div class="eyebrow">Stage ${esc(vd.name)} · ${esc(g.name)}</div><h2 style="margin-top:4px">Appréciation : des étoiles et un mot</h2><p class="note" style="margin-top:6px">★ à découvrir · ★★ en progrès · ★★★ acquis pour son âge. Le mot est celui que l'on dira aux parents le ${g.dayNames[1]} à 16h. Tout est enregistré sur cet appareil et partagé avec le RTJ dès qu'il y a du réseau.</p>${vacbar()}
  <div class="facets">${FACETS.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(g.facets[f.id])}</span></div>`).join("")}</div>
  ${list.length?`<div class="tbl-wrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`:`<div class="callout">Aucun enfant pour l'instant : ajoutez les stagiaires du groupe ${esc(g.name)} ci-dessous (ou collez la liste, un nom par ligne).</div>`}
  <div class="toolbar" style="margin-top:14px"><div class="field"><label for="who">Éducateur</label><input id="who" type="text" value="${esc(get("who",""))}" placeholder="Prénom"></div><div class="field"><label for="kid">Ajouter un enfant</label><input id="kid" type="text" placeholder="NOM Prénom" style="min-width:220px"></div><button class="btn" id="addKid" style="align-self:end">+ Ajouter</button><span class="status" id="syncStatus"></span></div>
  <div class="toolbar" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><button class="btn primary" id="printFiches">🎓 Carnets de stage (aperçu, PDF, impression)</button><button class="btn" id="waBilan">Résumé WhatsApp pour le RTJ</button><button class="btn" id="delKid">Retirer un enfant…</button></div><p class="note">Le carnet de stage (une page A4 par enfant, à imprimer sur papier épais) reprend les apprentissages, les étoiles et le mot ; le carnet numérique 📱 s'envoie aux parents par WhatsApp avec le lien vers sa version en ligne.</p><p class="legend">${list.length} enfant(s) · vacances de ${esc(vd.name)} · groupe ${esc(g.name)}</p>`;
  bindVac(v);setStatus();
  v.querySelector("#who").addEventListener("change",e=>set("who",e.target.value.trim()));
  v.querySelector("#printFiches").addEventListener("click",printFiches);

  v.querySelectorAll("[data-carnet]").forEach(b=>b.addEventListener("click",()=>{const p=b.dataset.carnet;const r=rec(p);const tot=FACETS.reduce((a,f)=>a+(r.f[f.id]||0),0);
    const msg=[`⚽ *Stage ${vd.name} · Pau FC* — carnet de ${p}`,`${FACETS.map(f=>`${f.name} : ${"★".repeat(r.f[f.id]||0)||"—"}`).join(" · ")}`,r.note?`💬 « ${r.note} » — ${get("who","")||"l'éducateur"}`:"",``,`📖 Le carnet complet (apprentissages et étoiles) : ${carnetLink(p)}`].filter(x=>x!==undefined).join("\n");
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,"_blank")}));
  const add=()=>{const inp=v.querySelector("#kid");const names=inp.value.split(/\n|;|,/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;const c=catKey();store.kids[c]=store.kids[c]||[];names.forEach(n=>{if(!store.kids[c].includes(n))store.kids[c].push(n)});save();renderAppr();toast(`${names.length} enfant(s) ajouté(s)`)};
  v.querySelector("#addKid").addEventListener("click",add);v.querySelector("#kid").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
  v.querySelector("#kid").addEventListener("paste",e=>{const t=(e.clipboardData||window.clipboardData).getData("text");if(t.includes("\n")){e.preventDefault();e.target.value=t;add()}});
  v.querySelectorAll(".stars button").forEach(b=>b.addEventListener("click",()=>{const tr=b.closest("tr");const p=tr.dataset.p;const f=b.closest(".stars").dataset.f;const n=+b.dataset.n;const r=rec(p);r.f[f]=(r.f[f]===n)?0:n;push(p);b.closest(".stars").querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=r.f[f]))}));
  v.querySelectorAll("input[data-note]").forEach(i=>i.addEventListener("change",()=>{const p=i.closest("tr").dataset.p;rec(p).note=i.value.trim();push(p)}));
  v.querySelector("#delKid").addEventListener("click",()=>{const n=prompt("Nom exact de l'enfant à retirer de la liste :");if(!n)return;const c=catKey();store.kids[c]=(store.kids[c]||[]).filter(x=>x!==n);save();renderAppr()});
  v.querySelector("#waBilan").addEventListener("click",()=>{const lines=[`*Stage ${vd.name} · ${g.name}* — bilan appréciation`,`${list.length} enfants · éducateur : ${get("who","")||"—"}`,""];
    list.forEach(p=>{const r=rec(p);const tot=FACETS.reduce((s,f)=>s+(r.f[f.id]||0),0);lines.push(`- ${p} : ${"★".repeat(Math.round(tot/FACETS.length))||"—"}${r.note?` — ${r.note}`:""}`)});
    lines.push("",`📎 ${location.origin}${location.pathname}?g=${gid}`);window.open(`https://wa.me/?text=${encodeURIComponent(lines.join("\n"))}`,"_blank")})}
function carnetData(p){const g=grp();const vd=VACANCES.find(x=>x.id===vac);const r=rec(p);return {n:p,g:gid,v:vac,f:r.f,m:r.note,e:r.by||get("who","")}}
function carnetLink(p){return `${location.origin}${location.pathname}?carnet=${b64e(carnetData(p))}`}
function printFiches(){const list=kids();if(!list.length){toast("Aucun enfant dans la liste");return}
  const g=grp();const vd=VACANCES.find(x=>x.id===vac);
  document.querySelector("header.top").hidden=true;const m=document.querySelector("main");
  m.innerHTML=`<div class="printbar"><button class="btn" id="backFiches">← Retour à l'appréciation</button><span class="note">${list.length} carnet(s) · Stage ${esc(vd.name)} · ${esc(g.name)} · une page A4 par enfant, à imprimer sur papier épais</span><span><button class="btn primary" id="doPdf">📄 Télécharger le PDF</button> <button class="btn" id="doPrint">🖨️ Imprimer</button></span></div><div class="dips">${list.map(p=>`<div class="dipwrap">${ficheHtml(carnetData(p))}</div>`).join("")}</div>`;
  m.querySelector("#backFiches").addEventListener("click",()=>{document.querySelector("header.top").hidden=false;m.innerHTML=`<section class="view" id="view-stage" role="tabpanel"></section><section class="view" id="view-seances" role="tabpanel"></section><section class="view active" id="view-appr" role="tabpanel"></section>`;render();document.querySelector('.tab[aria-controls="view-appr"]').click()});
  m.querySelector("#doPrint").addEventListener("click",()=>{try{window.print()}catch(e){toast("Utilise le menu Imprimer du navigateur")}});m.querySelector("#doPdf").addEventListener("click",pdfFiches);
  fitDips();window.scrollTo(0,0)}
function fitDips(){document.querySelectorAll(".dipwrap").forEach(w=>{const avail=w.parentElement.clientWidth;const sc=Math.min(1,avail/w.firstElementChild.offsetWidth);w.style.transform=`scale(${sc})`;w.style.height=(w.firstElementChild.offsetHeight*sc)+"px"})}
window.addEventListener("resize",()=>fitDips());
/* ---- PDF des fiches (jsPDF) ---- */
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res();const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res();sc.onerror=()=>rej(new Error("jspdf"));document.head.appendChild(sc)})}
async function pdfFiches(){const list=kids();if(!list.length){toast("Aucun enfant dans la liste");return}
  toast("Préparation du PDF…");try{await loadJsPDF()}catch(e){toast("Impossible de charger le module PDF (réseau)");return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
  list.forEach((p,i)=>{if(i>0)doc.addPage();pdfFiche(doc,carnetData(p))});
  const g=grp();const vd=VACANCES.find(x=>x.id===vac);const fname=`fiches-${vd.id}-${g.id}.pdf`;
  const blob=doc.output("blob");
  let dl=null;try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads")}catch(e){dl=null}
  if(dl){try{await dl.save({filename:fname,data:blob});toast("PDF enregistré")}catch(e){if(e&&e.code==="declined")toast("Enregistrement annulé");else toast("Utilise la barre d'outils du lecteur PDF ci-dessous")}}
  else{try{doc.save(fname);toast("PDF téléchargé")}catch(e){}}}
function renderCarnet(){document.querySelector("header.top").hidden=true;const m=document.querySelector("main");m.innerHTML=`<div class="dips"><div class="dipwrap">${ficheHtml(CARNET)}</div></div>`;document.title=`Carnet de ${CARNET.n} · Pau FC`;fitDips()}
function render(){if(!vac||!VACANCES.some(v=>v.id===vac))vac=nextVac().id;renderCats();renderStage();renderSeances();renderAppr()}
/* onglets */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===t.getAttribute("aria-controls")));set("tab",t.getAttribute("aria-controls"))}));
const savedTab=QS.get("s")?"view-seances":get("tab",null);if(savedTab&&document.getElementById(savedTab)){document.querySelector(`.tab[aria-controls="${savedTab}"]`).click()}
if(CARNET&&CARNET.n){renderCarnet()}else{render();loadRemote();window.addEventListener("online",flush)}
/* Aide au défilement pour les tableaux plus larges que l'écran : ombre sur le bord droit,
   barre de défilement toujours visible et une courte mention sous le tableau. */
function addScrollArrows(){document.querySelectorAll('.tbl-wrap,.sess-list').forEach(el=>{
  const over=el.scrollWidth>el.clientWidth+4;
  let bar=el.nextElementSibling;if(!(bar&&bar.classList.contains('scrollhint')))bar=null;
  el.classList.toggle('has-more',over);
  if(!over){if(bar)bar.hidden=true;return}
  if(!bar){bar=document.createElement('div');bar.className='scrollhint';bar.innerHTML='<span aria-hidden="true">↔</span> Tableau plus large que l’écran : faites-le glisser vers la gauche pour voir toutes les colonnes.';el.parentNode.insertBefore(bar,el.nextSibling);
    const upd=()=>el.classList.toggle('at-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4);el.addEventListener('scroll',upd,{passive:true});upd()}
  bar.hidden=false})}
const _sh=new MutationObserver(()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});_sh.observe(document.querySelector('main'),{childList:true,subtree:true});window.addEventListener('resize',()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});setTimeout(addScrollArrows,300);


</script>
</body></html>

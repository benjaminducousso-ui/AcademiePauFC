<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<meta charset="utf-8">
<title>Stages Pau FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{--navy:#0B2A4A;--navy-2:#123B66;--yellow:#F2C200;--yellow-ink:#7A5E00;--bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#E9EEF6;--line:#D5DDE8;--ink:#14213D;--muted:#5B6B82;--faint:#8A97AB;--ok:#2E8B57;--warn:#C77700;--bad:#D64545;--shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);--r:10px;--display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy-2:#173F6B;--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200}}
:root[data-theme="dark"]{--navy-2:#173F6B;--bg:#0E1726;--surface:#162236;--surface-2:#1D2C45;--line:#2B3C57;--ink:#E8EDF5;--muted:#A5B2C6;--faint:#7C8AA1;--yellow-ink:#F2C200}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}h1{font-size:clamp(30px,5vw,44px);font-weight:800;text-transform:uppercase}h2{font-size:clamp(22px,3vw,30px);font-weight:700;text-transform:uppercase}h3{font-size:21px;font-weight:700}h4{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}button{font-family:inherit;font-size:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.top{background:var(--navy);color:#fff;padding-block:18px 14px}.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.crest{width:76px;height:76px;flex:none;border-radius:50%;background:#fff;padding:2px;box-sizing:border-box}.brand .eyebrow{color:var(--yellow)}.brand p{color:#C9D6E8;max-width:66ch;margin-top:4px}
.catbar{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 4px}
.cat{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:18px;font-weight:700}
.cat[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.cat small{display:block;font-family:var(--body);font-size:11px;font-weight:600;opacity:.8;letter-spacing:0}
main{padding-block:20px 60px}
.perbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:14px 0 6px}
.perchip{flex:none;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:150px;text-align:left}
.perchip b{font-family:var(--display);font-size:18px;line-height:1}.perchip span{font-size:13px;font-weight:600}.perchip small{font-size:11px;color:var(--muted)}
.perchip[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:16px}
.card h3{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}@media (max-width:900px){.periods{grid-template-columns:repeat(2,1fr)}}@media (max-width:520px){.periods{grid-template-columns:1fr}}
.period{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14px}.period b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.period small{color:var(--muted)}.period ul{margin:6px 0 0;padding-left:16px}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.facet{background:var(--surface-2);border-radius:8px;padding:10px}.facet b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}.facet span{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.callout{border-left:4px solid var(--yellow);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px;font-size:15px}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.name{font-weight:600;white-space:normal;min-width:140px}
.tbl-wrap th:first-child,.tbl-wrap td.name{position:sticky;left:0;background:var(--bg);z-index:1}
.stars{display:inline-flex;gap:0}.stars button{background:none;border:0;padding:1px 2px;font-size:20px;line-height:1;color:var(--line)}.stars button.on{color:var(--yellow)}
input.num{width:64px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;background:var(--surface);color:var(--ink);text-align:right}
input.txt{width:150px;border:1px solid transparent;border-radius:6px;padding:5px 6px;font:inherit;background:transparent;color:var(--ink)}input.txt:hover,input.txt:focus{border-color:var(--line);background:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.status{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}.status.ok{background:#DCF5E6;color:#1B5E36}.status.warn{background:#FFF3BF;color:#7A5E00}.status.bad{background:#FBE0E0;color:#8A1F1F}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-weight:600;font-size:13px}.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.trend{font-family:var(--display);font-size:15px;letter-spacing:.04em}.trend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;background:var(--line);vertical-align:middle}.trend i.l1{background:#F2C200;opacity:.45}.trend i.l2{background:#F2C200;opacity:.75}.trend i.l3{background:#F2C200}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}.tab{white-space:nowrap;background:transparent;color:#C9D6E8;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-family:var(--display);font-size:17px;text-transform:uppercase;font-weight:700}.tab[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none}.view.active{display:block}
.legend{font-size:13px;color:var(--muted);margin-top:8px}

.tbl-wrap{position:relative;scrollbar-width:thin;scrollbar-color:#B9C4D6 transparent;padding-bottom:2px}.tbl-wrap::-webkit-scrollbar{height:10px;-webkit-appearance:none}.tbl-wrap::-webkit-scrollbar-track{background:var(--surface-2);border-radius:6px}.tbl-wrap::-webkit-scrollbar-thumb{background:#8F9FB8;border-radius:6px}
.tbl-wrap.has-more:not(.at-end){-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.scrollhint{font-size:13px;color:var(--muted);margin:6px 0 2px}.scrollhint span{display:inline-block;font-weight:700;margin-right:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}

/* ---------- UX : création en tête de liste, crayons de zone, glisser-déposer ---------- */
.block{position:relative}
.bedit{position:absolute;top:12px;right:14px;width:34px;height:34px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;line-height:1;opacity:.5;transition:opacity .15s,border-color .15s,transform .15s;z-index:2}
.block:hover .bedit,.bedit:focus-visible{opacity:1;border-color:var(--navy-2);transform:scale(1.06)}
@media (hover:none){.bedit{opacity:.85}}
.zedit{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;line-height:1;margin-left:10px;vertical-align:middle;opacity:.6;transition:opacity .15s,border-color .15s}
.zedit:hover,.zedit:focus-visible{opacity:1;border-color:var(--navy-2)}
.sheet-head .zedit{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
@media (hover:none){.zedit{opacity:.9}}
.edrow .grip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:transparent;border:0;padding:0;color:var(--muted);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.edrow .grip:active{cursor:grabbing}
.edrow .grip .dots{font-size:13px;line-height:1}
.edrow .grip .num{font-family:var(--display);font-size:17px;font-weight:800;color:var(--navy-2);line-height:1}
.edrow.dragging{box-shadow:0 10px 24px rgba(11,42,74,.28);border-color:var(--navy-2);opacity:.96}
.edblocks.is-dragging{cursor:grabbing}
.edrow.flash{animation:edflash 1.4s ease-out}
@keyframes edflash{0%,45%{box-shadow:inset 0 0 0 2px var(--yellow)}100%{box-shadow:none}}
.edrow .kind{white-space:nowrap}
.bedit svg,.zedit svg{display:block}
.bedit{color:var(--muted)}.zedit{color:var(--muted)}
.sheet-head .zedit{color:#fff}
.block:hover .bedit,.bedit:focus-visible,.zedit:hover,.zedit:focus-visible{color:var(--navy-2)}
.sheet-head .zedit:hover,.sheet-head .zedit:focus-visible{color:#fff;border-color:#fff}
.edrow .grip .dots{display:block;opacity:.75}

.edrow{grid-template-columns:34px minmax(150px,1fr) max-content max-content max-content}
.edrow .kind{min-width:max-content;overflow:visible}
@media (max-width:700px){.edrow{grid-template-columns:34px 1fr max-content}}
.edrow .kind{padding:3px 10px 3px 9px}

.rotband{display:block;margin:10px 20px 0;padding:8px 12px;border-left:4px solid var(--yellow);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.rotband b{color:var(--yellow-ink)}
.block.in-rot{border-left:4px solid var(--yellow)}
.chip.rot{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.edrow.is-rot{border-left:4px solid var(--yellow)}
.rotbtn[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#3B2E00;font-weight:700}
.rotwarn{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border-left:4px solid var(--yellow);background:var(--surface);border-radius:0 8px 8px 0;font-size:13.5px}
@media (hover:none){.zedit{width:34px;height:34px}.bedit{width:38px;height:38px}}
.zedit{width:30px;height:30px}

/* ---------- ligne d'atelier de l'éditeur (refonte) ---------- */
.edrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;grid-template-columns:none}
.edrow .grip{flex:0 0 auto}
.edname{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.edname b{font-size:15.5px;font-weight:700;line-height:1.25}
.edname .kind{flex:none;color:#fff}
.edtools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.edtools .dur input{width:58px}
.edname select{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--surface);color:var(--ink)}
.edtools .del{color:#8A1F1F;border-color:#E3C9C9}
.edtools .del:hover{background:#8A1F1F;color:#fff;border-color:#8A1F1F}
.edrow .txt[aria-expanded="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.edrow .edtxt,.edrow .picker{flex:1 1 100%}
@media (max-width:620px){.edtools{margin-left:0;width:100%}.edname{flex:1 1 100%}}

/* lien de rotation entre deux ateliers */
.rotlink{display:flex;justify-content:center;margin:-3px 0;position:relative;z-index:1}
.rotlink button{font-size:12px;font-weight:700;border:1px dashed var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer;line-height:1.2}
.rotlink button:hover,.rotlink button:focus-visible{border-color:var(--navy-2);color:var(--navy-2)}
.rotlink.on button{border-style:solid;background:var(--yellow);border-color:var(--yellow);color:#3B2E00}
.edblocks.is-dragging .rotlink{visibility:hidden}
.edblocks{gap:4px}

/* menu « autres actions » du bandeau de séance */
.moremenu{position:relative}
.moremenu summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:42px;font-size:18px;line-height:1}
.moremenu summary::-webkit-details-marker{display:none}
.moremenu[open] summary{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.menupop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;display:flex;flex-direction:column;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(11,42,74,.22);overflow:hidden}
.menupop button{text-align:left;padding:10px 14px;font:inherit;font-size:14.5px;font-weight:600;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.menupop button:last-child{border-bottom:0}
.menupop button:hover{background:var(--surface-2)}
.menupop button.danger{color:#8A1F1F}
.menupop button.danger.armed{background:#8A1F1F;color:#fff}
</style>
<style>
.days{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}@media (max-width:760px){.days{grid-template-columns:1fr}}
.day{background:var(--surface-2);border-radius:10px;padding:12px 14px}.day h3{font-size:20px;text-transform:uppercase;margin-bottom:6px}
.slot{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}.slot:first-of-type{border-top:0}
.slot .t{font-family:var(--display);font-weight:800;font-size:16px;color:var(--navy-2)}:root[data-theme="dark"] .slot .t{color:var(--yellow)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slot .t{color:var(--yellow)}}
.slot b{display:block}
.ateliers{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:10px}
.atelier{background:var(--surface-2);border-radius:10px;padding:12px}.atelier h3{font-size:19px;margin-bottom:6px}.atelier .kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy-2);border-radius:4px;padding:2px 7px;display:inline-block;margin-bottom:6px}
.atelier p{font-size:14.5px}.atelier .veiller{margin-top:8px;font-size:13.5px;background:var(--surface);border-radius:8px;padding:8px 10px}.atelier .veiller b{color:var(--yellow-ink)}
.schema{background:var(--surface);border-radius:8px;padding:6px;margin:8px 0}.schema svg{display:block;width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.kpi{background:var(--surface-2);border-radius:8px;padding:10px}.kpi b{display:block;font-family:var(--display);font-size:22px;line-height:1}.kpi span{font-size:13px;color:var(--muted)}

.sess-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;margin-top:12px}@media (max-width:900px){.sess-layout{grid-template-columns:1fr}}
.sess-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}@media (max-width:900px){.sess-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sess-list .dayh{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted);margin:8px 0 2px}@media (max-width:900px){.sess-list .dayh{display:none}}
.sess-item{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--ink);min-width:0}@media (max-width:900px){.sess-item{min-width:230px}}
.sess-item:hover{border-color:var(--navy-2)}.sess-item[aria-current="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.sess-item .d{font-family:var(--display);line-height:1;text-align:center}.sess-item .d b{display:block;font-size:20px}.sess-item .d span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess-item .ttl{font-weight:600;font-size:15px;line-height:1.2}.sess-item .sub{font-size:12px;color:var(--muted)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{background:var(--navy);color:#fff;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.sheet-head .eyebrow{color:var(--yellow)}.sheet-head h2{color:#fff;margin-top:4px}.sheet-head .theme{color:#C9D6E8;margin-top:6px;max-width:60ch}.sheet-head .meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:13px;color:#fff}
.objs{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.objs h4{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.objs ul{margin:0;padding-left:18px}
.timeline{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:14px 20px 0;background:var(--surface-2)}.timeline span{display:block}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 20px 0;font-size:12px;color:var(--muted)}.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.blocks{display:flex;flex-direction:column;padding:8px 0 4px}
.block{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:18px 20px;border-top:1px solid var(--line)}@media (max-width:760px){.block{grid-template-columns:1fr}}
.block .when{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}.block .when .t{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;color:var(--navy-2)}
:root[data-theme="dark"] .block .when .t{color:var(--yellow)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .block .when .t{color:var(--yellow)}}
.block .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:3px 8px;border-radius:4px;color:#fff}
.k-accueil{background:#6B7A90}.k-eveil{background:#C77700}.k-atelier{background:#1E56C9}.k-defi{background:#8E44AD}.k-match{background:#2E8B57}.k-calme{background:#6B7A90}
.block h3{font-size:22px;margin-bottom:6px}.block .desc{margin-bottom:8px;font-size:15px}
.block dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}.block dt{color:var(--muted);font-weight:600}.block dd{margin:0}
.block .veiller{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}.block .veiller b{color:var(--yellow-ink)}
.block .more{grid-column:1/-1;margin-top:-6px}.block .more dl{margin-top:0}.block .schema{margin:0}
.materiel{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}.materiel .mat{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:14px}
.meta .toggle{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.meta .toggle[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}.chip.mod{background:#E8EEFF;color:var(--navy);vertical-align:middle;margin-left:4px}
.actionbox{margin:12px 20px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}.actionbox .note{font-size:13px}
.acrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.acrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}.acrow input,.acrow select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-weight:400;background:var(--surface);color:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--navy-2)}.btn.small{padding:7px 10px;font-size:14px}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.editor{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}.editor .edhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:8px}
.editor .edgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}@media (max-width:700px){.editor .edgrid{grid-template-columns:1fr}.editor .edgrid .field{grid-column:auto!important}}
.editor .field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.edblocks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.edrow{display:grid;grid-template-columns:28px minmax(180px,1fr) auto auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (max-width:700px){.edrow{grid-template-columns:28px 1fr auto}.edrow .kind{display:none}.edrow .mv{grid-column:1/-1;justify-self:end}}
.edrow .n{font-family:var(--display);font-size:18px;font-weight:800;color:var(--navy-2);text-align:center}
.edrow select{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--surface);color:var(--ink)}
.edrow .dur{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}.edrow .dur input{width:64px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;background:var(--surface);color:var(--ink);text-align:right}
.edrow .mv{display:inline-flex;gap:4px}.edrow .txt{grid-column:1/-1;justify-self:start}.edrow .txt[aria-expanded="true"]{background:var(--navy);color:#fff}
.edtxt{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:8px 0 2px;border-top:1px dashed var(--line)}.edtxt label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.edtxt input,.edtxt textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-weight:400;background:var(--surface);color:var(--ink);resize:vertical}.edtxt .note{margin:0;font-size:13px}
.sendbar{background:var(--surface-2);padding:16px 20px;border-top:1px solid var(--line)}.sendbar h4{margin-bottom:10px}
.wa{background:#25D366;color:#0B3D22;border-color:#25D366}
.legend span{margin-right:10px;white-space:nowrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.slot.sess{cursor:pointer;border-radius:6px}.slot.sess:hover{background:var(--surface)}.slot.sess b{color:var(--navy-2)}.slot.sess b::after{content:" →";opacity:.6}
:root[data-theme="dark"] .slot.sess b{color:var(--yellow)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slot.sess b{color:var(--yellow)}}


.dips{display:flex;flex-direction:column;gap:18px;align-items:center;margin-top:14px}
.dipwrap{transform-origin:top left;width:210mm;align-self:flex-start}
.dip{position:relative;width:210mm;height:297mm;background:#fff;color:#1E2430;font-family:Poppins,"Source Sans 3",Arial,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.14);overflow:hidden}

.dip .dip-crest{position:absolute;left:93mm;top:16mm;width:24mm}
.dip .dip-club{position:absolute;left:0;right:0;top:44.5mm;text-align:center;font-weight:700;font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;color:#6E7887}
.dip .dip-title{position:absolute;left:0;right:0;top:49.5mm;text-align:center;font-weight:700;font-size:23pt;letter-spacing:.03em;text-transform:uppercase;color:#0B2A4A;line-height:1}
.dip .dip-rule{position:absolute;left:90mm;top:60.2mm;width:30mm;height:1mm;background:#F2C200}
.dip .dip-stage{position:absolute;left:0;right:0;top:63.5mm;text-align:center;font-size:9.5pt;color:#6E7887}
.dip .dip-name{position:absolute;left:15mm;right:15mm;top:74mm;text-align:center;font-weight:700;font-size:28pt;line-height:1.1;color:#1E2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dip .dip-sub{position:absolute;left:0;right:0;top:88mm;text-align:center;font-style:italic;font-size:10pt;color:#6E7887}
.dip .dip-list{position:absolute;left:20mm;right:20mm;top:96.5mm;margin:0;padding:0;list-style:none}
.dip .dip-list li{position:relative;padding-left:8mm;font-size:10pt;line-height:5.6mm;margin-bottom:1.1mm}
.dip .dip-list li::before{content:"";position:absolute;left:1mm;top:1.9mm;width:2mm;height:2mm;background:#F2C200;transform:rotate(45deg)}
.dip .dip-h{position:absolute;left:20mm;right:20mm;text-align:center;font-weight:700;font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;color:#0B2A4A;display:flex;align-items:center;gap:6mm}
.dip .dip-h::before,.dip .dip-h::after{content:"";flex:1;height:.4mm;background:#F2C200}
.dip .dip-rows{position:absolute;left:20mm;right:20mm;top:161.5mm}
.dip .dip-row{display:flex;justify-content:space-between;align-items:center;height:12.5mm;border-top:.25mm solid #E2E6EC}.dip .dip-row:first-child{border-top:0}
.dip .dip-row b{display:block;font-size:11pt;line-height:1.15}.dip .dip-row small{display:block;font-size:7.5pt;color:#6E7887;margin-top:.6mm}
.dip .dip-stars{display:flex;gap:2.7mm;flex:none}.dip .dip-stars svg{width:7.8mm;height:7.8mm;fill:#fff;stroke:#C8C8C8;stroke-width:.8}.dip .dip-stars svg.on{fill:#F2C200;stroke:#C9A000}
.dip .dip-legend{position:absolute;left:0;right:0;top:229mm;text-align:center;font-size:7.3pt;color:#6E7887}
.dip .dip-mot{position:absolute;left:20mm;right:20mm;top:244.5mm;height:25mm;background:#F6F7FA;border:.3mm solid #E2E6EC;border-radius:2.5mm;padding:4mm 7mm}
.dip .dip-mot p{margin:0;font-style:italic;font-size:11.5pt;line-height:1.35;max-height:17mm;overflow:hidden}
.dip .dip-lines{display:flex;flex-direction:column;gap:5.5mm;padding-top:3mm}.dip .dip-lines span{display:block;border-bottom:.25mm solid #C8CCD4}
.dip .dip-sign{position:absolute;right:6mm;bottom:1.5mm;font-size:8pt;color:#6E7887}
.dip .dip-sig{position:absolute;top:275mm;width:62mm;font-size:7.5pt;color:#6E7887;padding-top:1.2mm}.dip .dip-sig span{position:absolute;left:0;right:0;top:0;border-top:.3mm solid #1E2430}.dip .dip-sig.l{left:20mm}.dip .dip-sig.r{right:20mm;text-align:right}
.dip .dip-foot{position:absolute;left:20mm;right:20mm;top:281mm;text-align:center;font-size:6.8pt;color:#6E7887;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.printbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
@media print{header.top,.printbar,.toast{display:none!important}main{padding:0}.dips{display:block;margin:0;gap:0}.dipwrap{transform:none!important;height:auto!important;width:210mm}.dip{box-shadow:none;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}.dipwrap:last-child .dip{break-after:auto;page-break-after:auto}@page{size:A4 portrait;margin:0}}

<script>
/* ---------- Schéma SVG ---------- */
let svgId=0;
function renderSchema(sc){
  if(!sc) return "";
  const [L,W]=sc.f; const S=10, pad=2.6;
  const X=x=>((x+pad)*S).toFixed(1), Y=y=>((y+pad)*S).toFixed(1), M=m=>(m*S).toFixed(1);
  const vw=(L+2*pad)*S, vh=(W+2*pad)*S; const id="sv"+(++svgId);
  let o=`<svg viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="Schéma de l'atelier" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs>`;
  [["c","#FFFFFF"],["m","#FFFFFF"],["p","#F2C200"],["s","#FF5A5A"]].forEach(([k,c])=>{o+=`<marker id="${id}${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`});
  o+=`</defs>`;
  o+=`<rect x="0" y="0" width="${vw}" height="${vh}" rx="8" fill="#2F6B43"/>`;
  // pelouse rayée
  const bands=Math.max(4,Math.round(L/4));
  for(let i=0;i<bands;i++){const bx=i*L/bands;o+=`<rect x="${X(bx)}" y="${Y(0)}" width="${M(L/bands)}" height="${M(W)}" fill="${i%2?'#4A9C63':'#3E8E57'}"/>`}
  o+=`<rect x="${X(0)}" y="${Y(0)}" width="${M(L)}" height="${M(W)}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/>`;
  (sc.zones||[]).forEach(z=>{o+=`<rect x="${X(z.x)}" y="${Y(z.y)}" width="${M(z.w)}" height="${M(z.h)}" fill="${z.f||'#fff'}" fill-opacity=".32" stroke="${z.f||'#fff'}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    if(z.t) o+=`<text x="${X(z.x+z.w/2)}" y="${Y(z.y+z.h/2)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.45)" stroke-width="2.5" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(z.t)}</text>`});
  (sc.goals||[]).forEach(g=>{const s=g.s||3;
    if(g.o==="v"){const gx=g.x<=0?g.x-0.9:g.x; o+=`<rect x="${X(gx)}" y="${Y(g.y-s/2)}" width="${M(0.9)}" height="${M(s)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}
    else{const gy=g.y<=0?g.y-0.9:g.y; o+=`<rect x="${X(g.x-s/2)}" y="${Y(gy)}" width="${M(s)}" height="${M(0.9)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}});
  (sc.hoops||[]).forEach(h=>{o+=`<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${M(1.3)}" fill="none" stroke="#fff" stroke-width="1.8"/>`});
  (sc.arrows||[]).forEach(a=>{const pts=a.p;let d=`M${X(pts[0].x??pts[0][0])} ${Y(pts[0].y??pts[0][1])}`;
    if(pts.length===2){d+=` L${X(pts[1][0])} ${Y(pts[1][1])}`}
    else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${X(pts[i][0])} ${Y(pts[i][1])} ${X(mx)} ${Y(my)}`}const l=pts[pts.length-1];d+=` T${X(l[0])} ${Y(l[1])}`}
    const st={c:'stroke="#fff" stroke-width="2.2"',m:'stroke="#fff" stroke-width="1.8" stroke-dasharray="5 4"',p:'stroke="#F2C200" stroke-width="2"',s:'stroke="#FF5A5A" stroke-width="2.8"'}[a.k||"c"];
    o+=`<path d="${d}" fill="none" ${st} stroke-linecap="round" stroke-linejoin="round" marker-end="url(#${id}${a.k||"c"})"/>`});
  (sc.cups||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-3.6).toFixed(1)} l4.2 6.8 h-8.4z" fill="#FFB020" stroke="#7A4B00" stroke-width=".7"/>`});
  (sc.cones||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-6.5).toFixed(1)} l5.2 10.5 h-10.4z" fill="#FF7A1A" stroke="#7A2E00" stroke-width=".8"/><rect x="${(+X(c.x)-6).toFixed(1)}" y="${(+Y(c.y)+3.2).toFixed(1)}" width="12" height="2" fill="#7A2E00"/>`});
  (sc.players||[]).forEach(p=>{const col={b:"#1E56C9",r:"#D64545",y:"#F2C200",g:"#8E44AD",e:"#14213D"}[p.c]||"#1E56C9";const tx=p.c==="y"?"#3B2E00":"#fff";
    o+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${M(0.95)}" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
    const lab=p.l||(p.c==="e"?"E":"");if(lab)o+=`<text x="${X(p.x)}" y="${Y(p.y)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="800" fill="${tx}" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(lab)}</text>`});
  (sc.balls||[]).forEach(b=>{o+=`<circle cx="${X(b.x)}" cy="${Y(b.y)}" r="${M(0.5)}" fill="#fff" stroke="#14213D" stroke-width="1.3"/><circle cx="${X(b.x)}" cy="${Y(b.y)}" r="${M(0.2)}" fill="#14213D"/>`});

  o+=`</svg>`;return o;

<script>
/* ===== Carnet de stage (diplôme) — même mise en page en HTML et en PDF ===== */
const DIP={frame:8,inner:10.5,mx:20};
function dipData(d){const g=GROUPS.find(x=>x.id===d.g)||grp();const vd=VACANCES.find(x=>x.id===d.v)||VACANCES[0];const dates=vd[g.days];
  const y1=D(dates[0]).getFullYear();
  return {g,vd,dates,first:d.n.split(" ").pop(),
    stageLine:`Stage ${vd.name==="Hiver"?"d'hiver":vd.name==="Printemps"?"de printemps":"de la Toussaint"} · ${g.name} · ${g.dayNames[0].toLowerCase()} ${fmt(dates[0])} et ${g.dayNames[1].toLowerCase()} ${fmt(dates[1])} ${y1}`,
    next:`Prochains stages : ${VACANCES.filter(x=>x.id!==d.v).map(x=>`${x.name} (${fmt(x[g.days][0])} - ${fmt(x[g.days][1])})`).join(" · ")}.`}}
/* ---- HTML ---- */
function starsHtml(n){return [1,2,3].map(i=>`<svg viewBox="0 0 20 20" class="${i<=(n||0)?'on':''}"><polygon points="10,1.5 12.6,7.2 18.8,7.8 14.1,12 15.5,18.2 10,15 4.5,18.2 5.9,12 1.2,7.8 7.4,7.2"/></svg>`).join("")}
function ficheHtml(d){const {g,vd,first,stageLine,next}=dipData(d);
  return `<div class="dip"><div class="dip-frame"></div><div class="dip-inner"></div>
  <img class="dip-crest" src="${CREST_PNG}" alt="">
  <div class="dip-club">Pau FC · Académie</div>
  <div class="dip-title">Carnet de stage</div><div class="dip-rule"></div>
  <div class="dip-stage">${esc(stageLine)}</div>
  <div class="dip-name">${esc(d.n)}</div>
  <div class="dip-sub">a participé aux deux journées du stage et a travaillé :</div>
  <ul class="dip-list">${g.apprentissages.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
  <div class="dip-h" style="top:157mm">Les étoiles de l'éducateur</div>
  <div class="dip-rows">${FACETS.map(f=>`<div class="dip-row"><div><b>${esc(f.name)}</b><small>${esc(g.facets[f.id])}</small></div><div class="dip-stars">${starsHtml(d.f[f.id])}</div></div>`).join("")}</div>
  <div class="dip-legend">1 étoile : à découvrir · 2 étoiles : en progrès · 3 étoiles : acquis pour son âge — on se compare à soi-même, jamais aux autres.</div>
  <div class="dip-h" style="top:238mm">Le mot de l'éducateur</div>
  <div class="dip-mot">${d.m?`<p>« ${esc(d.m)} »</p>`:`<div class="dip-lines"><span></span><span></span><span></span></div>`}<div class="dip-sign">${esc(d.e||"")}</div></div>
  <div class="dip-sig l"><span></span>L'éducateur</div><div class="dip-sig r"><span></span>Le responsable technique jeunes</div>
  <div class="dip-foot">${esc(next)} À bientôt au Pau FC !</div></div>`}
/* ---- PDF (jsPDF) ---- */
let fontsReady=false;
function pdfFonts(doc){if(!fontsReady){doc.addFileToVFS("Poppins-Bold.ttf",FONT_BOLD);doc.addFont("Poppins-Bold.ttf","Poppins","bold");doc.addFileToVFS("Poppins-Regular.ttf",FONT_REGULAR);doc.addFont("Poppins-Regular.ttf","Poppins","normal");doc.addFileToVFS("Poppins-Italic.ttf",FONT_ITALIC);doc.addFont("Poppins-Italic.ttf","Poppins","italic")}}
function pdfStar(doc,cx,cy,r,on){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?r*0.45:r;pts.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
  const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
  if(on){doc.setFillColor(242,194,0);doc.setDrawColor(201,160,0)}else{doc.setFillColor(255,255,255);doc.setDrawColor(200,200,200)}doc.setLineWidth(.3);
  doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)}
function pdfFiche(doc,d){const {g,vd,first,stageLine,next}=dipData(d);const PW=210,PH=297,F=DIP.frame,I=DIP.inner,MX=DIP.mx,W=PW-2*MX,CX=PW/2;
  pdfFonts(doc);
  const navy=[11,42,74],yel=[242,194,0],gray=[110,120,135],ink=[30,36,48];
  // cadre
  doc.setDrawColor(...navy);doc.setLineWidth(.9);doc.rect(F,F,PW-2*F,PH-2*F);
  doc.setDrawColor(...yel);doc.setLineWidth(.35);doc.rect(I,I,PW-2*I,PH-2*I);
  // blason + en-tête
  doc.addImage(CREST_PNG,"PNG",CX-12,16,24,24);
  doc.setFont("Poppins","bold");doc.setFontSize(8.5);doc.setTextColor(...gray);{const t="PAU FC · ACADÉMIE",cs=1.2;doc.text(t,CX-(doc.getTextWidth(t)+(t.length-1)*cs)/2,47.5,{charSpace:cs})}
  doc.setFontSize(23);doc.setTextColor(...navy);{const t="CARNET DE STAGE",cs=.6;doc.text(t,CX-(doc.getTextWidth(t)+(t.length-1)*cs)/2,57,{charSpace:cs})}
  doc.setFillColor(...yel);doc.rect(CX-15,60.2,30,1,"F");
  doc.setFont("Poppins","normal");doc.setFontSize(9.5);doc.setTextColor(...gray);doc.text(stageLine,CX,67,{align:"center"});
  // nom
  doc.setFont("Poppins","bold");doc.setTextColor(...ink);let ns=28;doc.setFontSize(ns);while(doc.getTextWidth(d.n)>W-10&&ns>16){ns-=1;doc.setFontSize(ns)}doc.text(d.n,CX,84,{align:"center"});
  doc.setFont("Poppins","italic");doc.setFontSize(10);doc.setTextColor(...gray);doc.text("a participé aux deux journées du stage et a travaillé :",CX,91.5,{align:"center"});
  // liste
  let y=101;doc.setFont("Poppins","normal");doc.setFontSize(10);doc.setTextColor(...ink);
  g.apprentissages.forEach(a=>{const lines=doc.splitTextToSize(a,W-9);doc.setFillColor(...yel);const s=1.4;doc.lines([[s,s],[-s,s],[-s,-s],[s,-s]],MX+2,y-2.9,[1,1],"F",true);doc.text(lines,MX+8,y);y+=5.6*lines.length+1.1});
  // titre section étoiles
  const h=(t,yy)=>{doc.setFont("Poppins","bold");doc.setFontSize(8.5);doc.setTextColor(...navy);const cs=1.2;const tw=doc.getTextWidth(t)+(t.length-1)*cs;doc.text(t,CX-tw/2,yy,{charSpace:cs});doc.setDrawColor(...yel);doc.setLineWidth(.4);doc.line(MX,yy-1.2,CX-tw/2-6,yy-1.2);doc.line(CX+tw/2+6,yy-1.2,MX+W,yy-1.2)};
  h("LES ÉTOILES DE L'ÉDUCATEUR",159.5);
  y=168.5;FACETS.forEach((f,i)=>{doc.setDrawColor(226,230,236);doc.setLineWidth(.25);if(i)doc.line(MX,y-7,MX+W,y-7);
    doc.setFont("Poppins","bold");doc.setFontSize(11);doc.setTextColor(...ink);doc.text(f.name,MX,y);
    doc.setFont("Poppins","normal");doc.setFontSize(7.5);doc.setTextColor(...gray);doc.text(doc.splitTextToSize(g.facets[f.id],W-48)[0],MX,y+4.3);
    const n=d.f[f.id]||0;for(let k=0;k<3;k++)pdfStar(doc,MX+W-24+k*10.5,y+.4,3.9,k<n);y+=12.5});
  doc.setFont("Poppins","normal");doc.setFontSize(7.3);doc.setTextColor(...gray);doc.text("1 étoile : à découvrir · 2 étoiles : en progrès · 3 étoiles : acquis pour son âge — on se compare à soi-même, jamais aux autres.",CX,231.5,{align:"center"});
  // mot
  h("LE MOT DE L'ÉDUCATEUR",240.5);
  doc.setFillColor(246,247,250);doc.setDrawColor(226,230,236);doc.setLineWidth(.3);doc.roundedRect(MX,244.5,W,25,2.5,2.5,"FD");
  if(d.m){doc.setFont("Poppins","italic");doc.setFontSize(11.5);doc.setTextColor(...ink);const lines=doc.splitTextToSize(`« ${d.m} »`,W-14).slice(0,3);doc.text(lines,MX+7,251.5)}
  else{doc.setDrawColor(200,204,212);doc.setLineWidth(.25);[252,258.5,265].forEach(o=>doc.line(MX+7,o,MX+W-7,o))}
  if(d.e){doc.setFont("Poppins","normal");doc.setFontSize(8);doc.setTextColor(...gray);doc.text(d.e,MX+W-6,267.3,{align:"right"})}
  // signatures
  doc.setDrawColor(...ink);doc.setLineWidth(.3);doc.line(MX,275,MX+62,275);doc.line(MX+W-62,275,MX+W,275);
  doc.setFont("Poppins","normal");doc.setFontSize(7.5);doc.setTextColor(...gray);doc.text("L'éducateur",MX,278.6);doc.text("Le responsable technique jeunes",MX+W,278.6,{align:"right"});
  // pied
  doc.setFontSize(6.8);doc.text(doc.splitTextToSize(next+" À bientôt au Pau FC !",W)[0],CX,283.2,{align:"center"})}
</script>
<script>
/* ===== Fiche de séance en PDF (une page A4) et partage WhatsApp =====
   Le RTJ veut du visuel pour les éducateurs : la séance part en PDF, schémas compris, plutôt qu'en texte.
   Rendu avec jsPDF (police Poppins embarquée, comme le carnet) ; les schémas SVG sont rasterisés à la volée. */
const FCS={navy:"#0B2A4A",navy2:"#123B66",yel:"#F2C200",ink:"#1E2430",gray:"#6E7887",line:"#DCE2EC",light:"#F4F6FA"};
const KIND_PDFS={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90"};
/* le SVG est rasterisé à son propre ratio : sinon les ronds (joueurs, ballons) s'étirent */
function svgToPngS(svg,w,h){return new Promise(res=>{
  const img=new Image();const blob="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
  img.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    x.fillStyle="#2F6B43";x.fillRect(0,0,w,h);

<script>
/* ===== Application Stages ===== */
const LS="paufc-stages-v1";let store={};try{store=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){}

/* ===== Adaptations des séances du stage : modifier, dupliquer, déplacer, texte des ateliers =====
   Même principe que les pages séances : l'éducateur adapte la séance du jour, la modification est partagée
   avec le club (Apps Script, cat = STAGE-<vacances>-<groupe>) ; la liste des ateliers reste intacte. */
store.ovr=store.ovr||{};
const TXT=["name","desc","var"];
const ORIG={};
GROUPS.forEach(g=>STAGE[g.id].sessions.forEach(s=>{ORIG[g.id+"|"+s.id]=snapshotWith(s,STAGE[g.id].lib)}));
function blkWith(b,lib){const g=lib[b.g]||{};const o={g:b.g,dur:b.dur||undefined};if(b.rot)o.rot=1;TXT.forEach(k=>{const v=(b[k]||"").trim();if(v&&v!==(g[k]||""))o[k]=v});return o}
function blk(b){return blkWith(b,st().lib)}
function snapshotWith(s,lib){return {title:s.title,short:s.short||"",theme:s.theme||"",objs:[...(s.objs||[])],veiller:s.veiller||"",note:s.note||"",blocks:(s.blocks||[]).map(b=>blkWith(b,lib))}}
function snapshot(s){return snapshotWith(s,st().lib)}
function validData(d){const lib=st().lib;return !!d&&typeof d.title==="string"&&Array.isArray(d.objs)&&Array.isArray(d.blocks)&&d.blocks.length>0&&d.blocks.every(b=>lib[b.g])&&(!d.dup||d.day===1||d.day===2)}
const ovrs=()=>(store.ovr[catKey()]=store.ovr[catKey()]||{});
function applyOverrides(){const S=st();const O=ovrs();
  /* copies de réserve : propres à ce stage (vacances + groupe) */
  for(let i=S.sessions.length-1;i>=0;i--){const s=S.sessions[i];if(s.dup&&(s.vac!==vac||!O[s.id]||!O[s.id].data)){S.sessions.splice(i,1);if(curS===s.id)curS=null}}
  Object.entries(O).forEach(([id,o])=>{const d=o&&o.data;if(d&&d.dup&&validData(d)&&!S.sessions.some(x=>x.id===id))S.sessions.push({id,day:d.day,dup:true,vac,base:d.base||"",title:d.title,theme:"",objs:[],blocks:[]})});
  S.sessions.forEach(s=>{const o=O[s.id];const use=o&&validData(o.data);const src=use?o.data:ORIG[gid+"|"+s.id];if(!src)return;
    s.title=src.title;s.short=src.short||"";s.theme=src.theme||"";s.objs=[...src.objs];s.veiller=src.veiller||"";s.note=src.note||"";s.blocks=src.blocks.map(b=>({...blk(b)}));s.mod=use&&!s.dup?{by:o.by||"",ts:o.ts||0}:null;if(s.dup&&o)s.by=o.by||""});
  S.sessions.sort((a,b)=>a.day-b.day||(a.dup?1:0)-(b.dup?1:0))}
async function loadOverrides(){const c=catKey();try{const r=await fetch(`${API}?seances=${encodeURIComponent(c)}`,{cache:"no-store"});const arr=await r.json();if(!Array.isArray(arr))return;const O=store.ovr[c]=store.ovr[c]||{};let ch=false;
  arr.forEach(x=>{if(!x||!x.id)return;const cur=O[x.id];if(!cur||(x.ts||0)>(cur.ts||0)){O[x.id]={data:x.data||null,by:x.by||"",ts:x.ts||0};ch=true}});

/* ---------- ateliers tournants (sous-groupes qui tournent) ---------- */
function rotGroups(blocks){const g=blocks.map(()=>-1);
  for(let i=1;i<blocks.length;i++){if(blocks[i].rot){g[i]=g[i-1]>=0?g[i-1]:i-1;if(g[i-1]<0)g[i-1]=i-1}}
  return g}
function rotSize(g,at){return g.filter(x=>x===at).length}
function normRot(bl){if(bl[0])delete bl[0].rot;return bl}
/* Des ateliers tournants durent forcément le même temps : tout le groupe suit son premier atelier. */
function equalizeRots(bl,dur){const lib=st().lib;const g=rotGroups(bl);
  g.forEach((x,i)=>{if(x===i){const ids=g.map((y,j)=>y===i?j:-1).filter(j=>j>=0);
    const d=dur||bl[i].dur||(lib[bl[i].g]||{}).dur||10;ids.forEach(j=>bl[j].dur=d)}});
  return bl}

/* ---------- état de l'éditeur ---------- */
let editId=null,draft=null,action=null,edFocus=null;

function applyEdFocus(){if(!edFocus)return;const f=edFocus;edFocus=null;
  if(f.field){const el=document.getElementById(f.field);if(!el)return;
    el.scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>{el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}},260);return}

function moveBlock(from,to){if(to<0||to>=draft.blocks.length||to===from)return false;
  const [b]=draft.blocks.splice(from,1);draft.blocks.splice(to,0,b);return true}
function bindDrag(){
  const list=document.querySelector(".edblocks");if(!list)return;
  const rows=()=>[...list.querySelectorAll(".edrow")];
  const commit=()=>{const order=rows().map(r=>+r.dataset.i);
    if(order.some((v,i)=>v!==i)){draft.blocks=equalizeRots(normRot(order.map(i=>draft.blocks[i])));renderSeances();toast("Ordre des ateliers mis \u00e0 jour")}};
  list.querySelectorAll("[data-grip]").forEach(g=>{
    g.addEventListener("keydown",e=>{const i=+g.dataset.grip;let to=null;
      if(e.key==="ArrowUp")to=i-1;else if(e.key==="ArrowDown")to=i+1;else return;
      e.preventDefault();if(moveBlock(i,to)){edFocus=null;renderSeances();
        const nn=document.querySelector('.edrow[data-i="'+to+'"] [data-grip]');if(nn)nn.focus()}});
    g.addEventListener("pointerdown",e=>{
      if(e.button!==undefined&&e.button!==0)return;e.preventDefault();
      const row=g.closest(".edrow");row.classList.add("dragging");list.classList.add("is-dragging");
      try{g.setPointerCapture(e.pointerId)}catch(err){}
      const move=ev=>{const y=ev.clientY;
        rows().forEach(r=>{if(r===row)return;const b=r.getBoundingClientRect();
          if(y>b.top&&y<b.bottom){if(y>b.top+b.height/2)r.after(row);else r.before(row)}})};
      const up=()=>{window.removeEventListener("pointermove",move);
        row.classList.remove("dragging");list.classList.remove("is-dragging");
        try{g.releasePointerCapture(e.pointerId)}catch(err){}
        commit()};
      window.addEventListener("pointermove",move);

function bindActionPanel(s){const q=id=>document.getElementById(id);const cancel=q("acCancel");if(cancel)cancel.addEventListener("click",()=>{action=null;renderSeances()});
  if(action==="dup"){q("acDo").addEventListener("click",()=>duplicateSession(s,+q("acDay").value,signer()))}
  if(action==="move"){const ord=st().sessions.filter(movable);const k=ord.indexOf(s);
    const up=q("acUp"),dn=q("acDown");if(up&&!up.disabled)up.addEventListener("click",()=>swapSession(s,ord[k-1],signer()));if(dn&&!dn.disabled)dn.addEventListener("click",()=>swapSession(s,ord[k+1],signer()));

function swapSession(a,b,who){const A=snapshot(a),B=snapshot(b);
  const mk=(src,tgt)=>{const d={...src};if(tgt.dup){d.dup=true;d.day=tgt.day;d.base=tgt.base||""}return d};
  const same=(d,x)=>!x.dup&&JSON.stringify(d)===JSON.stringify(ORIG[gid+"|"+x.id]);
  const dA=mk(B,a),dB=mk(A,b);
  Promise.all([saveOverride(a.id,same(dA,a)?null:dA,who),saveOverride(b.id,same(dB,b)?null:dB,who)]).then(()=>render());
  curS=b.id;set("s:"+gid,curS);render();toast(`Séance déplacée (J${b.day})`)}
function duplicateSession(s,day,who){const id="d"+Date.now().toString(36);const data={...snapshot(s),dup:true,day,base:s.id};
  action=null;saveOverride(id,data,who).then(()=>render());curS=id;set("s:"+gid,curS);render();toast("Copie créée en séance de réserve — tu peux la modifier")}

   ${editing?editorHtml(s):""}
   ${!editing&&s.note?`<div class="callout" style="margin:12px 20px 0"><b>💬 Consignes du référent</b> · ${esc(s.note)}<button class="zedit" id="edNoteBtn" title="Modifier les consignes du référent" aria-label="Modifier les consignes du référent">${pencilIcon()}</button></div>`:""}
   <div class="objs"><div><h4>Objectifs de la séance${!editing?`<button class="zedit" id="edObjsBtn" title="Modifier les objectifs" aria-label="Modifier les objectifs">${pencilIcon()}</button>`:""}</h4><ul>${s.objs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div><div><h4>Le regard de l'éducateur${!editing?`<button class="zedit" id="edVeillerBtn" title="Modifier le regard de l'éducateur" aria-label="Modifier le regard de l'éducateur">${pencilIcon()}</button>`:""}</h4><p>${esc(s.veiller)}</p></div><div><h4>Repères d'appréciation</h4><p class="note">${FACETS.map(f=>`<b>${esc(f.name)}</b> : ${esc(g.facets[f.id])}`).join(" · ")}</p></div></div>
   <div class="timeline">${tl}</div><div class="tl-legend">${tlLeg}</div>
   <div class="blocks"><div style="padding:6px 20px 0">${LEGEND}</div>${blocksHtml}</div>
   <div class="materiel"><span class="eyebrow" style="margin-right:6px">Matériel</span>${mat.map(m=>`<span class="mat">${esc(m)}</span>`).join("")}</div>
   <div class="sendbar"><h4>Envoyer la séance aux éducateurs</h4><div class="toolbar" style="margin-top:0"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Envoyer sur WhatsApp</a><button class="btn" id="pdfDl">📄 Fiche PDF</button></div><p class="note" style="margin-top:8px">« Fiche PDF » donne la séance sur une page A4 avec les schémas : sur téléphone le partage s'ouvre (WhatsApp compris), sur ordinateur le PDF est téléchargé. Le message WhatsApp contient le déroulé en texte et le lien vers cette fiche.</p></div>
  </div></div>`;
  v.querySelectorAll(".sess-item").forEach(b=>b.addEventListener("click",()=>{curS=b.dataset.s;set("s:"+gid,curS);editId=null;draft=null;action=null;renderSeances();window.scrollTo({top:0,behavior:"smooth"})}));
  const pd=document.getElementById("pdfDl");if(pd)pd.addEventListener("click",()=>fichePdf(s));
  const eb=document.getElementById("editBtn");if(eb)eb.addEventListener("click",()=>{editId=s.id;draft=snapshot(s);action=null;renderSeances();const e=document.querySelector(".editor");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})});
  const db=document.getElementById("dupBtn");if(db)db.addEventListener("click",()=>{action=action==="dup"?null:"dup";renderSeances()});
  const sb=document.getElementById("swapBtn");if(sb)sb.addEventListener("click",()=>{action=action==="move"?null:"move";renderSeances()});
  const openEdit=focus=>{editId=s.id;draft=snapshot(s);action=null;
    if(focus&&focus.blk!=null&&draft.blocks[focus.blk])draft.blocks[focus.blk]._open=true;
    edFocus=focus||null;renderSeances()};
  v.querySelectorAll("[data-bedit]").forEach(b=>b.addEventListener("click",()=>openEdit({blk:+b.dataset.bedit})));
  [["edTitleBtn","edTitle"],["edObjsBtn","edObjs"],["edVeillerBtn","edVeiller"],["edNoteBtn","edNote"]].forEach(([id,fl])=>{
    const b=document.getElementById(id);if(b)b.addEventListener("click",()=>openEdit({field:fl}))});
  if(editing)bindEditor(s);else if(action)bindActionPanel(s)
  applyEdFocus()}

function render(){if(!vac||!VACANCES.some(v=>v.id===vac))vac=nextVac().id;applyOverrides();renderCats();renderStage();renderSeances();renderAppr();renderLib()}
/* onglets */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===t.getAttribute("aria-controls")));set("tab",t.getAttribute("aria-controls"))}));
const savedTab=QS.get("s")?"view-seances":get("tab",null);if(savedTab&&document.getElementById(savedTab)){document.querySelector(`.tab[aria-controls="${savedTab}"]`).click()}
if(CARNET&&CARNET.n){renderCarnet()}else{render();loadRemote();loadOverrides();window.addEventListener("online",flush)}
/* Aide au défilement pour les tableaux plus larges que l'écran : ombre sur le bord droit,
   barre de défilement toujours visible et une courte mention sous le tableau. */
function addScrollArrows(){document.querySelectorAll('.tbl-wrap,.sess-list').forEach(el=>{
  const over=el.scrollWidth>el.clientWidth+4;
  let bar=el.nextElementSibling;if(!(bar&&bar.classList.contains('scrollhint')))bar=null;
  el.classList.toggle('has-more',over);
  if(!over){if(bar)bar.hidden=true;return}
  if(!bar){bar=document.createElement('div');bar.className='scrollhint';bar.innerHTML='<span aria-hidden="true">↔</span> Tableau plus large que l’écran : faites-le glisser vers la gauche pour voir toutes les colonnes.';el.parentNode.insertBefore(bar,el.nextSibling);
    const upd=()=>el.classList.toggle('at-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4);el.addEventListener('scroll',upd,{passive:true});upd()}
  bar.hidden=false})}
const _sh=new MutationObserver(()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});_sh.observe(document.querySelector('main'),{childList:true,subtree:true});window.addEventListener('resize',()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});setTimeout(addScrollArrows,300);


</script>
</body></html>

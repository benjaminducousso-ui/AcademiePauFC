<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
</head>
<body style="margin:0">
<title>Séances U9 Pau FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --navy:#0B2A4A; --navy-2:#123B66; --yellow:#F2C200; --yellow-ink:#7A5E00;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EEF6; --line:#D5DDE8;
  --ink:#14213D; --muted:#5B6B82; --faint:#8A97AB;
  --pitch:#3E8E57; --pitch-2:#4A9C63; --pitch-line:rgba(255,255,255,.85);
  --blue-team:#1E56C9; --red-team:#D64545; --gk:#8E44AD;
  --ok:#2E8B57; --warn:#C77700; --wa:#25D366; --wa-ink:#0B3D22;
  --shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);
  --r:10px;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B2A4A; --navy-2:#173F6B; --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
    --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --navy:#0B2A4A; --navy-2:#173F6B; --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
  --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(24px,3.4vw,32px);font-weight:700;text-transform:uppercase}
h3{font-size:22px;font-weight:700}
h4{font-size:18px;font-weight:700}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;padding-block:18px 0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:46px;height:52px;flex:none}
.brand .eyebrow{color:var(--yellow)}
.brand p.sub{color:#C9D6E8;max-width:62ch;margin-top:4px}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;color:#C9D6E8;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none;padding-block:24px 56px}
.view.active{display:block}

/* ---------- periods strip ---------- */
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.period{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.period .idx{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.period h3{font-size:19px;text-transform:uppercase}
.period .dates{font-size:13px;color:var(--muted)}
.period .fil{font-size:14px}
.period .badge{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.period.current{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.period.current .idx{color:var(--yellow-ink)}
.period.current .idx::after{content:" · en cours"}
.period .hol{position:absolute;right:10px;top:10px;font-size:11px;color:var(--faint)}
@media (max-width:900px){.periods{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.periods{grid-template-columns:1fr}}

.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:22px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin-bottom:8px}
.card ul{margin:8px 0 0;padding-left:18px}
.card li{margin:4px 0}
.seance-type{display:grid;gap:6px;margin-top:10px}
.st-row{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.st-row b{font-family:var(--display);font-size:17px}
.st-row .t{font-family:var(--display);font-size:18px;color:var(--navy-2);font-weight:800}
:root[data-theme="dark"] .st-row .t{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-row .t{color:var(--yellow)}}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.facet{background:var(--surface-2);border-radius:8px;padding:10px}
.facet b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}
.facet span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.facets{grid-template-columns:repeat(2,1fr)}}
.note{font-size:14px;color:var(--muted)}
.callout{border-left:4px solid var(--yellow);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px;font-size:15px}

.perbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin}
.perchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:150px;text-align:left}
.perchip b{font-family:var(--display);font-size:18px;line-height:1}
.perchip span{font-size:13px;font-weight:600}
.perchip small{font-size:11px;color:var(--muted)}
.perchip[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.perchip:hover{border-color:var(--navy-2)}
/* ---------- sessions view ---------- */
.sess-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.sess-layout{grid-template-columns:1fr}}
.sess-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
@media (max-width:900px){.sess-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sess-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--ink);min-width:0}
@media (max-width:900px){.sess-item{min-width:240px}}
.sess-item:hover{border-color:var(--navy-2)}
.sess-item[aria-current="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.sess-item .d{font-family:var(--display);line-height:1;text-align:center}
.sess-item .d b{display:block;font-size:22px}
.sess-item .d span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess-item .ttl{font-weight:600;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sess-item .sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.sam{background:#FFF3BF;color:#7A5E00}
.chip.mer{background:var(--surface-2);color:var(--muted)}
.chip.plateau{background:var(--yellow);color:#3B2E00}
.chip.sent{background:#DCF5E6;color:#1B5E36}
.chip.opt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
:root[data-theme="dark"] .chip.sam{background:#4A3B00;color:#F2C200}
:root[data-theme="dark"] .chip.sent{background:#153D28;color:#7ED9A3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sam{background:#4A3B00;color:#F2C200}:root:not([data-theme="light"]) .chip.sent{background:#153D28;color:#7ED9A3}}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sheet-head{background:var(--navy);color:#fff;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.sheet-head .eyebrow{color:var(--yellow)}
.sheet-head h2{color:#fff;margin-top:4px}
.sheet-head .theme{color:#C9D6E8;margin-top:6px;max-width:60ch}
.sheet-head .meta{display:flex;gap:8px;flex-wrap:wrap}
.meta .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:13px;color:#fff}
.toggle{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.toggle[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.objs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.objs{grid-template-columns:1fr}}
.objs h4{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.objs ul{margin:0;padding-left:18px}
.timeline{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:14px 20px 0;background:var(--surface-2)}
.timeline span{display:block}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 20px 0;font-size:12px;color:var(--muted)}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.blocks{display:flex;flex-direction:column;gap:0;padding:8px 0 4px}
.block{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:18px 20px;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
@media (max-width:760px){.block{grid-template-columns:1fr}}
.block .when{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.block .when .t{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;color:var(--navy-2)}
:root[data-theme="dark"] .block .when .t{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .block .when .t{color:var(--yellow)}}
.block .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:3px 8px;border-radius:4px;color:#fff}
.k-accueil{background:#6B7A90}.k-eveil{background:#C77700}.k-atelier{background:#1E56C9}.k-defi{background:#8E44AD}.k-match{background:#2E8B57}.k-calme{background:#6B7A90}
.block h3{font-size:22px;margin-bottom:6px}
.block .desc{margin-bottom:8px}
.block dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.block dt{color:var(--muted);font-weight:600}
.block dd{margin:0}
.block .veiller{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}
.block .veiller b{color:var(--yellow-ink)}
.schema{background:var(--surface-2);border-radius:8px;padding:8px}
.schema svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:3px}
.materiel{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.materiel .mat{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:14px}
.educ{padding:14px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.educ .ico{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#3B2E00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.bilan{padding:14px 20px;border-top:1px solid var(--line)}
.bilan textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--ink);resize:vertical}
.bilan label{display:block;font-weight:600;margin-bottom:6px}

/* ---------- send bar ---------- */
.sendbar{background:var(--surface-2);padding:16px 20px;border-top:1px solid var(--line)}
.sendbar h4{margin-bottom:10px;display:flex;align-items:center;gap:8px}.sendbar h4 svg{width:20px;height:20px;color:var(--wa)}
.wa-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 14px;font-weight:700;border:1px solid transparent;text-decoration:none;line-height:1}
.btn.wa{background:var(--wa);color:#0B3D22}
.btn.wa:hover{filter:brightness(.95)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy-2)}
.btn.small{padding:7px 10px;font-size:14px}
.btn svg{width:18px;height:18px}
.sent-mark{font-size:13px;color:var(--ok);font-weight:600}
.preview{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;font-family:var(--body);max-height:260px;overflow:auto}
details.prev summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}

/* ---------- profils ---------- */
.prof-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.prof-table th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line)}
.prof-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.prof-table input[type=text]{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:6px 4px;border-radius:6px}
.prof-table input[type=text]:hover{border-color:var(--line)}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:2px;font-size:20px;line-height:1;color:var(--line)}
.stars button.on{color:var(--yellow)}
.stars button:hover{transform:scale(1.15)}
.tbl-wrap{overflow-x:auto}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.del{background:none;border:0;color:var(--faint);font-size:18px;padding:4px}
.del:hover{color:var(--red-team)}

/* ---------- réglages ---------- */
.edu-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.edu-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
@media (max-width:560px){.edu-row{grid-template-columns:1fr auto}.edu-row input:nth-child(2){grid-column:1}}
.edu-row input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink);width:100%}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.settings-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.source-list{margin:8px 0 0;padding-left:18px;font-size:14px}
.source-list li{margin:4px 0}
.source-list a{color:var(--navy-2)}
:root[data-theme="dark"] .source-list a{color:#9DC1F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .source-list a{color:#9DC1F0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- images WhatsApp ---------- */
.imgbar{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.img{background:var(--navy);color:#fff}
.btn.img:hover{background:var(--navy-2)}
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:40}
.overlay.open{display:flex}
.modal{background:var(--bg);color:var(--ink);border-radius:12px;max-width:760px;width:100%;padding:16px 16px 20px;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.modal-head h3{font-size:22px}
.modal .hint{font-size:14px;color:var(--muted);margin-bottom:12px}
.gallery{display:flex;flex-direction:column;gap:18px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.gitem img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.gitem .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.gitem .acts .note{margin-left:auto}
.close{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px}
.close:hover{color:var(--ink)}
.busy{opacity:.6;pointer-events:none}
.edu #tab-profils,.edu #tab-reglages,.edu .sendbar,.edu .bilan,.edu #plateauToggle{display:none!important}
.edu .brand p.sub{display:none}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.92em}
@media print{.top,.sess-list,.sendbar,.bilan,.toast{display:none!important}.sheet{box-shadow:none;border:0}.view{display:none}.view.active{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="crest" viewBox="0 0 46 52" aria-hidden="true"><path d="M23 1 44 8v18c0 12-9 21-21 25C11 47 2 38 2 26V8z" fill="#F2C200"/><path d="M23 6 39 11.5V26c0 9.5-7 16.8-16 20-9-3.2-16-10.5-16-20V11.5z" fill="#0B2A4A"/><path d="M23 12 33 16v10c0 6-4.2 10.6-10 13-5.8-2.4-10-7-10-13V16z" fill="#F2C200"/><text x="23" y="30" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="12" fill="#0B2A4A">U9</text></svg>
      <div>
        <div class="eyebrow">Pau FC · École de foot · Saison 2026-2027</div>
        <h1>Séances U9</h1>
        <p class="sub">Le programme de l'année, trois séances par semaine prêtes à mener et l'envoi WhatsApp aux éducateurs. Du jeu, de la technique, et le match.</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-guide" aria-selected="true" aria-controls="view-guide">Guide de l'année</button>
      <button class="tab" role="tab" id="tab-seances" aria-selected="false" aria-controls="view-seances">Séances</button>
      <button class="tab" role="tab" id="tab-profils" aria-selected="false" aria-controls="view-profils">Profils techniques</button>
      <button class="tab" role="tab" id="tab-reglages" aria-selected="false" aria-controls="view-reglages">Éducateurs &amp; réglages</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view active" id="view-guide" role="tabpanel" aria-labelledby="tab-guide"></section>
  <section class="view" id="view-seances" role="tabpanel" aria-labelledby="tab-seances"></section>
  <section class="view" id="view-profils" role="tabpanel" aria-labelledby="tab-profils"></section>
  <section class="view" id="view-reglages" role="tabpanel" aria-labelledby="tab-reglages"></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>

function renderSchema(sc){

  o+=`<defs>`;
  [["c","#FFFFFF"],["m","#FFFFFF"],["p","#F2C200"],["s","#FF5A5A"]].forEach(([k,c])=>{o+=`<marker id="${id}${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`});

  o+=`<rect x="${X(0)}" y="${Y(0)}" width="${M(L)}" height="${M(W)}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/>`;

    if(z.t) o+=`<text x="${X(z.x+z.w/2)}" y="${Y(z.y+z.h/2)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.45)" stroke-width="2.5" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(z.t)}</text>`});

  (sc.hoops||[]).forEach(h=>{o+=`<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${M(1.3)}" fill="none" stroke="#fff" stroke-width="1.8"/>`});
  (sc.arrows||[]).forEach(a=>{const pts=a.p;let d=`M${X(pts[0].x??pts[0][0])} ${Y(pts[0].y??pts[0][1])}`;
    if(pts.length===2){d+=` L${X(pts[1][0])} ${Y(pts[1][1])}`}
    else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${X(pts[i][0])} ${Y(pts[i][1])} ${X(mx)} ${Y(my)}`}const l=pts[pts.length-1];d+=` T${X(l[0])} ${Y(l[1])}`}
    const st={c:'stroke="#fff" stroke-width="2.2"',m:'stroke="#fff" stroke-width="1.8" stroke-dasharray="5 4"',p:'stroke="#F2C200" stroke-width="2"',s:'stroke="#FF5A5A" stroke-width="2.8"'}[a.k||"c"];
    o+=`<path d="${d}" fill="none" ${st} stroke-linecap="round" stroke-linejoin="round" marker-end="url(#${id}${a.k||"c"})"/>`});
  (sc.cups||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-3.6).toFixed(1)} l4.2 6.8 h-8.4z" fill="#FFB020" stroke="#7A4B00" stroke-width=".7"/>`});
  (sc.cones||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-6.5).toFixed(1)} l5.2 10.5 h-10.4z" fill="#FF7A1A" stroke="#7A2E00" stroke-width=".8"/><rect x="${(+X(c.x)-6).toFixed(1)}" y="${(+Y(c.y)+3.2).toFixed(1)}" width="12" height="2" fill="#7A2E00"/>`});

    o+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${M(0.95)}" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;

  const v=document.getElementById("view-seances");
  if(!curPer)curPer=currentId?perOf(SESSIONS.find(x=>x.id===currentId)).n:currentPer();
  if(!currentId||perOf(SESSIONS.find(x=>x.id===currentId)).n!==curPer){const up=sessionsOf(curPer).find(x=>D(x.date)>=today);currentId=(up||sessionsOf(curPer)[0]).id}
  const chips=PERIODS.map(p=>`<button class="perchip" data-per="${p.n}" aria-pressed="${p.n===curPer}"><b>P${p.n}</b><span>${esc(p.name)}</span><small>${fmtShort(p.from)} → ${fmtShort(p.to)}</small></button>`).join("");
  const list=sessionsOf(curPer).map(s=>{const d=D(s.date);const sent=Object.keys(get("sent:"+s.id,{})).length>0;const pl=isPlateau(s);
    return `<button class="sess-item" data-id="${s.id}" aria-current="${s.id===currentId}">
      <span class="d"><b class="num">${d.getDate()}</b><span>${MOIS_C[d.getMonth()]}</span></span>
      <span><span class="ttl">${esc(s.title)}</span><br><span class="sub">${cap(JOURS[d.getDay()])}${s.optional?" · facultatif":""}</span></span>
      <span style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">${pl?'<span class="chip plateau">Plateau</span>':`<span class="chip ${s.sat?'sam':'mer'}">${s.sat?'Samedi':'Mercredi'}</span>`}${sent?'<span class="chip sent">Envoyée</span>':''}</span>
    </button>`}).join("");
  v.innerHTML=`<div class="perbar" role="group" aria-label="Périodes">${chips}</div><div class="sess-layout"><aside class="sess-list" aria-label="Liste des séances">${list}</aside><div id="sheet"></div></div>`;
  v.querySelectorAll(".perchip").forEach(b=>b.addEventListener("click",()=>{curPer=+b.dataset.per;currentId=null;renderSessions()}));
  v.querySelectorAll(".sess-item").forEach(b=>b.addEventListener("click",()=>{currentId=b.dataset.id;renderSessions();document.getElementById("sheet").scrollIntoView({behavior:"smooth",block:"start"})}));
  renderSheet();
}
function renderSheet(){
  const s=SESSIONS.find(x=>x.id===currentId);const el=document.getElementById("sheet");
  const plateau=isPlateau(s);
  const blocks=plateau?PLATEAU.blocks.map(b=>{const g=b.game?GAMES[b.game]:{};return {...g,name:b.name,kind:b.kind,desc:b.desc||g.desc,dur:parseInt(b.t),t:b.t}}):expandBlocks(s);
  const total=blocks.reduce((a,b)=>a+b.dur,0);
  const tl=blocks.map(b=>`<span style="width:${(b.dur/total*100).toFixed(1)}%;background:${KIND_COLOR[b.kind]}" title="${esc(b.name)}"></span>`).join("");
  const tlLeg=[...new Set(blocks.map(b=>b.kind))].map(k=>`<span><i style="background:${KIND_COLOR[k]}"></i>${KIND_LABEL[k]}</span>`).join("");
  const blocksHtml=blocks.map(b=>`<article class="block">
     <div>${b.schema?`<div class="schema">${renderSchema(b.schema)}</div>`:`<div class="schema" style="display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:14px">${b.kind==="accueil"?"🤝 Cercle d'accueil":"🙌 Cercle de fin"}</div>`}</div>
     <div>
       <div class="when"><span class="t num">${plateau?b.t:b.dur+"'"}</span><span class="kind k-${b.kind}">${KIND_LABEL[b.kind]}</span>${b.src?`<span class="note" style="font-size:12px">· ${esc(b.src)}</span>`:""}</div>
       <h3>${esc(b.name)}</h3>
       <p class="desc">${esc(b.desc||"")}</p>
       ${b.org||b.var?`<dl>${b.org?`<dt>Organisation</dt><dd>${esc(b.org)}</dd>`:""}${b.var?`<dt>Variantes</dt><dd>${esc(b.var)}</dd>`:""}</dl>`:""}
       ${b.veiller?`<div class="veiller"><b>Veiller à</b> · ${esc(b.veiller)}</div>`:""}
     </div></article>`).join("");
  const mat=plateau?PLATEAU.mat:collectMat(blocks);
  const educs=educators();const sent=get("sent:"+s.id,{});
  const msg=waMessage(s);const enc=encodeURIComponent(msg);
  const waBtns=educs.length?educs.map((e,i)=>`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${normPhone(e.phone)}?text=${enc}" data-edu="${i}">${waIcon()} ${esc(e.name)}${sent[e.name]?` ✓`:""}</a>`).join(""):`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${enc}" data-edu="-1">${waIcon()} Envoyer sur WhatsApp</a>`;
  const info=get("plateauInfo:"+s.id,{lieu:"",heure:""});
  el.innerHTML=`<div class="sheet">
    <div class="sheet-head">
      <div><div class="eyebrow">Séance ${sessionsOf(perOf(s).n).indexOf(s)+1} / ${sessionsOf(perOf(s).n).length} · Période ${perOf(s).n} « ${esc(perOf(s).name)} »${s.optional?" · facultative":""}</div>
        <h2>${cap(fmtLong(s.date))}${plateau?" · Plateau":""}</h2>
        <h3 style="color:var(--yellow);margin-top:6px;font-size:24px">${esc(plateau?PLATEAU.title:s.title)}</h3>
        <p class="theme">${esc(plateau?PLATEAU.theme:s.theme)}</p></div>
      <div class="meta"><span class="pill num">${total} min</span><span class="pill">${CAT.group||"8-14 enfants"}</span>${s.sat?`<button class="toggle" id="plateauToggle" aria-pressed="${plateau}">${plateau?"🏟️ Plateau ce samedi":"Entraînement · passer en plateau"}</button>`:""}</div>
    </div>
    ${plateau?`<div class="objs"><div><h4>Infos pratiques du plateau</h4><div class="field"><label for="plLieu">Lieu</label><input id="plLieu" type="text" value="${esc(info.lieu)}" placeholder="Club d'accueil"></div><div class="field"><label for="plHeure">Heure de rendez-vous</label><input id="plHeure" type="text" value="${esc(info.heure)}" placeholder="9h45"></div></div>
      <div><h4>À veiller</h4><ul>${PLATEAU.veiller.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><p class="note" style="margin-top:8px"><b>Et la séance prévue ?</b> Elle est sautée, pas décalée : le samedi ne fait que réinvestir les séances de la semaine, et le plateau contient lui-même « le jeu de la période ». Rien n'est perdu.</p></div></div>`
    :`<div class="objs"><div><h4>Objectifs du jour</h4><ul>${s.objs.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>
      <div><h4>Message éducatif (PEF)</h4><p>${esc(s.pef)}</p><h4 style="margin-top:12px">Consigne unique du match</h4><p>${esc(blocks.find(b=>b.kind==="match")?"Une seule phrase répétée : celle de l'atelier du jour (ex. « lève la tête », « petites touches », « regarde le but »).":"—")}</p></div></div>`}
    <div class="timeline">${tl}</div><div class="tl-legend">${tlLeg}</div>
    <div class="blocks"><div style="padding:6px 20px 0">${LEGEND}</div>${blocksHtml}</div>
    <div class="materiel"><span class="eyebrow" style="margin-right:6px">Matériel</span>${mat.map(m=>`<span class="mat">${esc(m)}</span>`).join("")}</div>
    ${plateau?"":`<div class="educ"><div class="ico">PEF</div><div><b>Programme Éducatif Fédéral · ${esc(s.pef.split(" — ")[0])}</b><p class="note">${esc(s.pef.split(" — ")[1]||"")} — à dire en 30 secondes au retour au calme, puis on le vit sur la séance suivante.</p></div></div>`}
    <div class="sendbar"><h4>${waIcon()} Envoyer la séance aux éducateurs</h4>
      <div class="wa-row">${waBtns}<button class="btn ghost" id="copyMsg">Copier le texte</button><button class="btn ghost small" id="markSent">Marquer envoyée</button>${Object.keys(sent).length?`<span class="sent-mark">Envoyée à ${Object.keys(sent).join(", ")}</span>`:""}</div>
      <p class="note" style="margin-top:8px">Le message = le déroulé en texte + le lien vers cette fiche avec ses schémas${sessionLink(s)?` : <a href="${esc(sessionLink(s))}" target="_blank" rel="noopener" style="color:inherit">${esc(sessionLink(s))}</a>`:" (adresse à renseigner dans Éducateurs &amp; réglages)"}.</p>
      ${educs.length?"":`<p class="note">Ajoute tes éducateurs dans l'onglet Éducateurs pour avoir un bouton par personne.</p>`}
      <details class="prev" style="margin-top:10px"><summary>Aperçu du message WhatsApp</summary><div class="preview">${esc(msg)}</div></details>
    </div>
    <div class="bilan"><label for="bilan">Bilan après séance (pour ajuster la suivante)</label><textarea id="bilan" placeholder="Ce qui a marché, ce qu'il faut refaire, un enfant à encourager…">${esc(get("bilan:"+s.id,""))}</textarea></div>
  </div>`;
  const tg=document.getElementById("plateauToggle");if(tg)tg.addEventListener("click",()=>{set("plateau:"+s.id,!plateau);renderSessions()});
  ["plLieu","plHeure"].forEach(id=>{const i=document.getElementById(id);if(i)i.addEventListener("change",()=>{set("plateauInfo:"+s.id,{lieu:document.getElementById("plLieu").value,heure:document.getElementById("plHeure").value});renderSheet()})});
  document.getElementById("bilan").addEventListener("input",e=>set("bilan:"+s.id,e.target.value));
  el.querySelectorAll("a.btn.wa").forEach(a=>a.addEventListener("click",()=>{const i=+a.dataset.edu;const name=i>=0?educs[i].name:"WhatsApp";const st=get("sent:"+s.id,{});st[name]=new Date().toISOString();set("sent:"+s.id,st);setTimeout(renderSessions,600)}));
  document.getElementById("copyMsg").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(msg);toast("Message copié")}catch(e){toast("Copie impossible ici : utilise l'aperçu")}});
  document.getElementById("markSent").addEventListener("click",()=>{const st=get("sent:"+s.id,{});st["éducateurs"]=new Date().toISOString();set("sent:"+s.id,st);renderSessions()});
}
function waIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.1.6 2.8.5a2.4 2.4 0 0 0 1.6-1.1 2 2 0 0 0 .1-1.1c0-.1-.2-.2-.4-.3Z"/></svg>`}

/* ---------- Vue Profils ---------- */
let profPer=null;
function starsOf(k,per){k.stars=k.stars||{};if(!k.stars.p1&&Object.keys(k.stars).some(x=>FACETS.find(f=>f.id===x))){k.stars={p1:k.stars}}k.stars["p"+per]=k.stars["p"+per]||{};return k.stars["p"+per]}
function renderProfils(){
  const v=document.getElementById("view-profils");const kids=get("kids",[]);if(!profPer)profPer=currentPer();
  const rows=kids.map((k,i)=>`<tr><td><input type="text" id="kid-${i}" value="${esc(k.name)}" data-i="${i}" aria-label="Prénom"></td>
    ${FACETS.map(f=>`<td><span class="stars" data-i="${i}" data-f="${f.id}">${[1,2,3].map(n=>`<button class="${(starsOf(k,profPer)[f.id]||0)>=n?'on':''}" data-n="${n}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join("")}</span></td>`).join("")}
    <td><input type="text" id="note-${i}" value="${esc(k.note||"")}" data-i="${i}" placeholder="un mot" aria-label="Remarque"></td>
    <td><button class="del" data-i="${i}" aria-label="Retirer">×</button></td></tr>`).join("");
  const rallye=sessionsOf(profPer).find(x=>x.blocks.some(b=>/rallye|bilan/.test(b.g)));
  v.innerHTML=`<div class="eyebrow">Bilan de période · ${esc(GUIDE.bilanName)}${rallye?` (${fmtLong(rallye.date)})`:""}</div><h2 style="margin-top:4px">Profils techniques</h2>
   <div class="perbar" style="margin-top:12px">${PERIODS.map(p=>`<button class="perchip" data-pp="${p.n}" aria-pressed="${p.n===profPer}"><b>P${p.n}</b><span>${esc(p.name)}</span><small>${fmtShort(p.from)} → ${fmtShort(p.to)}</small></button>`).join("")}</div>
   <p style="max-width:70ch;margin-top:8px;color:var(--muted)">${GUIDE.starsNote}</p>
   <div class="card" style="margin-top:16px">
     <div class="facets" style="margin-top:0">${FACETS.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div>
     <div class="tbl-wrap"><table class="prof-table"><thead><tr><th>Enfant</th>${FACETS.map(f=>`<th>${esc(f.name)}</th>`).join("")}<th>Remarque</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="note" style="padding:14px 8px">Aucun enfant pour l'instant — ajoute les prénoms ci-dessous.</td></tr>`}</tbody></table></div>
     <div class="prof-actions"><button class="btn ghost" id="addKid">+ Ajouter un enfant</button><button class="btn ghost" id="bulkKids">Coller une liste de prénoms</button><button class="btn ghost" id="copyProf">Copier le bilan (texte)</button></div>
     <div id="bulkBox" hidden class="field"><label for="bulkArea">Un prénom par ligne</label><textarea id="bulkArea" rows="5"></textarea><button class="btn ghost" id="bulkOk" style="align-self:flex-start">Ajouter</button></div>
   </div>`;
  const persist=()=>set("kids",kids);
  v.querySelectorAll("input[id^=kid-]").forEach(i=>i.addEventListener("change",e=>{kids[+e.target.dataset.i].name=e.target.value;persist()}));
  v.querySelectorAll("input[id^=note-]").forEach(i=>i.addEventListener("change",e=>{kids[+e.target.dataset.i].note=e.target.value;persist()}));
  v.querySelectorAll(".stars button").forEach(b=>b.addEventListener("click",()=>{const sp=b.parentElement;const k=kids[+sp.dataset.i];const st=starsOf(k,profPer);const n=+b.dataset.n;st[sp.dataset.f]=st[sp.dataset.f]===n?0:n;persist();renderProfils()}));
  v.querySelectorAll(".perchip[data-pp]").forEach(b=>b.addEventListener("click",()=>{profPer=+b.dataset.pp;renderProfils()}));
  v.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{kids.splice(+b.dataset.i,1);persist();renderProfils()}));
  document.getElementById("addKid").addEventListener("click",()=>{kids.push({name:"",stars:{}});persist();renderProfils();const last=v.querySelector(`#kid-${kids.length-1}`);if(last)last.focus()});
  document.getElementById("bulkKids").addEventListener("click",()=>{document.getElementById("bulkBox").hidden=false});
  document.getElementById("bulkOk").addEventListener("click",()=>{document.getElementById("bulkArea").value.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(n=>kids.push({name:n,stars:{}}));persist();renderProfils()});
  document.getElementById("copyProf").addEventListener("click",async()=>{const txt=`Profils techniques ${CAT.code} — période ${profPer}\n`+kids.map(k=>`${k.name} : ${FACETS.map(f=>`${f.name} ${"★".repeat(starsOf(k,profPer)[f.id]||0)||"–"}`).join(" · ")}${k.note?` — ${k.note}`:""}`).join("\n");try{await navigator.clipboard.writeText(txt);toast("Bilan copié")}catch(e){toast("Copie impossible ici")}});
}

/* ---------- Vue Réglages ---------- */
function renderReglages(){
  const v=document.getElementById("view-reglages");const ed=educators();const st=settings();
  const rows=ed.map((e,i)=>`<div class="edu-row"><input type="text" id="edn-${i}" value="${esc(e.name)}" placeholder="Prénom" aria-label="Prénom de l'éducateur"><input type="tel" id="edp-${i}" value="${esc(e.phone)}" placeholder="06 12 34 56 78" aria-label="Numéro WhatsApp"><button class="del" data-i="${i}" aria-label="Retirer">×</button></div>`).join("");
  v.innerHTML=`<div class="eyebrow">Réglages</div><h2 style="margin-top:4px">Éducateurs &amp; envoi</h2>
  <div class="settings-grid">
    <div class="card"><h3>Éducateurs ${CAT.code}</h3><p class="note">Un bouton WhatsApp par personne sur chaque fiche. Les numéros restent sur cet appareil.</p>
      <div class="edu-list">${rows||'<p class="note">Aucun éducateur saisi.</p>'}</div>
      <div class="prof-actions"><button class="btn ghost" id="addEdu">+ Ajouter un éducateur</button></div>
    </div>
    <div class="card"><h3>Infos dans le message</h3>
      <div class="field"><label for="setLieu">Lieu d'entraînement</label><input id="setLieu" type="text" value="${esc(st.lieu)}" placeholder="Terrain synthétique n°2"></div>
      <div class="field"><label for="setHMer">Horaire du mercredi</label><input id="setHMer" type="text" value="${esc(st.hMer)}" placeholder="14h00 - 15h00"></div>
      <div class="field"><label for="setHSam">Horaire du samedi (entraînement)</label><input id="setHSam" type="text" value="${esc(st.hSam)}" placeholder="10h00 - 11h00"></div>
      <div class="field"><label for="setSign">Signature</label><input id="setSign" type="text" value="${esc(st.signature)}" placeholder="Benjamin · Pau FC ${CAT.code}"></div>
      <div class="field"><label for="setUrl">Adresse publique de cette page (mise dans le message)</label><input id="setUrl" type="url" value="${esc(st.url)}" placeholder="https://…/seances-u7.html"><span class="note">Le lien ouvre directement la fiche du jour, en lecture seule (sans boutons d'envoi ni réglages).</span></div>
      <div class="prof-actions"><button class="btn ghost" id="saveSet">Enregistrer</button></div>
    </div>
    <div class="card"><h3>Comment les éducateurs voient la fiche</h3>
      <p>Le message WhatsApp contient le déroulé en texte et un lien du type <code>…/${CAT.file}?seance=…</code>. En l'ouvrant, l'éducateur tombe directement sur la fiche du jour avec les schémas, en lecture seule. Pour que le lien marche, cette page doit être publiée sur le site du club (GitHub Pages, comme le calendrier) : déposer le fichier <code>${CAT.file}</code> dans le dépôt AcademiePauFC ; à chaque nouvelle période, remplacer le fichier.</p>
    </div>
    <div class="card"><h3>Sources des jeux</h3><ul class="source-list">${SOURCES.map(s=>`<li>${s.u?`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a>`:esc(s.t)}</li>`).join("")}</ul>
      <div class="prof-actions"><button class="btn ghost small" id="resetAll">Effacer les données de cet appareil</button></div>
    </div>
  </div>`;
  const persist=()=>set("educs",ed);
  ed.forEach((e,i)=>{document.getElementById(`edn-${i}`).addEventListener("change",ev=>{e.name=ev.target.value;persist()});document.getElementById(`edp-${i}`).addEventListener("change",ev=>{e.phone=ev.target.value;persist()})});
  v.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{ed.splice(+b.dataset.i,1);persist();renderReglages()}));
  document.getElementById("addEdu").addEventListener("click",()=>{ed.push({name:"",phone:""});persist();renderReglages();document.getElementById(`edn-${ed.length-1}`).focus()});
  document.getElementById("saveSet").addEventListener("click",()=>{set("settings",{lieu:document.getElementById("setLieu").value,hMer:document.getElementById("setHMer").value,hSam:document.getElementById("setHSam").value,signature:document.getElementById("setSign").value,url:document.getElementById("setUrl").value.trim()});toast("Réglages enregistrés")});
  document.getElementById("resetAll").addEventListener("click",()=>{store={};save();toast("Données effacées");renderAll()});
}

/* ---------- Onglets ---------- */
function showTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.getAttribute("aria-controls")===id));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  if(!EDU_MODE)set("tab",id);
  if(id==="view-seances")renderSessions();if(id==="view-profils")renderProfils();if(id==="view-reglages")renderReglages();if(id==="view-guide")renderGuide();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showTab(t.getAttribute("aria-controls"))));
const QS=new URLSearchParams(location.search);
const EDU_MODE=QS.has("seance")&&SESSIONS.some(x=>x.id===QS.get("seance"));
function renderAll(){renderGuide();if(EDU_MODE){document.documentElement.classList.add("edu");currentId=QS.get("seance");curPer=perOf(SESSIONS.find(x=>x.id===currentId)).n;showTab("view-seances")}else showTab(get("tab","view-guide"))}
renderAll();
</script>

</body>
</html>

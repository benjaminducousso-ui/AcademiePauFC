<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Séances U9 Pau FC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --navy:#0B2A4A; --navy-2:#123B66; --yellow:#F2C200; --yellow-ink:#7A5E00;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EEF6; --line:#D5DDE8;
  --ink:#14213D; --muted:#5B6B82; --faint:#8A97AB;
  --pitch:#3E8E57; --pitch-2:#4A9C63; --pitch-line:rgba(255,255,255,.85);
  --blue-team:#1E56C9; --red-team:#D64545; --gk:#8E44AD;
  --ok:#2E8B57; --warn:#C77700; --wa:#25D366; --wa-ink:#0B3D22;
  --shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);
  --r:10px;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#0B2A4A; --navy-2:#173F6B; --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
    --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --navy:#0B2A4A; --navy-2:#173F6B; --bg:#0E1726; --surface:#162236; --surface-2:#1D2C45; --line:#2B3C57;
  --ink:#E8EDF5; --muted:#A5B2C6; --faint:#7C8AA1; --yellow-ink:#F2C200;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(24px,3.4vw,32px);font-weight:700;text-transform:uppercase}
h3{font-size:22px;font-weight:700}
h4{font-size:18px;font-weight:700}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{background:var(--navy);color:#fff;padding-block:18px 0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:76px;height:76px;flex:none;border-radius:50%;background:#fff;padding:2px;box-sizing:border-box}
.brand .eyebrow{color:var(--yellow)}
.brand p.sub{color:#C9D6E8;max-width:62ch;margin-top:4px}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;color:#C9D6E8;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
.view{display:none;padding-block:24px 56px}
.view.active{display:block}

/* ---------- periods strip ---------- */
.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.period{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.period .idx{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.period h3{font-size:19px;text-transform:uppercase}
.period .dates{font-size:13px;color:var(--muted)}
.period .fil{font-size:14px}
.period .badge{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.period.current{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.period.current .idx{color:var(--yellow-ink)}
.period.current .idx::after{content:" · en cours"}
@media (max-width:900px){.periods{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.periods{grid-template-columns:1fr}}

.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:22px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{margin-bottom:8px}
.card ul{margin:8px 0 0;padding-left:18px}
.card li{margin:4px 0}
.seance-type{display:grid;gap:6px;margin-top:10px}
.st-row{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.st-row b{font-family:var(--display);font-size:17px}
.st-row .t{font-family:var(--display);font-size:18px;color:var(--navy-2);font-weight:800}
:root[data-theme="dark"] .st-row .t{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-row .t{color:var(--yellow)}}
.facets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
@media (max-width:640px){.facets{grid-template-columns:repeat(2,1fr)}}
.facet{background:var(--surface-2);border-radius:8px;padding:10px}
.facet b{display:block;font-family:var(--display);font-size:17px;text-transform:uppercase}
.facet span{font-size:13px;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.callout{border-left:4px solid var(--yellow);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;margin-top:14px;font-size:15px}

.perbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin}
.perchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);min-width:150px;text-align:left}
.perchip b{font-family:var(--display);font-size:18px;line-height:1}
.perchip span{font-size:13px;font-weight:600}
.perchip small{font-size:11px;color:var(--muted)}
.perchip[aria-pressed="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.perchip:hover{border-color:var(--navy-2)}
/* ---------- sessions view ---------- */
.sess-layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.sess-layout{grid-template-columns:1fr}}
.sess-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
@media (max-width:900px){.sess-list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.sess-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;color:var(--ink);min-width:0}
@media (max-width:900px){.sess-item{min-width:240px}}
.sess-item:hover{border-color:var(--navy-2)}
.sess-item[aria-current="true"]{border-color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.sess-item .d{font-family:var(--display);line-height:1;text-align:center}
.sess-item .d b{display:block;font-size:22px}
.sess-item .d span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sess-item .ttl{font-weight:600;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.sess-item .sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chip.sam{background:#FFF3BF;color:#7A5E00}
.chip.mer{background:var(--surface-2);color:var(--muted)}
.chip.plateau{background:var(--yellow);color:#3B2E00}
.chip.sent{background:#DCF5E6;color:#1B5E36}
.matchobjs{grid-template-columns:1fr!important}
.matchcard{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}.matchcard.home{border-left:5px solid var(--yellow)}.matchcard.away{border-left:5px solid var(--navy-2)}.matchcard.none{border-style:dashed}
.matchcard .vs{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1.05}.matchcard .vs span{color:var(--muted)}
.matchcard .mrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.matchcard .note{margin-top:6px}
.teambox{margin-top:8px}.tbhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tbgrid{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:16px;align-items:start}@media (max-width:700px){.tbgrid{grid-template-columns:1fr}}
.pitch{width:100%;height:auto;display:block;border-radius:8px}
ul.xi{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}ul.xi li{font-size:15px}ul.xi .pos{display:inline-block;min-width:28px;font-family:var(--display);font-weight:800;color:var(--navy-2)}
.convgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin:6px 0 8px}.conv{display:flex;gap:6px;align-items:center;font-size:15px;font-weight:400}.conv input{width:18px;height:18px}
.xigrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media (max-width:520px){.xigrid{grid-template-columns:1fr}}.xigrid .field span{font-size:12px;font-weight:700;color:var(--muted)}
.medit .field textarea,.medit .field input,.medit .field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.chip.mod{background:#E8EEFF;color:var(--navy);vertical-align:middle;margin-left:6px}
.chip.opt{background:transparent;border:1px dashed var(--line);color:var(--muted)}
:root[data-theme="dark"] .chip.sam{background:#4A3B00;color:#F2C200}
:root[data-theme="dark"] .chip.sent{background:#153D28;color:#7ED9A3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sam{background:#4A3B00;color:#F2C200}:root:not([data-theme="light"]) .chip.sent{background:#153D28;color:#7ED9A3}}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sheet-head{background:var(--navy);color:#fff;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.sheet-head .eyebrow{color:var(--yellow)}
.sheet-head h2{color:#fff;margin-top:4px}
.sheet-head .theme{color:#C9D6E8;margin-top:6px;max-width:60ch}
.sheet-head .meta{display:flex;gap:8px;flex-wrap:wrap}
.meta .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:13px;color:#fff}
.actionbox{margin:12px 20px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}.actionbox .note{font-size:13px}.acrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.acrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}.acrow input,.acrow select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;background:var(--surface);color:var(--ink);max-width:100%}
.toggle:disabled{opacity:.4;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.toggle[aria-pressed="true"]{background:var(--yellow);color:#3B2E00;border-color:var(--yellow)}
.objs{display:grid;grid-template-columns:1fr;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.objs h4{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.objs ul{margin:0;padding-left:18px}
.timeline{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:14px 20px 0;background:var(--surface-2)}
.timeline span{display:block}
.tl-legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 20px 0;font-size:12px;color:var(--muted)}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.blocks{display:flex;flex-direction:column;gap:0;padding:8px 0 4px}
.block{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px;padding:18px 20px;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
@media (max-width:760px){.block{grid-template-columns:1fr}}
.block .when{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.block .when .t{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;color:var(--navy-2)}
:root[data-theme="dark"] .block .when .t{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .block .when .t{color:var(--yellow)}}
.block .kind{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:3px 8px;border-radius:4px;color:#fff}
.k-accueil{background:#6B7A90}.k-eveil{background:#C77700}.k-atelier{background:#1E56C9}.k-defi{background:#8E44AD}.k-match{background:#2E8B57}.k-calme{background:#6B7A90}
.block h3{font-size:22px;margin-bottom:6px}
.block .desc{margin-bottom:8px}
.block dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.block dt{color:var(--muted);font-weight:600}
.block dd{margin:0}
.block .veiller{margin-top:10px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}
.block .veiller b{color:var(--yellow-ink)}
.schema{background:var(--surface-2);border-radius:8px;padding:8px}
.schema svg{display:block;width:100%;height:auto;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:3px}
.materiel{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.materiel .mat{background:var(--surface-2);border-radius:6px;padding:4px 10px;font-size:14px}
.educ{padding:14px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.educ .ico{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#3B2E00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.bilan{padding:14px 20px;border-top:1px solid var(--line)}
.bilan textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px;background:var(--surface);color:var(--ink);resize:vertical}
.bilan label{display:block;font-weight:600;margin-bottom:6px}

/* ---------- send bar ---------- */
.sendbar{background:var(--surface-2);padding:16px 20px;border-top:1px solid var(--line)}
.sendbar h4{margin-bottom:10px;display:flex;align-items:center;gap:8px}.sendbar h4 svg{width:20px;height:20px;color:var(--wa)}
.wa-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 14px;font-weight:700;border:1px solid transparent;text-decoration:none;line-height:1}
.btn.wa{background:var(--wa);color:#0B3D22}
.btn.wa:hover{filter:brightness(.95)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy-2)}
.btn.small{padding:7px 10px;font-size:14px}
.btn svg{width:18px;height:18px}
.sent-mark{font-size:13px;color:var(--ok);font-weight:600}
.preview{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;white-space:pre-wrap;font-family:var(--body);max-height:260px;overflow:auto}
details.prev summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}

/* ---------- profils ---------- */
.prof-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.prof-table th{text-align:left;font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--muted);padding:8px 8px;border-bottom:2px solid var(--line)}
.prof-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.prof-table input[type=text]{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;padding:6px 4px;border-radius:6px}
.prof-table input[type=text]:hover{border-color:var(--line)}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;padding:2px;font-size:20px;line-height:1;color:var(--line)}
.stars button.on{color:var(--yellow)}
.stars button:hover{transform:scale(1.15)}
.tbl-wrap{overflow-x:auto}
.prof-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.del{background:none;border:0;color:var(--faint);font-size:18px;padding:4px}
.del:hover{color:var(--red-team)}

/* ---------- réglages ---------- */
.edu-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.edu-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
@media (max-width:560px){.edu-row{grid-template-columns:1fr auto}.edu-row input:nth-child(2){grid-column:1}}
.edu-row input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink);width:100%}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.settings-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.source-list{margin:8px 0 0;padding-left:18px;font-size:14px}
.source-list li{margin:4px 0}
.source-list a{color:var(--navy-2)}
:root[data-theme="dark"] .source-list a{color:#9DC1F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .source-list a{color:#9DC1F0}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- images WhatsApp ---------- */
.imgbar{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.img{background:var(--navy);color:#fff}
.btn.img:hover{background:var(--navy-2)}
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:40}
.overlay.open{display:flex}
.modal{background:var(--bg);color:var(--ink);border-radius:12px;max-width:760px;width:100%;padding:16px 16px 20px;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.modal-head h3{font-size:22px}
.modal .hint{font-size:14px;color:var(--muted);margin-bottom:12px}
.gallery{display:flex;flex-direction:column;gap:18px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.gitem img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
.gitem .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.gitem .acts .note{margin-left:auto}
.close{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px}
.close:hover{color:var(--ink)}
.busy{opacity:.6;pointer-events:none}
.edu #tab-profils,.edu #tab-reglages,.edu .sendbar,.edu .bilan,.edu #plateauToggle{display:none!important}
.edu .brand p.sub{display:none}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.92em}
@media print{.top,.sess-list,.sendbar,.bilan,.toast{display:none!important}.sheet{box-shadow:none;border:0}.view{display:none}.view.active{display:block}}

/* ---------- édition de séance ---------- */
.period .hol{font-size:11.5px;color:var(--faint);line-height:1.3}
.editor{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.editor .edhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:8px}
.editor .edgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.editor .edgrid{grid-template-columns:1fr}}
.editor .field{margin-top:0}
.edblocks{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.edrow{display:grid;grid-template-columns:28px minmax(180px,1fr) auto auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (max-width:700px){.edrow{grid-template-columns:28px 1fr auto}.edrow .kind{display:none}.edrow .mv{grid-column:1/-1;justify-self:end}}
.edrow .n{font-family:var(--display);font-size:18px;font-weight:800;color:var(--navy-2);text-align:center}
.edrow select{min-width:0;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--surface);color:var(--ink)}
.edrow .dur{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.edrow .dur input{width:64px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;background:var(--surface);color:var(--ink);text-align:right}
.edrow .mv{display:inline-flex;gap:4px}
.edrow .txt{grid-column:1/-1;justify-self:start}
.edrow .txt[aria-expanded="true"]{background:var(--navy);color:#fff}
.edtxt{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:8px 0 2px;border-top:1px dashed var(--line)}
.edtxt label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.edtxt input,.edtxt textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-weight:400;background:var(--surface);color:var(--ink);resize:vertical}
.edtxt .note{margin:0;font-size:13px}

.edsave{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sheet.is-editing{outline:3px solid var(--yellow)}
.libcard{border-top:1px solid var(--line)}

.tbl-wrap{position:relative;scrollbar-width:thin;scrollbar-color:#B9C4D6 transparent;padding-bottom:2px}.tbl-wrap::-webkit-scrollbar{height:10px;-webkit-appearance:none}.tbl-wrap::-webkit-scrollbar-track{background:var(--surface-2);border-radius:6px}.tbl-wrap::-webkit-scrollbar-thumb{background:#8F9FB8;border-radius:6px}
.tbl-wrap.has-more:not(.at-end){-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
.scrollhint{font-size:13px;color:var(--muted);margin:6px 0 2px}.scrollhint span{display:inline-block;font-weight:700;margin-right:4px}

.block .more{grid-column:1/-1;margin-top:-6px}
.block dl{margin-top:0}


/* ---------- guide ---------- */
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero .lead{margin-top:10px;color:var(--muted);max-width:70ch}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.kpis b{font-family:var(--display);font-size:30px;line-height:1;color:var(--navy-2)}
:root[data-theme="dark"] .kpis b{color:var(--yellow)}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpis b{color:var(--yellow)}}
.kpis span{font-size:13px;color:var(--muted);margin-top:4px}
.sect{margin-top:26px;text-transform:uppercase;font-size:20px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.step-ico{width:40px;height:40px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:20px;margin-bottom:8px}
.step h4{font-size:18px}.step p{font-size:14px;color:var(--muted);margin-top:4px}
.period ul{margin:2px 0 0;padding-left:16px;font-size:13.5px}
.block .when,.libcard .when{flex-wrap:wrap}
.block .src,.libcard .src{font-size:12px;color:var(--muted);margin:-2px 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>

/* =====================================================================
   CARNET (diplôme A4) — module partagé Pau FC Académie
   La mise en page est calculée UNE fois en primitives (mm), puis rendue
   à l'identique en HTML (aperçu / impression) et en PDF (jsPDF).
   Dépend de : FONT_BOLD / FONT_REGULAR / FONT_ITALIC (Poppins base64),
   CREST_PNG (blason), jsPDF chargé à la demande (loadJsPDF).
   ===================================================================== */
const CARNET={PW:210,PH:297,F:8,I:10.5,MX:20};
const CCOL={navy:"#0B2A4A",yel:"#F2C200",gray:"#6E7887",ink:"#1E2430",line:"#E2E6EC",box:"#F6F7FA",on:"#F2C200",onS:"#C9A000",offS:"#C8C8C8",faint:"#C8CCD4"};
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res();const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res();sc.onerror=()=>rej(new Error("jspdf"));document.head.appendChild(sc)})}
function carnetFonts(doc){if(doc._pf)return;doc._pf=true;doc.addFileToVFS("Poppins-Bold.ttf",FONT_BOLD);doc.addFont("Poppins-Bold.ttf","Poppins","bold");doc.addFileToVFS("Poppins-Regular.ttf",FONT_REGULAR);doc.addFont("Poppins-Regular.ttf","Poppins","normal");doc.addFileToVFS("Poppins-Italic.ttf",FONT_ITALIC);doc.addFont("Poppins-Italic.ttf","Poppins","italic")}
/* d = {club,title,line,name,sub,items[],starsTitle,facets[{name,desc,n}],tests[{name,val,unit,target}],legend,motTitle,mot,educ,sigL,sigR,foot} */
function carnetLayout(doc,d){
  const {PW,F,I,MX}=CARNET,W=PW-2*MX,CX=PW/2,P=[];
  carnetFonts(doc);
  const font=(st,sz)=>{doc.setFont("Poppins",st);doc.setFontSize(sz)};
  const tw=(s,st,sz,cs)=>{font(st,sz);return doc.getTextWidth(s)+(cs?(s.length-1)*cs:0)};
  const wrap=(s,st,sz,w)=>{font(st,sz);return doc.splitTextToSize(s,w)};
  const T=(s,x,y,o)=>P.push(Object.assign({t:"text",s,x,y,size:10,st:"normal",c:CCOL.ink,al:"left",cs:0},o));
  // cadre
  P.push({t:"rect",x:F,y:F,w:PW-2*F,h:CARNET.PH-2*F,stroke:CCOL.navy,lw:.9});
  P.push({t:"rect",x:I,y:I,w:PW-2*I,h:CARNET.PH-2*I,stroke:CCOL.yel,lw:.35});
  // blason + en-tête
  P.push({t:"img",x:CX-12,y:16,w:24,h:24});
  T(d.club||"PAU FC · ACADÉMIE",CX,47.5,{size:8.5,st:"bold",c:CCOL.gray,al:"center",cs:1.2});
  T(d.title,CX,57,{size:23,st:"bold",c:CCOL.navy,al:"center",cs:.6});
  P.push({t:"rect",x:CX-15,y:60.2,w:30,h:1,fill:CCOL.yel});
  T(d.line,CX,67,{size:9.5,c:CCOL.gray,al:"center"});
  let ns=28;while(tw(d.name,"bold",ns)>W-10&&ns>16)ns-=1;
  T(d.name,CX,84,{size:ns,st:"bold",al:"center"});
  T(d.sub,CX,91.5,{size:10,st:"italic",c:CCOL.gray,al:"center"});
  // apprentissages
  let y=101;
  (d.items||[]).forEach(a=>{const lines=wrap(a,"normal",10,W-9);P.push({t:"diamond",x:MX+2,y:y-2.9,s:1.4});lines.forEach((l,i)=>T(l,MX+8,y+i*5.6,{size:10}));y+=5.6*lines.length+1.1});
  const h=(txt,yy)=>{const w=tw(txt,"bold",8.5,1.2);T(txt,CX,yy,{size:8.5,st:"bold",c:CCOL.navy,al:"center",cs:1.2});P.push({t:"line",x1:MX,y1:yy-1.2,x2:CX-w/2-6,y2:yy-1.2,c:CCOL.yel,lw:.4});P.push({t:"line",x1:CX+w/2+6,y1:yy-1.2,x2:MX+W,y2:yy-1.2,c:CCOL.yel,lw:.4})};
  // étoiles
  const tests=(d.tests||[]).filter(x=>x.val!=null&&x.val!=="");
  const yTitle=Math.max(y+7,128);h(d.starsTitle||"LES ÉTOILES DE L'ÉDUCATEUR",yTitle);
  const n=d.facets.length;const rowsStart=yTitle+9;const endMax=tests.length?214:226;
  const rowH=Math.max(12.6,Math.min(15,(endMax-rowsStart)/n));
  y=rowsStart;
  d.facets.forEach((f,i)=>{if(i)P.push({t:"line",x1:MX,y1:y-rowH+9.6,x2:MX+W,y2:y-rowH+9.6,c:CCOL.line,lw:.25});
    T(f.name,MX,y,{size:11,st:"bold"});
    wrap(f.desc||"","normal",7.5,W-42).slice(0,2).forEach((l,k)=>T(l,MX,y+4.3+k*3.5,{size:7.5,c:CCOL.gray}));
    for(let k=0;k<3;k++)P.push({t:"star",cx:MX+W-24+k*10.5,cy:y+.4,r:3.9,on:k<(f.n||0)});
    y+=rowH});
  // repères mesurés (facultatif)
  if(tests.length){const yt=y+1.5;T("REPÈRES MESURÉS",MX,yt,{size:7.5,st:"bold",c:CCOL.navy,cs:1});
    let x=MX;const yy=yt+6.2;tests.forEach(tt=>{const lab=`${tt.name} : ${tt.val} ${tt.unit||""}${tt.target?` (objectif ${tt.target})`:""}`.trim();const w=tw(lab,"normal",8)+6;if(x+w>MX+W){x=MX}P.push({t:"rect",x,y:yy-4.2,w,h:6,fill:CCOL.box,stroke:CCOL.line,lw:.25,r:1.5});T(lab,x+3,yy,{size:8});x+=w+2.5})}
  T(d.legend||"1 étoile : à découvrir · 2 étoiles : en progrès · 3 étoiles : acquis pour son âge — on se compare à soi-même, jamais aux autres.",CX,231.5,{size:7.3,c:CCOL.gray,al:"center"});
  // mot
  h(d.motTitle||"LE MOT DE L'ÉDUCATEUR",240.5);
  P.push({t:"rect",x:MX,y:244.5,w:W,h:25,fill:CCOL.box,stroke:CCOL.line,lw:.3,r:2.5});
  if(d.mot){wrap(`« ${d.mot} »`,"italic",11.5,W-14).slice(0,3).forEach((l,i)=>T(l,MX+7,251.5+i*5.6,{size:11.5,st:"italic"}))}
  else [252,258.5,265].forEach(o=>P.push({t:"line",x1:MX+7,y1:o,x2:MX+W-7,y2:o,c:CCOL.faint,lw:.25}));
  if(d.educ)T(d.educ,MX+W-6,267.3,{size:8,c:CCOL.gray,al:"right"});
  // signatures
  P.push({t:"line",x1:MX,y1:275,x2:MX+62,y2:275,c:CCOL.ink,lw:.3});P.push({t:"line",x1:MX+W-62,y1:275,x2:MX+W,y2:275,c:CCOL.ink,lw:.3});
  T(d.sigL||"L'éducateur",MX,278.6,{size:7.5,c:CCOL.gray});T(d.sigR||"Le responsable technique jeunes",MX+W,278.6,{size:7.5,c:CCOL.gray,al:"right"});
  if(d.foot)T(wrap(d.foot,"normal",6.8,W)[0],CX,283.2,{size:6.8,c:CCOL.gray,al:"center"});
  return P;
}

function hex(c){const m=c.replace("#","");return [parseInt(m.slice(0,2),16),parseInt(m.slice(2,4),16),parseInt(m.slice(4,6),16)]}
function carnetPdfPage(doc,prims){
  prims.forEach(p=>{
    if(p.t==="rect"){if(p.fill)doc.setFillColor(...hex(p.fill));if(p.stroke){doc.setDrawColor(...hex(p.stroke));doc.setLineWidth(p.lw||.3)}const m=p.fill&&p.stroke?"FD":p.fill?"F":"S";if(p.r)doc.roundedRect(p.x,p.y,p.w,p.h,p.r,p.r,m);else doc.rect(p.x,p.y,p.w,p.h,m)}
    else if(p.t==="line"){doc.setDrawColor(...hex(p.c));doc.setLineWidth(p.lw||.3);doc.line(p.x1,p.y1,p.x2,p.y2)}
    else if(p.t==="img"){doc.addImage(CREST_PNG,"PNG",p.x,p.y,p.w,p.h)}
    else if(p.t==="diamond"){doc.setFillColor(...hex(CCOL.yel));const s=p.s;doc.lines([[s,s],[-s,s],[-s,-s],[s,-s]],p.x,p.y,[1,1],"F",true)}
    else if(p.t==="star"){const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2?p.r*0.45:p.r;pts.push([p.cx+rr*Math.cos(a),p.cy+rr*Math.sin(a)])}const rel=[];for(let i=1;i<pts.length;i++)rel.push([pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]]);rel.push([pts[0][0]-pts[9][0],pts[0][1]-pts[9][1]]);
      if(p.on){doc.setFillColor(...hex(CCOL.on));doc.setDrawColor(...hex(CCOL.onS))}else{doc.setFillColor(255,255,255);doc.setDrawColor(...hex(CCOL.offS))}doc.setLineWidth(.3);doc.lines(rel,pts[0][0],pts[0][1],[1,1],"FD",true)}
    else if(p.t==="text"){doc.setFont("Poppins",p.st);doc.setFontSize(p.size);doc.setTextColor(...hex(p.c));
      if(p.cs){const w=doc.getTextWidth(p.s)+(p.s.length-1)*p.cs;const x=p.al==="center"?p.x-w/2:p.al==="right"?p.x-w:p.x;doc.text(p.s,x,p.y,{charSpace:p.cs})}
      else doc.text(p.s,p.x,p.y,{align:p.al})}
  })}
/* ---- rendu HTML (mêmes coordonnées) ---- */
function carnetHtml(prims){
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const mm=v=>v.toFixed(2)+"mm";
  let o=`<div class="dip">`;
  prims.forEach(p=>{
    if(p.t==="rect"){o+=`<div class="cp" style="left:${mm(p.x)};top:${mm(p.y)};width:${mm(p.w)};height:${mm(p.h)};${p.fill?`background:${p.fill};`:""}${p.stroke?`border:${mm(p.lw||.3)} solid ${p.stroke};`:""}${p.r?`border-radius:${mm(p.r)};`:""}"></div>`}
    else if(p.t==="line"){const horiz=Math.abs(p.y1-p.y2)<.01;o+=horiz?`<div class="cp" style="left:${mm(Math.min(p.x1,p.x2))};top:${mm(p.y1-(p.lw||.3)/2)};width:${mm(Math.abs(p.x2-p.x1))};height:${mm(p.lw||.3)};background:${p.c}"></div>`:``}
    else if(p.t==="img"){o+=`<img class="cp" src="${CREST_PNG}" alt="" style="left:${mm(p.x)};top:${mm(p.y)};width:${mm(p.w)};height:${mm(p.h)}">`}
    else if(p.t==="diamond"){o+=`<div class="cp" style="left:${mm(p.x-p.s)};top:${mm(p.y-p.s)};width:${mm(p.s*2)};height:${mm(p.s*2)};background:${CCOL.yel};transform:rotate(45deg) scale(.72)"></div>`}
    else if(p.t==="star"){o+=`<svg class="cp ${p.on?'on':''}" viewBox="0 0 20 20" style="left:${mm(p.cx-p.r)};top:${mm(p.cy-p.r)};width:${mm(p.r*2)};height:${mm(p.r*2)}"><polygon points="10,1.5 12.6,7.2 18.8,7.8 14.1,12 15.5,18.2 10,15 4.5,18.2 5.9,12 1.2,7.8 7.4,7.2"/></svg>`}
    else if(p.t==="text"){const szmm=p.size*0.3528;const top=p.y-szmm*0.86;
      let pos=p.al==="center"?`left:0;right:0;text-align:center;`:p.al==="right"?`right:${mm(CARNET.PW-p.x)};text-align:right;`:`left:${mm(p.x)};`;
      o+=`<div class="cp ct" style="${pos}top:${mm(top)};font-size:${p.size}pt;font-weight:${p.st==="bold"?700:400};font-style:${p.st==="italic"?"italic":"normal"};color:${p.c};letter-spacing:${p.cs?mm(p.cs):"0"}">${esc(p.s)}</div>`}
  });
  return o+`</div>`;
}
const CARNET_CSS=`
.dips{display:flex;flex-direction:column;gap:18px;align-items:center;margin-top:14px}

`;
function fitDips(){document.querySelectorAll(".dipwrap").forEach(w=>{const avail=w.parentElement.clientWidth;const sc=Math.min(1,avail/w.firstElementChild.offsetWidth);w.style.transform=`scale(${sc})`;w.style.height=(w.firstElementChild.offsetHeight*sc)+"px"})}
window.addEventListener("resize",()=>fitDips());
/* Vue carnets : list = tableau de données d (voir carnetLayout), opts = {title, fname, back()} */
async function showCarnets(list,opts){

<script>
/* ===== Jour de match (catégories avec CAT.satMatch) =====
   Le samedi s'affiche « MATCH » : adversaire, domicile/extérieur, heure et stade lus dans le calendrier du club
   (data.json du site AcademiePauFC, mis à jour par la synchro FFF), l'équipe convoquée et la composition choisies
   par le coach et partagées avec le club (Apps Script, mêmes clés que les séances : __team, __pl:<id>, m:<id>).
   Match annulé ou reporté : un clic sur « Entraînement » remplace le match par la séance « on rejoue ». */
const MATCH_ON=!!CAT.satMatch;
let CAL=null,CAL_ERR=false;
function calUrl(){try{return new URL("data.json",settings().url||DEFAULT_URL).href}catch(e){return "https://benjaminducousso-ui.github.io/AcademiePauFC/data.json"}}
async function loadCal(){if(!MATCH_ON)return;const cached=get("caldata",null);if(cached&&cached.ts&&Date.now()-cached.ts<6*3600e3&&cached.data){CAL=cached.data}
  try{const r=await fetch(calUrl(),{cache:"no-store"});const j=await r.json();if(j&&Array.isArray(j.rows)){CAL=j;set("caldata",{ts:Date.now(),data:{teams:j.teams,cols:j.cols,rows:j.rows.filter(rw=>/U1[0-9]/.test(rw[1])),fetchedAt:j.fetchedAt}});rerender()}}
  catch(e){CAL_ERR=!CAL;rerender()}}
function calTeams(){if(!CAL)return [];const age=parseInt(CAT.code.replace(/\D/g,""))||0;return (CAL.teams||[]).filter(t=>{const nums=(t.lcLib||"").match(/\d+/g)||[];return nums.some(n=>+n===age||+n===age+1)})}
const teamSel=()=>{const o=OVR["__team"];return (o&&o.data&&o.data.team)||get("team","")};
function matchFor(s){if(!CAL||!teamSel())return null;const cols=CAL.cols;const ci=k=>cols.indexOf(k);const rows=CAL.rows.filter(r=>r[ci("team")]===teamSel()&&String(r[ci("date")]||"").slice(0,10)===s.date);if(!rows.length)return null;const r=rows[0];
  const g=k=>r[ci(k)];const hm=String(g("date")||"").match(/T(\d{2}):(\d{2})/);const heure=g("heureOk")&&hm?`${+hm[1]}h${hm[2]}`:"";
  return {home:!!g("home"),dom:g("dom")||"",ext:g("ext")||"",heure,stade:g("stade")||"",ville:g("ville")||"",cp:g("cp")||"",poule:g("poule")||"",j:g("j")||"",statut:g("statut")||"",joue:!!g("joue"),bd:g("bd"),be:g("be"),adv:g("home")?g("ext"):g("dom")}}
const matchData=s=>{const o=OVR["m:"+s.id];const d=(o&&o.data)||{};return {conv:d.conv||[],rdv:d.rdv||"",form:d.form||"1-3-3-1",xi:d.xi||{},note:d.note||""}};
const FORMS={"1-3-3-1":[["G",50,88],["DG",22,68],["DC",50,72],["DD",78,68],["MG",22,44],["MC",50,48],["MD",78,44],["AT",50,20]],
  "1-2-3-2":[["G",50,88],["DG",32,70],["DD",68,70],["MG",20,46],["MC",50,50],["MD",80,46],["AG",34,22],["AD",66,22]],
  "1-3-2-2":[["G",50,88],["DG",22,68],["DC",50,72],["DD",78,68],["MG",34,46],["MD",66,46],["AG",34,22],["AD",66,22]]};
const POS_LABEL={G:"Gardien",DG:"Défenseur gauche",DC:"Défenseur central",DD:"Défenseur droit",MG:"Milieu gauche",MC:"Milieu axial",MD:"Milieu droit",AT:"Attaquant",AG:"Attaquant gauche",AD:"Attaquant droit"};
function kidNames(){return get("kids",[]).map(k=>(k.name||"").trim()).filter(Boolean)}
function pitchSvg(md){const pts=FORMS[md.form]||FORMS["1-3-3-1"];
  return `<svg viewBox="0 0 100 100" class="pitch" role="img" aria-label="Composition ${esc(md.form)}"><rect x="2" y="2" width="96" height="96" rx="3" fill="#2E8B57"/><rect x="6" y="6" width="88" height="88" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><path d="M6 50H94" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><circle cx="50" cy="50" r="9" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><rect x="30" y="78" width="40" height="16" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/><rect x="30" y="6" width="40" height="16" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8"/>
    ${pts.map(([p,x,y])=>{const n=md.xi[p]||"";return `<g><circle cx="${x}" cy="${y}" r="5.2" fill="${p==="G"?"#F2C200":"#0B2A4A"}" stroke="#fff" stroke-width=".8"/><text x="${x}" y="${y+1.2}" text-anchor="middle" font-size="3.2" font-weight="700" fill="${p==="G"?"#3B2E00":"#fff"}">${esc(p)}</text><text x="${x}" y="${y+9.5}" text-anchor="middle" font-size="3.6" font-weight="700" fill="#fff" stroke="#0B2A4A" stroke-width=".5" paint-order="stroke">${esc(n.split(" ")[0]).slice(0,12)}</text></g>`}).join("")}</svg>`}
let mEdit=false;
function matchPanel(s){const m=matchFor(s);const md=(mEdit&&mDraft)?mDraft:matchData(s);const teams=calTeams();const team=teamSel();const tm=teams.find(t=>t.id===team);
  const teamSelect=`<label class="field" style="margin:0"><span>Équipe dans le calendrier du club</span><select id="mTeam">${!team?`<option value="">— choisir l'équipe —</option>`:""}${teams.map(t=>`<option value="${t.id}" ${t.id===team?"selected":""}>${esc(t.libelle)}</option>`).join("")}</select></label>`;
  const calState=!CAL?(CAL_ERR?`<p class="note">Calendrier du club inaccessible pour l'instant (hors ligne ?) — les infos du match s'afficheront dès qu'il sera joignable.</p>`:`<p class="note">Lecture du calendrier du club…</p>`):"";
  const card=m?`<div class="matchcard ${m.home?"home":"away"}"><div class="vs"><b>${esc(m.dom)}</b><span>–</span><b>${esc(m.ext)}</b></div>
      <div class="mrow"><span class="chip ${m.home?"sam":"mer"}">${m.home?"À domicile":"À l'extérieur"}</span>${m.heure?`<span class="chip mer">Coup d'envoi ${m.heure}</span>`:`<span class="chip mer">Heure à confirmer</span>`}${m.j?`<span class="chip mer">${esc(m.cp)}${m.poule?" · "+esc(m.poule):""} · J${esc(m.j)}</span>`:""}${m.joue&&m.bd!=null?`<span class="chip plateau">Score ${m.bd} – ${m.be}</span>`:m.statut&&m.statut!=="à venir"?`<span class="chip plateau">${esc(m.statut)}</span>`:""}</div>
      ${m.stade?`<p class="note">${esc(m.stade)}${m.ville?" · "+esc(m.ville):""}</p>`:""}</div>`
    :(CAL&&team?`<div class="matchcard none"><b>Pas de match trouvé pour ${esc(tm?tm.libelle:"cette équipe")} ce samedi dans le calendrier du club.</b><p class="note">Journée libre, match reporté ou calendrier pas encore publié. Si c'est bien un samedi sans match, clique sur « Remplacer par une séance » dans le bandeau : la séance « on rejoue » remplace le match pour tous les éducateurs.</p></div>`:"");
  const conv=md.conv;const starters=Object.values(md.xi).filter(Boolean);const subs=conv.filter(n=>!starters.includes(n));
  const view=`<div class="teambox"><div class="tbhead"><h4>Équipe convoquée${conv.length?` · ${conv.length}`:""}</h4>${!mEdit?`<button class="btn ghost small" id="mEditBtn">${conv.length?"✏️ Modifier l'équipe":"+ Composer l'équipe"}</button>`:""}</div>
    ${!mEdit?(conv.length?`<div class="tbgrid"><div>${pitchSvg(md)}</div><div>${md.rdv?`<p><b>Rendez-vous</b> · ${esc(md.rdv)}</p>`:""}<p class="note" style="margin-top:6px"><b>Titulaires (${esc(md.form)})</b></p><ul class="xi">${(FORMS[md.form]||[]).map(([p])=>`<li><span class="pos">${esc(p)}</span>${esc(md.xi[p]||"—")}</li>`).join("")}</ul>${subs.length?`<p class="note" style="margin-top:8px"><b>Remplaçants</b> · ${subs.map(esc).join(", ")}</p>`:""}${md.note?`<p class="note" style="margin-top:8px"><b>Consignes</b> · ${esc(md.note)}</p>`:""}</div></div>`:`<p class="note">Choisis les joueurs convoqués (la liste vient de l'onglet Progression), la formation et la composition : tout est partagé avec les autres éducateurs et repris dans le message WhatsApp.</p>`):matchEditor(s,md)}</div>`;
  return `<div class="objs matchobjs"><div>${teamSelect}${calState}${card}</div>${view}</div>`}
function matchEditor(s,md){const names=[...new Set([...kidNames(),...md.conv])];const pts=FORMS[md.form]||FORMS["1-3-3-1"];const opts=(sel)=>`<option value="">—</option>`+md.conv.map(n=>`<option value="${esc(n)}" ${n===sel?"selected":""}>${esc(n)}</option>`).join("");
  return `<div class="medit">
    <div class="field"><label>Joueurs convoqués</label><div class="convgrid">${names.map((n,i)=>`<label class="conv"><input type="checkbox" data-conv="${esc(n)}" ${md.conv.includes(n)?"checked":""}> ${esc(n)}</label>`).join("")||`<span class="note">Aucun joueur dans l'onglet Progression : ajoute des noms ci-dessous.</span>`}</div>
      <input type="text" id="mExtra" placeholder="Autres joueurs (séparés par des virgules)"></div>
    <div class="edgrid" style="margin-top:10px"><div class="field"><label for="mRdv">Rendez-vous</label><input id="mRdv" type="text" value="${esc(md.rdv)}" placeholder="ex. 11h45 au stade, tenue bleue"></div>
      <div class="field"><label for="mForm">Formation</label><select id="mForm">${Object.keys(FORMS).map(f=>`<option ${f===md.form?"selected":""}>${f}</option>`).join("")}</select></div>
      <div class="field"><label for="mBy">Ton prénom</label><input id="mBy" type="text" value="${esc(get("who",""))}" placeholder="facultatif"></div></div>
    <div class="tbgrid" style="margin-top:10px"><div>${pitchSvg(md)}</div><div class="xigrid">${pts.map(([p])=>`<label class="field" style="margin:0"><span>${esc(p)} · ${POS_LABEL[p]||p}</span><select data-xi="${p}">${opts(md.xi[p]||"")}</select></label>`).join("")}</div></div>
    <div class="field" style="margin-top:10px"><label for="mNote">Consignes d'équipe (facultatif)</label><textarea id="mNote" rows="2">${esc(md.note)}</textarea></div>
    <div class="prof-actions"><button class="btn wa" id="mSave" style="background:var(--navy);color:#fff">Enregistrer et partager</button><button class="btn ghost" id="mCancel">Annuler</button>${md.conv.length?`<button class="btn ghost" id="mClear">Effacer l'équipe</button>`:""}</div></div>`}
let mDraft=null;
function bindMatchPanel(s){const q=id=>document.getElementById(id);
  const ts=q("mTeam");if(ts)ts.addEventListener("change",()=>{const v=ts.value;set("team",v);saveOverride("__team",v?{team:v}:null,signer()).then(()=>renderSessions());renderSessions()});
  const eb=q("mEditBtn");if(eb)eb.addEventListener("click",()=>{mEdit=true;mDraft=matchData(s);renderSheet()});
  if(!mEdit)return;const md=mDraft||(mDraft=matchData(s));
  const rerenderKeep=()=>{renderSheet()};
  document.querySelectorAll("[data-conv]").forEach(cb=>cb.addEventListener("change",()=>{const n=cb.dataset.conv;if(cb.checked){if(!md.conv.includes(n))md.conv.push(n)}else{md.conv=md.conv.filter(x=>x!==n);Object.keys(md.xi).forEach(p=>{if(md.xi[p]===n)delete md.xi[p]})}rerenderKeep()}));
  const ex=q("mExtra");if(ex)ex.addEventListener("change",()=>{ex.value.split(",").map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!md.conv.includes(n))md.conv.push(n)});rerenderKeep()});
  q("mRdv").addEventListener("input",e=>md.rdv=e.target.value);q("mNote").addEventListener("input",e=>md.note=e.target.value);
  q("mForm").addEventListener("change",e=>{md.form=e.target.value;const keep=FORMS[md.form].map(x=>x[0]);Object.keys(md.xi).forEach(p=>{if(!keep.includes(p))delete md.xi[p]});rerenderKeep()});
  document.querySelectorAll("[data-xi]").forEach(sel=>sel.addEventListener("change",()=>{const p=sel.dataset.xi;const n=sel.value;Object.keys(md.xi).forEach(k=>{if(md.xi[k]===n&&k!==p)delete md.xi[k]});if(n)md.xi[p]=n;else delete md.xi[p];rerenderKeep()}));
  q("mCancel").addEventListener("click",()=>{mEdit=false;mDraft=null;renderSheet()});
  q("mSave").addEventListener("click",()=>{const by=(q("mBy").value||"").trim();if(by)set("who",by);const data={conv:md.conv,rdv:md.rdv.trim(),form:md.form,xi:md.xi,note:md.note.trim()};mEdit=false;mDraft=null;saveOverride("m:"+s.id,data.conv.length?data:null,by||"l'éducateur").then(()=>renderSheet());renderSheet()});
  const cl=q("mClear");if(cl)cl.addEventListener("click",()=>{mEdit=false;mDraft=null;saveOverride("m:"+s.id,null,signer()).then(()=>renderSheet());renderSheet()})}
function matchWaLines(s){const m=matchFor(s);const md=matchData(s);const L=[];
  if(m){L.push(`◆ *${m.dom} – ${m.ext}* · ${m.home?"à domicile":"à l'extérieur"}${m.heure?` · coup d'envoi ${m.heure}`:""}`);if(m.stade)L.push(`● ${m.stade}${m.ville?", "+m.ville:""}`);if(m.cp)L.push(`_${m.cp}${m.poule?" · "+m.poule:""}${m.j?" · J"+m.j:""}_`)}

  if(md.rdv)L.push(`➜ Rendez-vous : ${md.rdv}`);
  if(md.conv.length){L.push("",`★ *Convoqués (${md.conv.length})* : ${md.conv.join(", ")}`);const st=Object.values(md.xi).filter(Boolean);if(st.length){L.push(`◆ *Composition ${md.form}*`);(FORMS[md.form]||[]).forEach(([p])=>{if(md.xi[p])L.push(`- ${p} ${md.xi[p]}`)});const subs=md.conv.filter(n=>!st.includes(n));if(subs.length)L.push(`- Remplaçants : ${subs.join(", ")}`)}
    if(md.note)L.push(`✦ *Consignes* : ${md.note}`)}
  return L}

<script>

const KIND_COLOR={accueil:"#6B7A90",eveil:"#C77700",atelier:"#1E56C9",defi:"#8E44AD",match:"#2E8B57",calme:"#6B7A90"};
/* Finalités des jeux (bibliothèque) */

/* ---------- Schéma SVG ---------- */
let svgId=0;
function renderSchema(sc){
  if(!sc) return "";
  const [L,W]=sc.f; const S=10, pad=2.6;
  const X=x=>((x+pad)*S).toFixed(1), Y=y=>((y+pad)*S).toFixed(1), M=m=>(m*S).toFixed(1);
  const vw=(L+2*pad)*S, vh=(W+2*pad)*S; const id="sv"+(++svgId);
  let o=`<svg viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="Schéma de l'atelier" xmlns="http://www.w3.org/2000/svg">`;
  o+=`<defs>`;
  [["c","#FFFFFF"],["m","#FFFFFF"],["p","#F2C200"],["s","#FF5A5A"]].forEach(([k,c])=>{o+=`<marker id="${id}${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="${c}"/></marker>`});
  o+=`</defs>`;
  o+=`<rect x="0" y="0" width="${vw}" height="${vh}" rx="8" fill="#2F6B43"/>`;
  const bands=Math.max(4,Math.round(L/4));
  for(let i=0;i<bands;i++){const bx=i*L/bands;o+=`<rect x="${X(bx)}" y="${Y(0)}" width="${M(L/bands)}" height="${M(W)}" fill="${i%2?'#4A9C63':'#3E8E57'}"/>`}
  o+=`<rect x="${X(0)}" y="${Y(0)}" width="${M(L)}" height="${M(W)}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6"/>`;
  (sc.zones||[]).forEach(z=>{o+=`<rect x="${X(z.x)}" y="${Y(z.y)}" width="${M(z.w)}" height="${M(z.h)}" fill="${z.f||'#fff'}" fill-opacity=".32" stroke="${z.f||'#fff'}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    if(z.t) o+=`<text x="${X(z.x+z.w/2)}" y="${Y(z.y+z.h/2)}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.45)" stroke-width="2.5" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(z.t)}</text>`});
  (sc.goals||[]).forEach(g=>{const s=g.s||3;
    if(g.o==="v"){const gx=g.x<=0?g.x-0.9:g.x; o+=`<rect x="${X(gx)}" y="${Y(g.y-s/2)}" width="${M(0.9)}" height="${M(s)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}
    else{const gy=g.y<=0?g.y-0.9:g.y; o+=`<rect x="${X(g.x-s/2)}" y="${Y(gy)}" width="${M(s)}" height="${M(0.9)}" fill="#fff" stroke="#14213D" stroke-width="1.2"/>`}});
  (sc.hoops||[]).forEach(h=>{o+=`<circle cx="${X(h.x)}" cy="${Y(h.y)}" r="${M(1.3)}" fill="none" stroke="#fff" stroke-width="1.8"/>`});
  (sc.arrows||[]).forEach(a=>{const pts=a.p;let d=`M${X(pts[0].x??pts[0][0])} ${Y(pts[0].y??pts[0][1])}`;
    if(pts.length===2){d+=` L${X(pts[1][0])} ${Y(pts[1][1])}`}
    else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${X(pts[i][0])} ${Y(pts[i][1])} ${X(mx)} ${Y(my)}`}const l=pts[pts.length-1];d+=` T${X(l[0])} ${Y(l[1])}`}
    const st={c:'stroke="#fff" stroke-width="2.2"',m:'stroke="#fff" stroke-width="1.8" stroke-dasharray="5 4"',p:'stroke="#F2C200" stroke-width="2"',s:'stroke="#FF5A5A" stroke-width="2.8"'}[a.k||"c"];
    o+=`<path d="${d}" fill="none" ${st} stroke-linecap="round" stroke-linejoin="round" marker-end="url(#${id}${a.k||"c"})"/>`});
  (sc.cups||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-3.6).toFixed(1)} l4.2 6.8 h-8.4z" fill="#FFB020" stroke="#7A4B00" stroke-width=".7"/>`});
  (sc.cones||[]).forEach(c=>{o+=`<path d="M${X(c.x)} ${(+Y(c.y)-6.5).toFixed(1)} l5.2 10.5 h-10.4z" fill="#FF7A1A" stroke="#7A2E00" stroke-width=".8"/><rect x="${(+X(c.x)-6).toFixed(1)}" y="${(+Y(c.y)+3.2).toFixed(1)}" width="12" height="2" fill="#7A2E00"/>`});
  (sc.players||[]).forEach(p=>{const col={b:"#1E56C9",r:"#D64545",y:"#F2C200",g:"#8E44AD",e:"#14213D"}[p.c]||"#1E56C9";const tx=p.c==="y"?"#3B2E00":"#fff";
    o+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${M(0.95)}" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
    const lab=p.l||(p.c==="e"?"E":"");if(lab)o+=`<text x="${X(p.x)}" y="${Y(p.y)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="800" fill="${tx}" font-family="Barlow Condensed, Arial Narrow, sans-serif">${esc(lab)}</text>`});
  (sc.balls||[]).forEach(b=>{o+=`<circle cx="${X(b.x)}" cy="${Y(b.y)}" r="${M(0.5)}" fill="#fff" stroke="#14213D" stroke-width="1.3"/><circle cx="${X(b.x)}" cy="${Y(b.y)}" r="${M(0.2)}" fill="#14213D"/>`});
  (sc.labels||[]).forEach(t=>{o+=`<text x="${X(t.x)}" y="${Y(t.y)}" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.55)" stroke-width="2.5" font-family="Source Sans 3, Arial, sans-serif">${esc(t.t)}</text>`});

/* ---------- Helpers séances ---------- */
function perOf(s){return PERIODS[(s.per||1)-1]}
function sessionsOf(per){return SESSIONS.filter(x=>(x.per||1)===per)}
function currentPer(){const p=PERIODS.find(p=>today<=D(p.to));return p?p.n:5}
let curPer=null;
function expandBlocks(s){let t=0;return s.blocks.filter(b=>GAMES[b.g]).map(b=>{const g=GAMES[b.g];const dur=b.dur||g.dur;const start=t;t+=dur;const o={...g,id:b.g,dur,start,edited:false};TXT.forEach(k=>{if(b[k]&&b[k]!==g[k]){o[k]=b[k];o.edited=true}});return o})}
function firstSentence(t){const i=t.indexOf(". ");return i>0&&i<160?t.slice(0,i+1):t}
function collectMat(blocks){const seen=new Set();const out=[];blocks.forEach(b=>(b.mat||[]).forEach(m=>{const k=m.toLowerCase().replace(/[\d+]/g,"").replace(/\s+/g," ").trim();if(!seen.has(k)){seen.add(k);out.push(m)}}));return out}
function isPlateau(s){if(!s.sat)return false;const o=OVR["__pl:"+s.id];if(o&&o.data&&typeof o.data.on==="boolean")return o.data.on;return !!get("plateau:"+s.id,!!CAT.satMatch)}
function educators(){return get("educs",[])}
function normPhone(p){let d=(p||"").replace(/[^\d+]/g,"");if(d.startsWith("+"))d=d.slice(1);if(d.startsWith("0"))d="33"+d.slice(1);return d}
const DEFAULT_URL="https://benjaminducousso-ui.github.io/AcademiePauFC/"+CAT.file;
function settings(){const s=Object.assign({lieu:"",hMer:"",hSam:"",signature:"",url:DEFAULT_URL},get("settings",{}));if(s.url&&s.url.includes("/PlanningPauFC/"))s.url=s.url.replace("/PlanningPauFC/","/AcademiePauFC/");return s}

/* ---------- Séances modifiées (partagées via le classeur du club) ---------- */
let OVR=get("ovr",{});const ORIG={};
/* blk : forme normalisée d'un atelier dans une séance — jeu, durée, et textes adaptés par l'éducateur (name/desc/var) qui ne touchent pas à la liste des ateliers */
const TXT=["name","desc","var"];
function blk(b){const o={g:b.g,dur:b.dur||undefined};TXT.forEach(k=>{const v=(b[k]||"").trim();const g=GAMES[b.g]||{};if(v&&v!==(g[k]||""))o[k]=v});return o}
function snapshot(s){return {title:s.title,theme:s.theme,objs:[...s.objs],note:s.note||"",blocks:s.blocks.map(blk)}}
function validData(d){return d&&typeof d.title==="string"&&Array.isArray(d.objs)&&Array.isArray(d.blocks)&&d.blocks.length>0&&d.blocks.every(b=>GAMES[b.g])&&(!d.dup||/^\d{4}-\d{2}-\d{2}$/.test(d.date||""))}
function perForDate(d){const p=PERIODS.find(p=>d>=p.from&&d<=p.to)||PERIODS.find(p=>d<p.from)||PERIODS[PERIODS.length-1];return p}
function applyOverrides(){
  /* séances dupliquées (créées par un éducateur) : présentes dans OVR avec data.dup, absentes des séances d'origine */
  Object.entries(OVR).forEach(([id,o])=>{const i=SESSIONS.findIndex(x=>x.id===id);const d=o&&o.data;
    if(d&&d.dup&&validData(d)&&i<0){const per=perForDate(d.date);const day=new Date(d.date+"T00:00:00Z").getUTCDay();SESSIONS.push({id,per:per.n,date:d.date,sat:day===6,dup:true,base:d.base||"",pef:per.pef||"",title:d.title,theme:d.theme||"",objs:[...d.objs],blocks:[]});SESSIONS.sort((a,b)=>a.date.localeCompare(b.date))}
    if(i>=0&&SESSIONS[i].dup&&!d){SESSIONS.splice(i,1);if(currentId===id)currentId=null}});
  SESSIONS.forEach(s=>{if(!ORIG[s.id])ORIG[s.id]=snapshot(s);const o=OVR[s.id];const use=o&&validData(o.data);const src=use?o.data:ORIG[s.id];
  s.title=src.title;s.theme=src.theme||"";s.objs=[...src.objs];s.note=src.note||"";s.blocks=src.blocks.map(b=>({...blk(b)}));s.mod=use&&!s.dup?{by:o.by||"",ts:o.ts||0}:null;if(s.dup&&o)s.by=o.by||""})}
function rerender(){const id=document.querySelector(".view.active")?.id;if(id==="view-seances")renderSessions();else if(id==="view-guide")renderGuide()}
async function loadOverrides(){try{const r=await fetch(`${API}?seances=${encodeURIComponent(CAT.code)}`,{cache:"no-store"});const arr=await r.json();if(!Array.isArray(arr))return;let ch=false;
  arr.forEach(x=>{if(!x||!x.id)return;const cur=OVR[x.id];if(!cur||(x.ts||0)>(cur.ts||0)){OVR[x.id]={data:x.data||null,by:x.by||"",ts:x.ts||0};ch=true}});
  if(ch){set("ovr",OVR);applyOverrides();if(QS.has("seance")&&!EDU_MODE&&SESSIONS.some(x=>x.id===QS.get("seance"))){EDU_MODE=true;renderAll()}else rerender()}}catch(e){}}
async function saveOverride(id,data,by){const ts=Date.now();OVR[id]={data,by,ts};set("ovr",OVR);applyOverrides();
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify({seances:1,cat:CAT.code,id,data,by,ts}),headers:{"Content-Type":"text/plain;charset=utf-8"}});const j=await r.json();if(!j.ok)throw new Error(j.error||"save");toast(data?"Séance enregistrée et partagée avec le club":"Séance d'origine rétablie pour tout le club")}
  catch(e){toast("Enregistrée sur cet appareil ; le partage réessaiera plus tard")}}

/* ---------- Message WhatsApp ---------- */
function waMessage(s,detail){
  /* Symboles typographiques non-emoji uniquement (★ ◆ ✦ ● ✓ ➜) : tout caractère à présentation emoji (⚽ ▶ ✔ 🎯…) arrive en « ? » sur WhatsApp Mac via un lien wa.me.
     Le lien vers la fiche complète est placé en haut, avant le repli « Lire la suite » de WhatsApp. */
  const st=settings();const plateau=isPlateau(s);
  const dateTxt=cap(fmtLong(s.date));
  const rdv=(s.sat?st.hSam:st.hMer);
  const lines=[];const lk=sessionLink(s);
  lines.push(`★ *PAU FC ${CAT.code} · ${dateTxt}*`);
  if(plateau){
    const info=get("plateauInfo:"+s.id,{lieu:"",heure:""});
    if(MATCH_ON){lines[0]=`★ *MATCH ${CAT.code} · ${dateTxt}*`;matchWaLines(s).forEach(l=>lines.push(l));if(lk)lines.push(`➜ Fiche du match (équipe, déroulé) : ${lk}`)}
    else{lines.push(`*PLATEAU DISTRICT*${info.lieu?` · ${info.lieu}`:""}${info.heure?` · RDV ${info.heure}`:""}`);
    lines.push(`_${PLATEAU.theme}_`);
    if(lk)lines.push(`➜ Fiche complète : ${lk}`)}
    lines.push("","◆ *Déroulé*");
    PLATEAU.blocks.forEach((b,i)=>lines.push(`${i+1}. ${b.t} ${b.name}`));
    lines.push("","✦ *À veiller*");PLATEAU.veiller.forEach(v=>lines.push(`- ${v}`));lines.push("",`● *À prévoir* : ${PLATEAU.mat.join(", ")}`);
  }else{
    const blocks=expandBlocks(s);
    lines.push(`◆ *${s.title}*`);lines.push(`_${s.theme}_`);
    if(rdv||st.lieu)lines.push(`${[rdv?`RDV ${rdv}`:"",st.lieu].filter(Boolean).join(" · ")}`);
    if(s.mod&&s.mod.by)lines.push(`Séance ajustée par ${s.mod.by}`);
    if(s.nogk)lines.push(`◆ *Sans gardien* (spécifique gardiens) : petits buts, cibles ou zones d'arrivée`);
    if(s.note)lines.push(`✦ *Consignes du référent* : ${s.note}`);
    if(lk)lines.push(`➜ Fiche complète (schémas, consignes, matériel) : ${lk}`);
    lines.push("",`◆ *Déroulé (${blocks.reduce((a,b)=>a+b.dur,0)}')*`);
    blocks.forEach((b,i)=>lines.push(`${i+1}. ${b.dur}' *${b.name}*${b.kind!=="accueil"&&b.kind!=="calme"&&b.desc?` — ${firstSentence(b.desc)}`:""}`));
    lines.push("","★ *Objectifs du jour*");s.objs.forEach(o=>lines.push(`- ${o}`));
    lines.push("","✦ *À veiller*");blocks.filter(b=>["atelier","defi","match","eveil"].includes(b.kind)&&b.veiller).forEach(b=>lines.push(`- ${b.name} : ${b.veiller}`));
    lines.push("",`● *Matériel* : ${collectMat(blocks).join(", ")}`);
    lines.push("",`★ *Message éducatif* : ${s.pef}`);
  }
  if(st.signature)lines.push("",st.signature);
  return lines.join("\n");
}

  q("edCancel").addEventListener("click",()=>{editId=null;draft=null;renderSheet()});
  q("edSave").addEventListener("click",()=>{const by=q("edBy").value.trim()||get("who","")||"l'éducateur";if(q("edBy").value.trim())set("who",by);
    const data={title:draft.title.trim()||real.title,theme:draft.theme.trim(),objs:draft.objs.length?draft.objs:real.objs,note:(draft.note||"").trim(),blocks:draft.blocks.map(blk)};if(real.dup){data.dup=true;data.date=real.date;data.base=real.base||""}
    if(!validData(data)){toast("Séance incomplète");return}
    const orig=ORIG[real.id];const same=!real.dup&&JSON.stringify(data)===JSON.stringify({title:orig.title,theme:orig.theme,objs:orig.objs,note:orig.note||"",blocks:orig.blocks.map(blk)});
    editId=null;draft=null;saveOverride(real.id,same?null:data,by).then(()=>renderSessions());renderSessions()});
  const dl=q("edDelete");if(dl)dl.addEventListener("click",()=>{if(dl.dataset.armed!=="1"){dl.dataset.armed="1";dl.textContent="Confirmer la suppression ?";dl.style.color="#8A1F1F";return}const by=q("edBy").value.trim()||get("who","")||"l'éducateur";editId=null;draft=null;currentId=null;saveOverride(real.id,null,by).then(()=>renderSessions());renderSessions()});
  const rs=q("edReset");if(rs)rs.addEventListener("click",()=>{if(rs.dataset.armed!=="1"){rs.dataset.armed="1";rs.textContent="Confirmer le rétablissement ?";return}const by=q("edBy").value.trim()||get("who","")||"l'éducateur";editId=null;draft=null;saveOverride(real.id,null,by).then(()=>renderSessions());renderSessions()});
}

/* ---------- Vue Bibliothèque ---------- */
let libFin=null,libQ="";
function renderBiblio(){
  const v=document.getElementById("view-biblio");
  const ids=Object.keys(GAMES);
  const counts={};ids.forEach(id=>{const f=finOf(id);counts[f]=(counts[f]||0)+1});
  const chips=`<button class="perchip" data-fin="" aria-pressed="${!libFin}"><b>Tout</b><span>${ids.length} jeux</span></button>`+FINALITES.filter(f=>counts[f.id]).map(f=>`<button class="perchip" data-fin="${f.id}" aria-pressed="${libFin===f.id}"><b>${counts[f.id]}</b><span>${esc(f.name)}</span><small>${esc(f.desc)}</small></button>`).join("");
  const q=libQ.toLowerCase();
  const shown=ids.filter(id=>(!libFin||finOf(id)===libFin)&&(!q||`${GAMES[id].name} ${GAMES[id].desc||""} ${GAMES[id].src||""}`.toLowerCase().includes(q)));
  const ret=get("libReturn",null);
  const cards=shown.map(id=>{const g=GAMES[id];return `<article class="block libcard" id="lib-${id}">
     <div>${g.schema?`<div class="schema">${renderSchema(g.schema)}</div>`:`<div class="schema" style="display:grid;place-items:center;min-height:120px;color:var(--muted);font-size:14px">${g.kind==="accueil"?"🤝 Cercle d'accueil":"🙌 Cercle de fin"}</div>`}</div>
     <div>
       <div class="when"><span class="t num">${g.dur}'</span><span class="kind k-${g.kind}">${KIND_LABEL[g.kind]}</span><span class="chip mer">${esc(finName(finOf(id)))}</span></div>
       <h3>${esc(g.name)}</h3>${g.src?`<p class="src">${esc(g.src)}</p>`:""}
       <p class="desc">${esc(g.desc||"")}</p>
     </div>
     <div class="more">${g.org||g.var?`<dl>${g.org?`<dt>Organisation</dt><dd>${esc(g.org)}</dd>`:""}${g.var?`<dt>Variantes</dt><dd>${esc(g.var)}</dd>`:""}</dl>`:""}
       ${g.veiller?`<div class="veiller"><b>Veiller à</b> · ${esc(g.veiller)}</div>`:""}
       <p class="note" style="margin-top:8px">${g.mat?`Matériel : ${g.mat.map(esc).join(", ")} · `:""}Utilisé dans ${SESSIONS.filter(s=>s.blocks.some(b=>b.g===id)).length} séance(s) de l'année.</p>
     </div></article>`}).join("");
  v.innerHTML=`<div class="eyebrow">Liste des ateliers ${CAT.code}</div><h2 style="margin-top:4px">Tous les jeux et ateliers, par finalité</h2>
   <p class="note" style="margin-top:8px">Chaque jeu est classé selon ce qu'il fait progresser. Pour remplacer un jeu dans une séance : ouvre la séance, <b>✏️ Modifier</b>, puis choisis dans la liste — les jeux de même finalité sont proposés en premier.${ret?` <button class="btn ghost small" id="libBack">← Revenir à la séance en cours de modification</button>`:""}</p>
   <div class="perbar" style="margin-top:12px">${chips}</div>
   <div class="field" style="max-width:420px"><input id="libQ" type="search" value="${esc(libQ)}" placeholder="Rechercher un jeu (nom, consigne, thème FFF…)" aria-label="Rechercher"></div>
   <div class="sheet" style="margin-top:14px"><div style="padding:10px 20px 0">${LEGEND}</div><div class="blocks">${cards||`<p class="note" style="padding:20px">Aucun jeu ne correspond.</p>`}</div></div>`;
  v.querySelectorAll(".perchip[data-fin]").forEach(b=>b.addEventListener("click",()=>{libFin=b.dataset.fin||null;renderBiblio()}));
  const qi=document.getElementById("libQ");qi.addEventListener("input",()=>{libQ=qi.value;clearTimeout(renderBiblio._t);renderBiblio._t=setTimeout(()=>{renderBiblio();const n=document.getElementById("libQ");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)});
  const lb=document.getElementById("libBack");if(lb)lb.addEventListener("click",()=>{set("libReturn",null);currentId=ret;showTab("view-seances")});
}

/* ---------- Vue Progression (ex-Profils) ---------- */
let profPer=null;
function starsOf(k,per){k.stars=k.stars||{};if(!k.stars.p1&&Object.keys(k.stars).some(x=>FACETS.find(f=>f.id===x))){k.stars={p1:k.stars}}k.stars["p"+per]=k.stars["p"+per]||{};return k.stars["p"+per]}
function noteOf(k,per){k.notes=k.notes||{};if(k.note&&!k.notes.p1){k.notes.p1=k.note;delete k.note}return k.notes["p"+per]||""}
function carnetOfKid(k,per){const P=PERIODS[per-1];const next=PERIODS[per];const st=starsOf(k,per);const y1=D(P.from).getFullYear(),y2=D(P.to).getFullYear();
  return {title:"CARNET DE PROGRESSION",line:`${CAT.code} · Période ${per} « ${P.name} » · du ${fmtDay(P.from)}${y1!==y2?" "+y1:""} au ${fmtDay(P.to)} ${y2}`,name:k.name||"—",
    sub:"a participé aux séances de la période et a travaillé :",items:P.tech,
    facets:FACETS.map(f=>({name:f.name,desc:f.desc,n:st[f.id]||0})),
    legend:"1 étoile : découvre · 2 étoiles : réussit souvent · 3 étoiles : réussit vite et en match — on se compare à soi-même, jamais aux autres.",
    mot:noteOf(k,per),educ:settings().signature||get("who",""),
    foot:(next?`Prochaine période : « ${next.name} » du ${fmtDay(next.from)} au ${fmtDay(next.to)} · message éducatif : ${next.pef.split(" — ")[0]}. `:"Merci pour cette belle saison ! ")+"À bientôt au Pau FC !"}}
function renderProfils(){
  const v=document.getElementById("view-profils");const kids=get("kids",[]);if(!profPer)profPer=currentPer();
  const rows=kids.map((k,i)=>`<tr><td class="name"><input type="text" id="kid-${i}" value="${esc(k.name)}" data-i="${i}" aria-label="Prénom"></td>
    ${FACETS.map(f=>`<td data-l="${esc(f.name)}"><span class="stars" data-i="${i}" data-f="${f.id}">${[1,2,3].map(n=>`<button class="${(starsOf(k,profPer)[f.id]||0)>=n?'on':''}" data-n="${n}" aria-label="${n} étoile${n>1?'s':''}">★</button>`).join("")}</span></td>`).join("")}
    <td data-l="Mot de l'éducateur"><input type="text" id="note-${i}" value="${esc(noteOf(k,profPer))}" data-i="${i}" placeholder="le mot de l'éducateur (carnet)" aria-label="Mot de l'éducateur"></td>
    <td data-l="Carnet" style="white-space:nowrap"><span style="display:inline-flex;gap:6px;align-items:center"><button class="btn ghost small" data-carnet="${i}" title="Carnet de cet enfant">📄 Carnet</button><button class="del" data-i="${i}" aria-label="Retirer" title="Retirer cet enfant">×</button></span></td></tr>`).join("");
  const rallye=sessionsOf(profPer).find(x=>x.blocks.some(b=>/rallye|bilan/.test(b.g)));
  v.innerHTML=`<div class="eyebrow">Bilan de période · ${esc(GUIDE.bilanName)}${rallye?` (${fmtLong(rallye.date)})`:""}</div><h2 style="margin-top:4px">Progression des enfants</h2>
   <div class="perbar" style="margin-top:12px">${PERIODS.map(p=>`<button class="perchip" data-pp="${p.n}" aria-pressed="${p.n===profPer}"><b>P${p.n}</b><span>${esc(p.name)}</span><small>${fmtShort(p.from)} → ${fmtShort(p.to)}</small></button>`).join("")}</div>
   <p style="margin-top:8px;color:var(--muted)">${GUIDE.starsNote} Le <b>mot de l'éducateur</b> et les étoiles de la période sont repris sur le carnet de progression remis aux parents.</p>
   <div class="card" style="margin-top:16px">
     <div class="facets" style="margin-top:0">${FACETS.map(f=>`<div class="facet"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></div>`).join("")}</div>
     <div class="tbl-wrap"><table class="prof-table"><thead><tr><th>Enfant</th>${FACETS.map(f=>`<th>${esc(f.name)}</th>`).join("")}<th>Mot de l'éducateur · P${profPer}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="8" class="note" style="padding:14px 8px">Aucun enfant pour l'instant — ajoute les prénoms ci-dessous.</td></tr>`}</tbody></table></div>
     <div class="prof-actions"><button class="btn ghost" id="addKid">+ Ajouter un enfant</button><button class="btn ghost" id="bulkKids">Coller une liste de prénoms</button><button class="btn wa" id="allCarnets" style="background:var(--navy);color:#fff">📄 Carnets de la période ${profPer} (PDF / impression)</button></div>
     <div id="bulkBox" hidden class="field"><label for="bulkArea">Un prénom par ligne</label><textarea id="bulkArea" rows="5"></textarea><button class="btn ghost" id="bulkOk" style="align-self:flex-start">Ajouter</button></div>
   </div>
   <p class="note" style="margin-top:12px">Le carnet reprend le format du carnet de stage : une page A4 par enfant (blason, apprentissages de la période, étoiles, mot de l'éducateur, signatures), à télécharger en PDF ou à imprimer sur papier épais. La signature de l'onglet Réglages sert de nom d'éducateur.</p>`;
  const persist=()=>set("kids",kids);
  v.querySelectorAll("input[id^=kid-]").forEach(i=>i.addEventListener("change",e=>{kids[+e.target.dataset.i].name=e.target.value;persist()}));
  v.querySelectorAll("input[id^=note-]").forEach(i=>i.addEventListener("change",e=>{const k=kids[+e.target.dataset.i];noteOf(k,profPer);k.notes["p"+profPer]=e.target.value;persist()}));
  v.querySelectorAll(".stars button").forEach(b=>b.addEventListener("click",()=>{const sp=b.parentElement;const k=kids[+sp.dataset.i];const st=starsOf(k,profPer);const n=+b.dataset.n;st[sp.dataset.f]=st[sp.dataset.f]===n?0:n;persist();renderProfils()}));
  v.querySelectorAll(".perchip[data-pp]").forEach(b=>b.addEventListener("click",()=>{profPer=+b.dataset.pp;renderProfils()}));
  v.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{kids.splice(+b.dataset.i,1);persist();renderProfils()}));
  const openCarnets=list=>{if(!list.length){toast("Aucun enfant dans la liste");return}showCarnets(list.map(k=>carnetOfKid(k,profPer)),{title:`${CAT.code} · période ${profPer}`,fname:`carnets-${CAT.code.toLowerCase()}-periode${profPer}.pdf`,back:()=>{restoreMain();showTab("view-profils")}})};
  v.querySelectorAll("[data-carnet]").forEach(b=>b.addEventListener("click",()=>openCarnets([kids[+b.dataset.carnet]])));
  document.getElementById("allCarnets").addEventListener("click",()=>openCarnets(kids.filter(k=>k.name)));
  document.getElementById("addKid").addEventListener("click",()=>{kids.push({name:"",stars:{}});persist();renderProfils();const last=v.querySelector(`#kid-${kids.length-1}`);if(last)last.focus()});
  document.getElementById("bulkKids").addEventListener("click",()=>{document.getElementById("bulkBox").hidden=false});
  document.getElementById("bulkOk").addEventListener("click",()=>{document.getElementById("bulkArea").value.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(n=>kids.push({name:n,stars:{}}));persist();renderProfils()});
}
function restoreMain(){const m=document.querySelector("main");if(!document.getElementById("view-guide")){m.innerHTML=`<section class="view" id="view-guide" role="tabpanel" aria-labelledby="tab-guide"></section><section class="view" id="view-seances" role="tabpanel" aria-labelledby="tab-seances"></section><section class="view" id="view-biblio" role="tabpanel" aria-labelledby="tab-biblio"></section><section class="view" id="view-profils" role="tabpanel" aria-labelledby="tab-profils"></section><section class="view" id="view-reglages" role="tabpanel" aria-labelledby="tab-reglages"></section>`}}

/* ---------- Vue Réglages ---------- */
function renderReglages(){
  const v=document.getElementById("view-reglages");const ed=educators();const st=settings();
  const rows=ed.map((e,i)=>`<div class="edu-row"><input type="text" id="edn-${i}" value="${esc(e.name)}" placeholder="Prénom" aria-label="Prénom de l'éducateur"><input type="tel" id="edp-${i}" value="${esc(e.phone)}" placeholder="06 12 34 56 78" aria-label="Numéro WhatsApp"><button class="del" data-i="${i}" aria-label="Retirer">×</button></div>`).join("");
  v.innerHTML=`<div class="eyebrow">Réglages</div><h2 style="margin-top:4px">Éducateurs &amp; envoi</h2>
  <div class="settings-grid">
    <div class="card"><h3>Éducateurs ${CAT.code}</h3><p class="note">Un bouton WhatsApp par personne sur chaque fiche. Les numéros restent sur cet appareil.</p>
      <div class="edu-list">${rows||'<p class="note">Aucun éducateur saisi.</p>'}</div>
      <div class="prof-actions"><button class="btn ghost" id="addEdu">+ Ajouter un éducateur</button></div>
    </div>
    <div class="card"><h3>Infos dans le message</h3>
      <div class="field"><label for="setLieu">Lieu d'entraînement</label><input id="setLieu" type="text" value="${esc(st.lieu)}" placeholder="Terrain synthétique n°2"></div>
      <div class="field"><label for="setHMer">Horaire en semaine</label><input id="setHMer" type="text" value="${esc(st.hMer)}" placeholder="14h00 - 15h00"></div>
      <div class="field"><label for="setHSam">Horaire du samedi (entraînement)</label><input id="setHSam" type="text" value="${esc(st.hSam)}" placeholder="10h00 - 11h00"></div>
      <div class="field"><label for="setSign">Signature (aussi nom de l'éducateur sur les carnets)</label><input id="setSign" type="text" value="${esc(st.signature)}" placeholder="Benjamin · Pau FC ${CAT.code}"></div>
      <div class="field"><label for="setUrl">Adresse publique de cette page (mise dans le message)</label><input id="setUrl" type="url" value="${esc(st.url)}" placeholder="https://…/seances-u7.html"><span class="note">Le lien ouvre directement la fiche du jour : l'éducateur peut la lire et, si besoin, la modifier (le changement est partagé).</span></div>
      <div class="prof-actions"><button class="btn ghost" id="saveSet">Enregistrer</button></div>
    </div>
    <div class="card"><h3>Comment les éducateurs voient la fiche</h3>
      <p>Le message WhatsApp contient le déroulé en texte et un lien du type <code>…/${CAT.file}?seance=…</code>. En l'ouvrant, l'éducateur tombe directement sur la fiche du jour avec les schémas ; il peut ouvrir la liste des ateliers et modifier la séance (jeu, durée, textes) : la modification est enregistrée dans le classeur du club et visible par tous. Cette page est publiée sur le site du club (dépôt AcademiePauFC).</p>
    </div>
    <div class="card"><h3>Sources des jeux</h3><ul class="source-list">${SOURCES.map(s=>`<li>${s.u?`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.t)}</a>`:esc(s.t)}</li>`).join("")}</ul>
      <div class="prof-actions"><button class="btn ghost small" id="resetAll">Effacer les données de cet appareil</button></div>
    </div>
  </div>`;
  const persist=()=>set("educs",ed);
  ed.forEach((e,i)=>{document.getElementById(`edn-${i}`).addEventListener("change",ev=>{e.name=ev.target.value;persist()});document.getElementById(`edp-${i}`).addEventListener("change",ev=>{e.phone=ev.target.value;persist()})});
  v.querySelectorAll(".del").forEach(b=>b.addEventListener("click",()=>{ed.splice(+b.dataset.i,1);persist();renderReglages()}));
  document.getElementById("addEdu").addEventListener("click",()=>{ed.push({name:"",phone:""});persist();renderReglages();document.getElementById(`edn-${ed.length-1}`).focus()});
  document.getElementById("saveSet").addEventListener("click",()=>{set("settings",{lieu:document.getElementById("setLieu").value,hMer:document.getElementById("setHMer").value,hSam:document.getElementById("setHSam").value,signature:document.getElementById("setSign").value,url:document.getElementById("setUrl").value.trim()});toast("Réglages enregistrés")});
  document.getElementById("resetAll").addEventListener("click",()=>{const ovr=store.ovr;store={ovr};save();toast("Données effacées");renderAll()});
}

/* ---------- Onglets ---------- */
function showTab(id){
  restoreMain();document.querySelector("header.top").hidden=false;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.getAttribute("aria-controls")===id));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  if(!EDU_MODE)set("tab",id);
  if(id==="view-seances")renderSessions();else if(id==="view-profils")renderProfils();else if(id==="view-reglages")renderReglages();else if(id==="view-biblio")renderBiblio();else renderGuide();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>showTab(t.getAttribute("aria-controls"))));
const QS=new URLSearchParams(location.search);
let EDU_MODE=QS.has("seance")&&SESSIONS.some(x=>x.id===QS.get("seance"));
applyOverrides();
function renderAll(){renderGuide();if(EDU_MODE){document.documentElement.classList.add("edu");currentId=QS.get("seance");curPer=perOf(SESSIONS.find(x=>x.id===currentId)).n;showTab("view-seances")}else showTab(get("tab","view-guide"))}
renderAll();
loadOverrides();if(typeof loadCal==="function")loadCal();
/* Aide au défilement pour les tableaux plus larges que l'écran : ombre sur le bord droit,
   barre de défilement toujours visible et une courte mention sous le tableau. */
function addScrollArrows(){document.querySelectorAll('.tbl-wrap,.sess-list').forEach(el=>{
  const over=el.scrollWidth>el.clientWidth+4;
  let bar=el.nextElementSibling;if(!(bar&&bar.classList.contains('scrollhint')))bar=null;
  el.classList.toggle('has-more',over);
  if(!over){if(bar)bar.hidden=true;return}
  if(!bar){bar=document.createElement('div');bar.className='scrollhint';bar.innerHTML='<span aria-hidden="true">↔</span> Tableau plus large que l’écran : faites-le glisser vers la gauche pour voir toutes les colonnes.';el.parentNode.insertBefore(bar,el.nextSibling);
    const upd=()=>el.classList.toggle('at-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4);el.addEventListener('scroll',upd,{passive:true});upd()}
  bar.hidden=false})}
const _sh=new MutationObserver(()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});_sh.observe(document.querySelector('main'),{childList:true,subtree:true});window.addEventListener('resize',()=>{clearTimeout(_sh._t);_sh._t=setTimeout(addScrollArrows,120)});setTimeout(addScrollArrows,300);



</script>

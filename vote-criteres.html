<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vote des critères · Pau FC</title>
<style>
:root{--navy:#0B2A4A;--yel:#F2C200;--ink:#13213A;--mut:#5B6577;--line:#DDE2EA;--bg:#F3F5F9;--card:#fff;--g:#1E8A4C;--o:#E07B00;--r:#C62828;--gl:#E3F4EA;--ol:#FFF0DC;--rl:#FBE3E3}
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:var(--navy);color:#fff;padding:16px 16px 0}
.hw{max-width:980px;margin:0 auto}.top{display:flex;gap:12px;align-items:center}.top img{width:48px;height:48px}
.k{color:var(--yel);font-weight:700;letter-spacing:1.5px;font-size:11px;text-transform:uppercase}h1{margin:2px 0 0;font-size:22px;text-transform:uppercase;letter-spacing:.3px}
.tabs{display:flex;gap:4px;margin-top:12px}.tabs button{background:none;border:0;color:#C9D4E3;font-weight:700;font-size:14px;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;text-transform:uppercase}
.tabs button.on{color:var(--yel);border-color:var(--yel)}
main{max-width:980px;margin:0 auto;padding:16px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px}
.pg{background:var(--gl);color:var(--g)}.po{background:var(--ol);color:var(--o)}.pr{background:var(--rl);color:var(--r)}
.who{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.who input{flex:1;min-width:180px;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.cats button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--navy)}
.cats button.on{background:var(--yel);border-color:var(--yel)}.cats small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.fam{margin:0 0 14px}.fh{background:var(--navy);color:#fff;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;padding:8px 12px;border-left:4px solid var(--yel);border-radius:8px 8px 0 0}
.row{background:#fff;border:1px solid var(--line);border-top:0;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.row:last-child{border-radius:0 0 8px 8px}.row b{display:block;font-size:15px}.row .d{color:var(--mut);font-size:13.5px;line-height:1.35}
.num{color:#99A3B3;font-weight:700;margin-right:4px}
.vb{display:flex;gap:6px}.vb button{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800;font-size:12px;color:var(--mut)}
.vb button[data-c=g].on{background:var(--g);border-color:var(--g);color:#fff}.vb button[data-c=o].on{background:var(--o);border-color:var(--o);color:#fff}.vb button[data-c=r].on{background:var(--r);border-color:var(--r);color:#fff}
.cm{grid-column:1/-1}.cm input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#FFFAF2}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#EEF1F5;min-width:160px}.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.res{grid-template-columns:1fr 220px 130px}.verd{font-weight:800;font-size:12.5px;text-align:center;padding:5px 8px;border-radius:8px;text-transform:uppercase}
.vg{background:var(--gl);color:var(--g)}.vo{background:var(--ol);color:var(--o)}.vr{background:var(--rl);color:var(--r)}.vn{background:#EEF1F5;color:var(--mut)}
.cmts{grid-column:1/-1;font-size:13px;color:#7A4A00;background:#FFF6E8;border-radius:6px;padding:6px 10px}
.stat{font-size:13px;color:var(--mut);margin:-4px 0 12px}
.sync{position:fixed;right:12px;bottom:12px;background:var(--navy);color:#fff;font-size:12.5px;padding:8px 12px;border-radius:99px;opacity:.92}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.sum b{font-size:26px;display:block}
@media(max-width:640px){.row{grid-template-columns:1fr}.vb{justify-content:flex-start}.res{grid-template-columns:1fr}.bar{min-width:0}h1{font-size:18px}}
.pbox{grid-template-columns:1fr}.pform{display:flex;gap:8px;flex-wrap:wrap}.pform select,.pform input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#FFFAF2}.pform input{flex:1;min-width:200px}.pform button{padding:8px 14px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:14px}.pitem{display:flex;gap:8px;align-items:center;font-size:14px;background:#F5F3EC;border-radius:8px;padding:6px 10px}.pf{font-size:11px;font-weight:700;text-transform:uppercase;color:#9A7400}.pdel{margin-left:auto;border:0;background:none;font-size:18px;cursor:pointer;color:#888}
.who input.need{border:2px solid #C62828;background:#FFF5F5}.needt{font-size:13px;font-weight:700;color:#C62828}@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shk .25s 2}.done{margin:18px 0 30px;text-align:center}.done button{width:100%;max-width:520px;padding:14px 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;cursor:pointer}.dok{background:#E3F1E8;color:#1F6B3A;font-weight:700;border-radius:10px;padding:12px 14px;margin:0 auto 10px;max-width:520px;font-size:14px;line-height:1.4}.who2{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}.who2 summary{font-weight:700;cursor:pointer}.wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.wl span{background:#F5F3EC;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;color:#8A8F99}.wl span.on{color:var(--navy)}.wl small{font-weight:500;color:#646B78}.cmts p{margin:2px 0}.cmts b{display:inline;font-size:13px}</style></head><body>

const CATS=[["u7","U7","5-6 ans"],["u89","U8 · U9","7-8 ans"],["u1011","U10 · U11","9-10 ans"],["u1213","U12 · U13","11-12 ans"],["u1415","U14 · U15","13-14 ans"]];
const LS="paufc-vote-v5-reunion";let st={};try{st=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){}
st.id=st.id||("v"+Math.random().toString(36).slice(2,10));st.v=st.v||{};st.c=st.c||{};st.name=st.name||"";st.p=st.p||{};st.cat=st.cat||"u7";
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}};saveLocal();
const QS=new URLSearchParams(location.search);let tab=QS.has("resultats")?"res":"vote";let rows=[];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sync=t=>{const e=document.getElementById("sync");if(!t){e.hidden=true;return}e.textContent=t;e.hidden=false};
let tmr=null,pending=false;
function needName(){const i=document.getElementById("name");if(i){i.classList.add("need","shake");i.focus();i.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>i.classList.remove("shake"),600)}sync("Écris ton prénom en haut de la page pour voter");setTimeout(()=>{if(!pending)sync()},2500)}
function queue(){pending=true;sync("Enregistrement…");clearTimeout(tmr);tmr=setTimeout(send,900)}
async function send(){const payload={seances:1,cat:CAT,id:st.id,data:{name:st.name,v:st.v,c:st.c,p:st.p,done:st.done||0},by:st.name||"anonyme",ts:Date.now()};
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});const j=await r.json().catch(()=>({}));if(j&&j.error)throw 0;pending=false;sync("Vote enregistré ✓");setTimeout(()=>{if(!pending)sync()},1500)}
  catch(e){sync("Pas de réseau : ton vote est gardé sur ce téléphone, nouvel essai…");setTimeout(send,6000)}}
async function load(){try{const r=await fetch(`${API}?seances=${encodeURIComponent(CAT)}`,{cache:"no-store"});const a=await r.json();if(Array.isArray(a)){rows=a.filter(x=>x&&x.data&&(x.data.v||x.data.p));rows.forEach(x=>{x.data.v=x.data.v||{}});if(tab==="res")render()}}catch(e){}}
function catBar(){return `<div class="cats">${CATS.map(([id,n,a])=>`<button data-cat="${id}" class="${st.cat===id?"on":""}">${n}<small>${a}</small></button>`).join("")}</div>`}
function lines(c){let n=0;return DATA[c].map(f=>({f,ls:f.lines.map(l=>({...l,n:++n}))}))}
function renderVote(){const c=st.cat;const fams=lines(c);const tot=fams.reduce((a,x)=>a+x.ls.length,0);const done=fams.reduce((a,x)=>a+x.ls.filter(l=>st.v[l.id]).length,0);
  return `<div class="intro"><b>Pour chaque critère, une couleur.</b> On garde les verts, on retravaille les oranges, on enlève les rouges. Une phrase en orange aide à corriger le critère.
  <div class="legend"><span class="pill pg">V · je garde, il est pertinent</span><span class="pill po">O · j'hésite, à reformuler</span><span class="pill pr">R · à enlever</span></div>
  <div class="who"><input id="name" class="${st.name?"":"need"}" placeholder="Ton prénom (obligatoire pour voter)" value="${esc(st.name)}" autocomplete="given-name">${st.name?"":`<span class="needt">← à remplir avant de voter</span>`}</div></div>
  ${catBar()}<div class="stat">${done} / ${tot} critères votés dans cette catégorie · tu peux voter pour toutes les catégories</div>
  ${fams.map(({f,ls})=>`<div class="fam"><div class="fh">${esc(f.name)}</div>${ls.map(l=>`<div class="row" data-id="${l.id}"><div><b><span class="num">${l.n}</span>${esc(l.short)}</b><div class="d">${esc(l.name)}</div></div>
  <div class="vb">${["g","o","r"].map(k=>`<button data-c="${k}" class="${st.v[l.id]===k?"on":""}" aria-label="${{g:"vert",o:"orange",r:"rouge"}[k]}">${{g:"V",o:"O",r:"R"}[k]}</button>`).join("")}</div>
  ${st.v[l.id]==="o"||st.v[l.id]==="r"||st.c[l.id]?`<div class="cm"><input data-cm="${l.id}" placeholder="${st.v[l.id]==="r"?"Pourquoi l'enlever ? (facultatif)":"Ce que je changerais (facultatif)"}" value="${esc(st.c[l.id])}"></div>`:""}</div>`).join("")}</div>`).join("")}${propBlock(c,fams)}${doneBlock()}`}
function doneBlock(){const nv=Object.keys(st.v).length;const np=Object.values(st.p).reduce((a,x)=>a+x.length,0);return `<div class="done">${st.done?`<p class="dok">✓ Merci ${esc(st.name)} ! Ton vote ${pending?"sera envoyé dès que le réseau revient":"est bien enregistré"} : ${nv} critère${nv>1?"s":""} voté${nv>1?"s":""}${np?` · ${np} critère${np>1?"s":""} proposé${np>1?"s":""}`:""}. Tu peux encore le modifier, chaque changement est enregistré.</p>`:""}<button id="doneBtn">${st.done?"✓ Envoyer à nouveau":"✓ J'ai terminé, j'envoie mon vote"}</button></div>`}
function propBlock(c,fams){const mine=st.p[c]||[];
  return `<div class="fam prop"><div class="fh">➕ Proposer un autre critère</div><div class="row pbox"><div class="d" style="grid-column:1/-1">Un critère qui manque ? Écris-le comme une phrase d'observation (« Il/elle… »), dans une thématique existante ou une nouvelle.</div>
  ${mine.map((x,i)=>`<div class="pitem"><span class="pf">${esc(x.f)}</span>${esc(x.t)}<button class="pdel" data-pdel="${i}" aria-label="Retirer">×</button></div>`).join("")}
  <div class="pform"><select id="pf">${fams.map(({f})=>`<option>${esc(f.name)}</option>`).join("")}<option>Nouvelle thématique</option></select><input id="pt" placeholder="Ex. : Encourage ses partenaires après une erreur"><button id="padd">Ajouter</button></div></div></div>`}
function tally(id){const t={g:0,o:0,r:0,cm:[]};rows.forEach(x=>{const v=x.data.v[id];if(v)t[v]++;const c=x.data.c&&x.data.c[id];if(c)t.cm.push({n:x.data.name||"anonyme",c})});t.n=t.g+t.o+t.r;return t}
function verdict(t){if(!t.n)return ["Pas de vote","vn"];if(t.r/t.n>=.5)return ["À enlever","vr"];if(t.g/t.n>=2/3)return ["Gardé","vg"];return ["À retravailler","vo"]}
function whoVoted(fams){const ids=new Set(fams.flatMap(x=>x.ls.map(l=>l.id)));const list=rows.map(x=>({n:x.data.name||"anonyme",here:Object.keys(x.data.v||{}).filter(k=>ids.has(k)).length,all:Object.keys(x.data.v||{}).length,done:!!x.data.done})).sort((a,b)=>a.n.localeCompare(b.n,"fr"));if(!list.length)return "";return `<details class="who2"><summary>👥 Qui a voté (${list.length})</summary><div class="wl">${list.map(x=>`<span class="${x.here?"on":""}">${esc(x.n)} <small>${x.here?`${x.here} ici`:"pas cette catégorie"} · ${x.all} au total${x.done?" · ✓ terminé":""}</small></span>`).join("")}</div></details>`}
function renderRes(){const c=st.cat;const fams=lines(c);const voters=rows.filter(x=>Object.keys(x.data.v).some(k=>fams.some(f=>f.ls.some(l=>l.id===k)))).length;
  const all=fams.flatMap(x=>x.ls).map(l=>verdict(tally(l.id))[1]);const cnt=k=>all.filter(x=>x===k).length;
  return `<div class="intro"><b>Résultats en direct</b> · mis à jour toutes les 10 secondes. Règle : <span class="pill pg">Gardé</span> au moins 2 votants sur 3 en vert · <span class="pill pr">À enlever</span> au moins la moitié en rouge · <span class="pill po">À retravailler</span> sinon.</div>
  ${catBar()}<div class="stat">${voters} votant${voters>1?"s":""} sur cette catégorie · ${rows.length} au total</div>${whoVoted(fams)}
  ${(()=>{const ps=rows.flatMap(x=>((x.data.p||{})[c]||[]).map(p=>({...p,by:x.data.name||"anonyme"})));return ps.length?`<div class="fam prop"><div class="fh">➕ Critères proposés (${ps.length})</div>${ps.map(p=>`<div class="row"><div><b>${esc(p.t)}</b><div class="d">${esc(p.f)} · proposé par ${esc(p.by)}</div></div></div>`).join("")}</div>`:""})()}<div class="sum"><div><b style="color:var(--g)">${cnt("vg")}</b>gardés</div><div><b style="color:var(--o)">${cnt("vo")}</b>à retravailler</div><div><b style="color:var(--r)">${cnt("vr")}</b>à enlever</div></div>
  ${fams.map(({f,ls})=>`<div class="fam"><div class="fh">${esc(f.name)}</div>${ls.map(l=>{const t=tally(l.id);const [vt,vc]=verdict(t);const p=k=>t.n?Math.round(t[k]*100/t.n):0;
  return `<div class="row res"><div><b><span class="num">${l.n}</span>${esc(l.short)}</b><div class="d">${esc(l.name)}</div></div>
  <div class="bar">${t.n?["g","o","r"].map(k=>t[k]?`<span style="width:${p(k)}%;background:var(--${k})">${t[k]}</span>`:"").join(""):""}</div><div class="verd ${vc}">${vt}</div>
  ${t.cm.length?`<div class="cmts">${t.cm.map(x=>`<p>💬 <b>${esc(x.n)}</b> : ${esc(x.c)}</p>`).join("")}</div>`:""}</div>`}).join("")}</div>`).join("")}`}
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  const app=document.getElementById("app");const y=window.scrollY;app.innerHTML=tab==="vote"?renderVote():renderRes();window.scrollTo(0,y)}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;render();if(tab==="res")load()});
document.getElementById("app").addEventListener("click",e=>{const cb=e.target.closest("[data-cat]");if(cb){st.cat=cb.dataset.cat;saveLocal();render();window.scrollTo(0,0);return}
  if(e.target.id==="doneBtn"){if(!st.name){needName();return}if(!Object.keys(st.v).length&&!Object.keys(st.p).length){sync("Tu n'as encore voté pour aucun critère");setTimeout(()=>{if(!pending)sync()},2500);return}st.done=Date.now();saveLocal();clearTimeout(tmr);pending=true;send().then(()=>{render();const d=document.querySelector(".done");if(d)d.scrollIntoView({block:"center",behavior:"smooth"})});return}
  if(e.target.id==="padd"&&!st.name){needName();return}if(e.target.id==="padd"){const tx=document.getElementById("pt").value.trim();if(!tx){document.getElementById("pt").focus();return}const c=st.cat;(st.p[c]=st.p[c]||[]).push({f:document.getElementById("pf").value,t:tx});saveLocal();render();queue();return}
  const pd=e.target.closest("[data-pdel]");if(pd){const c=st.cat;st.p[c].splice(+pd.dataset.pdel,1);if(!st.p[c].length)delete st.p[c];saveLocal();render();queue();return}
  const vb=e.target.closest(".vb button");if(vb&&tab==="vote"&&!st.name){needName();return}if(vb&&tab==="vote"){const id=vb.closest(".row").dataset.id;const k=vb.dataset.c;st.v[id]=st.v[id]===k?undefined:k;if(!st.v[id])delete st.v[id];saveLocal();render();queue();
    if(st.v[id]==="o"){const i=document.querySelector(`[data-cm="${id}"]`);i&&i.focus()}}});
document.getElementById("app").addEventListener("input",e=>{if(e.target.id==="name"){st.name=e.target.value.trim();saveLocal();e.target.classList.toggle("need",!st.name);const nt=document.querySelector(".needt");if(nt)nt.hidden=!!st.name;if(st.name)queue();return}
  const id=e.target.dataset.cm;if(id){st.c[id]=e.target.value;if(!st.c[id])delete st.c[id];saveLocal();queue()}});
render();load();setInterval(()=>{if(tab==="res")load()},10000);
</script></body></html>

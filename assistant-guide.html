<style>

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

@media (prefers-reduced-motion:reduce){.bigmic.rec,.listen .dot,.wave i,.bubble,.listen{animation:none}}

<script>
/* ===================== réglages ===================== */
const API="https://script.google.com/macros/s/AKfycbw_lyvwhgyF-4i9jM-mNnHTCkdS-q0W92UeU7QGwgmaayAjGTtJCGB1n2K-VlgkKuEGEg/exec";
const LS="paufc-assist-guide-v1";
const S=(()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}})();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const NS="http://www.w3.org/2000/svg";
/* ===================== moteur d'animation (même principe que les défis techniques) ===================== */
function field(box,vb){const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",vb.join(" "));s.setAttribute("class","f");box.appendChild(s);
  const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||s).appendChild(e);return e};
  return {s,el,rect:(x,y,w,h,c)=>el("rect",{x,y,width:w,height:h,fill:c||"none",stroke:"rgba(255,255,255,.8)","stroke-width":.12}),
    zone:(x,y,w,h,c)=>el("rect",{x,y,width:w,height:h,fill:c||"rgba(255,255,255,.12)",stroke:"rgba(255,255,255,.5)","stroke-width":.08,"stroke-dasharray":".4 .3"}),
    cone:(x,y,c)=>el("polygon",{points:`${x-.32},${y+.28} ${x+.32},${y+.28} ${x},${y-.38}`,fill:c||"#FF9100"}),
    goal:(x,y,w,vert)=>vert?el("rect",{x:x-.2,y:y-w/2,width:.4,height:w,fill:"#fff"}):el("rect",{x:x-w/2,y:y-.2,width:w,height:.4,fill:"#fff"}),
    ballS:(x,y)=>el("circle",{cx:x,cy:y,r:.3,fill:"#fff",stroke:"#14213A","stroke-width":.07}),
    txt:(x,y,t,o)=>{o=o||{};const e=el("text",{x,y,"text-anchor":o.a||"middle","font-size":o.s||.6,fill:o.c||"rgba(255,255,255,.92)","font-weight":700,"font-family":"Inter,Arial"});e.textContent=t;return e}}}
const lerp=(a,b,u)=>a+(b-a)*u;
function at(p,t){if(t<=p[0][0])return [p[0][1],p[0][2]];for(let i=1;i<p.length;i++)if(t<=p[i][0]){const a=p[i-1],b=p[i],u=(t-a[0])/((b[0]-a[0])||1);return [lerp(a[1],b[1],u),lerp(a[2],b[2],u)]}const z=p[p.length-1];return [z[1],z[2]]}
function lead(p,d){return p.map((q,i)=>{const n=p[Math.min(i+1,p.length-1)],r=p[Math.max(i-1,0)];let dx=n[1]-r[1],dy=n[2]-r[2];const L=Math.hypot(dx,dy)||1;return [q[0],q[1]+dx/L*(d||.8),q[2]+dy/L*(d||.8)]})}
function anim(box,F,A){const ctl=document.createElement("div");ctl.className="ctl";const play=document.createElement("button");play.className="play";play.textContent="▶ Voir l'atelier";ctl.appendChild(play);const say=document.createElement("div");say.className="say";box.appendChild(ctl);box.appendChild(say);
  const R=A.actors.map(a=>{const g=F.el("g",{});const c=a.kind==="def"?"#E53935":a.kind==="mate"?"#7E57C2":"#1E56C9";F.el("circle",{r:.55,fill:c,stroke:"#fff","stroke-width":.12},g);if(a.label){const l=F.el("text",{"text-anchor":"middle","font-size":.55,fill:"#fff","font-weight":800,"font-family":"Inter,Arial",dy:".2"},g);l.textContent=a.label}
    const ball=a.ball?F.el("circle",{r:.3,fill:"#fff",stroke:"#14213A","stroke-width":.07}):null;return {a,g,ball}});
  let raf=0,st=null,run=false;const draw=t=>{R.forEach(o=>{const [x,y]=at(o.a.path,t);o.g.setAttribute("transform",`translate(${x},${y})`);if(o.ball){const [bx,by]=at(o.a.ball,t);o.ball.setAttribute("cx",bx);o.ball.setAttribute("cy",by)}});let s="";(A.say||[]).forEach(([tt,x])=>{if(t>=tt)s=x});say.textContent=s;if(A.tick)A.tick(t)};
  play.onclick=()=>{if(run){cancelAnimationFrame(raf);run=false;play.textContent="▶ Revoir";return}run=true;play.textContent="⏸ Pause";st=null;const fr=ts=>{if(st==null)st=ts;const t=(ts-st)/1000;draw(Math.min(t,A.T));if(t<A.T+.4)raf=requestAnimationFrame(fr);else{run=false;play.textContent="▶ Revoir"}};raf=requestAnimationFrame(fr)};
  draw(0);say.textContent=A.intro||""}
/* ===================== la bibliothèque animée U7-U9 =====================
   type : mt = mise en train · at = atelier · jeu = match · th = thèmes (conduite, dribble, surfaces, duel, passe, frappe, motricite, defense, finition) */
const LIB=[
{id:"feux",nom:"Les feux de la ville",type:"mt",cats:["U7","U8","U9"],th:["conduite","surfaces","motricite"],col:"#4FC3F7",
 html:`<p>Carré de <b>15 × 15 m</b>, chacun son ballon. L'éducateur annonce une couleur :</p><ul><li><b>Vert</b> : intérieur du pied · <b>orange</b> : extérieur · <b>rouge</b> : stop, semelle.</li><li><b>Tunnel</b> : passer entre deux plots et repartir.</li></ul><p><b>On regarde</b> : petites touches, tête levée.</p>`,
 an:F=>{F.rect(0,0,15,15);[[0,0],[15,0],[0,15],[15,15]].forEach(([x,y])=>F.cone(x,y));F.cone(6.5,7.5,"#FFEB3B");F.cone(8.5,7.5,"#FFEB3B");const L=F.el("circle",{cx:17.2,cy:1.2,r:.9,fill:"#4CAF50",stroke:"#fff","stroke-width":.1});
  const p1=[[0,2,2],[2,6,3],[4,12,2.5],[6,12,7],[7.5,12,7],[9,9.5,7.6],[10,7.5,7.6],[11.5,5,6],[13,3,11],[15,7,13]],p2=[[0,13,13],[2,9,12],[4,3,13],[6,2.5,8],[7.5,2.5,8],[9,4,4],[11,8,2],[13,12,4],[15,13,9]],p3=[[0,7,4],[2,10,10],[4,5,10],[6,7,12],[7.5,7,12],[9,7.5,7.6],[10,7.5,7.6],[11,7.5,5],[13,10,6],[15,4,7]];
  return {vb:[-2,-2,21,19],T:15,intro:"Chacun conduit son ballon. Le feu change de couleur.",actors:[{path:p1,ball:lead(p1)},{path:p2,ball:lead(p2)},{path:p3,ball:lead(p3)}],say:[[0,"🟢 Vert : intérieur du pied"],[4,"🟠 Orange : extérieur"],[6,"🔴 Rouge : semelle, stop"],[7.5,"🟡 Tunnel entre les plots jaunes"],[11,"🟢 On repart, tête levée"]],tick:t=>L.setAttribute("fill",t<4?"#4CAF50":t<6?"#FF9800":t<7.5?"#E53935":t<11?"#FFEB3B":"#4CAF50")}}},
{id:"demenageurs",nom:"Les déménageurs",type:"mt",cats:["U7","U8"],th:["conduite","motricite"],col:"#4DB6AC",
 html:`<p>Une réserve de ballons au centre, <b>4 maisons</b> (carrés de plots) dans les coins. Au signal, chacun va chercher <b>un ballon</b> et le ramène <b>en conduite</b> dans sa maison. On ne vole pas les maisons des autres… sauf au 2e tour !</p><p><b>On regarde</b> : le ballon reste près du pied, on s'arrête à la semelle dans la maison.</p>`,
 an:F=>{F.rect(0,0,16,14);[[0,0],[12,0],[0,10],[12,10]].forEach(([x,y])=>F.zone(x,y,4,4));F.zone(6.5,5.5,3,3,"rgba(255,255,255,.2)");F.txt(8,4.9,"réserve",{s:.5});

{id:"soleil",nom:"1, 2, 3… soleil en conduite",type:"mt",cats:["U7","U8","U9"],th:["conduite","surfaces"],col:"#FFD54F",
 html:`<p>Les enfants sur une ligne, chacun son ballon. L'éducateur, à <b>15 m</b>, dos tourné, dit « 1, 2, 3… soleil ! » et se retourne : tout le monde doit être <b>arrêté, semelle sur le ballon</b>. Celui qui bouge recule de 3 pas.</p><p><b>Variante</b> : avancer seulement avec l'extérieur du pied.</p>`,

 an:F=>{for(let i=0;i<5;i++){F.cone(2+2*i,1.5);F.cone(2+2*i,5)}[.5,2.5,4,6].forEach(y=>F.cone(14,y,"#fff"));F.txt(14,7.3,"arrivée",{s:.55});

  return {vb:[-3,-1,20,9.5],T:7.5,intro:"Le slalom, puis l'accélération jusqu'à la porte.",actors:[{path:a,ball:lead(a,.75),label:"A"},{path:b,ball:lead(b,.75),label:"B"}],say:[[0,"Passage 1 : intérieur du pied"],[2,"Passage 2 : extérieur"],[4,"Passage 3 : semelle à chaque plot"],[5.8,"Passage 4 : on accélère"]]}}},
{id:"queue",nom:"La queue du diable en conduite",type:"at",cats:["U7","U8","U9"],th:["conduite","duel","motricite"],col:"#A1887F",

{id:"requins",nom:"Les requins",type:"at",cats:["U7","U8","U9"],th:["duel","dribble","conduite"],col:"#E57373",

{id:"crocodiles",nom:"La rivière aux crocodiles",type:"at",cats:["U8","U9"],th:["dribble","duel"],col:"#66BB6A",

{id:"duel2portes",nom:"1 contre 1, deux portes",type:"at",cats:["U7","U8","U9"],th:["duel","dribble","finition"],col:"#BA68C8",

{id:"quilles",nom:"Le tir aux quilles",type:"at",cats:["U7","U8","U9"],th:["frappe","conduite","finition"],col:"#F06292",

{id:"passeportes",nom:"Trouver son partenaire",type:"at",cats:["U8","U9"],th:["passe","conduite","controle"],col:"#64B5F6",

{id:"deuxcontreun",nom:"2 contre 1 vers le but",type:"at",cats:["U8","U9"],th:["finition","passe","dribble"],col:"#FF8A65",
 html:`<p>Terrain <b>15 × 12 m</b>, un mini-but. Deux attaquants partent ensemble contre <b>1 défenseur</b>. Si le défenseur vient sur le porteur : passe au partenaire libre. S'il reste au milieu : on dribble. Tir dans le but.</p><p><b>On regarde</b> : fixer le défenseur avant de passer.</p>`,
 an:F=>{F.rect(0,0,12,15);F.goal(6,0,3);const a=[[0,3,14],[1.4,4.2,9],[2,5,7],[3.2,5,7]],ab=[[0,3.4,13.3],[1.4,4.5,8.3],[2,5.2,6.4],[2.6,8.6,6],[3.2,8.6,6]],m=[[0,9,14],[1.4,8.6,9],[2.6,8.6,6.2],[3.4,7.8,3.6],[4,7,2]],mb=[[2.6,8.6,6],[3,8.6,6],[3.4,7.9,3.1],[4,6.5,.2]],d=[[0,6,3],[1.4,5.6,5],[2,5.2,6.2],[3,6.6,4.6],[4,6.8,3.4]];

{id:"carre",nom:"Le carré des passes",type:"at",cats:["U7","U8","U9"],th:["passe","controle"],col:"#29B6F6",
 html:`<p>Groupes de <b>4</b>, un carré de <b>6 × 6 m</b> (5 m en U7), un ballon. On passe au joueur suivant, qui fait un <b>contrôle orienté</b> pour se tourner vers le suivant, puis passe.</p><ul><li>Changer de sens toutes les minutes.</li><li>Variante : on <b>suit sa passe</b> (on prend la place du joueur servi), ou 2 ballons en même temps.</li></ul><p><b>On regarde</b> : passe de l'intérieur du pied, contrôle avec le pied le plus éloigné pour s'ouvrir.</p>`,
 an:F=>{F.rect(1,1,6,6,"rgba(255,255,255,.06)");const C=[[1,1],[7,1],[7,7],[1,7]];C.forEach(([x,y])=>F.cone(x,y));
  const P=C.map(([x,y])=>[x+(x<4?-.9:.9),y+(y<4?-.9:.9)]);const nx=i=>P[(i+1)%4];
  const ball=[[0,P[0][0]+.5,P[0][1]+.2]];let t=.4;for(let i=0;i<5;i++){const a=P[i%4],b=nx(i),c=P[(i+2)%4];ball.push([t,a[0]+(b[0]-a[0])*.12,a[1]+(b[1]-a[1])*.12]);t+=.9;ball.push([t,b[0]-(b[0]-a[0])*.1,b[1]-(b[1]-a[1])*.1]);t+=.45;ball.push([t,b[0]+(c[0]-b[0])*.12,b[1]+(c[1]-b[1])*.12]);t+=.15}
  const pl=(k)=>{const [x,y]=P[k];return {path:[[0,x,y],[6.5,x,y]],label:String(k+1),kind:k%2?"mate":undefined}};
  return {vb:[-1.5,-1.5,11,11],T:6.6,intro:"Passe, contrôle orienté, passe au suivant.",actors:[0,1,2,3].map(pl).concat([{path:[[0,-9,-9],[6.6,-9,-9]],ball}]),say:[[0,"1 passe à 2, intérieur du pied"],[1.3,"2 contrôle en s'ouvrant vers 3"],[1.9,"…et passe tout de suite"],[3.4,"On enchaîne en 2 touches"]]}}},
{id:"portesctrl",nom:"Le contrôle par la porte",type:"at",cats:["U7","U8","U9"],th:["controle","passe","conduite"],col:"#26A69A",

  const B=[[0,8,5],[1.4,8,5],[2.6,10.6,2.6],[3,12,2.4],[4.8,12,2.4]],ball=[[0,1.7,5],[.5,1.7,5],[1.4,7.4,5],[1.6,8,4.4],[2.6,11,2.4],[3,12.6,2.3],[3.9,1.8,4.8],[4.8,1.8,4.8]];
  return {vb:[-1,-.8,15,11.6],T:4.9,intro:"Le passeur annonce une couleur.",actors:[{path:[[0,1,5],[4.9,1,5]],label:"P"},{kind:"mate",path:B,label:"R"},{path:[[0,-9,-9],[4.9,-9,-9]],ball}],say:[[0,"P passe : « Jaune ! »"],[1.4,"Contrôle orienté vers la porte jaune"],[2.4,"R traverse la porte en conduite"],[3.1,"Passe retour"]]}}},
{id:"relais",nom:"Passe et suis",type:"mt",cats:["U7","U8","U9"],th:["passe","controle","motricite"],col:"#90CAF9",

   se.blocks.map((x,i)=>{if(x.k==="rot"){const s=rotHTML(x,i,b,t0);t0+=x.m;return s}const L=x.k==="lib"||x.k==="new"?getL(x):null;let h=L?L.html:FIX[x.k].html;if(L&&L.id==="match")h=h.replace(/\{N\}/g,N).replace("{L}",sz[0]).replace("{l}",sz[1]).replace("{REGLE}",(b.th||[]).includes("duel")||(b.th||[]).includes("conduite")?"<b>Règle du jour</b> : un but marqué en conduisant le ballon dans le but compte double.":"<b>Règle du jour</b> : un but après une passe compte double.");

const LET="ABCD";const TL=t=>({controle:"contrôle",motricite:"motricité"})[t]||t;
function rotHTML(x,i,b,t0){const n=x.stations.length;const per=Math.ceil(b.eff/n);const r=x.m/n;const rr=Math.round(r*10)/10;
  const plan=`<table class="rp"><tr><th></th>${x.stations.map((_,k)=>`<th>Groupe ${k+1}</th>`).join("")}</tr>${x.stations.map((_,t)=>`<tr><th>Tour ${t+1}</th>${x.stations.map((_,g)=>`<td>${LET[(g+t)%n]}</td>`).join("")}</tr>`).join("")}</table>`;
  const st=x.stations.map((id,j)=>{const L=getL(id);return `<div class="st" data-st="${i}-${j}" style="--c:${L.col}"><h3><span class="sl">${LET[j]}</span>${escH(L.nom)}</h3>${L.ia?`<span class="tag ia">✨ créé par l'IA</span>`:""}${L.th.map(t=>`<span class="tag">${TL(t)}</span>`).join("")}${L.html}<div data-an="${i}-${j}"></div><div class="alt"><button data-sws="${i}-${j}">⇄ Autre atelier</button></div></div>`}).join("");
  return `<section id="b${i}" style="--c:#26C6DA"><div class="sh"><h2>Ateliers tournants</h2><span class="min">${x.m} min · ${t0}'→${t0+x.m}'</span></div>
  <p><b>${n} groupes</b> d'environ <b>${per} joueurs</b>, <b>${n} ateliers</b> (${x.stations.map((_,k)=>LET[k]).join(", ")}). On tourne toutes les <b>${rr} min</b> : le chrono bipe à chaque rotation.</p>${plan}
  <div class="tim"><button data-tm="${i}">⏱ Lancer ${x.m} min</button><b id="tm${i}">${x.m}:00</b><button data-tr="${i}" title="Remettre à zéro">↺</button></div><div class="tour" id="tr${i}"></div>${st}</section>`}
function goTo(i){const el=$("b"+i);if(!el)return;const y=el.getBoundingClientRect().top+scrollY-12;scrollTo({top:Math.max(0,y),behavior:"smooth"})}
const sig=x=>x?JSON.stringify([x.k,x.id||"",x.role||"",x.m,x.stations||"",x.at?x.at.nom:""]):"";
let BUSY=false;
async function send(text){text=String(text||"").trim();if(!text||BUSY)return;BUSY=true;document.body.classList.add("busy");stopListen(true);
  ["q","q0"].forEach(id=>{$(id).value="";grow($(id))});document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
  const tn=nrm(text);const isNew=!S.se||/\bu ?(7|8|9|10|11|12|13)\b/.test(tn)||(/(nouvelle|autre) seance|^(une |fais|fait|prepare|propose|cree|je veux une|je voudrais une)|seance (de|sur|pour|avec|passe|conduite|dribble|duel|frappe|controle)/.test(tn)&&!/(change|remplace|enleve|ajoute|retire|plus de|moins de|garde)/.test(tn));const before=S.se?S.se.blocks.map(sig):[];
  bubble(`<span class="typing"><i></i><i></i><i></i></span> &nbsp;${isNew?"Je prépare ta séance…":"Je modifie ta séance…"}<br><small>« ${text.replace(/</g,"&lt;")} »</small>`,true);
  let reply=null;let ai=null;try{ai=await askClaude(text,isNew)}catch(e){}
  if(ai&&ai.reply)reply=ai.reply;else{const e=S.se&&!isNew?localEdit(text):null;if(e)reply=e;else{const b=parseBrief(text,S.se?{cat:S.se.brief.cat,eff:S.se.brief.eff,dur:S.se.brief.dur}:null);if(!["U7","U8","U9"].includes(b.cat)){reply=`Pour l'instant, les ateliers animés existent pour les U7, U8 et U9. Les autres catégories arrivent ensuite.`}else{S.se=compose(b);reply=`Voilà ta séance <b>${S.se.brief.cat}</b> de <b>${S.se.brief.dur} min</b> pour <b>${S.se.brief.eff} joueurs</b>. Touche ▶ pour voir chaque atelier.`}}}
  if(ai&&ai.err)reply=reply+`<br><small>(IA momentanément indisponible : ${ai.err}. Séance faite en mode simple.)</small>`;
  save();const now=S.se?S.se.blocks.map(sig):[];const changed=isNew?[]:now.map((s,i)=>s!==before[i]?i:-1).filter(i=>i>=0);
  render(changed);BUSY=false;document.body.classList.remove("busy");
  if(isNew||!changed.length)scrollTo({top:0,behavior:"smooth"});else goTo(changed[0]);
  let perio="";if(isNew&&S.se){const T=themePer(S.se.brief.cat);const asked=parseBrief(text).th;const forced=/theme (de la|du|de cette) (periode|moment|cycle)|theme actuel|theme en cours/.test(tn);
    if(T&&asked.length&&!asked.some(t=>T.th.includes(t))&&!forced){perio=`<div class="perio">📅 En ${S.se.brief.cat}, la <b>période ${T.n}</b> travaille <b>« ${T.t} »</b> (${T.th.map(t=>THN[t]).join(", ")}). Ta séance est sur un autre thème.<button data-perio="${S.se.brief.cat}">Faire plutôt une séance sur ce thème</button></div>`}
    else if(T&&(forced||!asked.length))perio=`<div class="perio ok">📅 Séance sur le thème de la période ${T.n} : <b>« ${T.t} »</b>.</div>`}
  bubble(reply+perio+(isNew&&S.se&&!perio.includes("data-perio")?`<small>Tu peux ensuite me dire : « change l'atelier 2 », « en ateliers tournants »…</small>`:""),!!perio.includes("data-perio"));
  const pb=document.querySelector("[data-perio]");if(pb)pb.onclick=()=>{const b=S.se.brief;send(`${b.cat}, ${b.dur} min, ${b.eff} joueurs, séance sur le thème de la période${b.rot?", en ateliers tournants":""}`)}}
/* ===================== chrono de chaque bloc : bip + vibration à la fin, petit bip 30 s avant ===================== */
let AC=null,TM=null,WL=null;
function beep(n,len,f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+k*(len+.15);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.setValueAtTime(.35,t+len-.03);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.start(t);o.stop(t+len+.02)}}catch(e){}}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function wake(on){try{if(on&&!WL&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");if(!on&&WL){WL.release();WL=null}}catch(e){}}
const fmt=r=>`${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`;
function stopTimer(keep){if(!TM)return;clearInterval(TM.h);const b=out.querySelector(`[data-tm="${TM.i}"]`);if(b){b.classList.remove("on");b.textContent=keep?"⏱ Reprendre":"⏱ Relancer"}const sec=document.getElementById("b"+TM.i);if(sec)sec.classList.remove("now");TM=null;wake(false)}
function bindTimers(){out.querySelectorAll("[data-tm]").forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.tm;const el=document.getElementById("tm"+i);
    beep(1,.01);/* débloque le son sur iPhone : il faut un premier son pendant le toucher */
    if(TM&&TM.i===i){stopTimer(true);return}stopTimer(false);
    const blk=S.se.blocks[i];const left=el.dataset.left!=null&&el.dataset.left!==""?+el.dataset.left:blk.m*60;if(left<=0)return;const end=Date.now()+left*1000;let warned=left<=30;
    const sec=document.getElementById("b"+i);sec.classList.remove("end");sec.classList.add("now");btn.classList.add("on");btn.textContent="⏸ Pause";wake(true);
    const isRot=blk.k==="rot";const nS=isRot?blk.stations.length:1;const rotS=blk.m*60/nS;const trEl=document.getElementById("tr"+i);
    const showTour=r=>{if(!isRot||!trEl)return;const t=Math.min(nS-1,Math.floor((blk.m*60-r)/rotS));trEl.innerHTML=`<b>Tour ${t+1}/${nS}</b> · `+blk.stations.map((_,g)=>`G${g+1} → ${LET[(g+t)%nS]}`).join(" · ");return t};let lastTour=showTour(left);
    TM={i,h:setInterval(()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));el.dataset.left=r;el.textContent=fmt(r);
      if(isRot&&r>0){const t=showTour(r);if(t>lastTour){lastTour=t;beep(2,.3,740);vib([300,150,300]);trEl.classList.remove("go");void trEl.offsetWidth;trEl.classList.add("go")}}
      if(!warned&&r<=30){warned=true;beep(1,.18,660);vib(150)}
      if(r<=0){clearInterval(TM.h);TM=null;wake(false);btn.classList.remove("on");btn.textContent="✓ Terminé";sec.classList.remove("now");sec.classList.add("end");beep(3,.45,880);vib([400,200,400,200,400]);
        const nx=document.getElementById("b"+(i+1));if(nx)setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"start"}),1200)}},250)}});
  out.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{const i=+b.dataset.tr;if(TM&&TM.i===i)stopTimer(false);const el=document.getElementById("tm"+i);el.dataset.left="";el.textContent=fmt(S.se.blocks[i].m*60);const t=out.querySelector(`[data-tm="${i}"]`);t.textContent=`⏱ Lancer ${S.se.blocks[i].m} min`;document.getElementById("b"+i).classList.remove("end")})}
/* ===================== voix : on voit en direct ce que l'assistant entend ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,LT={fin:"",tmp:"",want:false,stopT:null};
function grow(t){t.style.height="auto";t.style.height=Math.min(t.scrollHeight,innerHeight*.4)+"px"}
function lisShow(state,msgTxt){const p=$("lis");p.hidden=false;p.classList.toggle("done",state!=="on");$("lisst").textContent=state==="on"?"J'écoute… parle normalement":(msgTxt||"C'est bien ça ?");
  const txt=(LT.fin+" "+LT.tmp).trim();$("listx").innerHTML=txt?`${LT.fin.replace(/</g,"&lt;")} <i>${LT.tmp.replace(/</g,"&lt;")}</i>`:`<span class="ph">${state==="on"?"Ex. : « U7, une heure quinze, huit joueurs, conduite et duel »":"Je n'ai rien entendu."}</span>`;
  $("lisok").disabled=!txt;$("lisre").hidden=state==="on";$("lisok").textContent=state==="on"?"✓ J'ai fini":"✓ Envoyer";$("listx").scrollTop=1e6;
  ["mic","mic0"].forEach(id=>$(id).classList.toggle("rec",state==="on"))}
function stopListen(silent){if(rec){LT.want=false;try{rec.abort()}catch(e){}rec=null}clearTimeout(LT.stopT);if(silent){$("lis").hidden=true;["mic","mic0"].forEach(id=>$(id).classList.remove("rec"))}}
function startListen(){hideBubble();
  if(!SR){bubble("La dictée directe n'est pas disponible dans ce navigateur. Touche la zone de texte puis le 🎤 de ton clavier.");const q=$(S.se?"q":"q0");q.focus();return}
  if(rec){finishListen();return}
  LT={fin:"",tmp:"",want:false,stopT:null};beep(1,.01);
  const r=new SR();rec=r;r.lang="fr-FR";r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
  r.onresult=e=>{if(rec!==r)return;let f="",t="";for(let k=0;k<e.results.length;k++){const x=e.results[k];if(x.isFinal)f+=x[0].transcript;else t+=x[0].transcript}LT.fin=f.trim();LT.tmp=t.trim();lisShow("on")};
  r.onerror=e=>{if(rec!==r)return;const m={"not-allowed":"Le micro est bloqué : autorise-le pour ce site dans les réglages du navigateur.","service-not-allowed":"Le micro est bloqué : autorise-le pour ce site dans les réglages du navigateur.","no-speech":"Je n'ai rien entendu. Recommence en parlant près du téléphone.","audio-capture":"Aucun micro trouvé.","network":"La dictée a besoin d'internet."}[e.error];if(m)LT.err=m};
  r.onend=()=>{if(rec!==r)return;rec=null;clearTimeout(LT.stopT);const txt=(LT.fin+" "+LT.tmp).trim();if(LT.want&&txt){send(txt);return}LT.fin=txt;LT.tmp="";lisShow("done",txt?"C'est bien ça ? Envoie ou recommence.":(LT.err||"Je n'ai rien entendu."))};
  lisShow("on");try{r.start()}catch(e){rec=null;lisShow("done","Le micro n'a pas démarré, touche Recommencer.")}}
function finishListen(){const txt=(LT.fin+" "+LT.tmp).trim();if(rec){LT.want=true;try{rec.stop()}catch(e){}/* sécurité : certains téléphones ne rendent pas la main */LT.stopT=setTimeout(()=>{if(rec){const r=rec;rec=null;try{r.abort()}catch(e){}}const t=(LT.fin+" "+LT.tmp).trim();if(t)send(t);else lisShow("done")},1500)}else if(txt)send(txt)}
$("mic").onclick=$("mic0").onclick=startListen;
$("lisok").onclick=finishListen;$("lisno").onclick=()=>stopListen(true);$("lisre").onclick=()=>{stopListen(false);startListen()};
["q","q0"].forEach(id=>{const t=$(id);t.addEventListener("input",()=>grow(t));t.addEventListener("focus",hideBubble);t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(t.value)}})});
$("go").onclick=()=>send($("q").value);$("go0").onclick=()=>send($("q0").value);
/* ===================== partage par lien ===================== */
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
function shareLink(){const se=S.se;const z={v:1,b:se.brief,k:se.blocks.map(x=>[x.k,x.id||0,x.role||0,x.m,x.stations||0,x.at||0])};return location.origin+location.pathname+"#s="+b64e(JSON.stringify(z))}
$("share").onclick=async()=>{if(!S.se)return;const url=shareLink();const tot=S.se.blocks.reduce((a,x)=>a+x.m,0);const title=`Séance ${S.se.brief.cat} · ${tot} min · ${(S.se.brief.th||[]).join(", ")}`;
  if(navigator.share){try{await navigator.share({title,text:title+" (Pau FC)",url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);bubble("🔗 <b>Lien copié !</b> Colle-le dans WhatsApp pour l'envoyer aux éducateurs.")}catch(e){bubble(`Copie ce lien pour partager la séance :<span class="lnk">${url}</span>`,true)}};
$("neu").onclick=()=>{stopListen(true);hideBubble();S.se=null;save();render();scrollTo({top:0})};
function loadShared(){const m=location.hash.match(/^#s=([A-Za-z0-9_-]+)/);if(!m)return false;try{const z=JSON.parse(b64d(m[1]));const blocks=z.k.map(a=>{const x={k:a[0],m:+a[3]};if(a[1])x.id=a[1];if(a[2])x.role=a[2];if(a[4])x.stations=a[4];if(a[5])x.at=a[5];return x});
  if(!blocks.length||!blocks.every(x=>x.k==="lib"?!!libB(x.id):x.k==="new"?!!(x.at&&x.at.nom):x.k==="rot"?Array.isArray(x.stations)&&x.stations.every(v=>!!getL(v)):!!FIX[x.k])||!blocks.every(x=>x.m>0&&x.m<200))throw 0;
  S.se={brief:Object.assign({cat:"U7",dur:75,eff:8,th:[]},z.b||{}),blocks,titre:""};save();history.replaceState(null,"",location.pathname);return true}catch(e){history.replaceState(null,"",location.pathname);return "bad"}}
function moment(){const P=periodeOf();const el=$("moment");el.innerHTML=`<div class="mh">📅 Thème du moment · période ${P.n}${P.vac?" (à la reprise)":""}</div>`+["U7","U8","U9"].map(c=>{const T=themePer(c);return T?`<button data-mo="${c}"><b>${c}</b><span>${T.t}</span></button>`:""}).join("")+`<div class="mn">Proposition faite au RTJ, bientôt validée.</div>`;
  el.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>send(`${b.dataset.mo}, 1 h 15, séance sur le thème de la période`))}
moment();
/* démarrage */
const shared=loadShared();delete S.hist;save();render();
if(shared===true)bubble("📥 <b>Séance reçue.</b> Tu peux la lancer telle quelle ou me demander des changements.");else if(shared==="bad")bubble("Ce lien de séance est incomplet. Demande à l'éducateur de te le renvoyer.");

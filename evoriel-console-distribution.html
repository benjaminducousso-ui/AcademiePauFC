<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evoriel · Console de distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500..700&family=Inter:wght@400..700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#F7F7FB;--panel:#FFFFFF;--soft:#F1EFFE;--line:#E6E3FF;--ink:#0B0F2B;--muted:#5A5F7A;--faint:#8A8FA8;
 --acc:#5B4DFF;--acc-ink:#FFFFFF;--acc-soft:#EFEDFF;--navy:#1B1446;--mint:#C9F7F0;
 --good:#13795B;--good-soft:#E3F5EE;--warn:#A86200;--warn-soft:#FDF1DD;--bad:#B4231B;--bad-soft:#FBE5E3;--teal:#1FA99B;--orange:#E8A33D;
 --fd:"Sora","Segoe UI",system-ui,sans-serif;--fb:"Inter","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0E1E;--panel:#151833;--soft:#1D2045;--line:#2A2E5A;--ink:#EEF0FF;--muted:#A9ADCB;--faint:#7E83A6;--acc:#8C82FF;--acc-soft:#252456;--navy:#0A0C1C;--good-soft:#123B30;--warn-soft:#3B2C12;--bad-soft:#3E1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0E1E;--panel:#151833;--soft:#1D2045;--line:#2A2E5A;--ink:#EEF0FF;--muted:#A9ADCB;--faint:#7E83A6;--acc:#8C82FF;--acc-soft:#252456;--navy:#0A0C1C;--good-soft:#123B30;--warn-soft:#3B2C12;--bad-soft:#3E1714;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--navy);color:#E9E8FF;display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brandrow{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brandrow .mk{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-family:var(--fd);font-weight:700;color:#fff}
.brandrow b{font-family:var(--fd);font-size:15px;display:block}
.brandrow span{font-size:11.5px;color:#A9A6D9}
.navlbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8E8BC7;padding:14px 10px 6px}
.side button.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#D9D7FB;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500}
.side button.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.side button.nav[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.side button.nav .cnt{margin-left:auto;font-size:11px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:11.5px;color:#8E8BC7;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .crumb{font-size:12.5px;color:var(--faint)}
.top .crumb b{color:var(--ink)}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);min-width:240px;color:var(--faint)}
.search input{border:0;background:transparent;outline:0;width:100%;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px}
.content{flex:1;overflow-y:auto;padding:24px 28px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:0 0 4px}
.ph h1{font-family:var(--fd);font-size:24px;margin:0;letter-spacing:-.01em}
.ph p{margin:4px 0 0;color:var(--muted);max-width:760px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-family:var(--fd);font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--fd);font-size:26px;margin-top:4px}
.kpi small{font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.navy{background:var(--navy);color:var(--mint)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.tw{overflow-x:auto}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px}
.alert .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.alert b{display:block}
.alert span{color:var(--muted);font-size:12.5px}
.alert .btn{margin-left:auto;flex:none}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.track{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:6px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select,input[type=text],input[type=number],textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;width:100%}
label.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.sw{width:38px;height:22px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:12px}
/* studio */
.studio{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;gap:16px;align-items:start}
.steps{display:grid;gap:4px}
.steps button{display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:9px 10px;border-radius:10px;text-align:left;font-weight:600;color:var(--muted)}
.steps button .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.steps button[aria-current="step"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.steps button[aria-current="step"] .n{background:var(--acc);border-color:var(--acc);color:#fff}
.steps button.done .n{background:var(--good-soft);border-color:var(--good-soft);color:var(--good)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;margin-bottom:8px}
.opt[aria-pressed="true"]{border:2px solid var(--acc);padding:11px;background:var(--acc-soft)}
.opt b{display:block}
.opt span{font-size:12.5px;color:var(--muted)}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optgrid .opt{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;margin-top:1px}
.ic.ok{background:var(--good-soft);color:var(--good)} .ic.ko{background:var(--bad-soft);color:var(--bad)} .ic.wa{background:var(--warn-soft);color:var(--warn)}
/* phone preview */
.phone{width:300px;margin:0 auto;border-radius:30px;border:9px solid #0B0F2B;background:#F4F6FB;overflow:hidden;height:560px;display:flex;flex-direction:column;--b1:#1B2B5E;--b2:#2E4A9A;--ac:#F05A4B;--acs:#FFF0EC}
.phone.oralia{--b1:#0E4F57;--b2:#167C86;--ac:#E89A2C;--acs:#FFF4E4}
.phone .pb{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;padding:14px 14px 18px}
.phone .wm{font-family:var(--fd);font-weight:700;font-size:17px}
.phone .wm i{font-style:normal;color:var(--ac)}
.phone .pbody{flex:1;overflow-y:auto;padding:12px;display:grid;gap:10px;align-content:start;color:#0B0F2B}
.phone .pc{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(20,30,60,.06),0 6px 16px -10px rgba(20,30,60,.3);display:grid;gap:5px;font-size:12.5px}
.phone .hero{background:linear-gradient(135deg,var(--ac),#ff8a6b);color:#fff;border-radius:14px;padding:12px;display:grid;gap:5px;font-size:12.5px}
.phone.oralia .hero{background:linear-gradient(135deg,var(--ac),#f6c065)}
.phone .pbtn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px;font-weight:700;text-align:center}
.phone .hero .pbtn{background:#fff;color:var(--b1)}
.phone .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.phone .big{font-family:var(--fd);font-size:20px;color:var(--b1)}
.phone .small{font-size:11px;color:#5A5F7A}
.phone .ptab{display:flex;justify-content:space-around;border-top:1px solid #E6E9F0;background:#fff;padding:7px 0 9px;font-size:10px;color:#8A8FA8}
.phone .ptab span.on{color:var(--b1);font-weight:700}
.pvsteps{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.pvsteps button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.pvsteps button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* drawer & modal */
.drawer{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(10,15,40,.3);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.drawer .db{padding:18px 20px;overflow-y:auto;flex:1}
.tl{display:grid}
.tl div{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:14px;position:relative;font-size:13px}
.tl div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:4px}
.tl div.ok::before{background:var(--good)} .tl div.now::before{background:var(--acc)}
.tl span{color:var(--faint);font-size:12px;display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;transition:all .2s;z-index:40;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:15;display:none}
.scrim.on{display:block}
.qr{width:96px;height:96px;background:#fff;border-radius:8px;padding:4px}
.slot{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--bg)}
.slot .it{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.slot .it b{flex:1}
.mini{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.mini>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint)}
.mini i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--acc)}
.mini i.r{background:var(--teal)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:1100px){.studio{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;padding:10px}.side .navlbl,.side .foot,.brandrow span{display:none}.search{display:none}.g2,.g4{grid-template-columns:1fr}.content{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="side" aria-label="Navigation">
  <div class="brandrow"><div class="mk">E</div><div><b>Evoriel</b><span>Console de distribution</span></div></div>
  <div id="nav"></div>
  <div class="foot">Propulsé par Obendy · données de démonstration</div>
 </aside>
 <div class="main">
  <header class="top">
   <div class="crumb" id="crumb"></div>
   <div class="sp"></div>
   <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="text" placeholder="Rechercher un parcours, un client, un partenaire" aria-label="Rechercher"></label>
   <div class="seg" role="group" aria-label="Marque"><button data-brand="lamy">Lamy</button><button data-brand="oralia">Oralia</button><button data-brand="all">Les deux</button></div>
   <div class="avatar" title="Alexandra M., Développement et expérience clients">AM</div>
  </header>
  <main class="content" id="view"></main>
 </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Détail"><div class="dh"><div id="dtitle"></div><button class="btn sm" id="dclose">Fermer</button></div><div class="db" id="dbody"></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fr=(n,d=0)=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur=n=>fr(Math.round(n))+'\u00a0€', keur=n=>fr(n/1000,0)+'\u00a0k€';
const KEY='evoriel-console-v1';
const ICON={home:'<path d="M3 11l9-7 9 7v9H3z"/>',route:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M22 20c-.6-2.6-2.2-4.4-4.2-5.3"/>',box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',send:'<path d="M3 12l18-8-7 18-3-7z"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',plug:'<path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 0 1-12 0zM12 18v3"/>',euro:'<path d="M17 6a7 7 0 1 0 0 12M4 10h9M4 14h9"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ================= DATA ================= */
const CIBLES=['Copropriétaires','Conseils syndicaux','Bailleurs','Locataires'];
const SERVICES=[
 {id:'s_quote',t:'Simulateur de quote-part après aides',type:'Simulateur',c:['Copropriétaires']},
 {id:'s_aidescol',t:'Éligibilité et montage des aides collectives',type:'Moteur d\'aides',c:['Conseils syndicaux']},
 {id:'s_treso',t:'Simulateur de rendement de la trésorerie',type:'Simulateur',c:['Conseils syndicaux']},
 {id:'s_plan',t:'Plan de financement des travaux',type:'Simulateur',c:['Conseils syndicaux']},
 {id:'s_diag',t:'Diagnostic de protection des loyers',type:'Diagnostic',c:['Bailleurs']},
 {id:'s_verif',t:'Vérification des dossiers locataires',type:'Diagnostic',c:['Bailleurs']},
 {id:'s_fisc',t:'Simulateur fiscal du bailleur',type:'Simulateur',c:['Bailleurs']},
 {id:'s_bilan',t:'Bilan patrimonial en ligne',type:'Diagnostic',c:['Bailleurs','Copropriétaires']},
 {id:'s_reinv',t:'Simulateur de réinvestissement',type:'Simulateur',c:['Bailleurs']},
 {id:'s_comp_ae',t:'Comparateur d\'assurance emprunteur',type:'Comparateur',c:['Copropriétaires']},
 {id:'s_comp_mrh',t:'Comparateur d\'assurance habitation',type:'Comparateur',c:['Copropriétaires','Locataires']},
 {id:'s_aideslog',t:'Moteur d\'aides au logement',type:'Moteur d\'aides',c:['Locataires']},
 {id:'s_check',t:'Check-list d\'emménagement',type:'Check-list',c:['Locataires']},
 {id:'s_capa',t:'Capacité d\'emprunt et prêt à taux zéro',type:'Simulateur',c:['Locataires']},
 {id:'s_artisans',t:'Annuaire d\'artisans vérifiés',type:'Service',c:['Copropriétaires','Bailleurs','Locataires']},
 {id:'s_charges',t:'Comprendre ses charges',type:'Contenu',c:['Conseils syndicaux','Copropriétaires']}
];
const PRODUCTS=[
 {id:'p_ptz',t:'Éco-PTZ et prêt travaux',fam:'Crédit',partner:'Banque partenaire A',dist:'Société commune · intermédiaire bancaire',modes:['lead','orient'],com:'180 € par dossier débloqué',statut:'à créer'},
 {id:'p_pc',t:'Prêt collectif copropriété',fam:'Crédit',partner:'Banque partenaire A',dist:'Société commune · convention votée en AG',modes:['lead'],com:'1 % du montant financé',statut:'à créer'},

const DSTEPS=['Moment de vie','Service','Produit partenaire','Mode de distribution','Diffusion','Contrôles et lancement'];
function checks(D){const pr=P(D.prod);const C=[];
 C.push(pr.statut==='ok'?['ok','Distributeur habilité pour ce produit',pr.dist]:['ko','Statut de distribution à créer',`${pr.dist} : immatriculation en cours. Passez en orientation vers le partenaire en attendant.`]);
 if(D.mode==='sous'&&pr.statut!=='ok')C.push(['ko','Souscription intégrée impossible sans statut','Choisissez « Orientation » ou « Lead ».']);
 if(D.cible==='Conseils syndicaux'&&/Société commune/.test(pr.dist))C.push(['wa','Convention à faire voter en AG','Offre au syndicat via une entité liée au syndic : jointe à la convocation.']);
 if(D.cible==='Conseils syndicaux'&&pr.fam==='Épargne')C.push(['ok','Intérêts acquis au syndicat','Aucune rémunération du syndic : conforme.']);
 C.push(D.ch.includes('lien')?['wa','E-mails : consentement requis',`${S.consent} % des clients ont consenti ; les autres ne recevront pas l'e-mail.`]:['ok','Pas de prospection par e-mail','Diffusion dans l\'app et en agence uniquement.']);
 const pa=S.partners.find(p=>p.prods.includes(D.prod));C.push(pa&&pa.health==='ok'?['ok','Retours partenaire configurés',`${pa.t} · ${pa.conn}`]:['wa','Retours partenaire incomplets',pa?`${pa.t} : flux à surveiller`:'Aucun flux']);
 C.push(['ok','Mentions légales générées','Distributeur, ORIAS, rémunération, document d\'information.']);
 C.push(D.hook&&D.hook.length>4?['ok','Accroche rédigée',`« ${D.hook} »`]:['ko','Accroche manquante','Rédigez l\'accroche du widget à l\'étape Diffusion.']);
 return C}

 if(st===2){body=`<h3>Quel produit proposer derrière ?</h3><p class="faint">Produits de vos partenaires et du groupe, avec leur distributeur et leur rémunération.</p>${PRODUCTS.map(p=>`<button class="opt" data-pr="${p.id}" aria-pressed="${D.prod===p.id}"><div class="row"><b>${esc(p.t)}</b><span class="pill ${p.statut==='ok'?'good':'warn'}">${p.statut==='ok'?'Distribuable':'Statut à créer'}</span></div><span>${esc(p.partner)} · ${esc(p.dist)} · ${esc(p.com)}</span></button>`).join('')}`}

  <div class="card" style="margin-top:10px"><h3>Qui gère quoi</h3><table><tr><th></th><th>Lead</th><th>Souscription</th><th>Client ensuite</th></tr><tr><td><b>${esc(MODES[D.mode].l)}</b></td><td>${D.mode==='orient'?'Partenaire':'Evoriel'}</td><td>${D.mode==='sous'?'Evoriel, via le distributeur':'Partenaire'}</td><td>Partenaire, suivi par Evoriel</td></tr></table></div>`}

  <div class="row" style="justify-content:flex-start;gap:8px;margin-top:14px"><button class="btn pri" id="launchT" ${ko?'disabled':''}>Lancer en test sur 10 % de la cible</button><button class="btn" id="saveD">Enregistrer le brouillon</button></div>${ko?'<p class="faint" style="color:var(--bad)">Un contrôle bloquant empêche la mise en ligne.</p>':''}`}
 const pv=S.pvs||0;
 return head('Studio de parcours',D.id?'Modifier un parcours':'Nouveau parcours','Composez sans développement : chaque choix met à jour l\'aperçu, exactement ce que verra le client.',`<button class="btn ghost" data-go="journeys">Annuler</button>`)+
 `<div class="studio"><div class="card steps">${DSTEPS.map((n,i)=>`<button data-st="${i}" ${st===i?'aria-current="step"':''} class="${i<st?'done':''}"><span class="n">${i<st?'✓':i+1}</span>${n}</button>`).join('')}

function bindStudio(v){const D=S.draft;const up=()=>{save();render()};
 v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{S.dstep=+b.dataset.st;S.pvs=[0,1,2,2,0,3][S.dstep];up()});
 v.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{S.pvs=+b.dataset.pv;up()});
 v.querySelectorAll('[data-cible]').forEach(b=>b.onclick=()=>{D.cible=b.dataset.cible;const m=S.moments.find(x=>x.cible===D.cible);if(m)D.moment=m.id;const s=SERVICES.find(x=>x.c.includes(D.cible));if(s)D.svc=s.id;up()});
 v.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{D.moment=b.dataset.mo;up()});
 v.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{D.svc=b.dataset.sv;S.pvs=1;up()});
 v.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{D.prod=b.dataset.pr;const pr=P(D.prod);if(!pr.modes.includes(D.mode))D.mode=pr.modes[0];S.pvs=2;up()});
 v.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{D.mode=b.dataset.mode;S.pvs=2;up()});
 v.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const k=b.dataset.ch;D.ch=D.ch.includes(k)?D.ch.filter(x=>x!==k):D.ch.concat(k);if(!D.ch.length)D.ch=['app'];up()});
 const h=$('hook');if(h)h.onchange=()=>{D.hook=h.value;up()};
 const hb=$('hookB');if(hb)hb.onchange=()=>{D.abB=hb.value;save()};
 const ab=$('abSw');if(ab)ab.onclick=()=>{D.ab=!D.ab;up()};

function addProduct(){drawer('<h3 style="font-family:var(--fd);margin:0">Ajouter un produit partenaire</h3>',`<p class="muted">Un nouveau partenaire est branché en six semaines en moyenne.</p>
 <div class="tl"><div class="ok"><b>Fiche produit</b><span>Conditions, documents d'information, tarification ou règles d'éligibilité</span></div><div class="ok"><b>Statut de distribution</b><span>Qui distribue : Bélier, la société commune, le partenaire</span></div><div class="now"><b>Circuit</b><span>Où arrive le lead, ou l'API de souscription</span></div><div><b>Retours</b><span>Statuts, contrats, encours, commissions, par API ou fichier</span></div><div><b>Grille de rémunération</b><span>Pour le rapprochement automatique des commissions</span></div><div><b>Recette et mise en ligne</b><span>Le produit devient disponible dans le studio</span></div></div>
 <label class="f">Partenaire<input type="text" value="Mutuelle partenaire F"></label><label class="f" style="margin-top:10px">Produit<input type="text" value="Assurance santé seniors"></label><button class="btn pri" style="margin-top:12px" id="apGo">Lancer l'intégration</button>`,b=>{b.querySelector('#apGo').onclick=()=>{log('Intégration lancée : Mutuelle partenaire F, assurance santé seniors');save();closeDrawer();toast('Intégration lancée : le partenaire reçoit son espace d\'onboarding')}})}

/* ================= PLACEMENTS ================= */
function vPlacements(){const brand=S.brand==='oralia'?'oralia':'lamy';
 const slot=(k,title,d)=>`<div class="card"><h3>${title}</h3><p class="faint" style="margin:-4px 0 10px">${d}</p><div class="slot">${S.slots[k].map((id,i)=>{const j=JO(id);return j?`<div class="it"><span class="pill">${i+1}</span><b>${esc(j.t)}</b><span class="pill ${STATUS[j.status][0]}">${STATUS[j.status][1]}</span><button class="btn sm" data-up="${k}:${i}" ${i===0?'disabled':''} aria-label="Monter">↑</button></div>`:''}).join('')}</div></div>`;
 return head('Distribuer','Diffusion','Où vos clients rencontrent les parcours : l\'app, les e-mails, les agences. Vous ordonnez, la plateforme respecte le plafond d\'offres.')+
 `<div class="grid g2" style="margin-bottom:14px">${slot('home','Widget « Pour vous » de l\'accueil','Un seul parcours affiché à la fois, le premier éligible pour le client.')}${slot('services','Onglet Services de l\'app','Tous les parcours éligibles, rangés par thématique.')}</div>
 <div class="grid g2"><div class="card"><h3>Liens et e-mails</h3><table><thead><tr><th>Campagne</th><th>Parcours</th><th class="r">Envois</th><th class="r">Ouvertures</th></tr></thead><tbody>
 <tr><td>Convocation AG, travaux</td><td>Financer les travaux votés en AG</td><td class="r">380</td><td class="r">62 %</td></tr><tr><td>Appel de fonds travaux</td><td>Payer sa part des travaux</td><td class="r">5 080</td><td class="r">48 %</td></tr><tr><td>Bienvenue locataire</td><td>Emménager sans rien oublier</td><td class="r">2 900</td><td class="r">71 %</td></tr></tbody></table><p class="faint">Envoyés aux seuls clients ayant consenti.</p></div>
 <div class="card"><h3>QR codes pour les agences</h3><div class="row" style="align-items:flex-start;gap:14px"><svg class="qr" viewBox="0 0 29 29" aria-label="QR code de démonstration">${qrMock(7)}</svg><div style="flex:1"><label class="f">Agence<select><option>${brand==='oralia'?'Oralia':'Lamy'} Lyon Bellecour</option><option>${brand==='oralia'?'Oralia':'Lamy'} Nantes Centre</option><option>${brand==='oralia'?'Oralia':'Lamy'} Pau Gare</option></select></label><label class="f" style="margin-top:8px">Parcours<select>${S.journeys.filter(j=>j.status!=='draft').map(j=>`<option>${esc(j.t)}</option>`).join('')}</select></label><button class="btn sm pri" style="margin-top:10px" data-qr="1">Générer l'affiche</button></div></div><p class="faint">Chaque QR code est tracé par agence : vous savez quelle vitrine convertit.</p></div></div>`}
function qrMock(seed){let s='';let h=seed*2654435761>>>0;const n=29;const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0B0F2B"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0B0F2B"/>`;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20))continue;h=(h*1103515245+12345)>>>0;if((h>>16)&1)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0B0F2B"/>`}return s+fin(0,0)+fin(22,0)+fin(0,22)}

/* ================= LEADS ================= */
function vLeads(){const f=S.lf||'all';const list=S.leads.filter(l=>f==='all'||(f==='new'&&l.st==='Nouveau')||(f==='part'&&/partenaire|Accordé|Débloqué|Refusé/.test(l.st+l.src)));
 return head('Distribuer','Leads et dossiers','Chaque demande, de son arrivée à la souscription chez le partenaire. Les statuts remontent tout seuls.')+
 `<div class="grid g21"><div><div class="toolbar">${[['all','Tous'],['new','Nouveaux'],['part','Chez les partenaires']].map(([k,l])=>`<button class="chip" data-lf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
 <div class="card" style="padding:0"><div class="tw"><table><thead><tr><th style="padding-left:16px">Lead</th><th>Produit</th><th>Attribué à</th><th>Statut</th><th class="r" style="padding-right:16px">Délai</th></tr></thead><tbody>
 ${list.map(l=>{const over=l.st==='Nouveau'&&l.age>l.sla;return `<tr class="click" data-lead="${l.id}"><td style="padding-left:16px"><b>${esc(l.client)}</b><div class="faint">${l.id} · ${esc(l.cible)}</div></td><td>${esc(P(l.prod).t)}<div class="faint">${eur(l.mont)}</div></td><td>${l.to==='Non attribué'?'<span class="pill warn">Non attribué</span>':esc(l.to)}</td><td><span class="pill ${/Débloqué|Accordé/.test(l.st)?'good':/Refusé/.test(l.st)?'bad':l.st==='Nouveau'?'acc':''}">${esc(l.st)}</span><div class="faint">${esc(l.src)}</div></td><td class="r" style="padding-right:16px"><b class="${over?'down':''}">${l.age} h</b><div class="faint">SLA ${l.sla} h</div></td></tr>`}).join('')}</tbody></table></div></div></div>
 <div class="card"><h3>Règles de routage</h3>${S.routing.map((r,i)=>`<div class="check"><span class="ic ok">${i+1}</span><div><b>${esc(r.if)}</b><div class="faint">→ ${esc(r.then)} · SLA ${r.sla} h</div></div></div>`).join('')}<button class="btn sm" style="margin-top:8px" data-toast="Éditeur de règles : condition, destination, délai de réponse">Ajouter une règle</button></div></div>`}
function openLead(id){const l=S.leads.find(x=>x.id===id),j=JO(l.j);
 const steps=[['Service utilisé',true],['Demande envoyée',true],['Qualifiée',l.st!=='Nouveau'],['Transmise au partenaire',/partenaire|Accordé|Débloqué|Refusé/.test(l.st)||/Banque|Courtier/.test(l.to)],['Accord',/Accordé|Débloqué/.test(l.st)],['Souscription, déblocage',/Débloqué/.test(l.st)]];
 drawer(`<p class="eyebrow">${l.id}</p><h3 style="font-family:var(--fd);margin:0">${esc(l.client)}</h3>`,`<div class="card" style="margin-bottom:12px"><div class="row"><span class="muted">Parcours</span><b>${esc(j?j.t:'')}</b></div><div class="row"><span class="muted">Produit</span><b>${esc(P(l.prod).t)}</b></div><div class="row"><span class="muted">Montant</span><b>${eur(l.mont)}</b></div><div class="row"><span class="muted">Dernière mise à jour</span><b>${esc(l.src)}</b></div></div>
 <div class="tl">${steps.map(([t,d],i)=>`<div class="${d?'ok':(steps[i-1]&&steps[i-1][1]?'now':'')}"><b>${t}</b></div>`).join('')}</div>
 <label class="f">Attribuer à<select id="ldTo">${['Conseiller patrimonial','Conseiller financement','Agence du client','Banque partenaire A','Courtier partenaire'].map(o=>`<option ${o===l.to?'selected':''}>${o}</option>`).join('')}</select></label><button class="btn pri" style="margin-top:10px" id="ldGo">Attribuer</button>`,
 b=>{b.querySelector('#ldGo').onclick=()=>{l.to=$('ldTo').value;if(l.st==='Nouveau')l.st='Qualifié';log(`Lead ${l.id} attribué à ${l.to}`);save();closeDrawer();render();toast('Lead attribué, le conseiller est notifié')}})}

/* ================= PARTNERS ================= */
function vPartners(){return head('Partenaires','Partenaires et flux','Ce que chaque partenaire vous renvoie sur vos clients. Sans ces retours, Evoriel perd la trace de ses ventes.',`<button class="btn pri" id="addP">Ajouter un partenaire</button>`)+
 `<div class="grid g2">${S.partners.map(p=>`<div class="card"><div class="row"><h3 style="margin:0">${esc(p.t)}</h3><span class="pill ${p.health==='ok'?'good':p.health==='warn'?'warn':'bad'}">${p.health==='ok'?'Flux à jour':p.health==='warn'?'Données partielles':'Flux en retard'}</span></div>
 <p class="faint" style="margin:6px 0 10px">${p.prods.map(x=>esc(P(x).t)).join(', ')}</p>
 <div class="row"><span class="muted">Intégration</span><b>${esc(p.conn)}</b></div><div class="row"><span class="muted">Dernière réception</span><b>${esc(p.sync)}</b></div><div class="row"><span class="muted">Convention</span><b>${esc(p.conv)}</b></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${Object.entries({statut:'Statut du dossier',contrat:'Contrat',encours:'Encours',commission:'Commission'}).map(([k,l])=>`<span class="pill ${p.fields[k]?'good':'warn'}">${p.fields[k]?'✓':'✕'} ${l}</span>`).join('')}</div>
 ${p.health!=='ok'?`<button class="btn sm" style="margin-top:10px" data-relance="${p.id}">Relancer le partenaire</button>`:''}</div>`).join('')}</div>`}

/* ================= REVENUE ================= */
function vRevenue(){const rexp=S.revenue.reduce((s,r)=>s+r.exp,0),rrec=S.revenue.reduce((s,r)=>s+r.rec,0);const ents={};S.revenue.forEach(r=>{ents[r.ent]=(ents[r.ent]||0)+r.exp});
 return head('Partenaires','Revenus','Les commissions attendues d\'après les souscriptions, rapprochées de ce que les partenaires versent.',`<button class="btn" data-toast="Export CSV prêt pour la comptabilité">Exporter</button>`)+
 `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><span>Attendu en octobre</span><b>${keur(rexp)}</b></div><div class="card kpi"><span>Encaissé</span><b>${keur(rrec)}</b></div><div class="card kpi"><span>Écart à réclamer</span><b class="down">${keur(rexp-rrec)}</b></div><div class="card kpi"><span>Rapprochement automatique</span><b>${Math.round(S.revenue.filter(r=>r.exp===r.rec).length/S.revenue.length*100)} %</b></div></div>
 <div class="grid g21"><div class="card" style="padding:0"><div class="tw"><table><thead><tr><th style="padding-left:16px">Partenaire</th><th>Entité</th><th class="r">Attendu</th><th class="r">Encaissé</th><th class="r">Écart</th><th style="padding-right:16px">Action</th></tr></thead><tbody>
 ${S.revenue.map((r,i)=>{const d=r.exp-r.rec;return `<tr><td style="padding-left:16px"><b>${esc(r.p)}</b><div class="faint">${r.m}</div></td><td>${esc(r.ent)}</td><td class="r">${eur(r.exp)}</td><td class="r">${eur(r.rec)}</td><td class="r"><b class="${d?'down':'up'}">${d?'− '+eur(d):'0 €'}</b></td><td style="padding-right:16px">${d?`<button class="btn sm" data-claim="${i}">Réclamer</button>`:'<span class="pill good">Rapproché</span>'}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="card"><h3>Par entité</h3>${Object.entries(ents).map(([e,v])=>`<div class="frow" style="margin-bottom:8px"><span>${esc(e)}</span><span class="track"><i style="width:${v/rexp*100}%"></i></span><b style="text-align:right">${keur(v)}</b></div>`).join('')}<p class="faint">La société commune remonte sa part à Evoriel en dividendes. Le syndic ne perçoit rien sur les opérations bancaires des syndicats.</p></div></div>`}

/* ================= COMPLIANCE ================= */
function vCompliance(){const C=[['ok','Aucune rémunération du syndic sur une opération bancaire','Contrôlé sur chaque parcours destiné aux conseils syndicaux'],['wa','3 conventions à faire voter en AG','Prêt collectif · Les Tilleuls, Les Érables, Le Parc'],['ok','Distributeurs immatriculés','Bélier, KoproWatt, Banque partenaire C, courtier partenaire'],['wa','Société commune : immatriculation en cours','Crédit et épargne restent en orientation ou en lead d\'ici là'],['ok','Devoir de conseil tracé','100 % des souscriptions d\'épargne et de crédit'],['ok',`Consentement à la prospection : ${S.consent} %`,'Les e-mails ne partent qu\'aux clients ayant consenti'],[S.cap<=2?'ok':'wa',`Pression commerciale : ${S.cap} offre${S.cap>1?'s':''} par client et par mois`,'Seuil conseillé : 2']];
 return head('Encadrer','Conformité','Chaque parcours est contrôlé avant sa mise en ligne. Ici, la vue d\'ensemble et le journal.')+
 `<div class="grid g2"><div class="card">${C.map(c=>`<div class="check"><span class="ic ${c[0]}">${c[0]==='ok'?'✓':'!'}</span><div><b>${esc(c[1])}</b><div class="faint">${esc(c[2])}</div></div></div>`).join('')}</div>
 <div class="card"><h3>Journal</h3>${S.audit.slice(0,10).map(a=>`<div class="check"><span class="faint" style="width:84px;flex:none">${esc(a[0])}</span><div><b>${esc(a[1])}</b><div class="faint">${esc(a[2])}</div></div></div>`).join('')}</div></div>`}

/* ================= SETTINGS ================= */
function vSettings(){const R=[['Administrateur','Tout'],['Chef de produit','Parcours, studio, diffusion, résultats'],['Conseiller','Leads attribués, fiches clients'],['Agence','Leads de l\'agence, QR codes'],['Partenaire','Ses dossiers, ses retours, ses commissions']];
 return head('Encadrer','Paramètres','Vos marques, vos équipes et leurs droits. La plateforme est en marque blanche : vos clients ne voient que Lamy et Oralia.')+
 `<div class="grid g2"><div class="card"><h3>Marques</h3>${[['Lamy','#1B2B5E','#F05A4B'],['Oralia','#0E4F57','#E89A2C']].map(([n,a,b])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${n}</b><span style="display:flex;gap:6px"><i style="width:22px;height:22px;border-radius:6px;background:${a};display:inline-block"></i><i style="width:22px;height:22px;border-radius:6px;background:${b};display:inline-block"></i></span><span class="faint">Couleurs indicatives</span></div>`).join('')}<p class="faint">Logo, couleurs, typographie, ton éditorial : chaque marque a son thème.</p></div>
 <div class="card"><h3>Rôles et droits</h3><table><tbody>${R.map(([r,d])=>`<tr><td><b>${r}</b></td><td class="muted">${d}</td></tr>`).join('')}</tbody></table></div></div>`}

/* ================= DRAWER, LOG, RENDER ================= */
function drawer(title,body,bind){$('dtitle').innerHTML=title;$('dbody').innerHTML=body;$('drawer').classList.add('on');$('scrim').classList.add('on');bind&&bind($('dbody'));$('dclose').focus()}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on')}
$('dclose').onclick=closeDrawer;$('scrim').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
function log(t){const d=new Date();S.audit.unshift([d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),'Alexandra M.',t])}
const VIEWS={home:vHome,journeys:vJourneys,studio:vStudio,moments:vMoments,offer:vOffer,placements:vPlacements,leads:vLeads,partners:vPartners,revenue:vRevenue,compliance:vCompliance,settings:vSettings};
function render(){renderNav();const v=$('view');v.innerHTML=VIEWS[S.view]();
 v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 v.querySelectorAll('#newJ').forEach(b=>b.onclick=newDraft);
 v.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openJourney(b.dataset.open)});
 v.querySelectorAll('[data-jf]').forEach(b=>b.onclick=()=>{S.jf=b.dataset.jf;save();render()});
 v.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{S.lf=b.dataset.lf;save();render()});
 v.querySelectorAll('[data-ot]').forEach(b=>b.onclick=()=>{S.ot=b.dataset.ot;save();render()});
 v.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>openLead(b.dataset.lead));
 v.querySelectorAll('[data-mtog]').forEach(b=>b.onclick=()=>{const m=MO(b.dataset.mtog);m.on=!m.on;log(`Moment de vie « ${m.t} » ${m.on?'activé':'désactivé'}`);save();render()});
 v.querySelectorAll('#newM').forEach(b=>b.onclick=newMoment);
 v.querySelectorAll('#addP').forEach(b=>b.onclick=addProduct);
 v.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
 v.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>toast('Affiche A4 générée, avec le QR code tracé pour cette agence'));
 v.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.up.split(':');const a=S.slots[k];[a[+i-1],a[+i]]=[a[+i],a[+i-1]];save();render()});
 v.querySelectorAll('[data-relance]').forEach(b=>b.onclick=()=>{const p=S.partners.find(x=>x.id===b.dataset.relance);log(`Relance envoyée à ${p.t}`);save();toast(`Relance envoyée à ${p.t}, avec copie à votre contact`)});
 v.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const r=S.revenue[+b.dataset.claim];log(`Réclamation de ${eur(r.exp-r.rec)} à ${r.p}`);save();toast(`Réclamation envoyée à ${r.p} avec le détail des souscriptions`)});
 const cap=$('cap');if(cap)cap.oninput=()=>{S.cap=+cap.value;save();render()};
 if(S.view==='studio')bindStudio(v)}
$('q').addEventListener('input',()=>{if(S.view!=='journeys'){S.view='journeys'}render()});
render();
})();
</script>
</body>
</html>
